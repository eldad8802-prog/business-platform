apply plugin: 'com.android.application'

// Upload-key signing for Google Play.
//
// The keystore and its passwords live OUTSIDE this repository and are never
// committed. Point DUBIZ_UPLOAD_KEYSTORE_PROPERTIES at a properties file
// holding storeFile / storePassword / keyAlias / keyPassword.
//
// When the variable is unset — a plain checkout, or CI that only assembles
// debug — the release build is left unsigned rather than failing, so
// `assembleDebug` and the native validation workflow keep working without the
// key. When the variable IS set but the file is missing we fail loudly, because
// silently producing an unsigned bundle would only be discovered at upload.
def uploadKeystoreProps = new Properties()
def hasUploadKeystore = false
def uploadKeystorePropsPath = System.getenv("DUBIZ_UPLOAD_KEYSTORE_PROPERTIES")
if (uploadKeystorePropsPath != null && uploadKeystorePropsPath.trim()) {
    def propsFile = file(uploadKeystorePropsPath.trim())
    if (!propsFile.exists()) {
        throw new GradleException(
            "DUBIZ_UPLOAD_KEYSTORE_PROPERTIES points at a file that does not exist: " + propsFile)
    }
    // Read as UTF-8 explicitly. Properties.load(InputStream) decodes
    // ISO-8859-1, which silently mangles any non-ASCII character in the
    // keystore path — on a machine whose user folder is not ASCII that turns
    // into a "Keystore file not found" failure five minutes into the build,
    // pointing at a path that looks almost right.
    propsFile.withReader("UTF-8") { uploadKeystoreProps.load(it) }
    hasUploadKeystore = true

    def storePath = uploadKeystoreProps['storeFile']
    if (!storePath || !file(storePath).exists()) {
        throw new GradleException(
            "Upload keystore not found at storeFile=" + storePath +
            " (from " + propsFile + "). Prefer an ASCII-only path.")
    }
}

android {
    namespace = "il.co.promaxgroup.dubiz"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "il.co.promaxgroup.dubiz"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasUploadKeystore) {
            release {
                storeFile file(uploadKeystoreProps['storeFile'])
                storePassword uploadKeystoreProps['storePassword']
                keyAlias uploadKeystoreProps['keyAlias']
                keyPassword uploadKeystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasUploadKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
