<!doctype html>
<!--
  DIAGNOSTIC ONLY (branch diag/android-file-chooser) — never shipped.
  Bundled into capacitor/www/index.html by the probe workflow so the real
  Capacitor BridgeWebChromeClient handles every <input type=file> below.
  Each row is exactly 100vh/N tall so the probe script can tap row i at
  y = (i + 0.5) / N * screenHeight.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>file-chooser-probe</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
      .rows { display: flex; flex-direction: column; height: 100vh; }
      button {
        flex: 1 1 0; border: 0; border-bottom: 2px solid #fff; font-size: 15px;
        text-align: start; padding: 0 16px; color: #fff; background: #0f766e;
      }
      button:nth-child(even) { background: #115e59; }
      button small { display: block; opacity: .85; font-family: monospace; }
    </style>
  </head>
  <body>
    <div class="rows" id="rows"></div>
    <script>
      // id, accept, capture — C* = camera, U* = upload.
      var VARIANTS = [
        ["C1", "image/jpeg,image/png", true],              // camera BEFORE #1019
        ["C2", "image/*", true],                           // camera AFTER #1019
        ["U1", "application/pdf,image/jpeg,image/png", false], // upload today
        ["U2", "image/jpeg,image/png,application/pdf", false], // order swapped
        ["U3", ".pdf,.jpg,.jpeg,.png", false],             // extensions
        ["U4", "", false],                                 // no accept
        ["U5", "application/pdf,image/*", false],
        ["U6", "*/*", false],
      ];
      var rows = document.getElementById("rows");
      VARIANTS.forEach(function (v) {
        var input = document.createElement("input");
        input.type = "file";
        if (v[1]) input.setAttribute("accept", v[1]);
        if (v[2]) input.setAttribute("capture", "environment");
        input.style.display = "none";
        input.addEventListener("change", function () {
          var f = input.files && input.files[0];
          var msg = f ? "PROBE change " + v[0] + " name=" + f.name + " type=" + f.type + " size=" + f.size
                      : "PROBE change " + v[0] + " empty";
          console.log(msg); btn.querySelector("small").textContent = msg; input.value = "";
        });
        input.addEventListener("cancel", function () {
          console.log("PROBE cancel " + v[0]); btn.querySelector("small").textContent = "PROBE cancel " + v[0];
        });
        var btn = document.createElement("button");
        btn.type = "button";
        btn.innerHTML = v[0] + " <small></small>";
        btn.querySelector("small").textContent = "accept=" + (v[1] || "(none)") + (v[2] ? " capture" : "");
        btn.addEventListener("click", function () { console.log("PROBE tap " + v[0]); input.click(); });
        document.body.appendChild(input);
        rows.appendChild(btn);
      });
    </script>
  </body>
</html>
