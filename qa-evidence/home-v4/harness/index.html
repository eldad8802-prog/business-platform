<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&family=Rubik:wght@400;500;600;700&display=block" rel="stylesheet" />
<style>
  :root { --font-rubik: 'Rubik'; --font-heebo: 'Heebo'; --dz-shell-ground: #F6F3EC; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Heebo', system-ui, sans-serif; background: #F6F3EC; -webkit-font-smoothing: antialiased; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .flex { display: flex; } .flex-col { flex-direction: column; } .min-h-screen { min-height: 100vh; } .w-full { width: 100%; }
  .flex-1 { flex: 1 1 0%; } .min-w-0 { min-width: 0; } .overflow-x-hidden { overflow-x: hidden; }
</style>
</head>
<body>
<div id="root"></div>
<div id="dz-overlay-root"></div>
<script src="out/app.js"></script>
</body>
</html>
