name: secretary main screen

# "המזכירה שלי" main screen (alternative B): the headline and groups come only
# from the server briefing counts, rows lead with the ledger remaining amount,
# nothing is summed or rounded, and no sentence promises a reminder.
# Pure, no database. The browser proof is scripts/qa/ui/main-screens-qa.mjs.

on:
  pull_request:
    paths:
      - "app/(shell)/secretary/**"
      - "components/business-cost/BusinessCostCard.tsx"
      - "components/leads/LeadsBriefingCard.tsx"
      - "components/navigation/action-sheet.tsx"
      - "features/home/v3/desktop-home.tsx"
      - "features/tasks/task-form.tsx"
      - "lib/tasks/tasks-client.ts"
      - "lib/services/tasks/agenda-core.ts"
      - "lib/business-cost/business-cost-client.ts"
      - "components/ui/adaptive-overlay.tsx"
      - ".github/workflows/secretary-main-screen-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secretary-main-screen:
    name: secretary main screen (pure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:secretary-home
      - run: npm run verify:secretary-create-flow
      - run: npm run verify:secretary-hub
