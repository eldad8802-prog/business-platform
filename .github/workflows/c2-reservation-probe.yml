# PRE-C3 reservation probe — INVESTIGATION ONLY, on an ephemeral PG17.
#
# Records what the over-allocation guard in setReceiptAllocations actually does
# today. It asserts nothing and changes nothing: C2 settled which allocations
# COUNT, and left open which allocations RESERVE. This job produces the evidence
# for that decision.
#
# Manual dispatch only. Synthetic CI-only credentials; ZERO secrets; ZERO Neon;
# ZERO network.

name: c2 — reservation probe (investigation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation-probe:
    name: Reservation probe (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: probe_owner
          POSTGRES_PASSWORD: probe_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_probe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U probe_owner -d dubiz_probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: Push schema (lab)
        env:
          DATABASE_URL: postgresql://probe_owner:probe_ci_synthetic_owner_pw@localhost:5432/dubiz_probe
          DIRECT_URL: postgresql://probe_owner:probe_ci_synthetic_owner_pw@localhost:5432/dubiz_probe
        run: npx prisma db push --skip-generate

      - name: Reservation probe
        env:
          DATABASE_URL: postgresql://probe_owner:probe_ci_synthetic_owner_pw@localhost:5432/dubiz_probe
          DIRECT_URL: postgresql://probe_owner:probe_ci_synthetic_owner_pw@localhost:5432/dubiz_probe
          AUTH_TOKEN_SECRET: probe_ci_auth_secret_synthetic
        run: npx tsx .c2reserve/probe.mts
