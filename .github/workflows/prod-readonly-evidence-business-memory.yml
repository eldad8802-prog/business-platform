name: Prod Read-Only Evidence (Business Memory Claim)

# Manual, gated, READ-ONLY verification that a Business Memory Derived Claim was materialized in
# Production for a known (businessId, vendor subjectNormalizedKey) under vendor-category/v1. This is
# OPERATIONAL EVIDENCE ONLY — not a product Claim read path.
#
# Safety controls (mirror ops/evidence/prod-readonly-evidence.yml):
#   - workflow_dispatch only (no push / schedule triggers)
#   - environment: production-db  -> human approval before secrets are exposed
#   - host allowlist: DIRECT_URL must target endpoint ep-flat-brook-am4bhq1y
#   - SQL static guard: rejects any non-SELECT (write) keyword before connecting
#   - fixed SQL file path (no path input); READ ONLY transaction + session read_only + statement_timeout
#   - inputs are NEVER interpolated into the shell (${{ }} -> env -> $VAR) and are BOUND as psql
#     variables (:'var'), so neither shell nor SQL injection is possible
#   - businessId is validated to be a positive integer before it is used

on:
  workflow_dispatch:
    inputs:
      businessId:
        description: "Tenant businessId (positive integer)"
        required: true
        type: string
      subjectNormalizedKey:
        description: "Normalized vendor subject key (exact match; used only as a WHERE predicate)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-readonly-evidence-business-memory
  cancel-in-progress: false

jobs:
  evidence:
    name: Read-only Business Memory Claim evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs (businessId must be a positive integer)
        env:
          BID: ${{ inputs.businessId }}
        run: |
          set -euo pipefail
          case "$BID" in
            ''|*[!0-9]*) echo "::error::businessId must be a positive integer."; exit 1 ;;
          esac
          echo "Input validation OK."

      - name: SQL static guard (SELECT-only)
        run: |
          set -euo pipefail
          SQL_FILE="ops/evidence/business-memory-claim-evidence.sql"
          test -f "$SQL_FILE" || { echo "::error::SQL file missing: $SQL_FILE"; exit 1; }
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          MATCHES="$(grep -inE "$FORBIDDEN" "$SQL_FILE" || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Forbidden write keyword found in SQL — aborting before any DB connection."
            echo "$MATCHES"
            exit 1
          fi
          echo "SQL guard passed: file is SELECT-only."

      - name: Host allowlist assertion (verified Production only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          ALLOW="ep-flat-brook-am4bhq1y"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set in the production-db environment."; exit 1
          fi
          case "$DIRECT_URL" in
            *"$ALLOW"*) echo "Host allowlist OK: DIRECT_URL targets endpoint $ALLOW." ;;
            *) echo "::error::DIRECT_URL does not target the verified Production endpoint ($ALLOW) — aborting."; exit 1 ;;
          esac

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run read-only Claim evidence query
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
          BID: ${{ inputs.businessId }}
          SKEY: ${{ inputs.subjectNormalizedKey }}
        run: |
          set -euo pipefail
          psql "$DIRECT_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --set=businessId="$BID" \
            --set=subjectNormalizedKey="$SKEY" \
            --file=ops/evidence/business-memory-claim-evidence.sql
