# Tax-invoice creation under FORCE ROW LEVEL SECURITY.
#
# The defect this guards against refused EVERY tax invoice in Production, for
# EVERY tenant, because the identity check read `BusinessProfile` outside a
# tenant transaction. Under FORCE RLS that read matches zero rows, so the check
# concluded the identity was missing. Nothing errored and nothing was logged.
#
# Two things make this job able to see that, and both are easy to get wrong:
#
#   1. POLICIES. `prisma db push` creates tables, not policies. The test
#      installs the policy from the migration itself, or the bug does not
#      reproduce at all.
#
#   2. IDENTITY. RLS does not apply to a superuser, and applies to a table's
#      owner only under FORCE. A proof run as the owner of this lab would pass
#      while proving nothing — which is why the schema is pushed by the owner
#      and the test runs as a separate NOSUPERUSER / NOBYPASSRLS role, the same
#      posture Production runs in. The test asserts its own identity before it
#      asserts anything else.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: tenant-scoped routes under FORCE RLS (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/billing/documents/**"
      - "app/api/business/profile/**"
      - "app/api/video/plan/**"
      - "app/api/rls-tenant-scoped-routes.integration.test.ts"
      - "lib/services/billing/receipt/billing-settlement-state.service.ts"
      - "lib/billing/business-identity.ts"
      - "lib/services/billing/billing-tenant-tx.ts"
      - "lib/tenant/**"
      - "lib/notifications/notification-read.service.ts"
      - "app/api/notifications/**"
      - "app/api/pricing/calculations/**"
      - "lib/services/billing/collection/awaiting-payment.loader.ts"
      - "lib/services/billing/authority/billing-authority-validation.service.ts"
      - "app/api/rls-caller-closure.integration.test.ts"
      - "scripts/ci/tenant-scoped-access-guard.mjs"
      - ".github/workflows/billing-profile-rls-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  billing-profile-rls:
    name: Tenant-scoped routes under FORCE RLS (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rls_owner
          POSTGRES_PASSWORD: rls_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rls_owner -d dubiz_rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://rls_owner:rls_ci_synthetic_owner_pw@localhost:5432/dubiz_rls
      RUNTIME_URL: postgresql://rls_runtime:rls_ci_synthetic_runtime_pw@localhost:5432/dubiz_rls
      AUTH_TOKEN_SECRET: billing_rls_ci_secret_synthetic_at_least_32_chars

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      # Static, and deliberately first: it needs no database, and it is the only
      # check that sees the WHOLE repository rather than the paths this PR
      # happens to touch.
      - name: No unscoped access to a FORCE-RLS tenant table
        run: node scripts/ci/tenant-scoped-access-guard.mjs

      - name: Push schema as the owner
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate

      - name: Create the governed runtime role
        env:
          PGPASSWORD: rls_ci_synthetic_owner_pw
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q \
            -c "DROP ROLE IF EXISTS rls_runtime;" \
            -c "CREATE ROLE rls_runtime LOGIN PASSWORD 'rls_ci_synthetic_runtime_pw' NOSUPERUSER NOBYPASSRLS;" \
            -c "GRANT USAGE ON SCHEMA public TO rls_runtime;" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO rls_runtime;" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO rls_runtime;"
          psql "$RUNTIME_URL" -tAc "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user"

      - name: Tax invoice under FORCE RLS
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
          AUTH_DATABASE_URL: ${{ env.RUNTIME_URL }}
          RLS_ADMIN_URL: ${{ env.OWNER_URL }}
        run: npx tsx app/api/billing/documents/route.rls.integration.test.ts

      - name: Tenant-scoped routes under FORCE RLS
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
          AUTH_DATABASE_URL: ${{ env.RUNTIME_URL }}
          RLS_ADMIN_URL: ${{ env.OWNER_URL }}
        run: npx tsx app/api/rls-tenant-scoped-routes.integration.test.ts

      - name: Notifications, awaiting payment, pricing and authority identity
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
          AUTH_DATABASE_URL: ${{ env.RUNTIME_URL }}
          RLS_ADMIN_URL: ${{ env.OWNER_URL }}
        run: npx tsx app/api/rls-caller-closure.integration.test.ts
