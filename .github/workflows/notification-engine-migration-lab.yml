# Notification engine foundation / migration 20261210090000_notification_engine_foundation — proof on PostgreSQL
# BEFORE it reaches Production (ephemeral PG17).
#
# .nte/lab.sh builds on the task reminders push lab (.trp/lab.sh): Production's role topology, the owner's DEFAULT
# PRIVILEGES (which hand a new table to the runtime wholesale — the migration must take them back), FORCE RLS on
# Business, the task tables, "PushSubscription", "Notification" and "NotificationDelivery", the runtime holding
# nothing on "AuthSession", and the task reminders push migration applied by `prisma migrate deploy`.
#
#   0. Evidence files are SELECT-only and selectable in Production; the proof pins migration.sql's sha256; the
#      migration names only its own objects and what it builds on.
#   1. Baseline (pending): the PREFLIGHT passes (13 is INFO); the proof refuses.
#   2. `prisma migrate deploy` applies it over rows the current application already wrote: proof 22/22; the
#      preflight then fails exactly its "not there yet" checks.
#   3. Faults: each injected defect is caught by the proof check meant for it.
#   4. Battery (.nte/battery.ts) as the real roles: backward compatibility of every write the current code issues
#      (generated client, same calls), the provider-aware endpoint check, four-sided tenant isolation of
#      NotificationSettings / NotificationPreference, the same-business user triggers, the composite device key,
#      the checks, the exact grants, and the three definer functions' behaviour.
#   5. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: notification engine — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261210090000_notification_engine_foundation/**"
      - "ops/evidence/notification-engine-foundation-*.sql"
      - ".nte/**"
      - ".github/workflows/notification-engine-migration-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: notification engine foundation (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: nte_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: nte_ci_synthetic_super_pw
      LAB_PASSWORD: nte_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/notification-engine-foundation-preflight.sql
      EVIDENCE: ops/evidence/notification-engine-foundation-production-evidence.sql
      NTE: prisma/migrations/20261210090000_notification_engine_foundation/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable in Production; checksum pinned; the migration names only its own objects and what it builds on
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          node scripts/ci/evidence-output-guard.mjs   # assert-shaped output only (public logs)
          sum=$(sha256sum "$NTE" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum ($sum)"; exit 1; }
          echo "$NTE sha256 $sum (pinned)"
          others=$(grep -oE '"[A-Z][A-Za-z]*"' "$NTE" | sort -u | grep -vxE '"PushSubscription"|"Notification"|"NotificationDelivery"|"NotificationSettings"|"NotificationPreference"|"AuthSession"|"Business"|"User"' || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          echo "the migration names only PushSubscription, Notification, NotificationDelivery, NotificationSettings, NotificationPreference, AuthSession, Business and User"

      - name: 1. Baseline (pending) — PREFLIGHT passes; the proof refuses
        run: |
          set -euo pipefail
          bash .nte/lab.sh nte_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/pre.out; then echo "preflight FAILS on the baseline"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "12" || { echo "expected 12 PASS"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| INFO' /tmp/pre.out)" = "1" || { echo "expected 1 INFO"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline"

      - name: 2. prisma migrate deploy applies it over existing rows — proof 22/22; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          NTE_SEED=.nte/seed.sql bash .nte/lab.sh nte_post --with-nte | tee /tmp/post.log
          grep -q 'Applying migration `20261210090000_notification_engine_foundation`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "22" || { echo "expected 22 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "1 3 4 5 6 7 " || { echo "after the release: expected '1 3 4 5 6 7 ', got: $fails"; exit 1; }

      - name: 3. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte_post -v ON_ERROR_STOP=1 "$@"; }
          su() { psql -X -q -v ON_ERROR_STOP=1 -U "$SUPER" -d nte_post -c "$1"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test "$(failing)" = "" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            su "$3"; got=$(failing); su "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          GUC="NULLIF(current_setting('app.current_business_id', true), '')::int"
          fault "TRUNCATE for the runtime" "13 " 'GRANT TRUNCATE ON "NotificationSettings" TO app_runtime' 'REVOKE TRUNCATE ON "NotificationSettings" FROM app_runtime'
          fault "PUBLIC read" "13 " 'GRANT SELECT ON "NotificationPreference" TO PUBLIC' 'REVOKE SELECT ON "NotificationPreference" FROM PUBLIC'
          fault "read for another role" "13 " 'GRANT SELECT ON "NotificationSettings" TO app_auth' 'REVOKE SELECT ON "NotificationSettings" FROM app_auth'
          fault "sequence privilege for another role" "14 " 'GRANT USAGE ON SEQUENCE "NotificationSettings_id_seq" TO app_auth' 'REVOKE USAGE ON SEQUENCE "NotificationSettings_id_seq" FROM app_auth'
          fault "column read for another role" "15 " 'GRANT SELECT ("key") ON "NotificationPreference" TO app_auth' 'REVOKE SELECT ("key") ON "NotificationPreference" FROM app_auth'
          fault "NO FORCE row-level security" "10 " 'ALTER TABLE "NotificationSettings" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "NotificationSettings" FORCE ROW LEVEL SECURITY'
          fault "a permissive FOR ALL policy" "11 " 'CREATE POLICY nte_fault_all ON "NotificationPreference" USING (true)' 'DROP POLICY nte_fault_all ON "NotificationPreference"'
          fault "a policy that reads every business" "12 " \
            'ALTER POLICY notification_settings_tenant_select ON "NotificationSettings" USING (true)' \
            "ALTER POLICY notification_settings_tenant_select ON \"NotificationSettings\" USING (\"businessId\" = $GUC)"
          fault "the same-business trigger disabled (new table)" "17 " 'ALTER TABLE "NotificationPreference" DISABLE TRIGGER "NotificationPreference_user_same_business"' 'ALTER TABLE "NotificationPreference" ENABLE TRIGGER "NotificationPreference_user_same_business"'
          fault "the same-business trigger disabled (Notification)" "6 " 'ALTER TABLE "Notification" DISABLE TRIGGER "Notification_user_same_business"' 'ALTER TABLE "Notification" ENABLE TRIGGER "Notification_user_same_business"'
          fault "SECURITY INVOKER due function" "18 " 'ALTER FUNCTION public.notification_push_due(timestamp(3), integer) SECURITY INVOKER' 'ALTER FUNCTION public.notification_push_due(timestamp(3), integer) SECURITY DEFINER'
          fault "search_path not pinned" "18 " 'ALTER FUNCTION public.auth_sessions_live(uuid[], timestamp(3)) RESET search_path' 'ALTER FUNCTION public.auth_sessions_live(uuid[], timestamp(3)) SET search_path = pg_catalog, public, pg_temp'
          fault "EXECUTE for PUBLIC" "19 " 'GRANT EXECUTE ON FUNCTION public.notification_live_businesses(integer, integer) TO PUBLIC' 'REVOKE EXECUTE ON FUNCTION public.notification_live_businesses(integer, integer) FROM PUBLIC'
          fault "EXECUTE for another role" "19 " 'GRANT EXECUTE ON FUNCTION public.auth_sessions_live(uuid[], timestamp(3)) TO app_auth' 'REVOKE EXECUTE ON FUNCTION public.auth_sessions_live(uuid[], timestamp(3)) FROM app_auth'
          fault "attempts range check removed" "8 " 'ALTER TABLE "NotificationDelivery" DROP CONSTRAINT "NotificationDelivery_attempts_range"' \
            'ALTER TABLE "NotificationDelivery" ADD CONSTRAINT "NotificationDelivery_attempts_range" CHECK ("attempts" BETWEEN 0 AND 50)'
          fault "composite device key removed" "8 " 'ALTER TABLE "NotificationDelivery" DROP CONSTRAINT "NotificationDelivery_subscription_fkey"' \
            'ALTER TABLE "NotificationDelivery" ADD CONSTRAINT "NotificationDelivery_subscription_fkey" FOREIGN KEY ("subscriptionId", "businessId") REFERENCES "PushSubscription"("id", "businessId") ON DELETE CASCADE ON UPDATE CASCADE'
          fault "attempts default changed" "7 " 'ALTER TABLE "NotificationDelivery" ALTER COLUMN "attempts" SET DEFAULT 1' 'ALTER TABLE "NotificationDelivery" ALTER COLUMN "attempts" SET DEFAULT 0'
          fault "the old endpoint check (no FCM branch)" "5 " \
            "ALTER TABLE \"PushSubscription\" DROP CONSTRAINT \"PushSubscription_endpoint_shape\"; ALTER TABLE \"PushSubscription\" ADD CONSTRAINT \"PushSubscription_endpoint_shape\" CHECK ((\"endpoint\" ~ '^https://[^[:space:]]+\$' AND char_length(\"endpoint\") <= 1024) OR \"endpoint\" ~ '^erased:[0-9]+\$')" \
            "ALTER TABLE \"PushSubscription\" DROP CONSTRAINT \"PushSubscription_endpoint_shape\"; ALTER TABLE \"PushSubscription\" ADD CONSTRAINT \"PushSubscription_endpoint_shape\" CHECK ((\"provider\" = 'WEB_PUSH' AND \"endpoint\" ~ '^https://[^[:space:]]+\$' AND char_length(\"endpoint\") <= 1024) OR (\"provider\" = 'FCM' AND \"endpoint\" ~ '^fcm:[A-Za-z0-9_:.-]+\$' AND char_length(\"endpoint\") BETWEEN 24 AND 4100) OR \"endpoint\" ~ '^erased:[0-9]+\$')"
          fault "a row written in a new table" "20 " \
            "INSERT INTO \"NotificationPreference\" (\"businessId\", \"userId\", \"key\", \"updatedAt\") SELECT u.\"businessId\", u.\"id\", 'domain:fault', now() FROM \"User\" u WHERE u.\"email\" = 'seed@nte.lab'" \
            "DELETE FROM \"NotificationPreference\" WHERE \"key\" = 'domain:fault'"
          test "$(failing)" = "" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 4. Battery — backward compatibility, endpoint check, isolation, references, checks, grants, functions (real roles)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_post" \
          AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/nte_post" \
            npx tsx .nte/battery.ts

      - name: 5. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .nte/lab.sh nte_broken --broken-nte
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d nte_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relname IN ('NotificationSettings', 'NotificationPreference', 'NotificationSettings_id_seq', 'NotificationPreference_id_seq',
                   'PushSubscription_id_businessId_key', 'PushSubscription_authSessionId_live_idx', 'Notification_businessId_userId_lastSurfacedAt_idx',
                   'NotificationDelivery_push_owed_idx', 'NotificationDelivery_push_sent_by_user_idx'))
            + (SELECT count(*) FROM pg_proc WHERE proname IN ('notification_push_due', 'notification_live_businesses', 'auth_sessions_live'))
            + (SELECT count(*) FROM pg_attribute WHERE attrelid IN ('\"PushSubscription\"'::regclass, '\"Notification\"'::regclass, '\"NotificationDelivery\"'::regclass)
                 AND attname IN ('provider', 'authSessionId', 'revokedReason', 'lastSeenAt', 'appVersion', 'userId', 'subscriptionId', 'attempts',
                                 'nextAttemptAt', 'leaseUntil', 'expiresAt', 'completedAt') AND NOT attisdropped
                 AND NOT (attrelid = '\"PushSubscription\"'::regclass AND attname = 'userId'))
            + (SELECT count(*) FROM pg_trigger WHERE tgname IN ('Notification_user_same_business', 'NotificationDelivery_user_same_business'))
            + (SELECT count(*) FROM pg_constraint WHERE conname = 'PushSubscription_endpoint_shape' AND pg_get_constraintdef(oid) LIKE '%FCM%')
            + 1 - (SELECT count(*) FROM pg_constraint WHERE conname = 'PushSubscription_endpoint_shape')")
          led=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261210090000_notification_engine_foundation' AND finished_at IS NULL")
          echo "objects left=$left unfinished ledger rows=$led"
          test "$left" = "0" && test "$led" = "1" || { echo "NOT atomic"; exit 1; }
