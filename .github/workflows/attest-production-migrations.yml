name: attest-production-migrations

# Republish the production migration attestation — READ-ONLY.
#
# WHY THIS EXISTS SEPARATELY FROM release-migrate
#
# The release guard trusts an artifact, and GitHub caps artifact retention at 90
# days (verified on this repository: maximum_allowed_days = 90). Without this
# workflow, an attestation expiring would force a `release-migrate` run just to
# refresh a timestamp — running a migration tool for a bookkeeping reason, on a
# repository where nothing needed migrating. That is exactly the wrong incentive.
#
# So refreshing is its own read-only act. It reads `_prisma_migrations` and
# republishes; it can never apply, alter or roll back anything.
#
# This does NOT make attestation age a correctness condition. The guard's only
# safety test is set inclusion — every migration the deployed commit requires is
# applied. `generatedAt` is metadata. An old attestation is never unsafe: it can
# only be INCOMPLETE, and an incomplete one blocks.
#
# Safety controls (same shape as the other production-db workflows):
#   - workflow_dispatch only — no push / PR / schedule trigger
#   - environment: production-db -> human approval before secrets are exposed
#   - reads one metadata table; never business data
#   - no `prisma migrate deploy`, no DDL, no writes of any kind
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Audit note: why the attestation is being refreshed (optional)'
        required: false
        type: string

# Least privilege: read the repository. The artifact upload does not need more.
permissions:
  contents: read

concurrency:
  group: attest-production-migrations
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    # Binding the job to the protected environment is what enforces the human
    # gate AND scopes the DB secrets to this job only.
    environment: production-db
    steps:
      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (offline)
        run: npx prisma generate

      # Read-only proof of the current state. `migrate status` never writes; it
      # exits non-zero when migrations are pending, which is informational here —
      # the attestation records reality either way, and a pending migration
      # simply will not appear in `applied`.
      - name: prisma migrate status (read-only, informational)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate status

      # No continue-on-error and no `if: always()`: a failed ledger read must
      # leave the previous attestation in place rather than publish a guess.
      - name: Build attestation from the live ledger
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RELEASE_ATTESTATION_WORKFLOW_PATH: .github/workflows/attest-production-migrations.yml
        run: node scripts/ci/build-migration-attestation.mjs attestation.json

      - name: Upload attestation (immutable, bound to this run)
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-attestation
          path: attestation.json
          retention-days: 90
          if-no-files-found: error

      - name: Job Summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## attest-production-migrations (read-only)"
            echo ""
            echo "- Trigger: manual (workflow_dispatch), approved via \`production-db\`."
            echo "- Action: SELECT from \`_prisma_migrations\`; publish artifact."
            echo "- Writes: none. No migration is applied, altered or rolled back."
            echo "- Reason: ${REASON:-'(none provided)'}"
          } >> "$GITHUB_STEP_SUMMARY"
