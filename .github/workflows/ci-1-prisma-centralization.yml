          perl -0pi -e 's/        return \{ result: "CREATED", id: created\.id \} as RowOutcome;/        await tx.historicalFiscalDocument.delete({ where: { id: created.id } });\n        return { result: "CREATED", id: created.id } as RowOutcome;/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: history could be removed by the importer"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.5 negative proof (a fallback to BillingDocument must be caught)
        run: |
          F="lib/data-transfer/historical/historical-execute.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/      return candidates\.length === 1 \? candidates\[0\]\.id : "UNRESOLVED";/      if (candidates.length === 1) return candidates[0].id;\n      const fallback = await tx.billingDocument.findFirst({ where: { businessId }, select: { id: true } });\n      return fallback?.id ?? "UNRESOLVED";/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a historical credit reached a document Dubiz issued"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.5 negative proof (a Customer touched by the importer must be caught)
        run: |
          F="lib/data-transfer/historical/historical-execute.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/        const created = await tx\.historicalFiscalDocument\.create\(\{/        await tx.customer.update({ where: { id: 1 }, data: {} });\n        const created = await tx.historicalFiscalDocument.create({/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: importing history edited the customer book"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.5 negative proof (a Document created by the importer must be caught)
        run: |
          F="lib/data-transfer/historical/historical-execute.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/        const created = await tx\.historicalFiscalDocument\.create\(\{/        await tx.document.create({ data: {} });\n        const created = await tx.historicalFiscalDocument.create({/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a historical row grew a file record it never had"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.5 negative proof (money persisted as a JavaScript number must be caught)
        run: |
          F="lib/data-transfer/historical/historical-execute.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  return value === null \? null : fiscalAmountToDecimal\(value\);/  return value === null ? null : (parseFloat(value) as unknown as Prisma.Decimal);/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a fiscal amount crossed into the database as a float"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.5 negative proof (a reversal bound after the insert must be caught)
        run: |
          F="lib/data-transfer/historical/historical-execute.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/            reversesHistoricalDocumentId: reversal,\n//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a credit was written before it knew what it credits"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.5 negative proof (a statement outside the tenant transaction must be caught)
        run: |
          F="lib/data-transfer/historical/historical-execute.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/        const created = await tx\.historicalFiscalDocument\.create\(\{/        const created = await prisma.historicalFiscalDocument.create({/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a write ran without the tenant guard RLS reads"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      # The two validator extractions (I-5). Both moved rules OUT of live
      # services so the Import dry run can evaluate a row without a database.
      # These verifiers run the pre-extraction implementations side by side with
      # the extracted ones and require identical value, exception type and
      # message — because "we only moved it" is a claim, not a property.
      # Local: npm run verify:customer-core / npm run verify:inventory-core
      - name: Customer core extraction equivalence
        run: npx tsx lib/services/crm/customer-core.verify.test.ts

      - name: Inventory core extraction equivalence
        run: npx tsx lib/services/inventory/inventory-core.verify.test.ts

      # Import/Export Center I-5 — the Import DRY RUN. Blocking because every
      # failure mode here is silent: a mapping that picks the wrong column, a
      # number read as 1000x its value, a preview token that validates for the
      # wrong business or a different file, or a WRITE appearing in what is
      # supposed to be a read-only check. Pure — no DB, no network.
      # Local equivalent: npm run verify:import-dry-run
      - name: Import dry run (mapping, normalization, duplicates, token, zero writes)
        env:
          AUTH_TOKEN_SECRET: i5_ci_synthetic_secret
        run: npx tsx lib/data-transfer/import/import.verify.test.ts

      - name: I-5 negative proof (a write in the dry run must be caught)
        env:
          AUTH_TOKEN_SECRET: i5_ci_synthetic_secret
        run: |
          F="lib/data-transfer/import/duplicates/duplicate-detect.ts"
          cp "$F" "$F.bak"
          # Plant exactly the mistake that would turn a preview into an import.
          sed -i '0,/const existing = await tx\.customer\.findMany({/s//await tx.customer.create({ data: {} });\n        const existing = await tx.customer.findMany({/' "$F"
          if npx tsx lib/data-transfer/import/import.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier passed with a write in the dry run"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a write in the dry run fails the verifier"

      - name: I-5 negative proof (an unscoped duplicate lookup must be caught)
        env:
          AUTH_TOKEN_SECRET: i5_ci_synthetic_secret
        run: |
          F="lib/data-transfer/import/duplicates/duplicate-detect.ts"
          cp "$F" "$F.bak"
          # The cross-tenant leak, planted where it would actually happen: the
          # duplicate lookup keeps working and starts matching OTHER businesses'
          # customers. Nothing crashes — which is exactly why it needs a guard.
          sed -i '0,/where: { businessId, phone: { in: phones } },/s//where: { phone: { in: phones } },/' "$F"
          if npx tsx lib/data-transfer/import/import.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unscoped duplicate lookup passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unscoped duplicate lookup fails the verifier"

      # Import/Export Center I-6 — the bulk-import EXECUTION contract. Blocking
      # because the failure modes are duplication and cross-tenant writes, and
      # both are silent: a second run of the same file that creates a second
      # copy of every supplier looks exactly like a successful import.
      # Pure — no DB, no network.
      # Local equivalent: npm run verify:import-execute-contract
      - name: Import execute contract (defaults, in-file collisions, retry, batching)
        env:
          AUTH_TOKEN_SECRET: i6_ci_synthetic_secret
        run: npx tsx lib/data-transfer/import/execute/execute-contract.verify.test.ts

      # The ledger ratchet: RLS on both tables, the marker's immutability, the
      # tenant-scoped run identity, and the marker-inside-the-transaction rule.
      # Local equivalent: bash scripts/ci/import-ledger-guard.sh .
      - name: Import execution ledger guard
        run: bash scripts/ci/import-ledger-guard.sh .

      - name: Import ledger guard self-test (every check must be able to fail)
        run: bash scripts/ci/import-ledger-guard.sh --self-test .

      - name: I-6 negative proof (a record written without its marker must be caught)
        env:
          AUTH_TOKEN_SECRET: i6_ci_synthetic_secret
        run: |
          F="lib/data-transfer/import/execute/import-executor.ts"
          cp "$F" "$F.bak"
          # Exactly the defect the ledger exists to prevent: the business record
          # commits, the marker does not, and a retry creates it a second time.
          perl -pi -e 's/await markRow\(tx,/await skipTheMarker(tx,/' "$F"
          if bash scripts/ci/import-ledger-guard.sh . >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unmarked write passed the ledger guard"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unmarked write fails the ledger guard"

      - name: I-6 negative proof (a blanket duplicate rule must be caught)
        env:
          AUTH_TOKEN_SECRET: i6_ci_synthetic_secret
        run: |
          F="lib/data-transfer/import/execute/duplicate-policy.ts"
          cp "$F" "$F.bak"
          # The rejected design: ANY duplicate evidence blocks. It would silently
          # skip legitimate suppliers whose only match is a shared name.
          perl -0pi -e 's/  if \(domainId === "leads"\) \{/  return true;\n  if (domainId === "leads") {/' "$F"
          if npx tsx lib/data-transfer/import/execute/execute-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a blanket duplicate rule passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a blanket duplicate rule fails the verifier"

      - name: I-6 negative proof (re-validating decisions before the run lookup must be caught)
        env:
          AUTH_TOKEN_SECRET: i6_ci_synthetic_secret
        run: |
          F="lib/data-transfer/import/execute/import-executor.ts"
          cp "$F" "$F.bak"
          # The ordering defect a real database exposed: validating the owner's
          # decisions before resolving the run means a RETRY is judged against a
          # world the run itself changed, and an inventory re-submit is refused
          # for duplicating the row it just created.
          perl -pi -e 's/  const existing = await findExistingRun\(\{/  const early = validateDecisions({ domainId: input.domainId, rows: derived.rows, decisions: input.decisions });\n  if (early.length > 0) return { ok: false, code: "DECISIONS_INVALID", message: "x", decisionProblems: early };\n  const existing = await findExistingRun({/' "$F"
          if npx tsx lib/data-transfer/import/execute/execute-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: validate-before-lookup passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: validate-before-lookup fails the verifier"

      - name: I-6 negative proof (skipping BOTH sides of an in-file collision must be caught)
        env:
          AUTH_TOKEN_SECRET: i6_ci_synthetic_secret
        run: |
          F="lib/data-transfer/import/execute/duplicate-policy.ts"
          cp "$F" "$F.bak"
          # No row wins its group, so two identical rows import NEITHER — the
          # behaviour the owner explicitly ruled out.
          perl -0pi -e 's/    if \(winsAll\) eligible\.add\(rowNumber\);/    if (false) eligible.add(rowNumber);/' "$F"
          if npx tsx lib/data-transfer/import/execute/execute-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: skipping both sides of a collision passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: skipping both sides of a collision fails the verifier"

      # I-7C.3 — inbound integration intake. Blocking for two reasons: which
      # files Dubiz accepts must not depend on which door they arrive through,
      # and a Gmail import must not be able to leave a Document that a retry
      # cannot recognise — that state used to be reachable, and the retry then
      # imported the same attachment a second time.
      # Pure — no DB, no network, no Meta, no Gmail.
      # Local equivalent: npm run verify:integration-intake
      - name: Integration intake (canonical acceptance, Gmail idempotency)
        run: npx tsx lib/services/documents/integration-intake.verify.test.ts

      - name: I-7C.3 negative proof (a Gmail signature refusal that does not stop the import must be caught)
        run: |
          F="app/api/integrations/gmail/import/route.ts"
          cp "$F" "$F.bak"
          # The call stays exactly where it is; only its verdict is ignored.
          # Ordering assertions alone would not notice.
          perl -0pi -e 's/    if \(!signature\.ok\) \{/    if (false) {/' "$F"
          if npx tsx lib/services/documents/integration-intake.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an ignored signature verdict passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an ignored signature verdict fails the verifier"

      - name: I-7C.3 negative proof (a private integration allowlist must be caught)
        run: |
          F="app/api/integrations/gmail/import/route.ts"
          cp "$F" "$F.bak"
          # The wildcard that let an emailed file into Documents when a direct
          # upload of the same file would have been refused. It now targets the
          # type GMAIL resolved: the client's field is no longer read at all.
          perl -0pi -e 's/    if \(!isAllowedDocumentMime\(gmailMimeType\)\) \{/    if (!(gmailMimeType === "application\/pdf" || gmailMimeType.startsWith("image\/"))) {/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/services/documents/integration-intake.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a private allowlist passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a private allowlist fails the verifier"

      - name: I-7C.3 negative proof (a fabricated WhatsApp media type must be caught)
        run: |
          F="lib/services/integrations/whatsapp/media-validation.service.ts"
          cp "$F" "$F.bak"
          # Missing metadata becomes "probably a PDF" again, so an unidentified
          # file is stored, OCR'd and recorded under a type nobody established.
          perl -0pi -e 's/    const detected = detectFileSignature\(params\.buffer\);\r?\n    if \(detected === null\) return \{ ok: false, reason: "unsupported_mime" \};/    const detected = detectFileSignature(params.buffer) ?? "pdf";/' "$F"
          if npx tsx lib/services/documents/integration-intake.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a fabricated media type passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a fabricated media type fails the verifier"

      - name: I-7C.3 negative proof (a Gmail identity row outside the transaction must be caught)
        run: |
          F="app/api/integrations/gmail/import/route.ts"
          cp "$F" "$F.bak"
          # THE defect this increment closed: the import identity leaves the
          # transaction that creates the Document, so a crash between them
          # leaves a Document no retry can see.
          perl -0pi -e 's/        withinTransaction: async \(tx, documentId\) => \{/        unusedHook: async (tx: never, documentId: number) => {/' "$F"
          if npx tsx lib/services/documents/integration-intake.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an uncoupled identity row passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an uncoupled identity row fails the verifier"

      - name: I-7C.3 negative proof (a hook running outside the tenant transaction must be caught)
        run: |
          F="lib/services/documents/create-document-from-ocr.service.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    return withTenantTransaction\(\(tx\) => fn\(tx\)\);/    return fn(prisma as unknown as TenantTx);/' "$F"
          if npx tsx lib/services/documents/integration-intake.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an untenanted transaction passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an untenanted transaction fails the verifier"

      # Import/Export Center I-7 — Documents. Blocking because this is the only
      # import path that writes to TWO durability systems (object storage and
      # PostgreSQL), and its failure mode is silent duplication: a retried batch
      # that ingests every document a second time looks exactly like a slow one.
      # Pure — no DB, no network, no object storage.
      # Local equivalent: npm run verify:document-ingestion
      - name: Canonical document ingestion (one ingestion path, storage before row)
        run: npx tsx lib/services/documents/document-ingestion.verify.test.ts

      - name: I-7C.1 negative proof (upload accepting a file on its declared type alone must be caught)
        run: |
          F="app/api/documents/upload/route.ts"
          cp "$F" "$F.bak"
          # The gap this increment closed. The route goes back to believing
          # `file.type`, so a renamed file reaches storage and the OCR pipeline
          # under a type it does not have.
          perl -0pi -e 's/    if \(!signature\.ok\) \{/    if (false) {/' "$F"
          if npx tsx lib/services/documents/document-ingestion.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unvalidated upload passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unvalidated upload fails the verifier"

      - name: I-7C.1 negative proof (an unbounded image/* allowlist must be caught)
        run: |
          F="lib/services/documents/document-ingestion.service.ts"
          cp "$F" "$F.bak"
          # An open-ended accepted set cannot be signature-checked: declaring
          # image/webp was enough to get arbitrary bytes accepted.
          perl -0pi -e 's/  return containerForDeclaredMime\(m\) !== null;/  return m === "application\/pdf" || m.startsWith("image\/");/' "$F"
          if npx tsx lib/services/documents/document-ingestion.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: the image/* wildcard passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: the image/* wildcard fails the verifier"

      - name: I-7C.1 negative proof (accepting bytes that disagree with the declared type must be caught)
        run: |
          F="lib/services/documents/file-signature.ts"
          cp "$F" "$F.bak"
          # Detection still runs, but its answer is no longer compared to what
          # the client claimed — so a real JPEG passes as a PDF.
          perl -0pi -e 's/  if \(expected === null \|\| expected !== detected\) \{/  if (false) {/' "$F"
          if npx tsx lib/services/documents/document-ingestion.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a mismatched container passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a mismatched container fails the verifier"

      # Local equivalent: npm run verify:documents-analyze
      - name: Documents batch analyze (zero writes, duplicate triage, signatures)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: npx tsx lib/data-transfer/documents/documents-analyze.verify.test.ts

      # Local equivalent: npm run verify:documents-execute
      - name: Documents execute (binding, idempotency, drift, failure injection)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts

      - name: I-7 negative proof (a marker outside the ingestion transaction must be caught)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: |
          F="lib/data-transfer/documents/documents-execute.ts"
          cp "$F" "$F.bak"
          # THE defect this increment exists to prevent. The marker moves out of
          # the transaction that creates the Document row, so a crash between
          # them leaves a document nothing has recorded — and the retry, which
          # for an override cannot rely on duplicate detection, creates a second
          # copy.
          perl -0pi -e 's/      withinTransaction: async \(tx\) => \{\r?\n        await markRow\(tx, \{/      withinTransaction: undefined,\n      unusedMarker: async (tx: never) => {\n        await markRow(tx, {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a marker outside the transaction passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a marker outside the transaction fails the verifier"

      - name: I-7 negative proof (a caller statement outside the ingestion transaction must be caught)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: |
          F="lib/services/documents/document-ingestion.service.ts"
          cp "$F" "$F.bak"
          # The caller's statement leaves the transaction that creates the
          # Document, so the marker and the row it describes stop being atomic.
          # Expressed as a deletion, which cannot drift when the lines around
          # it change — the previous two-step reorder silently stopped matching
          # once the content lock was added between them.
          perl -0pi -e 's/          if \(input\.withinTransaction\) await input\.withinTransaction\(tx\);//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an uncoupled caller statement passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an uncoupled caller statement fails the verifier"

      - name: I-7 negative proof (deriving the duplicate override from live truth must be caught)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: |
          F="lib/data-transfer/documents/documents-execute.ts"
          cp "$F" "$F.bak"
          # The silent re-decision: instead of reading the override from the
          # SIGNED decision, execute asks "is it a duplicate now?" — and so
          # reads a plain CREATE on a file that became a duplicate after the
          # preview as an override the owner never gave.
          perl -pi -e 's/      allowDuplicate: action === "CREATE_ANYWAY",/      allowDuplicate: true,/' "$F"
          if npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unconditional override passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unconditional override fails the verifier"

      - name: I-7 negative proof (re-validating decisions before the run lookup must be caught)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: |
          F="lib/data-transfer/documents/documents-execute.ts"
          cp "$F" "$F.bak"
          # I-6's ordering defect in the Documents domain: a resumed run judges
          # its own CREATE decisions against a world it changed, so every file
          # it already ingested is refused as "you already hold this".
          perl -0pi -e 's/  if \(!existing\) \{/  if (true) {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: validate-before-lookup passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: validate-before-lookup fails the verifier"

      - name: I-7 negative proof (resuming a finished run instead of replaying it must be caught)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: |
          F="lib/data-transfer/documents/documents-execute.ts"
          cp "$F" "$F.bak"
          # BOTH replay branches removed, because either one alone still catches
          # it — replay safety is layered, and a proof that only disables the
          # first would pass while proving nothing.
          perl -0pi -e 's/  if \(existing && existing\.status !== "EXECUTING"\) \{/  if (false) {/' "$F"
          perl -0pi -e 's/  if \(!run\.created && run\.status !== "EXECUTING"\) \{/  if (false) {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: resuming a finished run passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: resuming a finished run fails the verifier"

      - name: I-7 negative proof (trusting the declared file type must be caught)
        env:
          AUTH_TOKEN_SECRET: i7_ci_synthetic_secret
        run: |
          F="lib/data-transfer/documents/batch-analyze.ts"
          cp "$F" "$F.bak"
          # The batch stops checking that a file's bytes match the type it
          # claims, so a renamed file passes the preview and reaches storage.
          perl -0pi -e 's/    if \(!signature\.ok\) \{/    if (false) {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-execute.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a relabelled file passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a relabelled file fails the verifier"

      # I-7E — Gmail MIME provenance and cross-channel duplicate awareness.
      # Blocking because both failures are silent: a browser-supplied media type
      # deciding how a stored document is typed, and the same invoice becoming
      # two Documents because it arrived by two doors. The concurrency claim is
      # driven, not asserted — a pre-check alone cannot give it.
      # Pure — no DB, no network, no Gmail, no Meta.
      # Local equivalent: npm run verify:documents-hardening
      - name: Documents hardening (Gmail MIME authority, cross-channel duplicates)
        run: npx tsx lib/services/documents/documents-hardening.verify.test.ts

      - name: I-7E negative proof (trusting the browser's Gmail MIME must be caught)
        run: |
          F="app/api/integrations/gmail/import/route.ts"
          cp "$F" "$F.bak"
          # The gap this closed: a field in the request body deciding what the
          # server accepts and how the stored Document is typed.
          perl -0pi -e 's/    const gmailMimeType = lookup\.descriptor\.mimeType;/    const gmailMimeType = body.mimeType;/' "$F"
          if npx tsx lib/services/documents/documents-hardening.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a client-supplied media type passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a client-supplied media type fails the verifier"

      - name: I-7E negative proof (a dropped content lock must be caught)
        run: |
          F="lib/services/documents/create-document-from-ocr.service.ts"
          cp "$F" "$F.bak"
          # Without the lock the duplicate check is a snapshot, not a guarantee:
          # two channels can both read "no duplicate" and both insert.
          perl -0pi -e 's/    await lockDocumentContent\(db, params\.businessId, params\.contentHashSha256\);//' "$F"
          if npx tsx lib/services/documents/documents-hardening.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a race-prone pre-check passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a race-prone pre-check fails the verifier"

      - name: I-7E negative proof (breaking CREATE_ANYWAY must be caught)
        run: |
          F="lib/services/documents/create-document-from-ocr.service.ts"
          cp "$F" "$F.bak"
          # Making the skip unconditional would quietly remove the owner's
          # explicit, confirmed override in the Import Center.
          perl -0pi -e 's/    if \(params\.duplicatePolicy === "SKIP_IF_EXISTS"\) \{/    if (true) {/' "$F"
          if npx tsx lib/services/documents/documents-hardening.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a hard-coded duplicate policy passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a hard-coded duplicate policy fails the verifier"

      - name: I-7E negative proof (an unscoped duplicate query must be caught)
        run: |
          F="lib/services/documents/document-duplicate.ts"
          cp "$F" "$F.bak"
          # Dropping the tenant from the predicate would make one business's
          # file suppress another's — a cross-tenant leak wearing a skip.
          perl -0pi -e 's/    where: \{\r?\n      businessId,\r?\n      contentHashSha256,/    where: {\n      contentHashSha256,/' "$F"
          if npx tsx lib/services/documents/documents-hardening.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unscoped duplicate query passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unscoped duplicate query fails the verifier"

      - name: I-7E negative proof (a fabricated media type must be caught)
        run: |
          F="app/api/integrations/gmail/import/route.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    const gmailMimeType = lookup\.descriptor\.mimeType;/    const gmailMimeType = lookup.descriptor.mimeType || "application\/pdf";/' "$F"
          if npx tsx lib/services/documents/documents-hardening.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an invented media type passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an invented media type fails the verifier"

      # I-7D — Documents export. Blocking because every failure here is silent:
      # an archive that is short a file, an entry name that escapes its
      # directory, an index carrying storage keys, or one tenant's originals in
      # another tenant's download. The verifier builds a real ZIP and reads it
      # back rather than trusting the builder.
      # Pure — no DB, no network, no object storage.
      # Local equivalent: npm run verify:documents-export
      - name: Documents export (fidelity, entry safety, index, tenant, limits)
        run: npx tsx lib/data-transfer/documents/documents-export.verify.test.ts

      - name: I-7D negative proof (an unscoped document read must be caught)
        run: |
          F="lib/data-transfer/documents/documents-export.ts"
          cp "$F" "$F.bak"
          # The cross-tenant leak, planted where it would actually happen: the
          # read keeps working and starts returning other businesses' documents.
          perl -0pi -e 's/          where: \{\r?\n            businessId,/          where: {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-export.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unscoped read passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unscoped read fails the verifier"

      - name: I-7D negative proof (a traversal-bearing entry name must be caught)
        run: |
          F="lib/data-transfer/documents/documents-export.ts"
          cp "$F" "$F.bak"
          # The uploader's filename is trusted verbatim, so `../evil.pdf` becomes
          # an archive entry that escapes the documents directory on extraction.
          perl -0pi -e 's/export function sanitizeArchiveBaseName\(raw: string \| null\): string \{/export function sanitizeArchiveBaseName(raw: string | null): string {\n  return String(raw ?? "");/' "$F"
          if npx tsx lib/data-transfer/documents/documents-export.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a traversal filename passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a traversal filename fails the verifier"

      - name: I-7D negative proof (a silently omitted file must be caught)
        run: |
          F="lib/data-transfer/documents/documents-export.ts"
          cp "$F" "$F.bak"
          # An archive that quietly drops a document the owner believes is backed
          # up. It only surfaces the day they need the file.
          perl -0pi -e 's/        if \(!\(error instanceof StorageObjectNotFoundError\)\) \{/        if (false) {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-export.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a silent omission passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a silent omission fails the verifier"

      - name: I-7D negative proof (an internal identifier in the index must be caught)
        run: |
          F="lib/data-transfer/documents/documents-export.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    row\.originalFilename \?\? "",/    row.fileUrl,/' "$F"
          if npx tsx lib/data-transfer/documents/documents-export.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a storage key in the index passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: a storage key in the index fails the verifier"

      - name: I-7D negative proof (a dropped export ceiling must be caught)
        run: |
          F="lib/data-transfer/documents/documents-export.ts"
          cp "$F" "$F.bak"
          # The byte ceiling is the real safety limit: the archive is assembled
          # in memory, and a function that exceeds it is killed, not errored.
          perl -0pi -e 's/      if \(totalBytes > DOCUMENTS_EXPORT_MAX_TOTAL_BYTES\) \{/      if (false) {/' "$F"
          if npx tsx lib/data-transfer/documents/documents-export.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an unbounded archive passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: an unbounded archive fails the verifier"

      # CASA Wave B — platform-admin TOTP MFA (CASA 3.3.1). The elevation
      # envelope and the guard decide whether a privileged request is allowed at
      # all, so they belong in the BLOCKING job. Deterministic and offline: no
      # DB, no network, no real secret.
      # Local equivalent: npm run verify:admin-mfa
      - name: Platform-admin MFA matrix (elevation, binding, expiry, seed storage)
        env:
          AUTH_TOKEN_SECRET: wave_b_ci_synthetic_secret
        run: npx tsx lib/auth/platform-admin-mfa.test.ts

      - name: Wave B negative proof (unbinding the elevation from the user must be caught)
        env:
          AUTH_TOKEN_SECRET: wave_b_ci_synthetic_secret
        run: |
          F="lib/auth/platform-admin-elevation.ts"
          cp "$F" "$F.bak"
          # Drop the user-binding check: an elevation minted for one admin would
          # then elevate any other.
          sed -i 's|  if (payload.sub !== expectedUserId) {|  if (false) {|' "$F"
          if npx tsx lib/auth/platform-admin-mfa.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the unbound elevation"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the unbound elevation"

      # CASA Wave B — the BROWSER half of the same control. Enforcement is
      # useless if the console cannot answer the challenge, and it was proven
      # that it could not: the admin client never sent x-admin-elevation. This
      # matrix pins the step-up contract (one challenge, one retry, no loop, no
      # retained code). Deterministic and offline: fetch and localStorage are
      # stubbed. Local equivalent: npm run verify:admin-step-up
      - name: Platform-admin MFA step-up client (challenge, single retry, no code retention)
        run: npx tsx lib/platform-admin/admin-step-up.test.ts

      - name: Wave B negative proof (retrying a cancelled challenge must be caught)
        run: |
          F="lib/platform-admin/fetch-platform-admin.ts"
          cp "$F" "$F.bak"
          # Drop the cancel guard: a cancelled or failed verification would then
          # still retry the privileged request instead of surfacing the refusal.
          sed -i 's|      if (!fresh) {|      if (false) {|' "$F"
          if npx tsx lib/platform-admin/admin-step-up.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: matrix did not catch the retry-after-cancel"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: matrix caught the retry-after-cancel"

      # CASA Wave E — PayPal and Tranzila were live, unauthenticated webhook
      # consumers verified only by a static token compared with '==='. Production
      # held zero rows for either provider, so the capability was disabled rather
      # than given invented cryptography. This matrix pins what makes that real:
      # a dormant callback reaches no processing, and the connect path is closed
      # server-side so removing the UI option is not the control.
      # Local equivalent: npm run verify:dormant-providers
      - name: Dormant payment providers stay closed (PayPal + Tranzila)
        run: npx tsx lib/services/payments/dormant-provider-closure.test.ts

      - name: Wave E negative proof (removing the webhook capability gate must be caught)
        run: |
          F="lib/services/payments/payment-webhook-handler.ts"
          cp "$F" "$F.bak"
          # Drop the capability gate: a dormant provider's callback would then
          # reach processing, persistence and provider verification again.
          sed -i 's|  if (!isPaymentProviderEnabled(input.provider)) {|  if (false) {|' "$F"
          if npx tsx lib/services/payments/dormant-provider-closure.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: matrix did not catch the removed capability gate"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: matrix caught the removed capability gate"

      # WhatsApp webhook EVENT-CLASS boundary. A read-only audit found that
      # acceptance was decided by payload SHAPE, not event class: change.field
      # was never read, so any change carrying a value.messages[] array reached
      # dispatch. Inertness of other fields depended on Meta choosing not to
      # emit a messages-shaped array elsewhere — an assumption about the
      # provider, not a property of this code. Deterministic and offline.
      # Local equivalent: npm run verify:whatsapp-event-class
      - name: WhatsApp webhook event-class boundary (field must be "messages")
        run: npx tsx lib/services/integrations/whatsapp/webhook-event-class-boundary.test.ts

      - name: Negative proof (removing the WhatsApp event-class boundary must be caught)
        run: |
          F="lib/services/integrations/whatsapp/webhook-parse.service.ts"
          cp "$F" "$F.bak"
          # Drop the event-class check: a hostile non-messages field carrying a
          # crafted messages[] array would again reach the dispatch loop.
          sed -i 's|      if (asString(changeRec?.field ?? null) !== SUPPORTED_CHANGE_FIELD) {|      if (false) {|' "$F"
          if npx tsx lib/services/integrations/whatsapp/webhook-event-class-boundary.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: matrix did not catch the removed event-class boundary"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: matrix caught the removed event-class boundary"

      # CASA Wave A — the application session lifetime (CASA 2.2.3). This token
      # is stateless and non-revocable, so its 24h ceiling IS the control; there
      # is no session store to fall back on. Enforced in code rather than by
      # configuration, and guarded here so no future change — or environment
      # variable — can quietly buy back a longer session.
      # Local equivalent: npm run verify:auth-token-ttl
      - name: Application session TTL ceiling (CASA 2.2.3)
        env:
          AUTH_TOKEN_SECRET: wave_a_ci_synthetic_secret
        run: npx tsx lib/auth-token.test.ts

      - name: Wave A negative proof (restoring a >24h lifetime must be caught)
        env:
          AUTH_TOKEN_SECRET: wave_a_ci_synthetic_secret
        run: |
          F="lib/auth-token.ts"
          cp "$F" "$F.bak"
          # Re-introduce the exact defect Wave A removed: a 30-day ceiling.
          sed -i 's|const MAX_TTL_SECONDS = 24 \* 60 \* 60;|const MAX_TTL_SECONDS = 30 * 24 * 60 * 60;|' "$F"
          if npx tsx lib/auth-token.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the restored 30-day lifetime"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the restored 30-day lifetime"

      # CASA Wave D — the CardCom webhook trust model. CardCom publishes no
      # signature mechanism, so authenticity rests entirely on correlation to a
      # payment flow this system created plus an authenticated GetLpResult.
      # These are the load-bearing tests for a public, unauthenticated,
      # money-adjacent endpoint, so they belong in the BLOCKING job rather than
      # in a script nobody runs. Pure in-memory: no DB, no network, no secrets.
      # Local equivalent: npm run verify:cardcom-webhook-hardening
      - name: CardCom webhook hardening (fail-closed + correlation + idempotency)
        run: npx tsx lib/services/payments/cardcom-webhook-hardening.test.ts

      - name: Payment webhook orchestration (authority + pre-persistence refusal)
        run: npx tsx lib/services/payments/payment-webhook.test.ts

      # Two negative proofs, each aimed at a control that is actually
      # load-bearing. (A third candidate — re-planting the fail-open branch in
      # CardCom's own verifyWebhook — was tried and DELIBERATELY dropped: the
      # suite still passed, because correlation catches those callbacks anyway.
      # That is defence-in-depth working as intended, but it makes for a proof
      # that proves nothing, so it is not used.)
      - name: Wave D negative proof 1 (restoring a provider fail-open must be caught)
        run: |
          F="lib/services/payments/providers/tranzila/tranzila.provider.ts"
          cp "$F" "$F.bak"
          # Re-introduce the exact defect Wave D removed: an unconfigured
          # provider accepting arbitrary anonymous callbacks.
          sed -i 's|      return { ok: false, reason: "provider_not_configured" };|      return { ok: true };|' "$F"
          if npx tsx lib/services/payments/cardcom-webhook-hardening.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the restored fail-open branch"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the restored fail-open branch"

      - name: Wave D negative proof 2 (dropping the ReturnValue correlation must be caught)
        run: |
          F="lib/services/payments/payment-webhook.service.ts"
          cp "$F" "$F.bak"
          # Disable the second correlation channel: a callback could then point a
          # real LowProfileId at someone else's PaymentRequest.
          sed -i 's|    String(parsed.correlationValue) !== String(request.id)|    false|' "$F"
          if npx tsx lib/services/payments/cardcom-webhook-hardening.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the dropped correlation check"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the dropped correlation check"

      - name: Leads W1 negative proof (a broken due-date rule must be caught)
        run: |
          F="lib/services/crm/lead-core.ts"
          cp "$F" "$F.bak"
          # Break the Israel-time day comparison into a naive UTC one.
          sed -i 's/if (delta < 0) return { kind: "overdue", at, overdueDays: -delta };/if (delta < 999) return { kind: "overdue", at, overdueDays: 1 };/' "$F"
          if npx tsx lib/services/crm/lead-core.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the broken follow-up rule"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the broken follow-up rule"

      # Leads W3: the rules that decide "who needs me next". Pure functions over
      # an in-memory conversation row — no DB, no network, no secrets — and the
      # single most load-bearing judgement in the product: if the queue order
      # stops being trustworthy the owner stops opening the screen. Blocking, so
      # a change to the bands has to be deliberate.
      # Local equivalent: npm run verify:leads-intelligence
      - name: Leads W3 intelligence + priority (aggregation, bands, safety)
        run: npx tsx lib/services/crm/lead-intelligence.test.ts

      - name: Leads W3 negative proof (a hot thread must not outrank an overdue promise)
        run: |
          F="lib/services/crm/lead-intelligence.ts"
          cp "$F" "$F.bak"
          # Let a hot thread score above the overdue follow-up band.
          sed -i 's/candidates.push({ score: 45, reason: "HOT_THREAD" });/candidates.push({ score: 99, reason: "HOT_THREAD" });/' "$F"
          if npx tsx lib/services/crm/lead-intelligence.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: the suite did not catch an inflated hot-thread score"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: the suite caught the inflated hot-thread score"

      # W2.5: the Conversation State Writer. Its behavioural proof needs a
      # database and stays local (npm run verify:conversation-state-w25), but
      # both blockers the activation audit found were SHAPES of code — a
      # read-modify-write `increment` that double-counted on replay, and a
      # `conversation.update({ where: { id } })` with no tenant predicate. A
      # refactor can reintroduce a shape long after anyone last ran the
      # DB-backed suite, so the shape itself is guarded here: pure fs scan, no
      # DB, no secrets. Local equivalent: npm run verify:conversation-state-contract
      - name: Conversation State Writer structural contract (replay + tenant safety)
        run: npx tsx lib/conversation-state/conversation-state.contract.test.ts

      - name: Writer negative proof (an untenanted write must be caught)
        run: |
          F="lib/conversation-state/conversation-state.service.ts"
          cp "$F" "$F.bak"
          # Drop the businessId predicate: mutate the conversation by id alone.
          sed -i 's/const updated = await db.conversation.updateMany({/const updated = await db.conversation.update({/' "$F"
          if npx tsx lib/conversation-state/conversation-state.contract.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: guard did not catch the untenanted write"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: guard caught the untenanted write"

      - name: Writer negative proof (a re-introduced increment must be caught)
        run: |
          F="lib/conversation-state/conversation-state.service.ts"
          cp "$F" "$F.bak"
          # Put the non-idempotent counter back.
          sed -i 's/unansweredInboundCount: unansweredAfterEvent,/unansweredInboundCount: { increment: 1 },/' "$F"
          if npx tsx lib/conversation-state/conversation-state.contract.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: guard did not catch the read-modify-write counter"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: guard caught the read-modify-write counter"

      - name: IMPL-2 negative proof (a synthetic Prisma type import must be caught)
        run: |
          F="lib/business-memory/evidence/review-event.reader.ts"
          cp "$F" "$F.bak"
          printf 'import type { Prisma } from "@prisma/client";\n' | cat - "$F.bak" > "$F"
          if npx tsx lib/business-memory/evidence/evidence-adapter.contract.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the leaked Prisma type import"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the leaked Prisma type import"
