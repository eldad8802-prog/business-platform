name: CI-1 Prisma Client Centralization Guard

# D2 / P5-3 (canonicalized in P7-W0a) — enforce the CI-1 invariant: production
# tenant-scoped runtime code must use the canonical Prisma client (lib/prisma.ts)
# and must not instantiate ad-hoc `new PrismaClient(...)`. Enforces on pushes to
# main and all PRs to main; also runnable locally via
# `npm run verify:prisma-centralization`, so the guard is not a CI-only artifact.

on:
  push:
    branches: [feat/d2-p7-w2gate-admin-foundation, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-1-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: CI-1 guard (positive — must pass)
        run: bash scripts/ci/prisma-centralization-guard.sh .

      - name: CI-1 negative proof (a synthetic offender must be caught)
        run: |
          NEG="$(mktemp -d)"
          mkdir -p "$NEG/app/x" "$NEG/lib"
          printf 'const prisma = new PrismaClient();\n' > "$NEG/app/x/route.ts"
          if bash scripts/ci/prisma-centralization-guard.sh "$NEG"; then
            echo "NEGATIVE-PROOF FAIL: guard did not catch the offender"; rm -rf "$NEG"; exit 1
          fi
          echo "NEGATIVE-PROOF PASS: guard caught the synthetic offender"; rm -rf "$NEG"

      - name: Admin-boundary guard CI-2/3/4 (positive — must pass)
        run: bash scripts/ci/admin-boundary-guard.sh .

      - name: Admin-boundary negative proofs (synthetic offenders must be caught)
        run: |
          NEG="$(mktemp -d)"
          mkdir -p "$NEG/app/api/customers" "$NEG/app/api/platform-admin/x" "$NEG/lib/services/platform-admin"
          printf 'import { getPrismaAdmin } from "@/lib/prisma-admin";\n' > "$NEG/app/api/customers/route.ts"
          if bash scripts/ci/admin-boundary-guard.sh "$NEG" >/dev/null 2>&1; then echo "CI-2 NEGATIVE FAIL"; exit 1; fi
          rm "$NEG/app/api/customers/route.ts"
          printf 'export async function GET(){return null}\n' > "$NEG/app/api/platform-admin/x/route.ts"
          if bash scripts/ci/admin-boundary-guard.sh "$NEG" >/dev/null 2>&1; then echo "CI-3 NEGATIVE FAIL"; exit 1; fi
          rm "$NEG/app/api/platform-admin/x/route.ts"
          printf 'import { prisma } from "@/lib/prisma";\n' > "$NEG/lib/services/platform-admin/new-thing.service.ts"
          if bash scripts/ci/admin-boundary-guard.sh "$NEG" >/dev/null 2>&1; then echo "CI-4 NEGATIVE FAIL"; exit 1; fi
          rm -rf "$NEG"
          echo "ADMIN-BOUNDARY NEGATIVE PROOFS PASS (CI-2, CI-3, CI-4)"

      - name: npm ci (needed for @prisma/client in auth matrix test)
        run: npm ci --no-audit --no-fund

      - name: Platform-admin auth fail-closed matrix (Step 0 hardening)
        run: npx tsx lib/auth/platform-admin.test.ts

      - name: P5-1 tenant context unit test (regression — must still pass)
        run: npx tsx lib/tenant/context.test.ts

      # W4E-B: the ITA OAuth tenant binding. Deterministic, offline, no DB —
      # and blocking, so an untrusted cookie can never silently become the
      # tenant authority again.
      - name: Tax Authority signed-state adversarial matrix
        env:
          AUTH_TOKEN_SECRET: w4eb_ci_signed_state_synthetic_secret
        run: npx tsx lib/services/billing/authority/billing-authority-signed-state.verify.test.ts

      # Ratified IMPL-2 boundary: the business-memory evidence adapter must not
      # import Prisma model types. W4D's dbStep codemod leaked two unused
      # `import type { Prisma }` lines past every branch check, because this
      # deterministic verifier ran in NO workflow — it was caught only by
      # post-merge operator verification. Wired here (the canonical blocking
      # guard job) since it is a pure fs + in-memory scan: no DB, no network,
      # no secrets. Local equivalent: npm run verify:business-memory-evidence-adapter
      - name: IMPL-2 evidence-adapter boundary (no Prisma type leak)
        run: npx tsx lib/business-memory/evidence/evidence-adapter.contract.test.ts

      # Leads W1: the whole Leads domain core (status vocabulary, transitions,
      # validation, and the Israel-time follow-up due/overdue arithmetic) is a
      # set of pure functions with no DB, no network and no secrets — so the
      # rules that decide "who needs chasing today" are guarded by the BLOCKING
      # job rather than by a script nobody runs. The DB-backed service test
      # (verify:leads-service) needs a database and stays local.
      # Local equivalent: npm run verify:leads-core
      - name: Leads W1 domain core (status, validation, follow-up due logic)
        run: npx tsx lib/services/crm/lead-core.test.ts

      - name: Leads W1 negative proof (a broken due-date rule must be caught)
        run: |
          F="lib/services/crm/lead-core.ts"
          cp "$F" "$F.bak"
          # Break the Israel-time day comparison into a naive UTC one.
          sed -i 's/if (delta < 0) return { kind: "overdue", at, overdueDays: -delta };/if (delta < 999) return { kind: "overdue", at, overdueDays: 1 };/' "$F"
          if npx tsx lib/services/crm/lead-core.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the broken follow-up rule"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the broken follow-up rule"

      # W2.5: the Conversation State Writer. Its behavioural proof needs a
      # database and stays local (npm run verify:conversation-state-w25), but
      # both blockers the activation audit found were SHAPES of code — a
      # read-modify-write `increment` that double-counted on replay, and a
      # `conversation.update({ where: { id } })` with no tenant predicate. A
      # refactor can reintroduce a shape long after anyone last ran the
      # DB-backed suite, so the shape itself is guarded here: pure fs scan, no
      # DB, no secrets. Local equivalent: npm run verify:conversation-state-contract
      - name: Conversation State Writer structural contract (replay + tenant safety)
        run: npx tsx lib/conversation-state/conversation-state.contract.test.ts

      - name: Writer negative proof (an untenanted write must be caught)
        run: |
          F="lib/conversation-state/conversation-state.service.ts"
          cp "$F" "$F.bak"
          # Drop the businessId predicate: mutate the conversation by id alone.
          sed -i 's/const updated = await db.conversation.updateMany({/const updated = await db.conversation.update({/' "$F"
          if npx tsx lib/conversation-state/conversation-state.contract.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: guard did not catch the untenanted write"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: guard caught the untenanted write"

      - name: Writer negative proof (a re-introduced increment must be caught)
        run: |
          F="lib/conversation-state/conversation-state.service.ts"
          cp "$F" "$F.bak"
          # Put the non-idempotent counter back.
          sed -i 's/unansweredInboundCount: unansweredAfterEvent,/unansweredInboundCount: { increment: 1 },/' "$F"
          if npx tsx lib/conversation-state/conversation-state.contract.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: guard did not catch the read-modify-write counter"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: guard caught the read-modify-write counter"

      - name: IMPL-2 negative proof (a synthetic Prisma type import must be caught)
        run: |
          F="lib/business-memory/evidence/review-event.reader.ts"
          cp "$F" "$F.bak"
          printf 'import type { Prisma } from "@prisma/client";\n' | cat - "$F.bak" > "$F"
          if npx tsx lib/business-memory/evidence/evidence-adapter.contract.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier did not catch the leaked Prisma type import"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: verifier caught the leaked Prisma type import"
