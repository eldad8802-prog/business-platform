name: CI-1 Prisma Client Centralization Guard

# D2 / P5-3 (canonicalized in P7-W0a) — enforce the CI-1 invariant: production
# tenant-scoped runtime code must use the canonical Prisma client (lib/prisma.ts)
# and must not instantiate ad-hoc `new PrismaClient(...)`. Enforces on pushes to
# main and all PRs to main; also runnable locally via
# `npm run verify:prisma-centralization`, so the guard is not a CI-only artifact.

on:
  push:
    branches: [feat/d2-p7-w2gate-admin-foundation, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-1-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: CI-1 guard (positive — must pass)
        run: bash scripts/ci/prisma-centralization-guard.sh .

      - name: CI-1 negative proof (a synthetic offender must be caught)
        run: |
          NEG="$(mktemp -d)"
          mkdir -p "$NEG/app/x" "$NEG/lib"
          printf 'const prisma = new PrismaClient();\n' > "$NEG/app/x/route.ts"
          if bash scripts/ci/prisma-centralization-guard.sh "$NEG"; then
            echo "NEGATIVE-PROOF FAIL: guard did not catch the offender"; rm -rf "$NEG"; exit 1
          fi
          echo "NEGATIVE-PROOF PASS: guard caught the synthetic offender"; rm -rf "$NEG"

      # D2/PRIVILEGED-WRITE-2 — the control-plane capability guards run on EVERY PR,
      # not only on PRs that touch the wave's own paths. The import-isolation and
      # actor/target guards must catch a leak introduced anywhere in the tree.
      - name: CI-PRIVWRITE control-plane guards (positive — must pass)
        run: bash scripts/ci/privwrite-guard.sh .

      - name: CI-PRIVWRITE negative self-proofs (planted violations must be caught)
        run: bash scripts/ci/privwrite-guard.sh --self-test

      - name: Admin-boundary guard CI-2/3/4 (positive — must pass)
        run: bash scripts/ci/admin-boundary-guard.sh .

      - name: Admin-boundary negative proofs (synthetic offenders must be caught)
        run: |
          NEG="$(mktemp -d)"
          mkdir -p "$NEG/app/api/customers" "$NEG/app/api/platform-admin/x" "$NEG/lib/services/platform-admin"
          printf 'import { getPrismaAdmin } from "@/lib/prisma-admin";\n' > "$NEG/app/api/customers/route.ts"
          if bash scripts/ci/admin-boundary-guard.sh "$NEG" >/dev/null 2>&1; then echo "CI-2 NEGATIVE FAIL"; exit 1; fi
          rm "$NEG/app/api/customers/route.ts"
          printf 'export async function GET(){return null}\n' > "$NEG/app/api/platform-admin/x/route.ts"
          if bash scripts/ci/admin-boundary-guard.sh "$NEG" >/dev/null 2>&1; then echo "CI-3 NEGATIVE FAIL"; exit 1; fi
          rm "$NEG/app/api/platform-admin/x/route.ts"
          printf 'import { prisma } from "@/lib/prisma";\n' > "$NEG/lib/services/platform-admin/new-thing.service.ts"
          if bash scripts/ci/admin-boundary-guard.sh "$NEG" >/dev/null 2>&1; then echo "CI-4 NEGATIVE FAIL"; exit 1; fi
          rm -rf "$NEG"
          echo "ADMIN-BOUNDARY NEGATIVE PROOFS PASS (CI-2, CI-3, CI-4)"

      - name: npm ci (needed for @prisma/client in auth matrix test)
        run: npm ci --no-audit --no-fund

      - name: Platform-admin auth fail-closed matrix (Step 0 hardening)
        run: npx tsx lib/auth/platform-admin.test.ts

      - name: P5-1 tenant context unit test (regression — must still pass)
        run: npx tsx lib/tenant/context.test.ts

      # W4E-B: the ITA OAuth tenant binding. Deterministic, offline, no DB —
      # and blocking, so an untrusted cookie can never silently become the
      # tenant authority again.
      - name: Tax Authority signed-state adversarial matrix
        env:
          AUTH_TOKEN_SECRET: w4eb_ci_signed_state_synthetic_secret
        run: npx tsx lib/services/billing/authority/billing-authority-signed-state.verify.test.ts

      # Ratified IMPL-2 boundary: the business-memory evidence adapter must not
      # import Prisma model types. W4D's dbStep codemod leaked two unused
      # `import type { Prisma }` lines past every branch check, because this
      # deterministic verifier ran in NO workflow — it was caught only by
      # post-merge operator verification. Wired here (the canonical blocking
      # guard job) since it is a pure fs + in-memory scan: no DB, no network,
      # no secrets. Local equivalent: npm run verify:business-memory-evidence-adapter
      - name: IMPL-2 evidence-adapter boundary (no Prisma type leak)
        run: npx tsx lib/business-memory/evidence/evidence-adapter.contract.test.ts

      # Leads W1: the whole Leads domain core (status vocabulary, transitions,
      # validation, and the Israel-time follow-up due/overdue arithmetic) is a
      # set of pure functions with no DB, no network and no secrets — so the
      # rules that decide "who needs chasing today" are guarded by the BLOCKING
      # job rather than by a script nobody runs. The DB-backed service test
      # (verify:leads-service) needs a database and stays local.
      # Local equivalent: npm run verify:leads-core
      - name: Leads W1 domain core (status, validation, follow-up due logic)
        run: npx tsx lib/services/crm/lead-core.test.ts

      # Import/Export Center I-1 — the data-transfer FORMAT layer. It is in the
      # BLOCKING job for one reason: it holds the CSV formula-injection guard.
      # A regression there does not fail loudly at runtime — it silently ships
      # an export that executes attacker-controlled content when the owner opens
      # it in Excel. The same file also pins the Accountant Export byte layout
      # (differential vs a reproduction of the pre-fix renderer), so the security
      # fix cannot drift into a data-format change. Needs no DB and no secret;
      # ExcelJS comes from the npm ci step above.
      # Local equivalent: npm run verify:data-transfer-format
      - name: Data-transfer format layer (CSV injection guard + accountant byte layout)
        run: npx tsx lib/data-transfer/format/format.verify.test.ts

      - name: Data-transfer negative proof (removing the formula guard must be caught)
        run: |
          F="lib/data-transfer/format/csv-writer.ts"
          cp "$F" "$F.bak"
          # Neuter the guard exactly the way a careless refactor would: make it
          # never fire, leaving the quoting (which is NOT a formula defence).
          sed -i 's|^export function needsCsvFormulaGuard(value: string): boolean {|export function needsCsvFormulaGuard(value: string): boolean {\n  return false;|' "$F"
          if npx tsx lib/data-transfer/format/format.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier passed with the formula guard disabled"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: disabling the formula guard fails the verifier"

      # The legacy /api/reports/export endpoint built its CSV with r.join(",").
      # That corrupted every row whose vendor/category held a comma, quote or
      # newline, shipped OCR-derived text as executable spreadsheet content, and
      # emitted no BOM (so Hebrew arrived as gibberish). It now goes through the
      # canonical writer. This verifier holds BOTH halves: the security fix AND
      # the compatibility contract (comma delimiter, no sep= line, LF endings,
      # the same five English headers) — so a later "improvement" to the format
      # cannot silently break a consumer of a legacy endpoint. Pure: the route's
      # auth/tenant/query path is unchanged and is not imported here.
      # Local equivalent: npm run verify:financial-records-csv
      - name: /api/reports/export CSV (escaping, injection guard, BOM, compat)
        run: npx tsx lib/reports/financial-records-csv.verify.test.ts

      # Import/Export Center I-2 — the Settings foundation. Blocking for one
      # reason: DEAD NAVIGATION fails silently. Nothing crashes when someone
      # adds the Settings row "so it's ready" ahead of the capability — a
      # business owner simply finds a screen that does nothing. This asserts the
      # two halves of releasing (the flag and the Settings listing) can only
      # move TOGETHER, that no other surface links the unreleased route, and
      # that the transferable scope is exactly the six ratified domains.
      # Pure: no DB, no network, no rendering.
      # Local equivalent: npm run verify:import-export-foundation
      - name: Import/Export foundation (six-domain scope + no dead navigation)
        run: npx tsx lib/data-transfer/import-export-foundation.verify.test.ts

      - name: I-2 negative proof (release and Settings listing drifting apart must be caught)
        run: |
          F="components/settings/settings-categories.ts"
          cp "$F" "$F.bak"
          # Break the atomicity from the released side: the route stays open but
          # the Settings row disappears, so a working capability becomes
          # invisible to the only person who can use it. (Before release the
          # same guard catches the opposite mistake — a listed row that 404s.)
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const s = fs.readFileSync(p, "utf8");
            fs.writeFileSync(p, s.replace(/\n\s*IMPORT_EXPORT_SETTINGS_CATEGORY,/, ""));
          ' "$F"
          if npx tsx lib/data-transfer/import-export-foundation.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier passed with release/listing out of step"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: release/listing drift fails the verifier"

      # Import/Export Center I-3 — Tabular Export. Blocking because this is the
      # first surface that reads whole tables and hands them to the browser as a
      # file. The properties it pins are the ones whose failure is SILENT: a
      # query that stops filtering by tenant still returns rows; an OFFSET page
      # still returns rows; a formula-guard regression still produces a valid
      # CSV. Pure — the descriptors run against an in-memory fake tx, so no DB.
      # Local equivalent: npm run verify:data-transfer-export
      - name: Tabular export (keyset paging, tenant filter, packaging, injection)
        run: npx tsx lib/data-transfer/export/export.verify.test.ts

      - name: I-3 negative proof (dropping the tenant filter must be caught)
        run: |
          F="lib/data-transfer/export/domains/customers.export.ts"
          cp "$F" "$F.bak"
          # The cross-tenant leak, planted exactly as a careless edit would make
          # it: the keyset stays, the businessId predicate goes.
          sed -i 's|where: { businessId, id: { gt: afterId } },|where: { id: { gt: afterId } },|' "$F"
          if npx tsx lib/data-transfer/export/export.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier passed with the tenant filter removed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: removing the tenant filter fails the verifier"

      # Import/Export Center I-4 — downloadable import templates. Blocking
      # because a template's whole job is to tell the owner what the importer
      # will accept: if the template columns and the domain's importable fields
      # drift apart, the file becomes a confident lie and nothing crashes. Also
      # pins that generation reads NO business data (it is a pure function of a
      # domain id and a date) and that the data sheet carries no example rows,
      # which would be uploadable by accident.
      # Local equivalent: npm run verify:import-templates
      - name: Import templates (field-model drift, privacy, guide contract)
        run: npx tsx lib/data-transfer/templates/templates.verify.test.ts

      - name: I-4 negative proof (template/import drift must be caught)
        run: |
          F="lib/data-transfer/export/domains/customers.export.ts"
          cp "$F" "$F.bak"
          # Promote the first field the create service does NOT accept. The
          # template would then teach the owner a column the importer ignores.
          sed -i '0,/importable: false,/s//importable: true,/' "$F"
          if npx tsx lib/data-transfer/templates/templates.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: verifier passed with the import contract drifted"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS: template/import drift fails the verifier"

      # Import/Export Center I-8B.1 — the historical field contract and the two
      # primitives a fiscal import goes quietly wrong in. Blocking, because
      # every failure here is silent: a date read under the other convention
      # moves an invoice into another tax period, and an amount that passes
      # through binary floating point arrives an agora short. Nothing throws.
      # Local equivalent: npm run verify:historical-contract
      - name: Historical field contract, dates and Decimal-safe money
        run: npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts

      - name: I-8B.1 negative proof (a quote must never be a fiscal document)
        run: |
          F="lib/data-transfer/historical/historical-vocabulary.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  "CREDIT_NOTE",\n\] as const;/  "CREDIT_NOTE",\n  "QUOTE",\n] as const;/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: QUOTE entered the historical fiscal vocabulary"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (currency must never default to ILS)
        run: |
          F="lib/data-transfer/historical/historical-vocabulary.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/\): VocabularyResult<HistoricalCurrency> \{/): VocabularyResult<HistoricalCurrency> {\n  return { ok: true, value: "ILS", raw: "" };/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a missing currency was silently assumed to be shekels"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (no locale date parsing)
        run: |
          F="lib/data-transfer/historical/historical-date.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  const iso = ISO\.exec\(original\);/  const iso = ISO.exec(original);\n  const loose = new Date(original);\n  void loose;/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the date primitive started parsing user strings with Date"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (money must not become a JS number)
        run: |
          F="lib/data-transfer/historical/historical-money.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/return \{ ok: true, value, original, display: group\(value\) \};/return { ok: true, value: Number(value) as unknown as string, original, display: group(value) };/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a fiscal amount passed through binary floating point"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (no silent rounding past two decimals)
        run: |
          F="lib/data-transfer/historical/historical-money.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  if \(decimal\.decimalPlaces\(\) > MONEY_DECIMAL_PLACES\) \{/  if (false \&\& decimal.decimalPlaces() > MONEY_DECIMAL_PLACES) {/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a three-decimal amount was silently rounded into shape"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (no customer phone, email or address in v1)
        run: |
          F="lib/data-transfer/historical/historical-fields.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/\n\] as const;/,\n  { header: "phone", target: "customerPhoneSnapshot", type: "text", exportable: false, importable: true }\n] as const;/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: v1 started collecting personal contact details with no consumer"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (no internal identifier reaches the owner)
        run: |
          F="lib/data-transfer/historical/historical-fields.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/example: "2024\/0017",/example: "2024\/0017 businessId",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an internal identifier reached owner-facing text"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (the import sheet stays headers-only)
        run: |
          F="lib/data-transfer/templates/template-builder.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    rows: \[\],/    rows: [["x"]],/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an example row appeared on the sheet the owner uploads"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.1 negative proof (historical is not the issued-documents template)
        run: |
          F="lib/data-transfer/historical/historical-template.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/domainId: "historical-documents",/domainId: "issued-documents",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-contract.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the historical template was built as the issued-documents one"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      # Import/Export Center I-8B.2 — historical fiscal Analyze. Blocking,
      # because the guarantees are all negative ones: Analyze reads a file and
      # writes NOTHING, reaches no business data, resolves no reversal and
      # cannot become Preview or Execute. A guarantee about absence is only
      # worth what its proofs are worth.
      # Local equivalent: npm run verify:historical-analyze
      - name: Historical fiscal Analyze (read, map, normalize, validate)
        run: npx tsx lib/data-transfer/historical/historical-analyze.verify.test.ts

      - name: I-8B.2 negative proof (Analyze must not create a historical record)
        run: |
          F="lib/data-transfer/historical/historical-analyze.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  const rows: HistoricalAnalyzedRow\[\] = \[\];/  void historicalFiscalDocument.create({});\n  const rows: HistoricalAnalyzedRow[] = [];/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-analyze.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: Analyze gained a historical record write"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.2 negative proof (Analyze must not create an import run)
        run: |
          F="lib/data-transfer/historical/historical-analyze.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  const rows: HistoricalAnalyzedRow\[\] = \[\];/  void importRun.create({});\n  const rows: HistoricalAnalyzedRow[] = [];/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-analyze.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: Analyze gained an import-run write"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.2 negative proof (Analyze must not touch a customer)
        run: |
          F="lib/data-transfer/historical/historical-analyze.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  const rows: HistoricalAnalyzedRow\[\] = \[\];/  void customer.update({});\n  const rows: HistoricalAnalyzedRow[] = [];/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-analyze.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: Analyze gained a customer mutation"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.2 negative proof (Analyze must not touch billing)
        run: |
          F="lib/data-transfer/historical/historical-analyze.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  const rows: HistoricalAnalyzedRow\[\] = \[\];/  void billingDocument.update({});\n  const rows: HistoricalAnalyzedRow[] = [];/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: Analyze gained a billing mutation"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.2 negative proof (Analyze must not resolve a reversal against billing)
        run: |
          F="lib/data-transfer/historical/historical-analyze.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  \/\* ---- reversal reference: TEXT ONLY\. Nothing is resolved here ---- \*\//  void billingDocument.findFirst({});/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the reversal reference was resolved against billing"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.2 negative proof (granting Analyze must not grant Execute)
        run: |
          F="lib/data-transfer/export/export-registry.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    \(EXPORTABLE_DOMAIN_IDS as readonly string\[\]\)\.includes\(value\)/    ((EXPORTABLE_DOMAIN_IDS as readonly string[]).includes(value) || value === "historical-documents")/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the historical domain reached the generic import gate"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: I-8B.2 negative proof (currency must never default to ILS in Analyze)
        run: |
          F="lib/data-transfer/historical/historical-vocabulary.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/\): VocabularyResult<HistoricalCurrency> \{/): VocabularyResult<HistoricalCurrency> {\n  return { ok: true, value: "ILS", raw: "" };/' "$F"
