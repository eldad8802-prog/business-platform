          echo "NEGATIVE-PROOF PASS"

      # ── model-level coverage ───────────────────────────────────────────────
      # The failure these catch is not "this model holds personal data" — no guard
      # can know that — but "nobody said what happens to this model".

      # The one that actually happened: three inbound-email models entered main
      # carrying fromEmail, subject and a raw MIME object key, and every check in
      # the repository stayed green.
      - name: negative proof — N1 a new model with no disposition
        run: |
          F="prisma/schema.prisma"
          cp "$F" "$F.bak"
          printf 'model FuturePersonalThing {\n  id Int @id @default(autoincrement())\n  secret String?\n}\n' >> "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:538:544" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unclassified model passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      - name: negative proof — N2 a disposition for a model that does not exist
        run: |
          F="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts N2
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:549:555" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a stale classification passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # Object spread keeps the last write silently, so the categories are compared
      # as separate sources rather than trusting the merged registry.
      - name: negative proof — N3 one model in two categories
        run: |
          F="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts N3
