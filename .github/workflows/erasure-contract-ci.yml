      - name: negative proof — R8 one of the five synchronised payables entries is removed again
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$RUNNER_TEMP/R8.orig"
          node .ad2a/mutate.mjs R8
          if cmp -s "$F" "$RUNNER_TEMP/R8.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
