          grep -qF -- "C24-RETENTION-SET-MISMATCH" "$RUNNER_TEMP/R8.out" || { tail -40 "$RUNNER_TEMP/R8.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      # ── S8 — the objects, which the model-level contract cannot describe ────
      #
      # `CrmAttachment` is ERASURE_MANAGED and its object used to survive the erasure,
      # with the only storageKey deleted alongside the row. These prove the new
      # surface-level dimension cannot go quiet: not by being undeclared, not by the
      # model becoming managed, and not by a model-level finding resolving.

      - name: negative proof — S1 the CrmAttachment object surface is undeclared
        run: |
          F="scripts/ci/erasure/erasure-object-surfaces.ts"
          cp "$F" "$RUNNER_TEMP/S1.orig"
          node .ad2a/mutate.mjs S1
          if cmp -s "$F" "$RUNNER_TEMP/S1.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/S1.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/S1.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/S1.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          [ $rc -ne 0 ] || { echo "NEGATIVE-PROOF FAIL: stayed green"; exit 1; }
          grep -qF "C20-UNDECLARED-OBJECT-POINTER  CrmAttachment.storageKey" "$RUNNER_TEMP/S1.out" || { tail -40 "$RUNNER_TEMP/S1.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — S2 the adapter deletes the row without the object
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$RUNNER_TEMP/S2.orig"
          node .ad2a/mutate.mjs S2
          if cmp -s "$F" "$RUNNER_TEMP/S2.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/S2.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/S2.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/S2.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          [ $rc -ne 0 ] || { echo "NEGATIVE-PROOF FAIL: stayed green"; exit 1; }
          grep -qF "C22-OBJECT-ERASURE-NOT-IMPLEMENTED" "$RUNNER_TEMP/S2.out" || { tail -40 "$RUNNER_TEMP/S2.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      # The load-bearing one for the Supplier wave: resolving InventoryItem's MODEL-level
      # C12 must NOT take its image debt with it.
      - name: proof — S3 a model-level C12 resolving leaves the object finding standing
        run: |
          A="lib/services/account/account-deletion.prisma-store.ts"
          C="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$A" "$RUNNER_TEMP/S3.a"; cp "$C" "$RUNNER_TEMP/S3.c"
          node .ad2a/mutate.mjs S3
          if cmp -s "$A" "$RUNNER_TEMP/S3.a"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract > "$RUNNER_TEMP/S3.out" 2>&1; set -e
          cp "$RUNNER_TEMP/S3.a" "$A"; cp "$RUNNER_TEMP/S3.c" "$C"
          cmp -s "$A" "$RUNNER_TEMP/S3.a" && cmp -s "$C" "$RUNNER_TEMP/S3.c" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          grep -qF "InventoryItem holds personal data" "$RUNNER_TEMP/S3.out" && { echo "the model-level C12 did not resolve; the proof proves nothing"; exit 1; }
          grep -qF "C19-EXTERNAL-OBJECT-UNERASED" "$RUNNER_TEMP/S3.out" || { echo "PROOF FAIL: no object findings at all"; exit 1; }
          grep -qF "InventoryItem.imageUrl points at stored bytes" "$RUNNER_TEMP/S3.out" || { tail -40 "$RUNNER_TEMP/S3.out"; echo "PROOF FAIL: the image debt vanished with the model-level finding"; exit 1; }
          echo "PROOF PASS — C12 resolved, C19::InventoryItem.imageUrl still open"

      - name: negative proof — S4 the InventoryItem image surface is undeclared
        run: |
          F="scripts/ci/erasure/erasure-object-surfaces.ts"
          cp "$F" "$RUNNER_TEMP/S4.orig"
          node .ad2a/mutate.mjs S4
          if cmp -s "$F" "$RUNNER_TEMP/S4.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/S4.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/S4.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/S4.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          [ $rc -ne 0 ] || { echo "NEGATIVE-PROOF FAIL: a removed object debt passed silently"; exit 1; }
          grep -qF "C20-UNDECLARED-OBJECT-POINTER  InventoryItem.imageUrl" "$RUNNER_TEMP/S4.out" || { tail -40 "$RUNNER_TEMP/S4.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — S5 a new owned-object column arrives undeclared
        run: |
          F="prisma/schema.prisma"
          cp "$F" "$RUNNER_TEMP/S5.orig"
          node .ad2a/mutate.mjs S5
          if cmp -s "$F" "$RUNNER_TEMP/S5.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/S5.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/S5.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/S5.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
