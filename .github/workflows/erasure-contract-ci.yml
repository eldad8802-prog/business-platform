# ERASURE CONTRACT — does the code do what the erasure manifest promises?
#
# Deliberately its OWN workflow rather than a step inside the AD-2A battery job.
# It needs no database, so bolting it onto a job that spends minutes starting
# Postgres would make a two-second check take two minutes.
#
# Mode: --baseline-check. The manifest and the adapter genuinely disagree on the tree
# today — that is the finding this guard was built to surface — so the honest default
# mode is red, and a red required check on every unrelated pull request gets switched
# off within a week. The ratchet is the alternative to switching it off: it fails when
# the contract breaks somewhere NEW, and it also fails when recorded debt quietly gets
# fixed, so an improvement has to be written down rather than drifting in.
#
# Run `npm run verify:erasure-contract` with no flag to see the real, unfiltered state.

name: erasure contract (manifest ↔ schema ↔ implementation)

on:
  pull_request:
  push:
    branches: [main]

# I-3: explicit least privilege (was the repository default).
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: Erasure contract — schema ↔ manifest ↔ adapter (ratchet)
        run: npm run verify:erasure-contract -- --baseline-check

      # Each proof breaks the contract in ONE specific way and requires the guard to
      # notice. Without them the guard is a script that prints PASS, and a script that
      # prints PASS when it cannot parse its input prints PASS forever.
      #
      # THE MUTATIONS ARE AST-BASED, NOT TEXT-BASED. They used to be `perl -0pi -e`
      # substitutions anchored on exact source lines, and that broke three separate
      # times — each time because a change to the code a proof guards reformatted the
      # line the proof matched. The failure mode was the dangerous one: MUTATION NOT
      # APPLIED, a red build that says nothing about the contract, and a standing
      # temptation to move the anchor and carry on.
      #
      # `scripts/ci/erasure-mutate.ts` expresses every mutation against the TypeScript
      # syntax tree instead — "the data object of the notification.updateMany call",
      # not a run of characters — so reflowing, reindenting or reordering the target
      # cannot stop it applying. The format-robustness step near the end proves that
      # rather than asserting it.
      #
      # The driver only mutates. The copy/restore around each step and the
      # byte-identical check at the end are what prove the tree comes back.

      - name: negative proof — M1 manifest names a column that does not exist
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts M1
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:62:68" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a nonexistent column passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # The one that matters most. `email` is a real column on User, Customer and Lead;
      # BusinessProfile has `billingEmail`. A guard that searched field names globally
      # would call this valid, and would then also have called `lead.email` valid.
      - name: negative proof — M2 right column name, wrong model
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts M2
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:76:82" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a wrong-model column passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      - name: negative proof — M3 the adapter stops keeping a declared promise
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts M3
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:87:93" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unkept promise passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      - name: negative proof — M4 the adapter erases something undeclared
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts M4
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:98:104" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an undeclared mutation passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # A relation field is not a stored value. Accepting one as proof that a column
      # was erased would let a relation stand in for `lead.email`.
      - name: negative proof — M5 a relation offered where a column is required
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts M5
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:111:117" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a relation satisfied a column requirement"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # Removing one disposition is the same shape as adding a column tomorrow and
      # forgetting to say what happens to it.
      - name: negative proof — M6 a covered column with no disposition
        run: |
          F="lib/services/account/erasure-dispositions.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts M6
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:124:130" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unclassified covered column passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # ── the DELETE ROW contract ────────────────────────────────────────────
      # `deleteRow: true` claims the ROW goes; `clear` claims named columns are
      # nulled and the row stays. They used to be interchangeable to the guard: a
      # row deletion satisfied a `clear` declaration. That is how OAuthToken and
      # POSApiKey came to be described as clears of columns they do not have, while
      # the adapter destroyed the whole row. Four proofs hold the two apart.

      - name: negative proof — D1 the adapter stops deleting a row the manifest says is deleted
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts D1
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:142:148" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an undelivered row deletion passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # The one that earns the shape: the row deletion becomes a column clear that
      # blanks the exact column the old manifest named. The old contract could not
      # tell these apart. The row — businessId, label, source, lastUsedAt — survives.
      - name: negative proof — D2 a column clear may not stand in for a row deletion
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts D2
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:156:162" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a clear satisfied a DELETE ROW declaration"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # A typo in a deleteRow entry must not be inert the way `oauthToken` was.
      - name: negative proof — D3 deleteRow declared for a delegate that does not exist
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts D3
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:168:174" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a deleteRow for no model passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # The regression lock. Rewriting a deleteRow entry back into the clear shape is
      # the cheaper fix this increment rejected; the guard must refuse it outright.
      - name: negative proof — D4 a deleteRow entry cannot be downgraded back to a clear
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts D4
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:181:187" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a downgraded deleteRow passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # ── the reclassification contract ──────────────────────────────────────
      # Four models left UNMANAGED_PERSONAL_DATA because nothing in the product can
      # put a person in them. Each of those claims is a fact about the CODE, and a
      # fact about code expires without announcing it. These four are what keeps
      # "this is not personal data" from decaying into a false green.

      - name: negative proof — R1 BusinessService gains an application writer
        run: |
          F="app/api/business/bot/knowledge/route.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts R1
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:198:204" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a new writer kept the non-personal claim"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      - name: negative proof — R2 CollaborationDeal written from an undeclared route
        run: |
          F="app/api/deals/route.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts R2
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:209:215" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an undeclared write site passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # The one that needs the VALUE rule rather than the site rule: this mutation
      # lands inside a file that IS allowed to write the column.
      - name: negative proof — R3 InventoryAlert.message sourced from free text
        run: |
          F="lib/services/inventory/inventory.service.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts R3
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:222:228" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a non-derived message value passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      - name: negative proof — R4 a new text column on SupplierPurchaseDraftLine
        run: |
          F="prisma/schema.prisma"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts R4
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:233:239" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unclassified text column inherited the claim"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # ── C12-E1: two notes cleared, and what was deliberately kept ──────────
      # Each proof must go red FOR THE REASON UNDER TEST: the named finding has to
      # appear, not merely a non-zero exit. E3/E3B live here, not in the AD-2A
      # battery: under FORCE RLS a widened `where` clears exactly the same rows, so
      # the battery cannot see it (measured — it stays green). C18 holds the shape.
      # E4/E4P are the runtime half, in d2-ad2a-ci.yml.

      - name: negative proof — E1 the adapter stops clearing ReceivingSession.note
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E1
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E1.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "C6-DISPOSITION-NOT-IMPLEMENTED  ReceivingSession.note" "$RUNNER_TEMP/E1.out" || { cat "$RUNNER_TEMP/E1.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — E2 the adapter stops clearing the purchase-line note
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E2
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E2.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "C6-DISPOSITION-NOT-IMPLEMENTED  PurchaseOrderLine.remainingDecisionNote" "$RUNNER_TEMP/E2.out" || { cat "$RUNNER_TEMP/E2.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — E3 the purchase-line tenant filter is removed
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E3
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E3.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "C18-UNSCOPED-ERASURE-WRITE  PurchaseOrderLine.updateMany()" "$RUNNER_TEMP/E3.out" || { cat "$RUNNER_TEMP/E3.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — E3B the purchase-line relation keeps its name but loses the tenant
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E3B
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E3B.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "C18-UNSCOPED-ERASURE-WRITE  PurchaseOrderLine.updateMany()" "$RUNNER_TEMP/E3B.out" || { cat "$RUNNER_TEMP/E3B.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      # The provenance pointers are retained ONLY because the User row they name is
      # anonymised. Both halves of that premise are proved: the classification (E5)
      # and the adapter actually doing it (E5B).
      - name: negative proof — E5 User.email is reclassified as retained
        run: |
          F="lib/services/account/erasure-dispositions.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E5
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E5.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "C17-RETENTION-DEPENDENCY-BROKEN  PurchaseOrderLine.remainingDecidedByUserId" "$RUNNER_TEMP/E5.out" || { cat "$RUNNER_TEMP/E5.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — E5B the adapter stops anonymising User.email
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E5B
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E5B.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "and the adapter no longer writes it" "$RUNNER_TEMP/E5B.out" || { cat "$RUNNER_TEMP/E5B.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      # rawName, sku and barcode were written down as product identity so the
      # classification would not rest on inference. That is only worth something if
      # a NEW text column cannot appear beside them and quietly inherit it.
      - name: negative proof — E6 a new text column beside the product identity
        run: |
          F="prisma/schema.prisma"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E6
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/E6.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the contract stayed green"; exit 1; fi
          grep -qF "C6-NO-DISPOSITION  PurchaseOrderLine.supplierContactNote" "$RUNNER_TEMP/E6.out" || { cat "$RUNNER_TEMP/E6.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      # ── The retention contract: two authorities, one answer ────────────────
      #
      # The registry classifies (complete by construction); the manifest projects that
      # into the operational list the runtime guard reads. Five payables models were
      # retained in one and absent from the other for weeks, and nothing failed —
      # `assertManifestSafe` was checking the manifest against the manifest. R1–R4
      # prove the two sets cannot drift apart in either direction again; R5–R7 prove
      # the safety property now bites when measured against the REGISTRY's set; R8
      # pins the five that were missing.

      - name: negative proof — R1 a retained model disappears from the manifest
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$RUNNER_TEMP/R1.orig"
          node .ad2a/mutate.mjs R1
          if cmp -s "$F" "$RUNNER_TEMP/R1.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/R1.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/R1.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/R1.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          [ $rc -ne 0 ] || { echo "NEGATIVE-PROOF FAIL: the retention contract stayed green"; exit 1; }
          grep -qF -- "C24-RETENTION-SET-MISMATCH" "$RUNNER_TEMP/R1.out" || { tail -40 "$RUNNER_TEMP/R1.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — R2 the manifest retains a model the registry does not
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$RUNNER_TEMP/R2.orig"
          node .ad2a/mutate.mjs R2
          if cmp -s "$F" "$RUNNER_TEMP/R2.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/R2.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/R2.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/R2.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          [ $rc -ne 0 ] || { echo "NEGATIVE-PROOF FAIL: the retention contract stayed green"; exit 1; }
          grep -qF -- "C24-RETENTION-SET-MISMATCH" "$RUNNER_TEMP/R2.out" || { tail -40 "$RUNNER_TEMP/R2.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — R3 the registry stops retaining a model the manifest retains
        run: |
          F="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$F" "$RUNNER_TEMP/R3.orig"
          node .ad2a/mutate.mjs R3
          if cmp -s "$F" "$RUNNER_TEMP/R3.orig"; then echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npm run verify:erasure-contract -- --baseline-check > "$RUNNER_TEMP/R3.out" 2>&1; rc=$?; set -e
          cp "$RUNNER_TEMP/R3.orig" "$F"
          cmp -s "$F" "$RUNNER_TEMP/R3.orig" || { echo "RESTORE NOT BYTE-IDENTICAL"; exit 1; }
          [ $rc -ne 0 ] || { echo "NEGATIVE-PROOF FAIL: the retention contract stayed green"; exit 1; }
          grep -qF -- "C24-RETENTION-SET-MISMATCH" "$RUNNER_TEMP/R3.out" || { tail -40 "$RUNNER_TEMP/R3.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — R4 a new retained registry entry has no manifest counterpart
        run: |
          F="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$F" "$RUNNER_TEMP/R4.orig"
          node .ad2a/mutate.mjs R4
