      # The bridge to the field-level contract: a model-level claim that bypasses it.
      - name: negative proof — N4 ERASURE_MANAGED without any erasure
        run: |
          F="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts N4
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:574:580" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a hollow ERASURE_MANAGED claim passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      - name: negative proof — N5 an existing model loses its classification
        run: |
          F="scripts/ci/erasure/erasure-model-coverage.ts"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts N5
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:585:591" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a de-classified model passed"; exit 1
          fi
          mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS"

      # ── the proof about the proofs ─────────────────────────────────────────
      # Reflow the two targets that a product change reformatted, then mutate. The
      # reflow is GENERATED FROM THE SYNTAX TREE, so it cannot be accused of being
      # hand-written to keep matching: it re-emits the same properties across more
      # lines. With the old text anchors this exact sequence produced MUTATION NOT
      # APPLIED and a green contract. Now both mutations must still apply and the
      # guard must still go red.
      - name: negative proof — M4 and M5 survive a formatting-only change
        run: |
          A="lib/services/account/account-deletion.prisma-store.ts"
          M="lib/services/account/account-erasure-manifest.ts"
          cp "$A" "$A.bak"
          cp "$M" "$M.bak"
          npx tsx scripts/ci/erasure-mutate.ts --reflow M4
          npx tsx scripts/ci/erasure-mutate.ts --reflow M5
          if cmp -s "$A" "$A.bak"; then mv "$A.bak" "$A"; mv "$M.bak" "$M"; echo "REFLOW CHANGED NOTHING"; exit 1; fi
          npx tsx scripts/ci/erasure-mutate.ts M4
          npx tsx scripts/ci/erasure-mutate.ts M5
          if node scripts/ci/proof-capture.mjs "erasure-contract-ci.yml:603:614" -- npm run verify:erasure-contract -- --baseline-check; then
            mv "$A.bak" "$A"; mv "$M.bak" "$M"; echo "FORMAT-ROBUSTNESS FAIL: the guard stayed green"; exit 1
          fi
          mv "$A.bak" "$A"; mv "$M.bak" "$M"; echo "FORMAT-ROBUSTNESS PASS"

      - name: Confirm the tree is byte-identical after every mutation
        run: git diff --exit-code
