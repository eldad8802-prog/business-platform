# Daily Tasks — milestone A application layer (TaskService, erasure, coverage) on the REAL migration
# 20261018090000_daily_tasks_foundation, in Production's role topology (ephemeral PG17).
#
# .dt/lab.sh builds the lab exactly as the migration lab does (non-superuser CREATEROLE/BYPASSRLS owner, NOLOGIN
# app_runtime + LOGIN app_runtime_prod, the owner's default privileges, wave 1 on "Task") and applies the
# migration with `prisma migrate deploy`; the schema.prisma of this PR is what `db push` builds first, and the
# lab removes the task objects again so the migration builds them as Production will have them.
#
#   1. The pure core (rules, transitions, closed payload, keys, digest).
#   2. TaskService AS app_runtime_prod (NOSUPERUSER NOBYPASSRLS): isolation, lifecycle, series T-R1..T-R9,
#      repeated requests T-I1..T-I6, account erasure T-P1.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: daily tasks A — service on the real migration (ephemeral PG17)

on:
  pull_request:
    # Also the migration branch: this PR is stacked on #727 until it merges (migration-first).
    branches: [main, feat/daily-tasks-a-migration]
    paths:
      - "lib/services/tasks/**"
      - "lib/services/account/**"
      - "lib/tenant/**"
      - "lib/utils/jerusalem-day.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261018090000_daily_tasks_foundation/**"
      - ".dt/**"
      - "prisma/migrations/20261022090000_task_reminders_push/**"
      - ".trp/**"
      - ".acct/lab.sh"
      - ".appt/lab.sh"
      - ".dsl/lab.sh"
      - ".dsl/prereq.sql"
      - "prisma/migrations/20261103090000_document_supplier_link/**"
      - "prisma/migrations/20261112090000_service_desk_foundation/**"
      - "prisma/migrations/20261113090000_service_external_work/**"
      - "prisma/migrations/20261115090000_service_parts/**"
      - "prisma/migrations/20261120090000_service_desk_ui_foundation/**"
      - ".github/workflows/daily-tasks-a-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service:
    name: daily tasks A (PG17, runtime role, real migration)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: dta_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: dta_ci_synthetic_super_pw
      LAB_PASSWORD: dta_ci_synthetic_role_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 1. Pure core — rules, transitions, closed payload, keys, digest
        run: npm run verify:tasks-core

      - name: 2. TaskService as the restricted runtime on the real migration
        run: |
          set -euo pipefail
          # The task reminders migration (20261022090000) on top of the foundation, both by migrate deploy, then the
          # monthly accountant migration (20261027090000, applied in Production 2026-10-24) by migrate deploy as well:
          # account erasure calls its accountant_erase_business(). Then the appointments foundation (20261029090000) the
          # same way: account erasure also calls appointment_erase_business(). .appt/lab.sh runs .acct/lab.sh first.
          # And the document supplier link (20261103090000): account erasure also calls
          # document_supplier_link_erase_business(). .dsl/lab.sh runs .appt/lab.sh first.
          bash .dsl/lab.sh dta --with-dsl
          # And Service Desk (20261112090000, 1.2b 20261113090000, M2 20261115090000): account erasure also calls
          # service_erase_business(), service_external_erase_business() and service_parts_erase_business(), and business
          # documents (20261114090000) business_documents_erase(). Their tables come from `db push` here, so only the
          # functions are created — from the migrations' own text, EXECUTE to the runtime only.
          node -e '
            const s = require("fs").readFileSync("prisma/migrations/20261112090000_service_desk_foundation/migration.sql", "utf8");
            const m = s.match(/CREATE OR REPLACE FUNCTION public\.service_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!m) { console.error("service_erase_business() not found in the migration"); process.exit(1); }
            console.log(m[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_erase_business() TO app_runtime;");
            // Service Desk 1.2b (20261113090000): the same for service_external_erase_business().
            const x = require("fs").readFileSync("prisma/migrations/20261113090000_service_external_work/migration.sql", "utf8");
            const e = x.match(/CREATE OR REPLACE FUNCTION public\.service_external_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!e) { console.error("service_external_erase_business() not found in the migration"); process.exit(1); }
            console.log(e[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_external_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_external_erase_business() TO app_runtime;");
            // Business documents (20261114090000): the same for business_documents_erase() (tables from db push).
            const b = require("fs").readFileSync("prisma/migrations/20261114090000_business_documents_records/migration.sql", "utf8");
            const d = b.match(/CREATE OR REPLACE FUNCTION public\.business_documents_erase\(\)[\s\S]*?\$fn\$;/);
            if (!d) { console.error("business_documents_erase() not found in the migration"); process.exit(1); }
            console.log(d[0]);
            console.log("REVOKE ALL ON FUNCTION public.business_documents_erase() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.business_documents_erase() TO app_runtime;");
            // Service Desk spare parts M2 (20261115090000): the same for service_parts_erase_business().
            const p = require("fs").readFileSync("prisma/migrations/20261115090000_service_parts/migration.sql", "utf8");
            const q = p.match(/CREATE OR REPLACE FUNCTION public\.service_parts_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!q) { console.error("service_parts_erase_business() not found in the migration"); process.exit(1); }
            console.log(q[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_parts_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_parts_erase_business() TO app_runtime;");
            // Service Desk UI foundation 1.3-0 (20261120090000): the same for service_desk_ui_erase_business().
            const u = require("fs").readFileSync("prisma/migrations/20261120090000_service_desk_ui_foundation/migration.sql", "utf8");
            const v = u.match(/CREATE OR REPLACE FUNCTION public\.service_desk_ui_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!v) { console.error("service_desk_ui_erase_business() not found in the migration"); process.exit(1); }
            console.log(v[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_desk_ui_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_desk_ui_erase_business() TO app_runtime;");
            // Service Desk P4 audit journal (20261122090000): the same for service_settings_journal_erase_business().
            const j = require("fs").readFileSync("prisma/migrations/20261122090000_service_desk_audit_journal/migration.sql", "utf8");
            const k = j.match(/CREATE OR REPLACE FUNCTION public\.service_settings_journal_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!k) { console.error("service_settings_journal_erase_business() not found in the migration"); process.exit(1); }
            console.log(k[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_settings_journal_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_settings_journal_erase_business() TO app_runtime;");
            // Service Desk case charge (20261126090000): the same for service_case_charge_erase_business().
            const c = require("fs").readFileSync("prisma/migrations/20261126090000_service_desk_case_charge/migration.sql", "utf8");
            const cf = c.match(/CREATE OR REPLACE FUNCTION public\.service_case_charge_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!cf) { console.error("service_case_charge_erase_business() not found in the migration"); process.exit(1); }
            console.log(cf[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_case_charge_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_case_charge_erase_business() TO app_runtime;");
            // Service Desk M1 tracks (20261127090000): the same for service_tracks_erase_business() (its tables and columns
            // from db push; it calls no other function of the migration, so nothing else is mirrored).
            const t = require("fs").readFileSync("prisma/migrations/20261127090000_service_desk_tracks/migration.sql", "utf8");
            const tf = t.match(/CREATE OR REPLACE FUNCTION public\.service_tracks_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!tf) { console.error("service_tracks_erase_business() not found in the migration"); process.exit(1); }
            console.log(tf[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_tracks_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_tracks_erase_business() TO app_runtime;");
            // Service Desk QA lists (20261129090000): the same for service_qa_lists_erase_business() (its tables from db push;
            // it calls no other function of the migration, so nothing else is mirrored).
            const qa = require("fs").readFileSync("prisma/migrations/20261129090000_service_desk_qa_lists/migration.sql", "utf8");
            const qf = qa.match(/CREATE OR REPLACE FUNCTION public\.service_qa_lists_erase_business\(\)[\s\S]*?\$fn\$;/);
            if (!qf) { console.error("service_qa_lists_erase_business() not found in the migration"); process.exit(1); }
            console.log(qf[0]);
            console.log("REVOKE ALL ON FUNCTION public.service_qa_lists_erase_business() FROM PUBLIC;");
            console.log("GRANT EXECUTE ON FUNCTION public.service_qa_lists_erase_business() TO app_runtime;");
          ' | PGPASSWORD="$LAB_PASSWORD" psql -X -v ON_ERROR_STOP=1 -q "postgresql://lab_owner@localhost:5432/dta"
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/dta" \
          DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/dta" \
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/dta" \
            npm run verify:tasks-service-db
