# Transactional email — ONE Resend smoke send from Production (TEMPORARY, manual only).
#
# Calls POST /api/transactional-email/smoke, which sends one fixed message to one fixed test inbox
# with Dubiz's configured sender, through the existing Resend adapter (lib/email/transactional/smoke.ts).
# No user, business or outbox row is created; the endpoint takes no input.
#
# Unintended runs are refused at every level:
#   - workflow_dispatch only (no schedule / push / pull_request), main only, `cron` environment;
#   - only the owner account may run it, only with the exact typed confirmation, never as a re-run;
#   - no retry: one curl, --retry 0;
#   - the endpoint itself: CRON_SECRET, a hard expiry (2026-11-04), a fail-closed one-send latch in
#     Production Redis, and a fixed provider idempotency key.
#
# Remove this file together with the smoke route after the test.

name: transactional email smoke (one-shot, manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: SEND ONE SMOKE EMAIL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transactional-email-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # CRON_SECRET authenticates to PRODUCTION: main only, inside the protected `cron` environment.
    if: github.ref == 'refs/heads/main' && github.actor == 'eldad8802-prog' && github.event.inputs.confirm == 'SEND ONE SMOKE EMAIL' && github.run_attempt == 1
    environment: cron
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send one smoke email from Production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SMOKE_URL: https://promaxgroup.co.il/api/transactional-email/smoke
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not configured for this repository."; exit 1
          fi
          code=$(curl -sS --retry 0 -o smoke.json -w "%{http_code}" -m 45 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$SMOKE_URL")
          echo "HTTP $code"
          cat smoke.json; echo
          {
            echo "### Transactional email smoke — HTTP $code"
            echo '```json'; cat smoke.json; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" = "200" ] || { echo "::error::smoke send answered $code"; exit 1; }
