# Service Desk 1.2b / migration 20261113090000_service_external_work — proof on PostgreSQL BEFORE it reaches
# Production (ephemeral PG17). Migration-first PR-1: this PR ships the migration and its proof only.
#
# .sdx/lab.sh builds on the foundation lab (.sdf/lab.sh --with-sdf: Production's role topology, the chain of earlier
# labs, the foundation applied by `migrate deploy`) and leaves this migration as the only pending one.
#
#   0. Evidence files are SELECT-only, never touch the read-only boundary, pass the output guard; the proof pins
#      migration.sql's sha256; the migration names only its own objects and the tables it builds on.
#   1. Baseline (pending): PREFLIGHT passes whole; the proof refuses; check 3 is live.
#   2. `prisma migrate deploy` applies it: proof 15/15; the preflight then fails exactly its "not there yet" checks.
#   3. Role battery (.sdx/battery.ts) as the real roles: isolation, send rules, one open work per device under
#      concurrency (READ COMMITTED and REPEATABLE READ), changes, correction, no silent change, return, handover,
#      supplier reference, append-only journal, atomicity, account erasure, 1.2a regression on the same database.
#   3b. 1.2a regression: the foundation battery on its own lab, and the real account-erasure purge with 1.2b (and M2,
#       whose erasure the purge also calls) applied.
#   3c. Account erasure of 1.2b through the real adapter (.sdx/erasure-battery.ts): refusal, whole rollback, the
#       declared columns of works and journal, the other business untouched, no DELETE, regression of the purge.
#   4. Faults: each injected defect is caught by the proof check meant for it.
#   5. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#   6. Rollback: refused while rows exist; on an empty database it reverts whole (preflight whole again).
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: service external work — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261113090000_service_external_work/**"
      - "ops/evidence/service-external-work-*.sql"
      - ".sdx/**"
      - ".github/workflows/service-external-work-lab.yml"
      - ".sdf/**"
      - "prisma/schema.prisma"
      - "lib/services/account/account-deletion.prisma-store.ts"
      - "lib/services/account/account-erasure-manifest.ts"
      - ".sdp/lab.sh"
      - "prisma/migrations/20261115090000_service_parts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service external work (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sdx_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sdx_ci_synthetic_super_pw
      LAB_PASSWORD: sdx_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/service-external-work-preflight.sql
      EVIDENCE: ops/evidence/service-external-work-production-evidence.sql
      SDX: prisma/migrations/20261113090000_service_external_work/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only; checksum pinned; the migration names only its own objects
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            if grep -inE '(default_)?transaction_read_only|read[[:space:]]+write|session[[:space:]]+characteristics|reset[[:space:]]+all|session[[:space:]]+authorization' "$f"; then
              echo "$f touches the read-only boundary"; exit 1
            fi
          done
          node scripts/ci/evidence-output-guard.mjs
          # Selectable in prod-readonly-evidence.yml: added by the release step (its own PR), not here.
          sum=$(sha256sum "$SDX" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$SDX sha256 $sum (pinned)"
          prefix='^"(ServiceExternalWork|ServiceExternalWorkEvent|ServiceHandover|ServiceCase)_[A-Za-z_]+"$'
          own='"ServiceExternalWork"|"ServiceExternalWorkEvent"|"ServiceExternalWorkState"|"ServiceExternalProgress"|"ServiceExternalReturnResult"|"ServiceExternalWorkEventKind"'
          base='"Business"|"User"|"Supplier"|"StaffMember"|"ServiceCase"|"ServiceHandover"|"ServiceDevice"|"ServiceActor"|"ServiceCaseStatus"'
          others=$(sed 's/--.*$//' "$SDX" | grep -oE '"[A-Z][A-Za-z_]*"' | sort -u | grep -vE "$prefix" | grep -vxE "$own|$base" || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261113090000_service_external_work" ]] || continue
            # Owner-approved Service Desk migrations that BUILD ON 1.2b (FK to the work table, a guard trigger on it) —
            # named one by one, never a pattern.
            [[ "$n" != "20261115090000_service_parts" ]] || continue
            if sed 's/--.*$//' "$d/migration.sql" | grep -nE '"ServiceExternalWork(Event)?"|service_external_|service_handover_no_open_external|service_case_external_work_closed'; then
              echo "$n names a service external work object"; exit 1
            fi
          done
          echo "the migration names only its own objects and the tables it builds on; no other migration names its objects"

      - name: 1. Baseline (pending) — PREFLIGHT passes whole; the proof refuses; checks 3 and 13 are live
        run: |
          set -euo pipefail
          bash .sdx/lab.sh sdx_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdx_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "baseline: expected no preflight failure, got: $fails"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "12" || { echo "expected 12 PASS"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          lab -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('lab-later', 'x', now(), '20261199000000_lab_later', 1)"
          c3=$(lab -f "$PREFLIGHT" | grep -E '^ +3 \|' | tr -d ' ')
          lab -q -c "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-later'"
          test "$c3" = "3|FAIL|1" || { echo "check 3 did not refuse a later finished migration: $c3"; exit 1; }
          lab -q -c "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '20261110100000_acquisition_resolve_paused_hold'"
          c13=$(lab -f "$PREFLIGHT" | grep -E '^ +13 \|' | tr -d ' ')
          c1=$(lab -f "$PREFLIGHT" | grep -E '^ +1 \|' | tr -d ' ')
          lab -q -c "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '20261110100000_acquisition_resolve_paused_hold'"
          test "$c13" = "13|FAIL|0" || { echo "check 13 did not refuse a pending #953 migration: $c13"; exit 1; }
          test "$c1" = "1|FAIL|1" || { echo "check 1 did not see the unfinished row: $c1"; exit 1; }
          echo "baseline whole; checks 3 and 13 are live"

      - name: 2. prisma migrate deploy applies it — proof 15/15; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .sdx/lab.sh sdx_post --with-sdx | tee /tmp/post.log
          grep -q 'Applying migration `20261113090000_service_external_work`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdx_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "15" || { echo "expected 15 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 5 6 7 " || { echo "after the release: expected '2 5 6 7 ', got: $fails"; exit 1; }

      - name: 3. Role battery — isolation, concurrency, changes, return, journal, atomicity, erasure, 1.2a regression
        run: |
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdx_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdx_post" \
            npx tsx .sdx/battery.ts

      - name: 3b. 1.2a regression — the foundation battery on its own lab; the real erasure purge with 1.2b and M2 applied
        run: |
          set -euo pipefail
          bash .sdf/lab.sh sdf_reg --with-sdf >/dev/null
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdf_reg" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdf_reg" \
            npx tsx .sdf/battery.ts
          # The purge also calls service_parts_erase_business() (M2, migration 20261115090000, applied in Production):
          # the erasure lab is the 1.2b lab with M2 deployed on top (.sdp/lab.sh --with-m2), as Production is.
          bash .sdp/lab.sh sdx_erase --with-m2 >/dev/null
          bash .sdf/erasure-prereq.sh sdx_erase
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdx_erase"
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdx_erase" \
          DATABASE_URL="$R" DIRECT_URL="$R" AUTH_DATABASE_URL="$R" AUTH_TOKEN_SECRET="sdx-ci-synthetic-auth-secret-0123456789abcdef" \
            npx tsx .sdf/erasure-battery.ts

      - name: 3c. Account erasure of 1.2b through the REAL adapter (purgeOperationalData) as the runtime login
        # On the 1.2b lab of step 3b (its own businesses; 3b restores every grant and name it touches).
        run: |
          set -euo pipefail
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdx_erase"
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdx_erase" \
          DATABASE_URL="$R" DIRECT_URL="$R" AUTH_DATABASE_URL="$R" AUTH_TOKEN_SECRET="sdx-ci-synthetic-auth-secret-0123456789abcdef" \
            npx tsx .sdx/erasure-battery.ts

      - name: 4. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          bash .sdx/lab.sh sdx_fault --with-sdx >/dev/null
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdx_fault -v ON_ERROR_STOP=1 "$@"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test -z "$(failing)" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "NO FORCE row-level security" "3 " 'ALTER TABLE "ServiceExternalWork" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "ServiceExternalWork" FORCE ROW LEVEL SECURITY'
          fault "a permissive FOR ALL policy" "4 5 " 'CREATE POLICY sdx_fault_all ON "ServiceExternalWorkEvent" USING (true)' 'DROP POLICY sdx_fault_all ON "ServiceExternalWorkEvent"'
          fault "removal privilege for app_runtime" "6 " 'GRANT DELETE ON "ServiceExternalWork" TO app_runtime' 'REVOKE DELETE ON "ServiceExternalWork" FROM app_runtime'
          fault "journal change privilege for app_runtime" "6 " 'GRANT UPDATE ON "ServiceExternalWorkEvent" TO app_runtime' 'REVOKE UPDATE ON "ServiceExternalWorkEvent" FROM app_runtime'
          fault "PUBLIC read" "7 " 'GRANT SELECT ON "ServiceExternalWork" TO PUBLIC' 'REVOKE SELECT ON "ServiceExternalWork" FROM PUBLIC'
          fault "search_path without pg_temp last" "8 " \
            'ALTER FUNCTION public.service_external_work_guard() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_external_work_guard() SET search_path = pg_catalog, public, pg_temp'
          fault "PUBLIC EXECUTE on the erasure" "9 " 'GRANT EXECUTE ON FUNCTION public.service_external_erase_business() TO PUBLIC' 'REVOKE EXECUTE ON FUNCTION public.service_external_erase_business() FROM PUBLIC'
          fault "SECURITY INVOKER erasure" "10 " 'ALTER FUNCTION public.service_external_erase_business() SECURITY INVOKER' 'ALTER FUNCTION public.service_external_erase_business() SECURITY DEFINER'
          fault "handover guard disabled" "11 " 'ALTER TABLE "ServiceHandover" DISABLE TRIGGER "ServiceHandover_no_open_external"' 'ALTER TABLE "ServiceHandover" ENABLE TRIGGER "ServiceHandover_no_open_external"'
          fault "per-device one-open-work index gone" "12 " 'DROP INDEX "ServiceExternalWork_one_open_per_device"' \
            "CREATE UNIQUE INDEX \"ServiceExternalWork_one_open_per_device\" ON \"ServiceExternalWork\"(\"businessId\", \"deviceId\") WHERE \"state\" = 'AT_SUPPLIER' AND \"deviceId\" IS NOT NULL"
          fault "the foundation erasure loses pg_temp" "14 " \
            'ALTER FUNCTION public.service_erase_business() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_erase_business() SET search_path = pg_catalog, public, pg_temp'
          sum=$(sha256sum "$SDX" | cut -d' ' -f1)
          fault "a ledger checksum that is not the reviewed file" "15 " \
            "UPDATE \"_prisma_migrations\" SET checksum = repeat('0', 64) WHERE migration_name = '20261113090000_service_external_work'" \
            "UPDATE \"_prisma_migrations\" SET checksum = '$sum' WHERE migration_name = '20261113090000_service_external_work'"
          test -z "$(failing)" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 5. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .sdx/lab.sh sdx_broken --broken-sdx
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d sdx_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relnamespace = 'public'::regnamespace AND relname IN ('ServiceExternalWork','ServiceExternalWorkEvent'))
            + (SELECT count(*) FROM pg_proc WHERE pronamespace = 'public'::regnamespace AND (proname LIKE 'service\_external\_%' OR proname IN ('service_handover_no_open_external','service_case_external_work_closed')))
            + (SELECT count(*) FROM pg_type WHERE typname IN ('ServiceExternalWorkState','ServiceExternalProgress','ServiceExternalReturnResult','ServiceExternalWorkEventKind'))
            + (SELECT count(*) FROM pg_trigger WHERE tgname IN ('ServiceHandover_no_open_external','ServiceCase_external_work_closed'))")
          echo "objects left=$left"
          test "$left" = "0" || { echo "NOT atomic"; exit 1; }

      - name: 6. Rollback — refused with rows; whole on an empty database
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -v ON_ERROR_STOP=1 "$@"; }
          if lab -d sdx_post -f .sdx/rollback.sql 2>/tmp/rb.err >/dev/null; then echo "rollback ran over rows"; exit 1; fi
          grep -q "SERVICE_EXTERNAL_ROLLBACK_REFUSED" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          bash .sdx/lab.sh sdx_rb --with-sdx >/dev/null
          lab -d sdx_rb -f .sdx/rollback.sql
          fails=$(lab -d sdx_rb -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "after rollback the preflight is not whole: $fails"; exit 1; }
          bash .sdx/lab.sh sdx_rb --deploy-only | grep -q "service external work applied"
          test -z "$(lab -d sdx_rb -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; })" || { echo "re-apply after rollback is not whole"; exit 1; }
          echo "rollback refused over rows; whole on an empty database; the release re-applies cleanly"
