# Issuance: an EXEMPT_DEALER (עוסק פטור) cannot issue a tax invoice or a tax
# invoice/receipt — refused before the number sequence and before any write.
#
# Its own job and database on purpose: the test replays EVERY RLS / policy statement
# the migrations ship (as the shared tenant-RLS job does not), which would change the
# posture for any step that ran after it in a shared database.
#
# Synthetic CI-only credentials; ZERO secrets, ZERO Neon, ZERO network, ZERO Production.
# The post-commit Approval is a local stub; global fetch throws.

name: billing exempt-dealer issuance (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/billing/business-identity.ts"
      - "lib/billing/business-identity.exempt-dealer.test.ts"
      - "lib/services/billing/billing-issue.service.ts"
      - "lib/services/billing/billing-issue-exempt-dealer.rls.integration.test.ts"
      - "lib/services/billing/billing-authority-*.ts"
      - "lib/services/billing/authority/billing-authority-readiness.ts"
      - "lib/tenant/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - ".github/workflows/billing-exempt-dealer-issuance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exempt-dealer-issuance:
    name: Exempt dealer issuance (unit + PG17, replayed RLS, NOBYPASSRLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ex_owner
          POSTGRES_PASSWORD: ex_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_ex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ex_owner -d dubiz_ex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://ex_owner:ex_ci_synthetic_owner_pw@localhost:5432/dubiz_ex
      RUNTIME_URL: postgresql://ex_runtime:ex_ci_synthetic_runtime_pw@localhost:5432/dubiz_ex
      AUTH_TOKEN_SECRET: billing_ex_ci_secret_synthetic_at_least_32_chars

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: Rule (pure)
        run: npx tsx lib/billing/business-identity.exempt-dealer.test.ts

      - name: Push schema as the owner
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate

      - name: Create the governed runtime role
        env:
          PGPASSWORD: ex_ci_synthetic_owner_pw
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE ex_runtime LOGIN PASSWORD 'ex_ci_synthetic_runtime_pw' NOSUPERUSER NOBYPASSRLS;" \
            -c "GRANT USAGE ON SCHEMA public TO ex_runtime;" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO ex_runtime;" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ex_runtime;"

      - name: Issuance under replayed RLS
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
          AUTH_DATABASE_URL: ${{ env.RUNTIME_URL }}
          RLS_ADMIN_URL: ${{ env.OWNER_URL }}
        run: npx tsx lib/services/billing/billing-issue-exempt-dealer.rls.integration.test.ts

      # The refusal is removed from issuance (exactly the defect) and the suite must go
      # red on X1 — the exempt dealer's tax invoice issuing.
      - name: Negative proof — issuance without the exempt-dealer rule is caught
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
          AUTH_DATABASE_URL: ${{ env.RUNTIME_URL }}
          RLS_ADMIN_URL: ${{ env.OWNER_URL }}
        run: |
          set -uo pipefail
          prove() {
            local file=lib/services/billing/billing-issue.service.ts
            cp "$file" "$file.bak"
            perl -0pi -e 's/\n  assertDocumentTypeAllowedForBusinessKind\(\n    business\.profile\?\.billingBusinessKind,\n    doc\.documentType\n  \);/\n/' "$file"
            if cmp -s "$file" "$file.bak"; then
              mv "$file.bak" "$file"; echo "::error::negative-proof setup did not apply"; return 1
            fi
            npx tsx lib/services/billing/billing-issue-exempt-dealer.rls.integration.test.ts > np.log 2>&1; local status=$?
            mv "$file.bak" "$file"
            if [ "$status" -eq 0 ]; then
              echo "::error::NEGATIVE-PROOF FAIL: issuance without the rule and the suite stayed green"; return 1
            fi
            if ! grep -q "\[FAIL\] X1" np.log; then
              echo "::error::NEGATIVE-PROOF FAIL: the suite failed, but not on X1"; tail -30 np.log; return 1
            fi
            echo "negative proof OK — issuance without the exempt-dealer rule fails X1"
          }
          prove || exit 1
