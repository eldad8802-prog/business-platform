# Notification engine — the application (notifications track PR 3) on the REAL migration
# 20261210090000_notification_engine_foundation, in Production's role topology (ephemeral PG17).
#
#   1. Pure: the catalog, the preference resolver, quiet hours / digest time across the clock changes, the unified
#      push sender with a fake fetch (FCM HTTP v1 + web push), the worker's decision table, the static boundaries.
#   2. The suites this PR touched: task reminders (pure), the cron authority registry, the erasure contract.
#   3. The engine AS app_runtime_prod (NOSUPERUSER NOBYPASSRLS) on `.nte2d/lab.sh <db> --with-nte2d` (the foundation,
#      the follow-up 20261211090000, the activation record 20261212090000 and 20261213090000 — this PR depends on all four being on the
#      branch, migration-first), the database session in Asia/Jerusalem: create → deliver, claim / lease, retry, quiet
#      hours, settings, feature off, fan-out, sessions / logout / account switch, two businesses and the kill switch,
#      historical rows, digest, the activation record (initial activation, policy edits, kill switch, OFF → ON,
#      global-only enablement, table missing), read side.
#   3b. The status sweep and the state producers A–E (obligations, payment requests, ITA allocation, document
#      processing, appointment reminders) on `.nte2d/lab.sh <db> --with-nte2d` (+ migration 20261213090000: the
#      document status stamp and the per-user appointment lead time — this PR depends on it being on the branch,
#      migration-first): isolation, resolve after handling, no duplicate across passes, cancel / reschedule, time zones
#      across the October DST change, the per-business lock; stuck documents and per-user appointment reminders end to
#      end with the real sweep + worker (precision ≤ 5 min), the March 2027 DST day, the lead-time settings round-trip.
#   4. The task reminders, unchanged in behaviour, on the same migration (the shared sender).
#
# Synthetic credentials; ZERO secrets (the FCM key is generated by the test); ZERO Neon; ZERO network (fake push
# providers). The feature flag stays OFF everywhere but the test's own synthetic businesses.

name: notification engine — application on the real migration (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/notifications/**"
      - "lib/push/**"
      - "app/api/notifications/**"
      - "app/api/push/**"
      - "app/api/auth/logout/**"
      - "app/api/auth/refresh/revoke/**"
      - "app/api/security/sessions/**"
      - "lib/services/tasks/task-reminders*"
      - "lib/services/booking/booking-notify.ts"
      - "lib/services/feature-access/platform-feature-catalog.ts"
      - "lib/services/account/**"
      - "lib/services/integrations/gmail/oauth-refresh.service.ts"
      - "lib/services/integrations/gmail/gmail-auth.service.ts"
      - "lib/services/integrations/gmail/gmail-discovery.service.ts"
      - "lib/services/integrations/whatsapp/connection.service.ts"
      - "lib/business-status/**"
      - "lib/services/crm/lead-attention-queue.ts"
      - "lib/services/obligations/**"
      - "lib/services/billing/authority/billing-authority-send-certainty.ts"
      - "lib/services/billing/authority/billing-authority-production-pilot.ts"
      - "scripts/notifications/**"
      - "vercel.json"
      - "docs/notifications/scheduling.md"
      - "app/api/integrations/gmail/callback/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261210090000_notification_engine_foundation/**"
      - "prisma/migrations/20261211090000_notification_engine_followup/**"
      - "prisma/migrations/20261212090000_notification_engine_activation/**"
      - "prisma/migrations/20261213090000_notification_docs_stuck_appointment_lead/**"
      - ".nte/**"
      - ".nte2/**"
      - ".nte2c/**"
      - ".nte2d/**"
      - "scripts/ci/test-coverage/notification-engine.json"
      - ".github/workflows/notification-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: notification engine (PG17, runtime role, real migration)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: nte3_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: nte3_ci_synthetic_super_pw
      LAB_PASSWORD: nte3_ci_synthetic_role_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 1. Pure — catalog, preferences, time, push sender (fake fetch), worker decisions, boundaries
        run: |
          set -euo pipefail
          npx tsx lib/notifications/catalog.test.ts
          npx tsx lib/notifications/preferences.test.ts
          npx tsx lib/notifications/notification-time.test.ts
          npx tsx lib/notifications/push/push.test.ts
          npx tsx lib/notifications/engine/worker-decision.test.ts
          npx tsx lib/notifications/engine/engine-boundary.test.ts
          npx tsx lib/notifications/engine/schedule.test.ts
          npx tsx lib/notifications/producers/producers.test.ts
          npx tsx lib/notifications/producers/status-sweep.test.ts
          npx tsx lib/notifications/producers/state-producers.test.ts

      - name: 2. Touched suites — task reminders (pure), cron authority registry, erasure contract
        run: |
          set -euo pipefail
          npx tsx lib/services/tasks/task-reminders.test.ts
          npx tsx lib/services/billing/settlement/settlement-recovery-auth.test.ts
          npm run verify:erasure-contract -- --baseline-check

      - name: 3. The engine as the restricted runtime (session in Asia/Jerusalem)
        run: |
          set -euo pipefail
          # On .nte2d (+ 20261213090000): the preferences the engine reads now carry the personal appointment lead time.
          bash .nte2d/lab.sh nte_engine --with-nte2d
          TZ_OPT="options=-c%20TimeZone%3DAsia%2FJerusalem"
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_engine?$TZ_OPT" \
          DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_engine?$TZ_OPT" \
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_engine" \
            npx tsx lib/notifications/engine/notification-engine.db.test.ts

      - name: 3a. Scheduling overlap — racing digest / worker / rotation-sweep passes (own lab database)
        run: |
          set -euo pipefail
          bash .nte2d/lab.sh nte_sched --with-nte2d
          TZ_OPT="options=-c%20TimeZone%3DAsia%2FJerusalem"
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sched?$TZ_OPT"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sched?$TZ_OPT"           OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_sched"             npx tsx lib/notifications/engine/scheduling-overlap.db.test.ts

      - name: 3b. The status sweep, the state producers A–E, stuck documents and per-user reminders as the restricted runtime (session in Asia/Jerusalem)
        run: |
          set -euo pipefail
          bash .nte2d/lab.sh nte_sweep --with-nte2d
          TZ_OPT="options=-c%20TimeZone%3DAsia%2FJerusalem"
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sweep?$TZ_OPT&pool_timeout=30" \
          DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sweep?$TZ_OPT&pool_timeout=30" \
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_sweep" \
            npx tsx lib/notifications/producers/status-sweep.db.test.ts
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sweep?$TZ_OPT&pool_timeout=30" \
          DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sweep?$TZ_OPT&pool_timeout=30" \
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_sweep" \
            npx tsx lib/notifications/producers/state-producers.db.test.ts
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sweep?$TZ_OPT&pool_timeout=30"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_sweep?$TZ_OPT&pool_timeout=30"           OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_sweep"             npx tsx lib/notifications/producers/docs-appointments.db.test.ts

      - name: 4. Task reminders on the same migration — the shared sender changes nothing
        run: |
          set -euo pipefail
          bash .nte/lab.sh nte_trp --with-nte
          TZ_OPT="options=-c%20TimeZone%3DAsia%2FJerusalem"
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_trp?$TZ_OPT" \
          DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte_trp?$TZ_OPT" \
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte_trp" \
            npx tsx lib/services/tasks/task-reminders.db.test.ts
