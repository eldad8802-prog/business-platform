name: Prod User Verify Evidence (read-only)

# Manual, gated, READ-ONLY verification of a single user's existence, role, and
# linked business/tenant in the verified Production database. Runs ONLY the
# SELECT in ops/evidence/prod-user-verify-evidence.sql. Returns booleans + role
# only — no user id value, hash, token, or other PII. No writes, no migrations.
#
# Safety controls (identical model to the other prod-readonly evidence flows):
#   - workflow_dispatch only (no push / schedule triggers)
#   - environment: production-db  -> human approval before secrets are exposed
#   - host allowlist: DIRECT_URL must target endpoint ep-flat-brook-am4bhq1y
#   - SQL static guard: rejects any non-SELECT (write) keyword before connecting
#   - READ ONLY transaction + session read-only + statement timeout + ON_ERROR_STOP
#   - a single fixed SQL file; no free SQL input, no arbitrary file path

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prod-user-verify-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Read-only user verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SQL static guard (SELECT-only)
        run: |
          set -euo pipefail
          SQL_FILE="ops/evidence/prod-user-verify-evidence.sql"
          test -f "$SQL_FILE" || { echo "::error::SQL file missing: $SQL_FILE"; exit 1; }
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          MATCHES="$(grep -inE "$FORBIDDEN" "$SQL_FILE" || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Forbidden write keyword found in SQL — aborting before any DB connection."
            echo "$MATCHES"
            exit 1
          fi
          echo "SQL guard passed: file is SELECT-only."

      - name: Host allowlist assertion (verified Production only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          ALLOW="ep-flat-brook-am4bhq1y"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set in the production-db environment."; exit 1
          fi
          case "$DIRECT_URL" in
            *"$ALLOW"*) echo "Host allowlist OK: DIRECT_URL targets endpoint $ALLOW." ;;
            *) echo "::error::DIRECT_URL does not target the verified Production endpoint ($ALLOW) — aborting."; exit 1 ;;
          esac

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run read-only verification query
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
          # M-1: the address is a production-db environment secret, bound as a psql variable; never committed, never printed.
          TARGET_EMAIL: ${{ secrets.PROD_VERIFY_EMAIL }}
        run: |
          set -euo pipefail
          [ -n "${TARGET_EMAIL:-}" ] || { echo "::error::PROD_VERIFY_EMAIL is not set in the production-db environment"; exit 1; }
          echo "::add-mask::${TARGET_EMAIL}"
          psql "$DIRECT_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --set=target_email="${TARGET_EMAIL}" \
            --file=ops/evidence/prod-user-verify-evidence.sql \
            | node scripts/ci/evidence-redact.mjs
