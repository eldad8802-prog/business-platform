# D2 / ACCOUNT-DELETION-2A.1 — Preview proof (Neon branch DB, PREVIEW ONLY).
#
# Gate A identity via the Neon API, then the account-deletion lifecycle proven against
# the REAL Preview schema as the REAL restricted runtime role. Read-mostly: the only
# writes are synthetic `ad2a-prev-` fixtures, cleaned at the end with an always-on
# backstop. NO migration, NO grant, NO role change — this wave ships no DB artifact.
#
# Transient secret (set -> run -> DELETE IMMEDIATELY, never printed, never committed):
#   W1_RUNTIME_PW   password of app_runtime_preview_p4b
#
# NO PRODUCTION. The deny-list aborts on ep-flat-brook / ep-winter-bread.

name: d2/ad2a — account-deletion preview proof (neon)

on:
  # TEMPORARY arm so GitHub registers this new workflow; a new file cannot be
  # dispatched on a non-default branch until it has run once. Removed immediately after.
  push:
    branches: [feat/d2-account-deletion-2a]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d2-ad2a-preview
  cancel-in-progress: false

env:
  NEON_BASE: https://console.neon.tech/api/v2
  P4_PROJECT_ID: orange-shape-16620903
  P4_BRANCH_ID: br-red-scene-amth33qx
  P4_EXPECT_ENDPOINT: ep-wispy-dawn-amr74bwz
  P4_EXPECT_DB: neondb
  P4_EXPECT_HOST_SUFFIX: us-east-1.aws.neon.tech
  P4_DENY_ENDPOINTS: ep-flat-brook-am4bhq1y ep-winter-bread-ami5o8p5

jobs:
  gate_a_identity:
    name: Gate A — Preview target identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate_a: ${{ steps.verify.outputs.gate_a }}
    steps:
      - name: Verify project/branch/endpoint via Neon API
        id: verify
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${NEON_API_KEY:-}" ] || { echo "::error::NEON_API_KEY missing"; exit 1; }
          api() { curl --fail-with-body -sS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" "$1"; }
          ep=$(api "${NEON_BASE}/projects/${P4_PROJECT_ID}/endpoints/${P4_EXPECT_ENDPOINT}")
          ep_id=$(printf '%s' "$ep" | jq -r '.endpoint.id')
          ep_branch=$(printf '%s' "$ep" | jq -r '.endpoint.branch_id')
          ep_host=$(printf '%s' "$ep" | jq -r '.endpoint.host')
          fail=0
          [ "$ep_id" = "${P4_EXPECT_ENDPOINT}" ] || { echo "::error::endpoint"; fail=1; }
          [ "$ep_branch" = "${P4_BRANCH_ID}" ] || { echo "::error::endpoint branch"; fail=1; }
          case "$ep_host" in *"${P4_EXPECT_HOST_SUFFIX}") : ;; *) echo "::error::suffix"; fail=1 ;; esac
          for d in ${P4_DENY_ENDPOINTS}; do case "$ep_host" in *"$d"*) echo "::error::DENY"; fail=1 ;; esac; done
          [ "$fail" -eq 0 ] || { echo "gate_a=FAIL" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "gate_a=PASS" >> "$GITHUB_OUTPUT"; echo "GATE A = PASS"

  ad2a_preview:
    name: AD-2A.1 proof on Preview
    needs: gate_a_identity
    if: needs.gate_a_identity.outputs.gate_a == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .ad2a/preview.mjs

      - name: CI-AD guards (blocking)
        run: |
          bash scripts/ci/account-deletion-guard.sh .
          bash scripts/ci/account-deletion-guard.sh --self-test

      - name: Run the AD-2A.1 Preview proof
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          W1_RUNTIME_PW: ${{ secrets.W1_RUNTIME_PW }}
          AUTH_TOKEN_SECRET: ad2a_preview_ci_auth_secret_synthetic
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${W1_RUNTIME_PW:-}" ] || { echo "::error::W1_RUNTIME_PW missing (transient secret)"; exit 1; }
          echo "::add-mask::${W1_RUNTIME_PW}"

          uri() { curl --fail-with-body -sS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" \
            "${NEON_BASE}/projects/${P4_PROJECT_ID}/connection_uri?branch_id=${P4_BRANCH_ID}&endpoint_id=${P4_EXPECT_ENDPOINT}&database_name=${P4_EXPECT_DB}&role_name=neondb_owner&pooled=$1" | jq -r '.uri'; }
          DBP="$(uri true)"; DBD="$(uri false)"
          echo "::add-mask::${DBP}"; echo "::add-mask::${DBD}"
          for u in "${DBP}" "${DBD}"; do
            [ -n "$u" ] && [ "$u" != "null" ] || { echo "::error::empty URI"; exit 1; }
            case "$u" in *"${P4_EXPECT_ENDPOINT}"*) : ;; *) echo "::error::URI endpoint mismatch"; exit 1 ;; esac
            for d in ${P4_DENY_ENDPOINTS}; do case "$u" in *"$d"*) echo "::error::URI DENY"; exit 1 ;; esac; done
          done

          RUNTIME_URL="$(node -e '
            const u = new URL(process.argv[1]);
            u.username = "app_runtime_preview_p4b";
            u.password = process.argv[2];
            process.stdout.write(u.toString());
          ' "${DBP}" "${W1_RUNTIME_PW}")"
          echo "::add-mask::${RUNTIME_URL}"

          DIRECT_URL="${DBD}" RUNTIME_URL="${RUNTIME_URL}" npx tsx .ad2a/preview.mjs

      - name: Fixtures cleanup net (always — marker-based backstop)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -uo pipefail
          DBD="$(curl -sS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" "${NEON_BASE}/projects/${P4_PROJECT_ID}/connection_uri?branch_id=${P4_BRANCH_ID}&endpoint_id=${P4_EXPECT_ENDPOINT}&database_name=${P4_EXPECT_DB}&role_name=neondb_owner&pooled=false" | jq -r '.uri')"
          echo "::add-mask::${DBD}"
          [ -n "${DBD}" ] && [ "${DBD}" != "null" ] || exit 0
          cat > .ad2a/fixnet.gen.mjs <<'FIX_EOF'
          import { PrismaClient } from '@prisma/client';
          const c = new PrismaClient({ datasourceUrl: process.env.DIRECT_URL });
          const bids = `SELECT id FROM "Business" WHERE name LIKE 'ad2a-prev-%'`;
          await c.$executeRawUnsafe('DELETE FROM "LearningEvent" WHERE "businessId" IN (' + bids + ')');
          await c.$executeRawUnsafe('DELETE FROM "Message" WHERE "businessId" IN (' + bids + ')');
          await c.$executeRawUnsafe('DELETE FROM "Conversation" WHERE "businessId" IN (' + bids + ')');
          for (const t of ['CrmAttachment','CrmNote','Customer','POSApiKey'])
            await c.$executeRawUnsafe('DELETE FROM "' + t + '" WHERE "businessId" IN (' + bids + ')');
          await c.$executeRawUnsafe(`DELETE FROM "User" WHERE email LIKE '%@ad2a-prev.test'`);
          await c.$executeRawUnsafe(`DELETE FROM "Business" WHERE name LIKE 'ad2a-prev-%'`);
          const r = await c.$queryRaw`SELECT (SELECT count(*)::int FROM "Business" WHERE name LIKE 'ad2a-prev-%') AS biz`;
          console.log('[fixnet] residue business=' + r[0].biz);
          await c.$disconnect();
          FIX_EOF
          DIRECT_URL="${DBD}" node .ad2a/fixnet.gen.mjs || true
