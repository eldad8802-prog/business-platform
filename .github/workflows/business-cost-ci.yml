name: daily business cost

# Daily Business Cost engine — a read-only derivation over the payables ledger.
#
#   core     allocation, projection, baseline, cash-out and uncertainty rules.
#            No database; runs anywhere and fails fast.
#
#   db       real rows through the real payables service, the legacy-obligation
#            bridge (counted once, never twice), and tenant isolation proven
#            twice: at the service, and under the repo's own RLS migrations as a
#            NOSUPERUSER NOBYPASSRLS role — the superuser CI connection bypasses
#            RLS, so the policies are only exercised through that second role.
#
# Fail-closed on TEST_DATABASE_URL, like every payables suite.

on:
  push:
    branches: [feat/daily-business-cost]
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "lib/services/business-cost/**"
      - "lib/services/payables/**"
      - "lib/services/obligations/**"
      - "app/api/business-cost/**"
      - ".github/workflows/business-cost-ci.yml"

jobs:
  core:
    name: business cost core (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Allocation rules
        run: npx tsx lib/services/business-cost/business-cost-core.test.ts

  db:
    name: business cost (PG17, real RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: business_cost_owner
          POSTGRES_PASSWORD: business_cost_ci_synthetic_pw
          POSTGRES_DB: dubiz_business_cost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U business_cost_owner -d dubiz_business_cost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://business_cost_owner:business_cost_ci_synthetic_pw@localhost:5432/dubiz_business_cost
      DIRECT_URL: postgresql://business_cost_owner:business_cost_ci_synthetic_pw@localhost:5432/dubiz_business_cost
      TEST_DATABASE_URL: postgresql://business_cost_owner:business_cost_ci_synthetic_pw@localhost:5432/dubiz_business_cost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the schema
        run: npx prisma db push --skip-generate
      - name: Generate the client
        run: npx prisma generate
      - name: Figures, legacy bridge, isolation and RLS
        run: npx tsx lib/services/business-cost/business-cost.db.test.ts
