# Transactional email — the application (PR-2): WELCOME on signup, delivery, retry / sweep, erasure.
#
# The table, its RLS and its grants are migration 20261015090000_transactional_email_foundation
# (already applied in Production). This workflow proves the CODE against it:
#
#   1. Pure (no database, no network): configuration (OFF by default, fail closed), the kind registry,
#      the WELCOME rendering, the Resend adapter over a fake fetch (Idempotency-Key te:<id>), the retry /
#      expiry policy, OFF = no database and no outbound request, logs without PII, the sweep route's
#      CRON_SECRET authority, and the static scope (only signup enqueues; only the register route and the
#      sweep route deliver). Plus the register route contract (a scheduling failure never fails signup)
#      and the cron-authority scope.
#   2. The auth-plane write lab (.authfix): schema + the shipped auth-plane migrations + this migration,
#      verbatim; the REAL signup / login / logout through LOGIN members of app_auth.
#   3. The application battery (.te/app-battery.ts) in that same lab, as the real roles: one WELCOME per
#      signup in the account transaction, rollback leaves nothing, double submit, tenant binding, the
#      runtime cannot read content, OFF sends nothing, idempotency key, 429 / 5xx / network retry,
#      4xx permanent, expiry, concurrent workers send once, dead-worker lease and fence, login does not
#      enqueue, erasure deletes only the erased tenant's rows, no backfill.
#   4. Schema parity: the TransactionalEmail model against the table the MIGRATION built — no drift — and a
#      negative control proving the comparison would see one.
#
# Synthetic CI-only credentials; ZERO secrets, ZERO Neon, ZERO network, ZERO Production.

name: transactional email — application (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/email/**"
      - "app/api/transactional-email/**"
      - "app/api/auth/register/**"
      - "lib/auth/signup.ts"
      - "lib/prisma-auth.ts"
      - "lib/services/account/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261015090000_transactional_email_foundation/**"
      - ".te/app-battery.ts"
      - ".authfix/auth-plane-write-battery.ts"
      - ".github/workflows/transactional-email-ci.yml"
      - ".github/workflows/transactional-email-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactional-email-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: transactional email application (pure + PG17 real roles)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: authfix_owner
          POSTGRES_PASSWORD: authfix_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_te_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authfix_owner -d dubiz_te_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://authfix_owner:authfix_ci_synthetic_owner_pw@localhost:5432/dubiz_te_app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: 1. Pure — transactional email, register route, cron authority scope
        run: |
          set -euo pipefail
          npx tsx lib/email/transactional/transactional-email.test.ts
          npx tsx app/api/auth/register/route.test.ts
          npx tsx lib/services/billing/settlement/settlement-recovery-auth.test.ts

      - name: Prisma validate + generate; build the lab schema
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma db push --skip-generate

      - name: 2. Auth-plane write lab — shipped auth-plane migrations + this migration, real signup
        run: npx tsx .authfix/auth-plane-write-battery.ts

      - name: 3. Application battery — real roles, real signup, delivery, retry, concurrency, erasure
        env:
          AUTH_URL: postgresql://app_auth_battery:authfix_ci_synthetic_pw@localhost:5432/dubiz_te_app
          RUNTIME_URL: postgresql://app_runtime_battery:authfix_ci_synthetic_runtime_pw@localhost:5432/dubiz_te_app
        run: npx tsx .te/app-battery.ts

      # The table above was built by the MIGRATION (step 2 drops the pushed copy and applies the shipped
      # file). Prisma is asked what DDL the model would still need for TransactionalEmail: none.
      - name: 4. Schema parity — the model is exactly the migrated table (and the check can see drift)
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: |
          set -euo pipefail
          npx prisma migrate diff --from-url "$OWNER_URL" --to-schema-datamodel prisma/schema.prisma --script > /tmp/diff.sql
          if grep -n 'TransactionalEmail' /tmp/diff.sql; then echo "::error::the TransactionalEmail model drifts from the migrated table"; exit 1; fi
          echo "no TransactionalEmail drift"
          # Negative control: drop one index from the model; the same comparison must report it.
          mkdir -p /tmp/drift && cp prisma/schema.prisma /tmp/drift/schema.prisma
          node -e 'const f="/tmp/drift/schema.prisma";const fs=require("fs");const s=fs.readFileSync(f,"utf8");const m=s.indexOf("model TransactionalEmail {");const i=s.indexOf("  @@index([userId])",m);if(m<0||i<0)process.exit(3);fs.writeFileSync(f,s.slice(0,i)+s.slice(i+"  @@index([userId])".length));'
          npx prisma migrate diff --from-url "$OWNER_URL" --to-schema-datamodel /tmp/drift/schema.prisma --script > /tmp/drift.sql
          grep -q 'TransactionalEmail_userId_idx' /tmp/drift.sql || { echo "::error::the parity check did not see a removed index"; exit 1; }
          echo "negative control: a removed index is reported"
