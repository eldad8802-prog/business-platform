# TEST-ONLY, BRANCH-ONLY. iOS WKWebView cookie-contract probe.
#
# EVIDENCE ONLY. Not release CI, not a required check, not to be merged to main
# without separate approval. Runs on pushes to its own probe branch and nowhere
# else.
#
# THE QUESTION
#
# Does WKWebView honour HttpOnly + Secure + SameSite=Strict +
# Path=/api/auth/refresh, and does that cookie survive the app's process being
# terminated? Android answered it for its own engine; WKWebView is a different
# engine with a different cookie store and nothing transfers.
#
# WHY A PUBLIC TUNNEL AND NOT A LOCAL CERTIFICATE
#
# Two things were learned the hard way. WebKit refuses a Secure cookie from
# http://127.0.0.1 — Chromium accepts it, which is how Android passed, so the
# assumption had quietly crossed engines. And a private CA installed with
# `simctl keychain add-root-cert` never produced a usable TLS connection: six
# runs, zero requests reaching the probe, and no error to read.
#
# So the transport here is the one Production actually uses: real HTTPS with a
# publicly trusted certificate. A Cloudflare quick tunnel provides exactly that
# with no account, no token and no stored secret, and it disappears with the job.
#
# EXPOSURE
#
# The tunnel publishes ONLY the disposable probe: four synthetic endpoints and a
# random per-run cookie value. No Dubiz code, no database, no auth, no
# Production, no Preview. The probe binds loopback, so the tunnel client is the
# only thing that can reach it, and the hostname is random per run.

name: ios cookie probe (simulator, evidence only)

on:
  push:
    branches: [probe/ios-cookie-feasibility]

permissions:
  contents: read

concurrency:
  group: ios-cookie-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-cookie-probe:
    name: iOS cookie probe (Simulator)
    runs-on: macos-15
    timeout-minutes: 60

    env:
      PROBE_PORT: '3171'
      BUNDLE_ID: il.co.promaxgroup.dubiz

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Environment
        run: |
          xcodebuild -version
          uname -m

      - name: Start the disposable probe server (loopback only)
        run: |
          mkdir -p native-evidence
          node scripts/native/cookie-probe-server.mjs > native-evidence/cookie-probe-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsS "http://localhost:${PROBE_PORT}/plan" > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS "http://localhost:${PROBE_PORT}/plan"
          echo

      # A quick tunnel needs no account and no token: cloudflared assigns a
      # random trycloudflare.com hostname with a publicly trusted certificate,
      # and tears it down with the process.
      - name: Open a publicly trusted HTTPS tunnel to the probe
        id: tunnel
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then PKG=cloudflared-darwin-arm64.tgz; else PKG=cloudflared-darwin-amd64.tgz; fi
          curl -fsSL -o cloudflared.tgz "https://github.com/cloudflare/cloudflared/releases/latest/download/$PKG"
          tar -xzf cloudflared.tgz
          chmod +x cloudflared
          ./cloudflared --version
          ./cloudflared tunnel --no-autoupdate --url "http://localhost:${PROBE_PORT}" > native-evidence/cloudflared.log 2>&1 &
          URL=""
          for _ in $(seq 1 60); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' native-evidence/cloudflared.log | head -1 || true)"
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "no tunnel hostname was assigned"
            tail -40 native-evidence/cloudflared.log
            exit 1
          fi
          echo "tunnel origin assigned"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          HOST="${URL#https://}"

          # cloudflared prints the hostname before the tunnel is registered and
          # before DNS carries it. The previous run raced both: the name was
          # assigned and "could not resolve host" a moment later. Wait for the
          # connection first, then for DNS, then for the probe to answer.
          for _ in $(seq 1 60); do
            grep -q "Registered tunnel connection" native-evidence/cloudflared.log && break
            sleep 2
          done
          echo "tunnel connections registered: $(grep -c "Registered tunnel connection" native-evidence/cloudflared.log || echo 0)"

          # The previous run gated on `host`/`dig`, which these runners may not
          # ship — so the gate failed rather than DNS, and the run was stopped by
          # my own check. curl is the only test that matters here: it resolves,
          # connects and verifies TLS in one go, which is what the WebView does.
          echo "which host: $(command -v host || echo ABSENT)  which dig: $(command -v dig || echo ABSENT)"

          # No -k and no custom CA: verifying against the public trust store is
          # the whole point, and it is what WKWebView will do too.
          OK=""
          for _ in $(seq 1 45); do
            if curl -fsS --max-time 10 "$URL/plan" > /dev/null 2>&1; then OK=yes; break; fi
            sleep 2
          done
          if [ -z "$OK" ]; then
            echo "the public origin never served the probe"
            curl -v --max-time 10 "$URL/plan" 2>&1 | tail -20 || true
            tail -40 native-evidence/cloudflared.log
            exit 1
          fi
          curl -fsS "$URL/plan"
          echo

      # The origin is only known now, so the sync has to follow the tunnel.
      - name: Sync the iOS project against the public probe origin
        env:
          CAP_SERVER_URL: ${{ steps.tunnel.outputs.url }}
        run: |
          npx cap sync ios
          grep -o '"url"[^,}]*' ios/App/App/capacitor.config.json || true

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          DEVTYPE="$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[5-7][^ )]*' | tail -1)"
          RUNTIME="$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)"
          echo "device type: $DEVTYPE"
          echo "runtime:     $RUNTIME"
          UDID="$(xcrun simctl create probe-iphone "$DEVTYPE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build the app for the simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -30
          find build-ios -name "App.app" -maxdepth 6 -print

      - name: Run the iOS cookie probe
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          PROBE_PUBLIC_ORIGIN: ${{ steps.tunnel.outputs.url }}
        run: |
          APP_PATH="$(find build-ios -name 'App.app' -maxdepth 6 | head -1)"
          echo "app bundle: $APP_PATH"
          APP_PATH="$APP_PATH" bash scripts/native/ios-cookie-probe.sh

      # A run where the WebView never connects looks identical to one where it
      # connected and misbehaved, unless something says which.
      - name: Capture diagnostics on failure
        if: failure()
        run: |
          echo "--- probe server ---"
          cat native-evidence/cookie-probe-server.log || true
          echo "--- tunnel ---"
          tail -40 native-evidence/cloudflared.log || true
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 5m --predicate 'processImagePath CONTAINS "App"' > native-evidence/simulator-app.log 2>&1 || true
          grep -iE "error|fail|TLS|certificate|NSURLError" native-evidence/simulator-app.log | head -40 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cookie-probe-evidence
          path: native-evidence/**
          if-no-files-found: warn
          retention-days: 30

      - name: Tear the tunnel and simulator down
        if: always()
        run: |
          pkill -f cloudflared || true
          xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
