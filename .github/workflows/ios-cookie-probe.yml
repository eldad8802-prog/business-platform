# TEST-ONLY, BRANCH-ONLY. iOS WKWebView cookie-contract probe.
#
# EVIDENCE ONLY. This is not release CI, it is not a required check, and it must
# not be merged to main without separate approval. It runs on pushes to its own
# probe branch and nowhere else.
#
# It answers one question with runtime evidence: does WKWebView honour
# HttpOnly + Secure + SameSite=Strict + Path=/api/auth/refresh, and does that
# cookie survive the app's process being terminated? Android has already
# answered it for its own engine; WKWebView is a different engine with a
# different cookie store and nothing transfers.
#
# WHY REAL TLS AND NOT LOOPBACK HTTP
#
# The first run of this probe served plain http on 127.0.0.1, which is what
# Android accepted. WebKit refused the Secure cookie there while accepting an
# otherwise identical non-Secure twin — so loopback http is enough for Chromium
# and not for WebKit. The answer is to give the probe a real certificate, never
# to drop the attribute under test. An ephemeral CA is minted on the runner,
# trusted by this one disposable simulator, and discarded with it.
#
# Consequently the committed Info.plist is NOT touched: a trusted certificate
# satisfies App Transport Security on its own, so production iOS configuration
# stays exactly as it ships.
#
# Zero secrets. Zero Production. Zero Preview. Zero database. The probe server
# is runner-local and the cookie value is a synthetic per-run marker.

name: ios cookie probe (simulator, evidence only)

on:
  push:
    branches: [probe/ios-cookie-feasibility]

permissions:
  contents: read

concurrency:
  group: ios-cookie-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-cookie-probe:
    name: iOS cookie probe (Simulator)
    runs-on: macos-15
    timeout-minutes: 45

    env:
      PROBE_PORT: '3171'
      CAP_SERVER_URL: https://localhost:3171
      BUNDLE_ID: il.co.promaxgroup.dubiz

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Environment
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true

      # Points the WebView at the runner-local probe. Nothing about Dubiz is
      # served: CAP_SERVER_URL is loopback, so the app loads the probe page.
      - name: Sync the iOS project against the probe origin
        run: npx cap sync ios

      - name: Mint an ephemeral CA and server certificate
        run: |
          set -euo pipefail
          mkdir -p probe-tls
          cd probe-tls
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 -keyout ca.key -out ca.pem -subj "/CN=Dubiz Probe Ephemeral CA" -addext "basicConstraints=critical,CA:TRUE,pathlen:0" -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -sha256 -nodes -keyout leaf.key -out leaf.csr -subj "/CN=localhost"
          {
            echo "subjectAltName=DNS:localhost,IP:127.0.0.1"
            echo "extendedKeyUsage=serverAuth"
            echo "basicConstraints=critical,CA:FALSE"
          } > leaf.ext
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out leaf.pem -days 2 -sha256 -extfile leaf.ext
          openssl x509 -in leaf.pem -noout -subject -issuer -dates
          openssl x509 -in leaf.pem -noout -text | grep -A 1 "Subject Alternative Name"

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          DEVTYPE="$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[5-7][^ )]*' | tail -1)"
          RUNTIME="$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)"
          echo "device type: $DEVTYPE"
          echo "runtime:     $RUNTIME"
          UDID="$(xcrun simctl create probe-iphone "$DEVTYPE" "$RUNTIME")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      # Trusted for this disposable simulator only. It is deleted with the
      # device at the end of the job and never leaves the runner.
      - name: Trust the ephemeral CA inside the disposable simulator
        run: |
          xcrun simctl keychain "${{ steps.sim.outputs.udid }}" add-root-cert probe-tls/ca.pem
          echo "root certificate installed on ${{ steps.sim.outputs.udid }}"
          # The network process caches trust at launch, so a root added to a
          # already-booted device is not picked up until it restarts. Every https
          # run so far never connected at all, while the earlier http run loaded
          # the page fine — the difference is trust, and this is what applies it.
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          echo "simulator restarted so the new trust anchor takes effect"

      - name: Build the app for the simulator
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40
          find build-ios -name "App.app" -maxdepth 6 -print

      - name: Start the runner-local cookie probe over TLS
        run: |
          mkdir -p native-evidence
          PROBE_TLS_KEY=probe-tls/leaf.key PROBE_TLS_CERT=probe-tls/leaf.pem node scripts/native/cookie-probe-server.mjs > native-evidence/cookie-probe-server.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -fsSk "https://localhost:${PROBE_PORT}/plan" > /dev/null 2>&1 && break
            sleep 1
          done
          # -k on the RUNNER only: macOS curl is built against Secure Transport and
          # ignores --cacert, which failed the job before the real test could run.
          # The WebView is the thing under test and it validates the chain properly.
          curl -fsSk "https://localhost:${PROBE_PORT}/plan"
          echo
          cat native-evidence/cookie-probe-server.log

      - name: Run the iOS cookie probe
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          PROBE_SCHEME: https
        run: |
          APP_PATH="$(find build-ios -name 'App.app' -maxdepth 6 | head -1)"
          echo "app bundle: $APP_PATH"
          APP_PATH="$APP_PATH" bash scripts/native/ios-cookie-probe.sh

      # If the WebView never reported, the reason is in the app process log —
      # a TLS trust failure looks nothing like a page that loaded and misbehaved.
      - name: Capture the simulator log on failure
        if: failure()
        run: |
          mkdir -p native-evidence
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 5m --predicate 'processImagePath CONTAINS "App"' > native-evidence/simulator-app.log 2>&1 || true
          tail -80 native-evidence/simulator-app.log || true
          cat native-evidence/cookie-probe-server.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-cookie-probe-evidence
          path: native-evidence/**
          if-no-files-found: warn
          retention-days: 30

      - name: Shut the simulator down
        if: always()
        run: xcrun simctl delete "${{ steps.sim.outputs.udid }}" || true
