# Business runtime-columns forensic — proof on PostgreSQL (ephemeral PG17).
#
# Read-only investigation of the tenant runtime's privileges on "Business"
# (column SELECT id/name/createdAt/deletionRequestedAt/deletedAt and column UPD
# on the lifecycle columns, from 20260908180000 — Business has NO RLS). NOTHING
# here changes a migration, a grant or application code.
#
#   1. .bizcols/lab.sh — Production topology (.c594/lab.sh) + the REAL D2 E4
#      narrowing migration.
#   2. The read-only Production preflight (ops/evidence/business-runtime-columns-
#      preflight.sql) on the lab: 35/35 PASS, observed counts as Production should show.
#   3. .bizcols/battery.ts — exposure (cross-tenant reads AND the cross-tenant
#      lifecycle write, with and without a tenant GUC; the real lifecycle reader)
#      and four options, each tried in a ROLLED-BACK transaction.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: bizcols — Business runtime-columns forensic lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "ops/evidence/business-runtime-columns-preflight.sql"
      - ".bizcols/**"
      - ".github/workflows/bizcols-forensic-lab.yml"
      - "prisma/migrations/20261006090000_business_tenant_write_rls/**"
      - "ops/evidence/business-tenant-write-rls-production-evidence.sql"
      - "ops/evidence/business-tenant-write-rls-preflight.sql"
      - "ops/evidence/business-b4-role-classification.sql"
      - "lib/services/account/account-deletion.prisma-store.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Business runtime columns (PG17, Production role topology, real D2 E4 migration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bizcols_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bizcols_ci_synthetic_super_pw
      LAB_PASSWORD: bizcols_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/business-runtime-columns-preflight.sql
      B4_PROOF: ops/evidence/business-tenant-write-rls-production-evidence.sql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. The preflight passes the Production workflow's SELECT-only guard and is selectable there
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          if grep -inE "$FORBIDDEN" "$PREFLIGHT"; then echo "write keyword in $PREFLIGHT"; exit 1; fi
          grep -q "'$PREFLIGHT'" .github/workflows/prod-readonly-evidence.yml || { echo "not selectable"; exit 1; }

      - name: 1. Lab + the read-only preflight — 35/35 PASS
        run: |
          set -euo pipefail
          bash .bizcols/lab.sh biz_lab
          out=$(PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d biz_lab -v ON_ERROR_STOP=1 -f "$PREFLIGHT")
          printf '%s\n' "$out"
          test "$(printf '%s\n' "$out" | grep -cE '^ +[0-9]+ \| PASS')" = "35" || { echo "expected 35 PASS rows"; exit 1; }

      - name: 2. Exposure + options battery (options rolled back)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/biz_lab" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/biz_lab" \
            npx tsx .bizcols/battery.ts

      - name: 3. B4 — the REAL migration + the REAL account-deletion code (19 checks)
        if: hashFiles('prisma/migrations/20261006090000_business_tenant_write_rls/migration.sql') != ''
        run: |
          set -euo pipefail
          bash .bizcols/lab.sh b4_lab --b4
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/b4_lab"           RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/b4_lab"           AUTH_URL="postgresql://app_auth_lab:$LAB_PASSWORD@localhost:5432/b4_lab"             npx tsx .bizcols/b4-battery.ts


      - name: 4. B4 post-apply proof — 14/14 after; exactly 1 3 4 5 6 7 fail before
        if: hashFiles('prisma/migrations/20261006090000_business_tenant_write_rls/migration.sql') != ''
        run: |
          set -euo pipefail
          M=prisma/migrations/20261006090000_business_tenant_write_rls/migration.sql
          sum=$(sha256sum "$M" | cut -d' ' -f1)
          grep -q "'$sum'" "$B4_PROOF" || { echo "the B4 proof pins a different checksum"; exit 1; }
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -v ON_ERROR_STOP=1 "$@"; }
          lab -d b4_lab -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES (gen_random_uuid()::text, '$sum', now(), '20261006090000_business_tenant_write_rls', 1)"
          out=$(lab -d b4_lab -f "$B4_PROOF")
          printf '%s\n' "$out"
          test "$(printf '%s\n' "$out" | grep -cE '^ +[0-9]+ \| PASS')" = "14" || { echo "expected 14 PASS rows"; exit 1; }
          pre=$(lab -d biz_lab -f "$B4_PROOF" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$pre" = "1 3 4 5 6 7 " || { echo "pre-B4 lab: expected exactly 1 3 4 5 6 7 to fail, got: $pre"; exit 1; }

      - name: 5. B4 PREFLIGHT — 17/17 before; a signup login outside app_auth is caught BEFORE apply; after B4 exactly 2 4 fail
        if: hashFiles('prisma/migrations/20261006090000_business_tenant_write_rls/migration.sql') != ''
        run: |
          set -euo pipefail
          PRE=ops/evidence/business-tenant-write-rls-preflight.sql
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          if grep -inE "$FORBIDDEN" "$PRE"; then echo "write keyword in $PRE"; exit 1; fi
          grep -q "'$PRE'" .github/workflows/prod-readonly-evidence.yml || { echo "$PRE not selectable"; exit 1; }
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -v ON_ERROR_STOP=1 "$@"; }
          fails() { lab -d "$1" -f "$PRE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          # app_auth_lab (LOGIN IN ROLE app_auth) exists cluster-wide since step 3 — the signup identity.
          lab -d biz_lab -f "$PRE" | tee /tmp/b4pre.out
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/b4pre.out)" = "17" || { echo "expected 17/17 on the pre-B4 lab"; exit 1; }
          psql -X -v ON_ERROR_STOP=1 -q -U "$SUPER" -d biz_lab \
            -c "CREATE ROLE b4_rogue_signup LOGIN NOSUPERUSER NOBYPASSRLS" \
            -c "GRANT USAGE ON SCHEMA public TO b4_rogue_signup" \
            -c "GRANT INSERT (name) ON \"Business\" TO b4_rogue_signup"
          got=$(fails biz_lab); test "$got" = "7 " || { echo "rogue signup login: expected preflight FAIL '7 ', got '$got'"; exit 1; }
          echo "fault detected BEFORE apply [a login adds Business rows outside app_auth] → preflight FAIL $got"
          psql -X -v ON_ERROR_STOP=1 -q -U "$SUPER" -d biz_lab -c "REVOKE ALL ON \"Business\" FROM b4_rogue_signup" -c "REVOKE USAGE ON SCHEMA public FROM b4_rogue_signup" -c "DROP ROLE b4_rogue_signup"
          got=$(fails b4_lab); test "$got" = "2 4 " || { echo "post-B4 lab: expected preflight 2 4 to fail, got '$got'"; exit 1; }
          echo "post-B4 lab: preflight fails exactly $got (B4 recorded, Business under RLS)"

      - name: 6. Role classification (evidence for preflight checks 7/12) — planted roles are classified exactly
        if: hashFiles('prisma/migrations/20261006090000_business_tenant_write_rls/migration.sql') != ''
        run: |
          set -euo pipefail
          CL=ops/evidence/business-b4-role-classification.sql
          PRE=ops/evidence/business-tenant-write-rls-preflight.sql
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          if grep -inE "$FORBIDDEN" "$CL"; then echo "write keyword in $CL"; exit 1; fi
          grep -q "'$CL'" .github/workflows/prod-readonly-evidence.yml || { echo "$CL not selectable"; exit 1; }
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d biz_lab -v ON_ERROR_STOP=1 "$@"; }
          su() { psql -X -v ON_ERROR_STOP=1 -q -U "$SUPER" -d biz_lab "$@"; }
          # clean baseline: nothing to classify
          out=$(lab -A -F'|' -f "$CL"); echo "$out" | grep -qx '0|0|0|0' || { echo "baseline: expected 0|0|0|0"; echo "$out"; exit 1; }
          # plant one role of each shape the preflight can trip on
          su -c "CREATE ROLE cl_owner_member LOGIN NOSUPERUSER NOBYPASSRLS INHERIT IN ROLE lab_owner" \
             -c "CREATE ROLE cl_direct_ins LOGIN NOSUPERUSER NOBYPASSRLS" \
             -c "GRANT USAGE ON SCHEMA public TO cl_direct_ins" -c "GRANT INSERT (name) ON \"Business\" TO cl_direct_ins" \
             -c "CREATE ROLE cl_direct_upd NOLOGIN NOSUPERUSER NOBYPASSRLS" \
             -c "GRANT USAGE ON SCHEMA public TO cl_direct_upd" -c "GRANT UPDATE (\"deletedAt\") ON \"Business\" TO cl_direct_upd"
          pre=$(lab -f "$PRE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1"="$3}' | tr -d ' ' | tr '\n' ' ')
          echo "preflight with planted roles: $pre"
          # The owner role is a member of app_runtime (as in Production), so an owner-member login is
          # transitively a runtime member: check 10 sees it and check 12 excludes it.
          test "$pre" = "7=2 10=1 12=1 " || { echo "expected preflight 7=2 10=1 12=1"; exit 1; }
          out=$(lab -A -F'|' -f "$CL"); echo "$out"
          echo "$out" | grep -qx '2|1|0|3' || { echo "summary: expected 2|1|0|3 (same sets as the preflight)"; exit 1; }
          n() { echo "$out" | grep -cx "$1" || true; }
          test "$(n 'in_check7|t')" = "2" && test "$(n 'in_check12|t')" = "1" && test "$(n 'member_app_runtime|t')" = "1" \
            && test "$(n 'member_of_owner|t')" = "1" && test "$(n 'owner_ins_and_upd|t')" = "1" \
            && test "$(n 'direct_ins|t')" = "1" && test "$(n 'direct_upd|t')" = "1" \
            && test "$(n 'can_login|f')" = "1" && test "$(n 'known_repo_role|t')" = "0" \
            || { echo "classification flags differ from the planted roles"; exit 1; }
          if echo "$out" | grep -q 'cl_'; then echo "a role name leaked into the output"; exit 1; fi
          su -c "REVOKE ALL ON \"Business\" FROM cl_direct_ins, cl_direct_upd" -c "REVOKE USAGE ON SCHEMA public FROM cl_direct_ins, cl_direct_upd" \
             -c "DROP ROLE cl_owner_member" -c "DROP ROLE cl_direct_ins" -c "DROP ROLE cl_direct_upd"
          echo "role classification: owner member, direct INSERT login and direct UPDATE role each classified exactly; no name printed"

      - name: 7. Neon-shaped BYPASSRLS roles are outside B4 — preflight 17/17 with them; tied to the app they fail 9 and 16
        if: hashFiles('prisma/migrations/20261006090000_business_tenant_write_rls/migration.sql') != ''
        run: |
          set -euo pipefail
          PRE=ops/evidence/business-tenant-write-rls-preflight.sql
          CL=ops/evidence/business-b4-role-classification.sql
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d biz_lab -v ON_ERROR_STOP=1 "$@"; }
          su() { psql -X -v ON_ERROR_STOP=1 -q -U "$SUPER" -d biz_lab "$@"; }
          fails() { lab -f "$PRE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          obs() { lab -f "$PRE" | grep -E "^ +$1 \|" | awk -F'|' '{print $3}' | tr -d ' '; }
          # the Production shape measured by run 37150916395: a NOLOGIN bypassing platform role holding the
          # predefined write-all role, and one bypassing LOGIN that is a member of it, nothing else
          su -c "CREATE ROLE ns_platform NOLOGIN NOSUPERUSER BYPASSRLS CREATEROLE CREATEDB REPLICATION" \
             -c "GRANT pg_read_all_data, pg_write_all_data TO ns_platform" \
             -c "CREATE ROLE ns_platform_login LOGIN NOSUPERUSER BYPASSRLS CREATEROLE CREATEDB REPLICATION IN ROLE ns_platform"
          got=$(fails); test -z "$got" || { echo "platform pair: expected 17/17, failing: $got"; exit 1; }
          test "$(obs 7)" = "0" && test "$(obs 12)" = "0" && test "$(obs 17)" = "2" && test "$(obs 16)" = "0" \
            || { echo "platform pair: expected 7=0 12=0 16=0 17=2"; exit 1; }
          cls=$(lab -A -F'|' -f "$CL"); echo "$cls" | grep -qx '1|2|1|2' || { echo "classification: expected Production's 1|2|1|2"; exit 1; }
          echo "platform pair (Production shape): preflight 17/17, classification 1|2|1|2 — outside B4 by construction"
          # the danger the new check exists for: a bypassing login tied to the app
          su -c "GRANT app_auth TO ns_platform_login"
          got=$(fails); test "$got" = "9 16 " || { echo "bypassing login in app_auth: expected FAIL '9 16 ', got '$got'"; exit 1; }
          echo "bypassing login tied to app_auth → preflight FAIL $got"
          su -c "REVOKE app_auth FROM ns_platform_login" -c "DROP ROLE ns_platform_login" \
             -c "REVOKE pg_read_all_data, pg_write_all_data FROM ns_platform" -c "DROP ROLE ns_platform"
