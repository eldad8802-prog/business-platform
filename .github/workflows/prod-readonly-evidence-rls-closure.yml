name: Prod Read-Only Evidence (tenant/RLS closure preflight + proof)

# Tenant/RLS closure — BEFORE the migration: integrity preflight (tenant keys, orphans, child/parent
# tenant agreement) and the measured gap; AFTER it: RLS/FORCE/policies/privileges and zero rows visible
# to the runtime without a tenant. Same fail-closed shape as prod-readonly-evidence-runtime-rls.yml:
#   OWNER_DATABASE_URL   = secrets.DIRECT_URL            catalog facts and counts
#   RUNTIME_DATABASE_URL = secrets.RUNTIME_DATABASE_URL  the no-context visibility probe
# Both sessions READ ONLY by Postgres (verified before and after); the runtime must be exactly
# app_runtime_prod, NOSUPERUSER, NOBYPASSRLS. Output: counts and booleans only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-readonly-evidence-rls-closure
  cancel-in-progress: false

jobs:
  evidence:
    name: RLS closure evidence (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-db
    steps:
      - name: Both connection secrets present (fail closed, nothing printed)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DIRECT_URL:-}" ]; then echo "::error::DIRECT_URL (owner) is not set in production-db — refusing."; exit 1; fi
          if [ -z "${RUNTIME_DATABASE_URL:-}" ]; then echo "::error::RUNTIME_DATABASE_URL is not set in production-db — NOT RUN (this is not a pass)."; exit 1; fi
          if [ "$DIRECT_URL" = "$RUNTIME_DATABASE_URL" ]; then echo "::error::owner and runtime secrets are the same URL — two identities are required."; exit 1; fi
          echo "Both connection secrets are present and distinct."

      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: node_modules/.bin/prisma generate

      - name: RLS closure evidence (read-only, counts only)
        env:
          OWNER_DATABASE_URL: ${{ secrets.DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        run: |
          node_modules/.bin/tsx scripts/ops/rls-closure-preflight.ts \
            --expected-runtime-user app_runtime_prod \
            --allow-host ep-flat-brook-am4bhq1y
