# Service Desk 1.2a / migration 20261112090000_service_desk_foundation — proof on PostgreSQL BEFORE it reaches
# Production (ephemeral PG17). Migration-first PR-1: this PR ships the migration and its proof only.
#
# .sdf/lab.sh builds Production's topology on top of the public booking lab: non-superuser CREATEROLE/BYPASSRLS owner
# (owner of the database, as Production's migration role is), NOLOGIN app_runtime + LOGIN app_runtime_prod, the
# owner's DEFAULT PRIVILEGES, "Customer" ("businessId", "id"), "BillingDocument" under cutover-2B's FORCE RLS, and the
# ledger completed with every migration that sorts before this one.
#
#   0. Evidence files are SELECT-only, selectable (exactly two) in prod-readonly-evidence.yml, never touch the
#      read-only boundary, pass the output guard; the proof pins migration.sql's sha256; the migration names only its own objects
#      and the tables it builds on, and no other migration names its objects.
#   1. Baseline (pending): PREFLIGHT passes whole; the proof refuses; a finished migration sorting after it makes
#      check 3 FAIL.
#   2. `prisma migrate deploy` (the release-migrate mechanism) applies it: proof 17/17; the preflight then fails
#      exactly its "not there yet" checks.
#   3. Role battery (.sdf/battery.ts) as the real roles: isolation, cross-business references, numbering under
#      concurrency, the core's state rules, quote versions, the journal, handover, intake, erasure, atomicity.
#   3b. Account erasure through the real adapter (.sdf/erasure-battery.ts): refusal, whole rollback, the declared
#       columns, the other business untouched, no DELETE, regression of the other erasures — on the foundation lab
#       with 1.2b (20261113090000) and M2 (20261115090000) deployed on top, because the purge also calls their erasure
#       functions.
#   4. Faults: each injected defect is caught by the proof check meant for it.
#   5. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#   6. Rollback: refused while rows exist; on an empty database it reverts whole (preflight whole again).
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: service desk foundation — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261112090000_service_desk_foundation/**"
      - "ops/evidence/service-desk-foundation-*.sql"
      - ".sdf/**"
      - ".sdx/lab.sh"
      - ".sdx/prereq.sql"
      - "prisma/migrations/20261113090000_service_external_work/**"
      - ".sdp/lab.sh"
      - "prisma/migrations/20261115090000_service_parts/**"
      - ".sd3/lab.sh"
      - "prisma/migrations/20261120090000_service_desk_ui_foundation/**"
      - ".github/workflows/service-desk-foundation-lab.yml"
      - ".github/workflows/prod-readonly-evidence.yml"
      - "prisma/schema.prisma"
      - "lib/services/account/account-deletion.prisma-store.ts"
      - "lib/services/account/account-erasure-manifest.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service desk foundation (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sdf_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sdf_ci_synthetic_super_pw
      LAB_PASSWORD: sdf_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/service-desk-foundation-preflight.sql
      EVIDENCE: ops/evidence/service-desk-foundation-production-evidence.sql
      SDF: prisma/migrations/20261112090000_service_desk_foundation/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only; checksum pinned; the migration names only its own objects
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            # Exactly these two Service files are selectable in the gated read-only workflow — no other.
            grep -q "^          - '$f'$" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
            # Never touches the read-only boundary (the workflow's own BOUNDARY rule).
            if grep -inE '(default_)?transaction_read_only|read[[:space:]]+write|session[[:space:]]+characteristics|reset[[:space:]]+all|session[[:space:]]+authorization' "$f"; then
              echo "$f touches the read-only boundary"; exit 1
            fi
          done
          listed=$(grep -cE "^          - 'ops/evidence/service-desk-foundation-[^']*'$" .github/workflows/prod-readonly-evidence.yml)
          test "$listed" = "2" || { echo "expected exactly 2 selectable service-desk-foundation evidence files, found $listed"; exit 1; }
          node scripts/ci/evidence-output-guard.mjs   # assert-shaped output only (public logs)
          sum=$(sha256sum "$SDF" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$SDF sha256 $sum (pinned)"
          prefix='^"(ServiceCaseNumberSequence|ServiceDevice|ServiceCase|ServiceCaseIntake|ServiceQuote|ServiceCaseEvent|ServiceHandover)_[A-Za-z_]+"$'
          own='"ServiceCaseNumberSequence"|"ServiceDevice"|"ServiceCase"|"ServiceCaseIntake"|"ServiceQuote"|"ServiceCaseEvent"|"ServiceHandover"|"ServiceCaseKind"|"ServiceCaseStatus"|"ServiceHoldReason"|"ServiceOutcome"|"ServiceCoverageSource"|"ServiceCoverageDecision"|"ServiceQuoteState"|"ServiceQuoteApprovalMethod"|"ServiceActor"|"ServiceCaseAction"|"ServiceEventType"'
          base='"Business"|"User"|"Customer"|"StaffMember"|"BillingDocument"'
          others=$(sed 's/--.*$//' "$SDF" | grep -oE '"[A-Z][A-Za-z_]*"' | sort -u | grep -vE "$prefix" | grep -vxE "$own|$base" || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261112090000_service_desk_foundation" ]] || continue
            # Owner-approved Service Desk migrations that BUILD ON the foundation (FKs to its tables, its case-row lock,
            # triggers on ServiceCase / ServiceHandover, its shared guard functions) — named one by one, never a pattern.
            [[ "$n" != "20261113090000_service_external_work" ]] || continue
            [[ "$n" != "20261115090000_service_parts" ]] || continue
            [[ "$n" != "20261120090000_service_desk_ui_foundation" ]] || continue
            if sed 's/--.*$//' "$d/migration.sql" | grep -nE '"Service(CaseNumberSequence|Device|Case|CaseIntake|Quote|CaseEvent|Handover)"|service_(erase_business|case_guard|case_opening_guard|quote_guard|event_|handover_guard|intake_guard|device_guard|user_same_business|journal_truncate)'; then
              echo "$n names a service desk object"; exit 1
            fi
          done
          echo "the migration names only its own objects and the tables it builds on; no other migration names its objects"

      - name: 1. Baseline (pending) — PREFLIGHT passes whole; the proof refuses; check 3 is live
        run: |
          set -euo pipefail
          bash .sdf/lab.sh sdf_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdf_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "baseline: expected no preflight failure, got: $fails"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "12" || { echo "expected 12 PASS"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline (the tables do not exist yet)"
          lab -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('lab-later', 'x', now(), '20261199000000_lab_later', 1)"
          c3=$(lab -f "$PREFLIGHT" | grep -E '^ +3 \|' | tr -d ' ')
          lab -q -c "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-later'"
          test "$c3" = "3|FAIL|1" || { echo "check 3 did not refuse a later finished migration: $c3"; exit 1; }
          echo "check 3 is live"

      - name: 2. prisma migrate deploy applies it — proof 17/17; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .sdf/lab.sh sdf_post --with-sdf | tee /tmp/post.log
          grep -q 'Applying migration `20261112090000_service_desk_foundation`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdf_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "17" || { echo "expected 17 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 4 5 6 " || { echo "after the release: expected '2 4 5 6 ', got: $fails"; exit 1; }

      - name: 3. Role battery — isolation, references, numbering, state rules, quotes, journal, erasure (real roles)
        run: |
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdf_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdf_post" \
            npx tsx .sdf/battery.ts

      - name: 3b. Account erasure through the REAL adapter (purgeOperationalData) as the runtime login
        # The purge also calls service_external_erase_business() (1.2b, 20261113090000), service_parts_erase_business()
        # (M2, 20261115090000) and service_desk_ui_erase_business() (1.3-0, 20261120090000), all applied in Production,
        # so the erasure is proven where Production is: the foundation lab with 1.2b, M2 and 1.3-0 deployed on top
        # (.sd3/lab.sh runs .sdp/lab.sh --with-m2 — the chain .sdf → .sdx → .sdp — then `migrate deploy` of 1.3-0).
        run: |
          set -euo pipefail
          bash .sd3/lab.sh sdf_erase --with-sd3 >/dev/null
          bash .sdf/erasure-prereq.sh sdf_erase
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdf_erase"
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdf_erase" \
          DATABASE_URL="$R" DIRECT_URL="$R" AUTH_DATABASE_URL="$R" AUTH_TOKEN_SECRET="sdf-ci-synthetic-auth-secret-0123456789abcdef" \
            npx tsx .sdf/erasure-battery.ts

      - name: 4. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          bash .sdf/lab.sh sdf_fault --with-sdf >/dev/null
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdf_fault -v ON_ERROR_STOP=1 "$@"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test -z "$(failing)" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "NO FORCE row-level security" "3 " 'ALTER TABLE "ServiceCase" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "ServiceCase" FORCE ROW LEVEL SECURITY'
          fault "a permissive FOR ALL policy" "4 5 " 'CREATE POLICY sdf_fault_all ON "ServiceQuote" USING (true)' 'DROP POLICY sdf_fault_all ON "ServiceQuote"'
          fault "removal privilege for app_runtime" "6 " 'GRANT DELETE ON "ServiceCase" TO app_runtime' 'REVOKE DELETE ON "ServiceCase" FROM app_runtime'
          fault "journal change privilege for app_runtime" "7 " 'GRANT UPDATE ON "ServiceCaseEvent" TO app_runtime' 'REVOKE UPDATE ON "ServiceCaseEvent" FROM app_runtime'
          fault "PUBLIC read" "8 " 'GRANT SELECT ON "ServiceHandover" TO PUBLIC' 'REVOKE SELECT ON "ServiceHandover" FROM PUBLIC'
          fault "search_path without pg_temp last" "9 " \
            'ALTER FUNCTION public.service_case_guard() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_case_guard() SET search_path = pg_catalog, public, pg_temp'
          fault "PUBLIC EXECUTE on the erasure" "10 " 'GRANT EXECUTE ON FUNCTION public.service_erase_business() TO PUBLIC' 'REVOKE EXECUTE ON FUNCTION public.service_erase_business() FROM PUBLIC'
          fault "SECURITY INVOKER erasure" "11 " 'ALTER FUNCTION public.service_erase_business() SECURITY INVOKER' 'ALTER FUNCTION public.service_erase_business() SECURITY DEFINER'
          fault "append-only trigger disabled" "12 " 'ALTER TABLE "ServiceCaseEvent" DISABLE TRIGGER "ServiceCaseEvent_append_only"' 'ALTER TABLE "ServiceCaseEvent" ENABLE TRIGGER "ServiceCaseEvent_append_only"'
          fault "one-document-one-case exclusion gone" "13 " 'ALTER TABLE "ServiceQuote" DROP CONSTRAINT "ServiceQuote_billing_document_one_case"' \
            'ALTER TABLE "ServiceQuote" ADD CONSTRAINT "ServiceQuote_billing_document_one_case" EXCLUDE USING gist ("billingDocumentId" WITH =, "caseId" WITH <>)'
          fault "a flag definition for the module" "15 " \
            "INSERT INTO \"PlatformFeatureDefinition\" (\"key\", \"displayName\", \"category\", \"description\", \"defaultEnabled\", \"mutable\", \"createdAt\") VALUES ('service_desk', 'x', 'x', 'x', false, true, now())" \
            "DELETE FROM \"PlatformFeatureDefinition\" WHERE \"key\" = 'service_desk'"
          fault "the opening rule (seq 1 <=> case.opened) gone" "17 " \
            'ALTER TABLE "ServiceCaseEvent" DROP CONSTRAINT "ServiceCaseEvent_opening"' \
            "ALTER TABLE \"ServiceCaseEvent\" ADD CONSTRAINT \"ServiceCaseEvent_opening\" CHECK ((\"seq\" = 1) = (\"eventType\" = 'case.opened') AND (\"eventType\" = 'case.opened') = (\"action\" = 'OPEN') AND (\"eventType\" = 'case.opened') = (\"fromStatus\" IS NULL) AND (\"eventType\" <> 'case.opened' OR (\"toStatus\" = 'OPEN' AND \"holdReasonBefore\" IS NULL AND \"holdReasonAfter\" IS NULL AND NOT \"cancellationRequestedBefore\" AND NOT \"cancellationRequestedAfter\" AND \"outcome\" IS NULL AND \"actor\" = 'OWNER_USER')))"
          fault "the opening-event constraint trigger disabled" "12 17 " \
            'ALTER TABLE "ServiceCase" DISABLE TRIGGER "ServiceCase_has_opening_event"' \
            'ALTER TABLE "ServiceCase" ENABLE TRIGGER "ServiceCase_has_opening_event"'
          sum=$(sha256sum "$SDF" | cut -d' ' -f1)
          fault "a ledger checksum that is not the reviewed file" "16 " \
            "UPDATE \"_prisma_migrations\" SET checksum = repeat('0', 64) WHERE migration_name = '20261112090000_service_desk_foundation'" \
            "UPDATE \"_prisma_migrations\" SET checksum = '$sum' WHERE migration_name = '20261112090000_service_desk_foundation'"
          test -z "$(failing)" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 5. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .sdf/lab.sh sdf_broken --broken-sdf
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d sdf_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relnamespace = 'public'::regnamespace AND relname IN ('ServiceCaseNumberSequence','ServiceDevice','ServiceCase','ServiceCaseIntake','ServiceQuote','ServiceCaseEvent','ServiceHandover'))
            + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'service\_%' AND pronamespace = 'public'::regnamespace)
            + (SELECT count(*) FROM pg_type WHERE typname IN ('ServiceCaseKind','ServiceCaseStatus','ServiceHoldReason','ServiceOutcome','ServiceCoverageSource','ServiceCoverageDecision','ServiceQuoteState','ServiceQuoteApprovalMethod','ServiceActor','ServiceCaseAction','ServiceEventType'))")
          echo "objects left=$left"
          test "$left" = "0" || { echo "NOT atomic"; exit 1; }

      - name: 6. Rollback — refused with rows; whole on an empty database
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -v ON_ERROR_STOP=1 "$@"; }
          if lab -d sdf_post -f .sdf/rollback.sql 2>/tmp/rb.err >/dev/null; then echo "rollback ran over rows"; exit 1; fi
          grep -q "SERVICE_DESK_ROLLBACK_REFUSED" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          bash .sdf/lab.sh sdf_rb --with-sdf >/dev/null
          lab -d sdf_rb -f .sdf/rollback.sql
          fails=$(lab -d sdf_rb -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "after rollback the preflight is not whole: $fails"; exit 1; }
          bash .sdf/lab.sh sdf_rb --deploy-only | grep -q "service desk foundation applied"
          test -z "$(lab -d sdf_rb -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; })" || { echo "re-apply after rollback is not whole"; exit 1; }
          echo "rollback refused over rows; whole on an empty database; the release re-applies cleanly"
