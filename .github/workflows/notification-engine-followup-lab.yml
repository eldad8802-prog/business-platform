# Notification engine follow-up / migration 20261211090000_notification_engine_followup — proof on PostgreSQL BEFORE
# it reaches Production (ephemeral PG17). DEPENDS ON 20261210090000_notification_engine_foundation (PR #1143): the lab
# chains the foundation lab, so the follow-up meets exactly what it builds on.
#
# .nte2/lab.sh chains .nte/lab.sh --with-nte (Production's role topology, the owner's DEFAULT PRIVILEGES, FORCE RLS,
# the task reminders push migration and the foundation applied by `prisma migrate deploy`).
#
#   0. Evidence files are SELECT-only and selectable in Production; the proof pins migration.sql's sha256; the
#      migration names only its own objects and what it builds on.
#   1. Baseline (foundation applied, follow-up pending): the PREFLIGHT passes (10 is INFO); the proof refuses.
#   2. `prisma migrate deploy` applies it: proof 14/14 (12 + the two visibility checks); the preflight then fails
#      exactly its "not there yet" checks.
#   3. Faults: each injected defect is caught by the proof check meant for it.
#   4. Battery (.nte2/battery.ts) as the real roles: the starvation-free reminder function (identifiers only, same
#      conditions as task_reminders_due, exclusion, clamp, grants), the owed-push index serving the worker's order,
#      the cascade indexes, the feature rows (OFF) and a per-business override becoming writable.
#   5. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: notification engine — follow-up migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261211090000_notification_engine_followup/**"
      - "ops/evidence/notification-engine-followup-*.sql"
      - ".nte2/**"
      - ".github/workflows/notification-engine-followup-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: notification engine follow-up (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: nte2_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: nte2_ci_synthetic_super_pw
      LAB_PASSWORD: nte2_ci_synthetic_role_pw
      CHECKPOINT_DISABLE: "1"
      PREFLIGHT: ops/evidence/notification-engine-followup-preflight.sql
      EVIDENCE: ops/evidence/notification-engine-followup-production-evidence.sql
      NTE2: prisma/migrations/20261211090000_notification_engine_followup/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable in Production; checksum pinned; the migration names only its own objects and what it builds on
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          node scripts/ci/evidence-output-guard.mjs   # assert-shaped output only (public logs)
          sum=$(sha256sum "$NTE2" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum ($sum)"; exit 1; }
          echo "$NTE2 sha256 $sum (pinned)"
          others=$(grep -oE '"[A-Z][A-Za-z]*"' "$NTE2" | sort -u | grep -vxE '"Task"|"Business"|"Notification"|"NotificationDelivery"|"PlatformFeatureDefinition"|"PlatformFeaturePolicy"' || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          echo "the migration names only Task, Business, Notification, NotificationDelivery, PlatformFeatureDefinition and PlatformFeaturePolicy"
          if grep -qiE '^\s*(DROP|ALTER TABLE|ALTER FUNCTION|DELETE|UPDATE|TRUNCATE)\b' "$NTE2"; then echo "not expand-only"; exit 1; fi
          echo "expand-only: no DROP / ALTER / DELETE / UPDATE / TRUNCATE"

      - name: 1. Baseline (foundation applied, follow-up pending) — PREFLIGHT passes; the proof refuses
        run: |
          set -euo pipefail
          bash .nte2/lab.sh nte2_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte2_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/pre.out; then echo "preflight FAILS on the baseline"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "9" || { echo "expected 9 PASS"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| INFO' /tmp/pre.out)" = "1" || { echo "expected 1 INFO"; exit 1; }
          if lab -f "$EVIDENCE" 2>/dev/null | grep -qE '^ +1 \| PASS'; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline"

      - name: 2. prisma migrate deploy applies it — proof 14/14; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          NTE_SEED=.nte/seed.sql bash .nte2/lab.sh nte2_post --with-nte2 | tee /tmp/post.log
          grep -q 'Applying migration `20261211090000_notification_engine_followup`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte2_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "14" || { echo "expected 14 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "1 5 6 8 " || { echo "after the release: expected '1 5 6 8 ', got: $fails"; exit 1; }

      - name: 3. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte2_post -v ON_ERROR_STOP=1 "$@"; }
          su() { psql -X -q -v ON_ERROR_STOP=1 -U "$SUPER" -d nte2_post -c "$1"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test "$(failing)" = "" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            su "$3"; got=$(failing); su "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          F='public.task_reminders_due_excluding(timestamp(3), integer, integer[])'
          fault "SECURITY INVOKER" "4 " "ALTER FUNCTION $F SECURITY INVOKER" "ALTER FUNCTION $F SECURITY DEFINER"
          fault "search_path not pinned" "4 " "ALTER FUNCTION $F RESET search_path" "ALTER FUNCTION $F SET search_path = pg_catalog, public, pg_temp"
          fault "EXECUTE for PUBLIC" "5 " "GRANT EXECUTE ON FUNCTION $F TO PUBLIC" "REVOKE EXECUTE ON FUNCTION $F FROM PUBLIC"
          fault "EXECUTE for another role" "5 " "GRANT EXECUTE ON FUNCTION $F TO app_auth" "REVOKE EXECUTE ON FUNCTION $F FROM app_auth"
          fault "a cascade index missing" "6 " 'DROP INDEX "Notification_userId_idx"' 'CREATE INDEX "Notification_userId_idx" ON "Notification"("userId") WHERE "userId" IS NOT NULL'
          fault "the owed-push index in the wrong order" "7 " \
            'DROP INDEX "NotificationDelivery_push_owed_due_idx"; CREATE INDEX "NotificationDelivery_push_owed_due_idx" ON "NotificationDelivery"("nextAttemptAt", "id") WHERE "status" = '"'"'PENDING'"'"' AND "channel" = '"'"'PUSH'"'"'' \
            'DROP INDEX "NotificationDelivery_push_owed_due_idx"; CREATE INDEX "NotificationDelivery_push_owed_due_idx" ON "NotificationDelivery"("nextAttemptAt" ASC NULLS FIRST, "id") WHERE "status" = '"'"'PENDING'"'"' AND "channel" = '"'"'PUSH'"'"''
          fault "the foundation index dropped" "8 " 'DROP INDEX "NotificationDelivery_push_owed_idx"' \
            'CREATE INDEX "NotificationDelivery_push_owed_idx" ON "NotificationDelivery"("nextAttemptAt", "id") WHERE "status" = '"'"'PENDING'"'"' AND "channel" = '"'"'PUSH'"'"''
          fault "the feature defined ON" "9 " 'UPDATE "PlatformFeatureDefinition" SET "defaultEnabled" = true WHERE "key" = '"'"'notifications_engine'"'"'' \
            'UPDATE "PlatformFeatureDefinition" SET "defaultEnabled" = false WHERE "key" = '"'"'notifications_engine'"'"''
          fault "the policy ON" "10 " 'UPDATE "PlatformFeaturePolicy" SET "globalEnabled" = true WHERE "featureKey" = '"'"'notifications_engine'"'"'' \
            'UPDATE "PlatformFeaturePolicy" SET "globalEnabled" = false WHERE "featureKey" = '"'"'notifications_engine'"'"''
          fault "a business override at release time" "12 " \
            'INSERT INTO "BusinessFeatureAccess" ("businessId", "featureKey", "state", "updatedAt") SELECT min("id"), '"'"'notifications_engine'"'"', '"'"'ENABLED'"'"', now() FROM "Business"' \
            'DELETE FROM "BusinessFeatureAccess" WHERE "featureKey" = '"'"'notifications_engine'"'"''
          test "$(failing)" = "" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 4. Battery — the reminder function, the indexes, the feature rows (real roles)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte2_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte2_post" \
          AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/nte2_post" \
            npx tsx .nte2/battery.ts

      - name: 5. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .nte2/lab.sh nte2_broken --broken-nte2
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d nte2_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relname IN ('NotificationDelivery_push_owed_due_idx', 'NotificationDelivery_subscriptionId_idx',
                   'NotificationDelivery_userId_idx', 'Notification_userId_idx'))
            + (SELECT count(*) FROM pg_proc WHERE proname = 'task_reminders_due_excluding')
            + (SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE \"key\" = 'notifications_engine')
            + (SELECT count(*) FROM \"PlatformFeaturePolicy\" WHERE \"featureKey\" = 'notifications_engine')")
          led=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261211090000_notification_engine_followup' AND finished_at IS NULL")
          found=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261210090000_notification_engine_foundation' AND finished_at IS NOT NULL")
          echo "objects left=$left unfinished ledger rows=$led foundation applied=$found"
          test "$left" = "0" && test "$led" = "1" && test "$found" = "1" || { echo "NOT atomic"; exit 1; }
