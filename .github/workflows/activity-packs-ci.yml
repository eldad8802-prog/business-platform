name: activity packs — Home, bar and API (pure)

# Phase 2 (owner-approved spec + design 2026-11-20). Pure proofs only — no database, no network, no secrets:
# no selection = today's Home; packs reorder only what feature access allows; the bar slot; FREE_LIMITED presentation
# from test data; the API's 404 while the feature is OFF; HOME v4 and navigation regressions.

on:
  pull_request:
    paths:
      - "lib/activity-packs/**"
      - "features/home/**"
      - "features/tools/**"
      - "components/navigation/**"
      - "components/activity-packs/**"
      - "components/settings/settings-categories.ts"
      - "app/api/business/activity/**"
      - "app/(shell)/setup/**"
      - "app/settings/activity/**"
      - "lib/services/activity-packs/**"
      - "lib/services/feature-access/**"
      - "lib/i18n/messages/**"
      - "lib/navigation/**"
      - "scripts/ci/test-coverage/activity-packs.json"
      - ".github/workflows/activity-packs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx tsx features/home/v4/activity-packs-home.test.ts
      - run: npx tsx lib/activity-packs/activity-packs-api.test.ts
      # HOME v4 and navigation regressions (the existing suites, unchanged).
      - run: npx tsx features/home/v4/home-v4-model.test.ts
      - run: npx tsx components/navigation/nav-destinations.test.tsx
