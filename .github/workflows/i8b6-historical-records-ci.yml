# I-8B.6 — the historical fiscal READ path, on real PostgreSQL 17.
#
# The failure this guards against is a PostgreSQL failure and it is silent: under
# the restricted runtime role a SELECT with no tenant context does not raise, it
# matches zero rows. So the battery asserts a POSITIVE same-tenant read as well
# as the cross-tenant denial, and it runs through the same NOBYPASSRLS role
# production runs as — not superuser, not the owner.
#
# The structural verifiers run here too, and each one is then MUTATED: a suite
# that cannot fail is not evidence.
#
# Synthetic CI-only data. ZERO secrets, ZERO Neon, ZERO production.

name: i8b6 — historical records read path (ephemeral PG17)

on:
  push:
    branches: [feat/i8b6-historical-import-ux]
  pull_request:
    branches: [main]
    paths:
      - ".i8b6/**"
      - "lib/data-transfer/historical/**"
      - "app/api/data-transfer/historical/**"
      - "app/api/data-transfer/import/historical/**"
      - "app/settings/import-export/historical/**"
      - "components/settings/import-export/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260907120000_i8a_historical_fiscal_documents/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  OWNER_URL: postgresql://i8b6_owner:i8b6_ci_synthetic_owner_pw@localhost:5432/dubiz_i8b6
  RUNTIME_URL: postgresql://app_runtime:i8b6_ci_synthetic_runtime_pw@localhost:5432/dubiz_i8b6

jobs:
  i8b6-structural:
    name: I-8B.6 structural verifiers (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate

      - name: Types
        run: npx tsc --noEmit

      - name: Owner-facing surface
        run: npm run verify:historical-ux

      - name: Read path shape
        run: npm run verify:historical-records

      - name: The engine verifiers still pass unchanged
        run: |
          npm run verify:historical-contract
          npm run verify:historical-analyze
          npm run verify:historical-duplicates
          npm run verify:historical-preview
          npm run verify:historical-execute
          npm run verify:historical-fiscal-persistence

      - name: The Import/Export foundation still holds
        run: npm run verify:import-export-foundation

      # ── Negative proofs on the structural suite ────────────────────────────
      # Each mutation removes ONE real protection and is confirmed to have
      # applied before its result is believed.

      - name: negative proof — the confirm button ungated from the server
        run: |
          F="components/settings/import-export/historical/HistoricalImportScreen.tsx"
          cp "$F" "$F.bak"
          perl -0pi -e 's/                !preview\.readyForExecute \|\|\n//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-ux >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an ungated confirm button passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — a hardcoded action list instead of the server's
        run: |
          F="components/settings/import-export/historical/HistoricalImportScreen.tsx"
          cp "$F" "$F.bak"
          # Offering CREATE_ANYWAY on every row would let an owner click past a
          # collision the server never said could be overridden.
          perl -0pi -e 's/row\.allowedDecisions\.map\(/["CREATE", "SKIP", "CREATE_ANYWAY"].map(/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-ux >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a hardcoded action list passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — an expired preview reported as a generic error
        run: |
          F="lib/data-transfer/historical/historical-owner-language.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  TOKEN_EXPIRED:\n    "התצוגה המקדימה פגה\. יש לבדוק את הקובץ מחדש לפני הייבוא\.",/  TOKEN_EXPIRED: "אירעה שגיאה.",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-ux >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a generic error for an expired preview passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — an engine code left without owner wording
        run: |
          F="lib/data-transfer/historical/historical-owner-language.ts"
          cp "$F" "$F.bak"
          # A code with no sentence renders as nothing at all: the owner is shown
          # a row with a problem and no problem stated.
          perl -0pi -e 's/  REVERSAL_TARGET_UNSUPPORTED_TYPE:\n    "אי אפשר לזכות את סוג המסמך שהזיכוי מפנה אליו",//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-ux >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a code with no owner wording passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — CREATE_ANYWAY described as a replacement
        run: |
          F="lib/data-transfer/historical/historical-owner-language.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  CREATE_ANYWAY:\n    "תישמר רשומה היסטורית נוספת לצד זו שכבר קיימת\. הרשומה הקיימת נשארת כפי שהיא — היא לא מתעדכנת, לא מוחלפת ולא נמחקת\.",/  CREATE_ANYWAY: "הרשומה הקיימת תוחלף ברשומה מהקובץ.",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-ux >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an override described as a replacement passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the list ordering left partial
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  \{ id: "desc" \},\n//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-records >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a partial ordering passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the tenant taken from the request
        run: |
          F="app/api/data-transfer/historical/records/route.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/        page,/        page,\n        businessId: Number(params.get("businessId")),/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-records >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a client-supplied tenant passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the reader acquiring a write
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    const \[rows, total, anyAtAll, facets\] = await Promise\.all\(\[/    await tx.historicalFiscalDocument.update({ where: { id: 1 }, data: {} });\n    const [rows, total, anyAtAll, facets] = await Promise.all([/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-fiscal-persistence >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a write on the read path passed the model firewall"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — an internal row id handed to the owner
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          # A reversal row id in an owner-facing payload is a handle into another
          # business's world, and the reason the boolean exists at all.
          perl -0pi -e 's/    reversesLinked: row\.reversesHistoricalDocumentId !== null,/    reversesLinked: row.reversesHistoricalDocumentId !== null, reversesHistoricalDocumentId: row.reversesHistoricalDocumentId,/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-records >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an internal id reached the owner-facing shape"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the reader reaching the global client
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          # The global singleton carries no tenant GUC. Under the restricted role
          # that is not an error — it is an empty result.
          perl -0pi -e 's/import \{ withTenantTransaction, type TenantTx \} from "\@\/lib\/tenant\/transaction";/import { prisma } from "\@\/lib\/prisma";\nimport { withTenantTransaction, type TenantTx } from "\@\/lib\/tenant\/transaction";/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:historical-records >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the global client passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the historical flow hidden from the owner again
        run: |
          F="components/settings/import-export/import-export-actions.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/    key: "historical",/    key: "documents-import",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npm run verify:import-export-foundation >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a hub with no historical row passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: Confirm the tree is byte-identical after every mutation
        run: git diff --exit-code

  i8b6-battery:
    name: I-8B.6 records read battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: i8b6_owner
          POSTGRES_PASSWORD: i8b6_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_i8b6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U i8b6_owner -d dubiz_i8b6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .i8b6/battery.mjs

      - name: Create the restricted runtime role
        env:
          PGPASSWORD: i8b6_ci_synthetic_owner_pw
        run: |
          psql -h localhost -U i8b6_owner -d dubiz_i8b6 -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_runtime LOGIN PASSWORD 'i8b6_ci_synthetic_runtime_pw'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT USAGE ON SCHEMA public TO app_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO app_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO app_runtime;
          SQL

      - name: Push schema (lab)
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate

      - name: Run the I-8B.6 records battery
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: npx tsx .i8b6/battery.mjs

      # A historical issue date is a CALENDAR DAY. The writer pins it at UTC
      # midnight so it reads back as the same day; a reader built on local time
      # shifts it by the host offset. Running the whole battery again at +14 is
      # the only way to see that, because CI's own clock is UTC.
      - name: Run the battery again at UTC+14, so a day cannot shift
        env:
          TZ: Pacific/Kiritimati
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: npx tsx .i8b6/battery.mjs

      - name: Run the battery again at UTC-11
        env:
          TZ: Pacific/Pago_Pago
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: npx tsx .i8b6/battery.mjs

      # ── Negative proofs on the battery ────────────────────────────────────

      - name: negative proof — the tenant clause removed from the list
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          # RLS should still hold the line. This proves the battery would NOTICE
          # if it did not — the clause and the policy must agree.
          perl -0pi -e 's/  const where: Prisma\.HistoricalFiscalDocumentWhereInput = \{ businessId \};/  const where: Prisma.HistoricalFiscalDocumentWhereInput = {};/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          npx tsx .i8b6/battery.mjs > /tmp/neg.log 2>&1 || true
          mv "$F.bak" "$F"
          # With the clause gone the counts must still be right, because RLS is
          # the boundary. If they are NOT, the boundary was the clause all along.
          if grep -q "FAIL" /tmp/neg.log; then
            echo "FINDING: with the application clause removed the read path broke —"
            echo "that means RLS was not actually holding the boundary."
            cat /tmp/neg.log
            exit 1
          fi
          echo "NEGATIVE-PROOF PASS — RLS held the boundary on its own"

      - name: negative proof — the tenant context never established
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: |
          F="lib/tenant/transaction.ts"
          cp "$F" "$F.bak"
          # Without the GUC every read matches zero rows and NOTHING RAISES.
          # The battery must fail on the POSITIVE read, not pass on the denial.
          perl -0pi -e 's/await tx\.\$queryRaw`SELECT set_config[^;]*;//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx .i8b6/battery.mjs >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the battery passed with no tenant context — it is not proving the positive read"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the ordering left partial
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  \{ originalIssueDate: \{ sort: "desc", nulls: "last" \} \},\n  \{ id: "desc" \},/  { originalIssueDate: { sort: "desc", nulls: "first" } },/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx .i8b6/battery.mjs >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a partial ordering paged cleanly"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      # A UTC-midnight instant only changes DATE in a NEGATIVE offset: at UTC+14
      # it is 14:00 the same day, at UTC-11 it is the afternoon before. So the
      # mutation has to be observed from the west, and the two positive runs
      # above keep both directions covered.
      - name: negative proof — a calendar day read through local time
        env:
          TZ: Pacific/Pago_Pago
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          # Local time is the mistake this guards: `en-CA` also formats as
          # YYYY-MM-DD, so the shape of the value is identical and only the DAY
          # is wrong — at UTC+14 the 17th becomes the 18th, and 31 December
          # becomes 1 January of the next year.
          #
          # No `$` in the replacement: perl interpolates the right-hand side of
          # s/// even from a single-quoted shell argument, and a `${...}` there
          # is a perl dereference, not text.
          perl -0pi -e 's/  return value === null \? null : value\.toISOString\(\)\.slice\(0, 10\);/  return value === null ? null : value.toLocaleDateString("en-CA");/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx .i8b6/battery.mjs >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a timezone-shifted day passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — money read as a JavaScript number
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  return value === null \? null : value\.toFixed\(2\);/  return value === null ? null : String(Number(value));/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx .i8b6/battery.mjs >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a sixteen-digit amount survived a float"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the facet de-duplicated after fetching
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          RUNTIME_DATABASE_URL: ${{ env.RUNTIME_URL }}
          AUTH_TOKEN_SECRET: i8b6_ci_auth_secret_synthetic
        run: |
          F="lib/data-transfer/historical/historical-records.ts"
          cp "$F" "$F.bak"
          # `findMany({ distinct, take })` bounds the ROWS, then de-duplicates —
          # so a source system appearing once in a long history disappears from
          # the filter list. Bounded at 1 here to show the mechanism.
          perl -0pi -e 's/      tx\.historicalFiscalDocument\.groupBy\(\{\n        by: \["sourceSystemCode"\],\n        where: \{ businessId \},\n        orderBy: \{ sourceSystemCode: "asc" \},\n        take: HISTORICAL_RECORDS_MAX_FACETS,\n      \}\),/      tx.historicalFiscalDocument.findMany({\n        where: { businessId },\n        distinct: ["sourceSystemCode"],\n        orderBy: { sourceSystemCode: "asc" },\n        take: 1,\n        select: { sourceSystemCode: true },\n      }),/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx .i8b6/battery.mjs >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a truncated facet passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: Confirm the tree is byte-identical after every mutation
        run: git diff --exit-code
