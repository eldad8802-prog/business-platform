# iPhone input zoom (owner-reported 2026-11-11): text fields below 16px make iOS zoom in on focus. Measures every
# text-entry field on the reported screens in Chromium (Android) and WebKit (iPhone), as served and with the iOS rule
# of app/globals.css applied. Synthetic data only; ZERO secrets; NO environment; ZERO network beyond localhost.

name: mobile input zoom

on:
  pull_request:
    paths:
      - "app/globals.css"
      - ".mobile-input/**"
      - ".github/workflows/mobile-input-zoom-ci.yml"

permissions:
  contents: read

concurrency:
  group: mobile-input-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    name: Text fields on iPhone vs Android — computed font size, overflow, focus, reachability (PG17 lab, Chromium + WebKit)
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install browsers on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: mi_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: mi_ci_synthetic_super_pw
      LAB_PASSWORD: mi_ci_synthetic_role_pw
      AUTH_TOKEN_SECRET: mi-synthetic-auth-token-secret-0123456789
      TASK_REQUEST_HMAC_KEY: mi-synthetic-request-hmac-key-0123456789abcdef
      TASK_REQUEST_HMAC_KEY_ID: lab1
      CRON_SECRET: mi_ci_cron_secret_synthetic_at_least_32
      AUTH_PLANE_ENABLED: "true"
      RATE_LIMIT_BACKEND: memory
      DUBIZ_I18N_ENABLED: "true"
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: /tmp/mi-store
      NEXT_TELEMETRY_DISABLED: "1"
      OUT: /tmp/mobile-input
      SEED_OUT: /tmp/mobile-input-seed.json
      E2E_BASE: http://localhost:3740
      OWNER_URL: postgresql://lab_owner:mi_ci_synthetic_role_pw@localhost:5432/mi_ui
      DATABASE_URL: postgresql://app_runtime_prod:mi_ci_synthetic_role_pw@localhost:5432/mi_ui?connection_limit=20
      DIRECT_URL: postgresql://app_runtime_prod:mi_ci_synthetic_role_pw@localhost:5432/mi_ui
      AUTH_DATABASE_URL: postgresql://lab_owner:mi_ci_synthetic_role_pw@localhost:5432/mi_ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Lab — the real migrations by migrate deploy, Production role topology
        run: bash .business-documents/lab.sh mi_ui --with-po
      - name: Seed — M (customer, supplier, lead, complete identity), N (identity incomplete)
        run: npx tsx .mobile-input/seed.mts
      - run: npx playwright install --with-deps chromium webkit
      - name: Start the app (next dev, as the other browser labs)
        shell: bash
        run: |
          mkdir -p "$OUT" "$LOCAL_STORAGE_ROOT"
          (nohup npx next dev -p 3740 > "$OUT/server.log" 2>&1 &)
          for i in $(seq 1 150); do curl -sf -o /dev/null http://localhost:3740/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3740/login
      - name: Probe — customers, leads, supplier, business details, identity gate × Chromium/WebKit × he/en
        run: npx tsx .mobile-input/probe.mts
      - name: Report
        if: always()
        run: '[ -f "$OUT/report.md" ] && cat "$OUT/report.md" >> "$GITHUB_STEP_SUMMARY" || true'
      - name: Server log (on failure)
        if: failure()
        run: grep -vE "auth_sidless_token_accepted" "$OUT/server.log" | tail -n 120 || true
      - name: Screenshots and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-input-probe
          path: /tmp/mobile-input
          retention-days: 14
