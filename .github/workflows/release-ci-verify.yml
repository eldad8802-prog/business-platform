name: release-ci-verify

# Phase 4 · Step 4 — CI Verification.
#
# Runs read-only checks (prisma validate, lint, build) and publishes the
# `release/verify` commit status + Job Summary. It performs NO database writes,
# NO migrations, NO deploys, and NO provider changes.
#
# ⚠️ THIS STATUS IS REQUIRED. Branch protection on `main` lists `release/verify`
# in required_status_checks, so a failure here BLOCKS the merge.
#
# This header previously said the opposite — "non-blocking, REPORT-ONLY, no
# required checks are configured here". That was true when it was written and
# silently stopped being true when branch protection was added; nobody
# reconciled the two. The file claimed to be advice while GitHub treated it as a
# gate, which is dangerous in both directions: someone editing it as
# "report-only" can break every merge, and someone relying on branch protection
# is trusting a check its own author did not intend to be one.
#
# Two-tier reporting still applies WITHIN the job: `validate` and `build` decide
# pass/fail, while `lint` and `migrate status` are observations that never fail
# it. That tiering is about which STEPS block — not about whether the overall
# status blocks. It does.
on:
  pull_request: {}
  workflow_dispatch: {}

# Least privilege: read repo contents; write only the non-required commit status.
permissions:
  contents: read
  statuses: write

# Avoid overlapping runs on the same ref; never cancel in a way that blocks.
concurrency:
  group: release-ci-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The migration-first guard diffs base..head. Both SHAs must exist locally.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci — lockfile present)
        run: npm ci

      # ── migration-first guard (BLOCKING) ───────────────────────────────────
      # Offline. No network, no database, no Vercel, no GitHub API, no secret.
      # It reads this PR's own diff and refuses the shape that caused the
      # 2026-09-02 incident: a migration, prisma/schema.prisma and the runtime
      # code that depends on it, all in one PR. See docs/RELEASE-OWNERSHIP.md.
      # NOT continue-on-error: this one is allowed to fail the run.
      - name: migration-first guard (self-test, then the PR)
        id: migration_guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node scripts/ci/migration-first-guard.mjs --self-test
          node scripts/ci/migration-first-guard.mjs

      # Non-connecting placeholders ONLY so env("DATABASE_URL")/env("DIRECT_URL")
      # resolve for OFFLINE schema validation. `prisma validate` never opens a
      # connection — these are NOT a DB binding and never touch any database.
      - name: prisma validate (offline, no DB)
        id: validate
        continue-on-error: true
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npx prisma validate

      - name: Lint (report-only)
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build (no deploy; prisma generate + next build)
        id: build
        continue-on-error: true
        run: npm run build

      # migrate status is DB-touching. It runs ONLY against an explicitly-provided
      # non-production CI binding (CI_DATABASE_URL). The production/preview
      # DATABASE_URL secret is intentionally NOT referenced, so production data
      # can never be touched. With no CI_DATABASE_URL set, this is skipped.
      - name: prisma migrate status (read-only; skipped if no DB binding)
        id: migrate_status
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "skipped: no DB binding (CI_DATABASE_URL not set)"
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "outcome=ran" >> "$GITHUB_OUTPUT"
          npx prisma migrate status

      # Two-Tier reporting (uses .outcome — the real result, not the
      # continue-on-error-masked .conclusion):
      #   Blockers     -> validate, build  (a failure here = failing status)
      #   Report-only  -> lint, migrate status  (observations; never block)
      - name: Job Summary
        if: always()
        env:
          GUARD: ${{ steps.migration_guard.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          MIGRATE: ${{ steps.migrate_status.outputs.outcome || 'skipped' }}
        run: |
          {
            echo "## release/verify (REQUIRED status — a failure here blocks the merge)"
            echo ""
            echo "### Blockers (determine pass/fail)"
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| migration-first guard | ${GUARD} |"
            echo "| prisma validate | ${VALIDATE} |"
            echo "| build | ${BUILD} |"
            echo ""
            echo "### Report-only observations (never block)"
            echo "| check | result |"
            echo "| --- | --- |"
            echo "| lint | ${LINT} |"
            echo "| migrate status | ${MIGRATE} |"
            echo ""
            failed=""
            [ "${GUARD}" != "success" ] && failed="${failed} migration-first-guard"
            [ "${VALIDATE}" != "success" ] && failed="${failed} validate"
            [ "${BUILD}" != "success" ] && failed="${failed} build"
            if [ -n "${failed}" ]; then
              echo "**Failure reason:** blocking checks failed —${failed} (lint is report-only)."
            else
              echo "**Failure reason:** none — all blockers passed (lint is report-only)."
            fi
            echo ""
            echo "_This status is REQUIRED by branch protection on \`main\`. No DB writes, no migrations, no deploy._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release/verify commit status (PR only — REQUIRED by branch protection)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // Two-Tier status (.outcome = real result, not continue-on-error-masked
            // .conclusion). Status is determined by BLOCKERS only; lint is report-only.
            // This status is REQUIRED by branch protection on `main`.
            const blockers = {
              'migration-first-guard': '${{ steps.migration_guard.outcome }}',
              validate: '${{ steps.validate.outcome }}',
              build: '${{ steps.build.outcome }}',
            };
            const failed = Object.entries(blockers).filter(([, o]) => o !== 'success').map(([k]) => k);
            const ok = failed.length === 0;
            const description = ok
              ? 'blockers passed (migration-first-guard, validate, build); lint report-only'
              : `blocking checks failed: ${failed.join(', ')} (lint report-only)`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: ok ? 'success' : 'failure',
              context: 'release/verify',
              description,
            });
