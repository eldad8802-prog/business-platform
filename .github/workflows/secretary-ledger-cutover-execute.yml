name: secretary-ledger-cutover-execute

# Phase 2 cutover — the ONE owner-approved Production correction, and nothing else.
#
# Approved operation (owner, after dry run 36292324127):
#   clear `totalAmount` on the 4 migrated RECURRING commitments that still carry
#   one (a recurring commitment has no total), and write 4 migration audit
#   events. 0 commitments/installments/workflow rows created, 0 installments
#   updated, 0 Payments.
#
# Everything that defines the operation is HARD-CODED below — there is no input
# that can change the mode, the confirmation phrase or a single expected count.
# If Production no longer matches the approved dry run EXACTLY (headline counts,
# conflicts, the full plan), the script refuses before writing. The write runs
# in ONE REPEATABLE READ transaction that proves its own effect before commit
# (Payments +0, allocations +0, legacy rows +0, only `totalAmount` changed on
# those commitments, nothing left to copy/reconcile/clear) and rolls back on any
# violation.
#
# Same safety model as release-migrate: manual trigger only; main only; bound to
# the protected `production-db` environment (required reviewer); read-only repo
# token. It never touches SECRETARY_LEDGER_STORE, never deploys, never migrates.
#
# To run a DIFFERENT correction later, change this file in a reviewed PR.

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: 'Type exactly: CLEAR-4-RECURRING-TOTALS'
        required: true
        type: string
      reason:
        description: 'Audit note (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: secretary-ledger-cutover-production
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: production-db
    steps:
      - name: Refuse anything but canonical main and the exact acknowledgement
        env:
          ACK: ${{ inputs.acknowledge }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "refusing: runs from main only (got $GITHUB_REF)"; exit 1; fi
          if [ "$ACK" != "CLEAR-4-RECURRING-TOTALS" ]; then echo "refusing: acknowledgement does not match"; exit 1; fi
          echo "main @ $GITHUB_SHA · acknowledgement OK"

      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Payments before (read-only session)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: psql "$DIRECT_URL" -X -t -A -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM "Payment"' | tee payments-before.txt

      - name: Execute the approved correction (one transaction; refuses on any drift)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx scripts/payables/secretary-ledger-cutover.ts --mode execute \
            --confirm-execute SECRETARY_LEDGER_CUTOVER_EXECUTE \
            --expect-copy 0 \
            --expect-reconcile 0 \
            --expect-totals 4 \
            --expect-conflicts 0 \
            --expect-plan '{"commitmentsToCreate":0,"installmentsToCreate":0,"commitmentsToUpdate":4,"installmentsToUpdate":0,"workflowRowsToCreate":0,"workflowRowsToUpdate":0,"auditEventsToWrite":4,"paymentsToCreate":0}' \
            --json-out cutover-execute.json | tee cutover-execute.txt

      - name: Payments after (read-only session)
        if: always()
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: psql "$DIRECT_URL" -X -t -A -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM "Payment"' | tee payments-after.txt

      - name: Second dry run (READ ONLY transactions)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/payables/secretary-ledger-cutover.ts --mode dry-run --json-out cutover-after.json | tee cutover-after.txt

      - name: SQL preflight after (read-only session)
        if: always()
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -X -f scripts/payables/secretary-ledger-cutover-preflight.sql | tee cutover-after-preflight.txt

      - name: Upload the evidence (counts and ids only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secretary-ledger-cutover-execute
          path: |
            payments-before.txt
            payments-after.txt
            cutover-execute.json
            cutover-execute.txt
            cutover-after.json
            cutover-after.txt
            cutover-after-preflight.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Job Summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## secretary-ledger-cutover — PRODUCTION CORRECTION (owner-approved)"
            echo ""
            echo "- Approved: clear totalAmount on 4 migrated recurring commitments + 4 audit events; 0 Payments."
            echo "- Reason: ${REASON:-'(none provided)'}"
            echo "- Payments before/after (whole table, read-only reads): $(cat payments-before.txt 2>/dev/null) / $(cat payments-after.txt 2>/dev/null)"
            echo ""
            echo '```'
            sed -n '/^mode /,/^{/p' cutover-execute.txt 2>/dev/null | sed '$d' || true
            echo '--- second dry run'
            sed -n '/^mode /,/^{/p' cutover-after.txt 2>/dev/null | sed '$d' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
