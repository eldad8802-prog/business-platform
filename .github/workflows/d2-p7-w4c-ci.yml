# D2 / P7-W4C — Gmail tenant-isolation battery on ephemeral PG17.
# Real connect/callback/status/disconnect/import handlers with Google fully
# stubbed, token refresh isolation, OAuthToken parent-join, admin read via
# app_admin, rollback proof, idempotent re-apply.
# Synthetic CI-only creds; ZERO secrets; ZERO Neon; ZERO real Google calls.

name: d2/p7 — w4c gmail battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-p7-w4c]
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20260826200000_d2_p7_w4c_gmail_tenant_rls/**"
      - "scripts/security/d2-p7-w4c-*.sql"
      - ".p7w4c/**"
      - "app/api/integrations/gmail/**"
      - "lib/services/integrations/gmail/**"
      - "lib/tenant/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w4c-battery:
    name: W4C battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p7w4c_owner
          POSTGRES_PASSWORD: p7w4c_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_p7w4c
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p7w4c_owner -d dubiz_p7w4c"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .p7w4c/battery.mjs

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: postgresql://p7w4c_owner:p7w4c_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4c
          DIRECT_URL: postgresql://p7w4c_owner:p7w4c_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4c
        run: npx prisma db push --skip-generate

      - name: Run W4C battery
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: postgresql://p7w4c_owner:p7w4c_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4c
          DIRECT_URL: postgresql://p7w4c_owner:p7w4c_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4c
          RUNTIME_URL: postgresql://wave1_runtime:p7w1_ci_synthetic_pw@localhost:5432/dubiz_p7w4c
          ADMIN_LOGIN_ROLE: app_admin_lab
          W2G_ADMIN_PW: p7w2g_ci_synthetic_admin_pw
          AUTH_TOKEN_SECRET: p7w4c_ci_auth_secret_synthetic
        run: npx tsx .p7w4c/battery.mjs
