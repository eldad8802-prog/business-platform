# D2 / PRIVILEGED-WRITE-2 — BusinessFeatureAccess control-plane battery (PG17).
#
# Real services: the actual updateBusinessFeatureAccess writer, the actual
# tenant resolver, and the actual admin read — driven through three real DB
# credentials (tenant runtime / admin read / control plane) so the proof is
# about privileges, not about mocks.
#
# Synthetic CI-only credentials; ZERO secrets, ZERO Neon, ZERO network,
# ZERO Production. The endpoint deny-list in .pw2/shared.mjs aborts if this is
# ever pointed anywhere but the local lab.

name: d2/pw2 — control-plane battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-pw2a-admin-read-cleanup]
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20260901090000_d2_pw2_business_feature_access_rls/**"
      - "scripts/security/d2-pw2-*.sql"
      - "scripts/ci/privwrite-guard.sh"
      - ".pw2/**"
      - "lib/prisma-control-plane.ts"
      - "lib/services/control-plane/**"
      - "lib/services/feature-access/**"
      - "lib/services/platform-admin/**"
      - "app/api/platform-admin/businesses/**"
      - "app/api/business/capabilities/**"
      - "lib/tenant/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pw2-battery:
    name: PW-2 battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pw2_owner
          POSTGRES_PASSWORD: pw2_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_pw2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pw2_owner -d dubiz_pw2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://pw2_owner:pw2_ci_synthetic_owner_pw@localhost:5432/dubiz_pw2

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .pw2/shared.mjs && node --check .pw2/provision.mjs && node --check .pw2/battery.mjs

      - name: CI-PRIVWRITE guards + negative self-proofs (blocking)
        run: |
          bash scripts/ci/privwrite-guard.sh .
          bash scripts/ci/privwrite-guard.sh --self-test

      - name: Existing admin-boundary ratchet (CI-2/CI-3/CI-4, blocking)
        run: bash scripts/ci/admin-boundary-guard.sh .

      - name: Existing W4 context guards + self-proofs (blocking, no regression)
        run: |
          bash scripts/ci/w4-context-guard.sh .
          bash scripts/ci/w4-context-guard.sh --self-test

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate

      - name: Provision lab roles + feature catalog
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx tsx .pw2/provision.mjs

      - name: Run PW-2 battery
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          AUTH_TOKEN_SECRET: pw2_ci_auth_secret_synthetic
          PLATFORM_ADMIN_EMAILS: admin@pw2.test
        run: npx tsx .pw2/battery.mjs

      - name: Platform-admin authorization matrix (fail-closed gate)
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx tsx lib/auth/platform-admin.test.ts
