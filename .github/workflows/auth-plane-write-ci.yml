# AUTH-PLANE WRITE CONTRACT — ephemeral PG17 proof.
#
# Production login, logout and signup returned 500 for hours because Prisma
# appends `RETURNING <every scalar column>` to a write that carries no `select`,
# and D2 E4 had narrowed the auth plane's SELECT on "User" to a column list.
# Every column the write SET was granted; the read back nobody wrote was not.
#
# The existing privilege batteries could not have caught it. They prove what a
# ROLE may do, and every statement they issue is one a human chose to write. So
# this workflow drives the REAL login, logout and signup code paths through a
# LOGIN role attached to `app_auth`, under the SHIPPED E4 grants, on PostgreSQL
# 17 — and keeps the incident itself as a negative control.
#
# Signup runs under the full set Production holds — E4, sec_c's identity INSERT
# grants and B4's forced RLS on Business — and must SUCCEED, ending in the same
# AuthSession + refresh cookie login issues, with the tenant boundaries around
# account creation asserted alongside it.
#
# Synthetic CI-only credentials; ZERO secrets, ZERO Neon, ZERO network, ZERO
# Production.

name: auth-plane — write contract under least privilege (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/auth/**"
      - "app/api/security/**"
      - "app/settings/security/**"
      - "components/settings/security/**"
      - "lib/auth/**"
      - "lib/auth.ts"
      - "lib/auth-token.ts"
      - "lib/client-session.ts"
      - "lib/prisma-auth.ts"
      - "components/auth/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/20260908120000_persistent_auth_sessions/**"
      - "prisma/migrations/20260908180000_d2_user_business_privilege_narrowing/**"
      - "prisma/migrations/20260908200000_auth_session_privilege_contract/**"
      - "prisma/migrations/20260913120000_authsession_user_agent/**"
      - "prisma/migrations/20260926110300_sec_c_explicit_identity_grants/**"
      - "prisma/migrations/20261006090000_business_tenant_write_rls/**"
      - "prisma/migrations/20261011090000_onboarding_setup_state/**"
      - "prisma/migrations/20261011090100_signup_consent_business_rename/**"
      - "prisma/migrations/20261011090200_user_email_casefold_unique/**"
      - "lib/legal/**"
      - "lib/services/onboarding/**"
      - "app/api/business/setup/**"
      - "app/api/business/name/**"
      - "app/(shell)/setup/**"
      - "app/register/**"
      - ".authfix/**"
      - "scripts/qa/auth/**"
      - "lib/native/**"
      - "android/app/src/main/java/**"
      - ".github/workflows/auth-plane-write-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-plane-write-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-plane-writes:
    name: auth-plane write contract (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: authfix_owner
          POSTGRES_PASSWORD: authfix_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_authfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authfix_owner -d dubiz_authfix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://authfix_owner:authfix_ci_synthetic_owner_pw@localhost:5432/dubiz_authfix

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      # Source lock first: it needs no database, so a missing `select` fails in
      # seconds rather than after the lab is built.
      - name: Auth-plane write contract (source lock)
        run: npx tsx lib/auth/auth-plane-write-contract.test.ts

      # Pure, no database: the signup gate, the route contract (session +
      # refresh cookie), identity normalisation, and the guard that every
      # product call to signAuthToken names a session. These used to run only
      # when someone remembered `npm run verify:prelaunch`.
      - name: Signup contract and session-bound token guard (pure)
        run: npm run verify:prelaunch

      - name: Prisma validate + generate
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: |
          npx prisma validate
          npx prisma generate

      - name: Build the lab schema
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate

      - name: Auth-plane write battery (real routes, real grants, PG17)
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: npx tsx .authfix/auth-plane-write-battery.ts

      # ── PERSISTENT LOGIN: model parity, then ORM behaviour ────────────────
      #
      # The AuthSession models describe tables that ALREADY EXIST in Production.
      # `db push` above built them from the models; this replaces them with the
      # SHIPPED DDL — both migrations now, because the models have caught up and
      # describe userAgent — and then asks Prisma whether the models still need
      # any DDL at all. `--exit-code` fails the step on any difference, so the
      # models can never quietly drift from the shape Production actually has.
      - name: Persistent login — schema parity against the shipped DDL
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS "AuthSessionSecret" CASCADE;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS "AuthSession" CASCADE;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20260908120000_persistent_auth_sessions/migration.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20260913120000_authsession_user_agent/migration.sql
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Persistent login — ORM behaviour under the shipped grants (PG17)
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: npx tsx .authfix/auth-session-orm-battery.ts

      # The browser half and the client coordinator need no database, so they run
      # before the state machine and fail in seconds when they fail.
      - name: Persistent login — cookie, CSRF and client coordinator
        run: |
          npx tsx lib/auth/refresh-cookie.test.ts
          npx tsx lib/auth/refresh-client.test.ts

      # One line per refresh decision — outcome, reason, platform class — so a
      # sign-in screen on a phone can be traced; and proof that no line carries a
      # credential or a User-Agent and that the response body is unchanged.
      - name: Persistent login — refresh telemetry, closed vocabulary
        run: npx tsx lib/auth/refresh-telemetry.test.ts

      # Several tabs, one cookie jar: without a lock, overlapping refreshes leave
      # the jar holding a secret that dies with its grace (the control proves it
      # happens); under Web Locks and under the localStorage lease, seeded
      # interleavings make exactly one rotation and leave the jar current. Lost
      # responses are recovered inside the 120 s grace, never by widening it, and
      # nothing on the client ever revokes.
      - name: Persistent login — cross-tab lock, lost responses, retry schedule
        run: npx tsx lib/auth/refresh-client.concurrency.test.ts

      # One decision for a refused session: refreshable → stay (a read retried
      # once, a write never); ended by the server → cleared, hidden, /login;
      # network / 429 / 5xx → nothing cleared. And the source lock that keeps
      # every authenticated screen under the coordinator and the token's removal
      # inside the auth modules.
      - name: Session guard — refused sessions, coverage of every authenticated screen
        run: |
          npx tsx lib/auth/session-guard.test.ts
          npx tsx lib/auth/session-guard-coverage.test.ts

      # Android: the cookie jar is persisted after every RECEIVED auth response
      # (the device proof — kill 3 s after sign-in / refresh / sign-out — is the
      # emulator QA); the helper is a no-op outside the app.
      - name: Android cookie persistence — requested once per received auth response
        run: npx tsx lib/native/auth-cookies.test.ts

      # The device bug PR-E fixes, as two one-line regressions the suite must catch.
      - name: negative proof — a refused session that stays on screen / a chrome without the coordinator
        run: |
          mutate () {
            F="$1"; cp "$F" "$F.bak"
            node -e "const fs=require('fs');const f=process.argv[1];const s=fs.readFileSync(f,'utf8');const m=s.replace(process.argv[2],process.argv[3]);if (m === s) process.exit(9);fs.writeFileSync(f,m)" "$F" "$2" "$3" \
              || { mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED: $4"; exit 1; }
            if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:session-guard-$4" --expect "$5" -- npx tsx "$6"; then
              mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: $4"; exit 1
            fi
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS: $4"
          }
          mutate lib/auth/session-guard.ts 'window.location.replace(`${window.location.origin}/login`);' '/* stays */' stays-on-screen 'FAIL  - ...and replaced by /login' lib/auth/session-guard.test.ts
          mutate lib/auth/session-guard.ts 'if (rejectedToken === null && signOutPending()) {' 'if (false) {' pending-signout-resumed 'FAIL  - PENDING SIGN-OUT, no token' lib/auth/session-guard.test.ts
          mutate components/navigation/shell-chrome.tsx '<RefreshCoordinator>' '<>' no-coordinator 'FAIL  - the coordinator is mounted by ShellChrome' lib/auth/session-guard-coverage.test.ts
          git diff --exit-code

      # Each of these is a one-line regression that would quietly bring back
      # concurrent rotations. The suite must go red for each, for the right reason.
      - name: negative proof — refresh lock bypassed / adopt check removed / no heartbeat
        run: |
          F=lib/auth/refresh-client.ts
          mutate () {
            cp "$F" "$F.bak"
            node -e "const fs=require('fs');const f=process.argv[1];const s=fs.readFileSync(f,'utf8');const m=s.replace(process.argv[2],process.argv[3]);if (m === s) process.exit(9);fs.writeFileSync(f,m)" "$F" "$1" "$2" \
              || { mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED: $3"; exit 1; }
            if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:refresh-$3" --expect "$4" -- npx tsx lib/auth/refresh-client.concurrency.test.ts; then
              mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: $3"; exit 1
            fi
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF PASS: $3"
          }
          mutate 'return locks.request(REFRESH_LOCK_NAME, { mode: "exclusive" }, fn);' 'return fn();' lock-bypassed 'FAIL  - WEB LOCKS, 2 tabs'
          mutate 'if (replacedSince(startToken)) return "refreshed";' '' adopt-removed 'FAIL  - LEASE FALLBACK, 2 tabs'
          mutate '}, LEASE_HEARTBEAT_MS);' '}, 10 * 60_000);' no-heartbeat 'FAIL  - ...the waiter sent ZERO requests while the holder was still retrying'
          git diff --exit-code

      # The device label is built from a header the caller controls, so the thing
      # under test is not "does it recognise Chrome". It is whether a hostile
      # User-Agent can ever put text of its choosing on the owner's screen.
      - name: Device sessions — device label from a hostile User-Agent
        run: npx tsx lib/auth/device-label.test.ts

      # The state machine against real grants: rotation, the grace window,
      # concurrency, replay, every lifecycle refusal, and the rollback that
      # decides whether a lost response means "sign in again" or "carry on".
      - name: Persistent login — refresh state machine (PG17)
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: npx tsx .authfix/refresh-state-machine-battery.ts

      # sid binding end to end: the fourth gate, the three device routes, the
      # login that fails closed when it cannot create a session, and the rule that
      # no Phase 3.3 path may mint an access token naming no session.
      - name: Device sessions — sid binding and the device routes (PG17)
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: npx tsx .authfix/device-sessions-battery.ts

      # A gate nobody can delete quietly. The mutation is confirmed to have
      # applied before its result is believed, so a pattern that silently stops
      # matching fails the step rather than reporting a green it never earned.
      - name: negative proof — a refresh that ignores the deletion quarantine
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: |
          F="lib/auth/refresh-session.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/if \(!user\.business \|\| !acceptsNormalWrites\(user\.business\)\) \{/if (false) {/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:166:174" --expect 'FAIL  - DELETION_REQUESTED refuses the refresh' -- npx tsx .authfix/refresh-state-machine-battery.ts; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: an account being erased can still mint access tokens"
            exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      # The first draft of this feature passed every test while validating nothing,
      # because the token decoder rebuilt the payload from a whitelist and quietly
      # dropped the sid claim — so every token read as sid-less and the fourth gate
      # was never reached. Disabling that gate on purpose proves the suite would
      # now notice. A literal string replace, so "did not apply" is unambiguous.
      - name: negative proof — an auth context that skips the session gate
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: |
          F=lib/auth.ts
          cp "$F" "$F.bak"
          node -e "const fs=require('fs');const f=process.argv[1];const s=fs.readFileSync(f,'utf8');const m=s.replace('if (verified.sessionId !== null) {','if (false) {');if (m === s) process.exit(9);fs.writeFileSync(f,m)" "$F" \
            || { mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; }
          if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:187:195" --expect 'FAIL  - SID INVALID (no such session) is refused' -- npx tsx .authfix/device-sessions-battery.ts; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a revoked or expired session still authenticates"
            exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      # Per-device logout: the laptop that signs out ends its own session and the
      # phone stays signed in, while "every device", a sid-less token and any
      # generation bump still end everything — and a device revocation that
      # cannot be written is reported as a failure, never as a sign-out.
      - name: Logout scope — per device by default, everywhere on request (PG17)
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: npx tsx .authfix/logout-scope-battery.ts

      # Turning the default back into a global logout must be noticed: that is
      # exactly the regression that signed phones out on every account switch.
      - name: negative proof — a default logout that ends every device
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: |
          F=app/api/auth/logout/route.ts
          cp "$F" "$F.bak"
          node -e "const fs=require('fs');const f=process.argv[1];const s=fs.readFileSync(f,'utf8');const m=s.replace('const effective: LogoutScope = scope === \"device\" && sessionId !== null ? \"device\" : \"all\";','const effective: LogoutScope = \"all\";');if (m === s) process.exit(9);fs.writeFileSync(f,m)" "$F" \
            || { mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; }
          if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:logout-scope-default" --expect 'FAIL  - PHONE (Android WebView) still authenticates' -- npx tsx .authfix/logout-scope-battery.ts; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: a global default logout would go unnoticed"
            exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      # Cookie logout accepts a rotated secret only inside its grace. Dropping the
      # time bound would be a longer replay window by another name.
      - name: negative proof — cookie logout that accepts a secret past its grace
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: |
          F=lib/auth/refresh-session.ts
          cp "$F" "$F.bak"
          node -e "const fs=require('fs');const f=process.argv[1];const s=fs.readFileSync(f,'utf8');const m=s.replace('proven = historic !== null && input.now <= historic.graceUntil;','proven = historic !== null;');if (m === s) process.exit(9);fs.writeFileSync(f,m)" "$F" \
            || { mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; }
          if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:cookie-logout-grace" --expect 'FAIL  - COOKIE (rotated secret, PAST grace): revoked=false' -- npx tsx .authfix/logout-scope-battery.ts; then
            mv "$F.bak" "$F"
            echo "NEGATIVE-PROOF FAIL: cookie logout would accept an expired grace"
            exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: Confirm the tree is byte-identical after every mutation
        run: git diff --exit-code

      # The migration's own grant delta, kept as a standing check: the new column
      # must carry the same column-level privileges as the rest of the table and no
      # more. It rebuilds its own lab, so it is independent of every step above.
      - name: Device metadata — userAgent column and grant delta (PG17)
        env:
          OWNER_URL: ${{ env.OWNER_URL }}
        run: npx tsx prisma/migrations/20260913120000_authsession_user_agent/grant-delta.test.ts

  # The three properties the unit model cannot prove, because the browser decides
  # them: the real Web Locks API, the real cookie jar's ordering under HttpOnly
  # Set-Cookie, and a keepalive response landing after navigation. No database,
  # no secrets: a local server on 127.0.0.1 implements the engine's rotation and
  # grace rules.
  refresh-multitab-browser:
    name: persistent login — multi-tab refresh in a real browser (Chromium)
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Multi-tab refresh — Web Locks, lease fallback, lost responses, navigation
        run: node scripts/qa/auth/refresh-multitab.browser.mjs

  # Honest sign-out, in the browser that decides it: a 500 or no network keeps
  # the device signed in and says so; "clear anyway" stores only a session-id
  # marker and finishes later with the HttpOnly cookie as proof (attached by the
  # browser, invisible to scripts); a sign-in in between is never ended by it.
  logout-honest-browser:
    name: honest sign-out — client outcomes and pending revoke (Chromium)
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Honest sign-out — 500, offline, clear anyway, pending revoke, re-sign-in, expired token
        run: node scripts/qa/auth/logout-honest.browser.mjs
      # The regression this exists to prevent: clearing local state although the
      # server did not end the session. The suite must go red, for that reason.
      - name: negative proof — clearing local state on a failed sign-out
        run: |
          F=lib/client-session.ts
          cp "$F" "$F.bak"
          node -e "const fs=require('fs');const f=process.argv[1];const s=fs.readFileSync(f,'utf8');const a='    console.error(\"signOut: server did not revoke the session\", res.status);\n    return \"server_failed\";';const m=s.replace(a,'    clearClientSession();\n    return \"server_failed\";');if (m === s) process.exit(9);fs.writeFileSync(f,m)" "$F" \
            || { mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; }
          if ! node scripts/ci/expect-red.mjs --id "auth-plane-write-ci.yml:logout-honest" --expect 'FAIL  - ...the local session is KEPT' -- node scripts/qa/auth/logout-honest.browser.mjs; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a false sign-out would go unnoticed"; exit 1
          fi
          mv "$F.bak" "$F"; git diff --exit-code; echo "NEGATIVE-PROOF PASS"
