# Business documents (ר1–ר3, owner-approved 2026-11-05): quote follow-up, letters, the
# per-customer documents timeline. Nothing here changes the existing billing mechanism;
# every job also re-runs the billing A0 characterization to prove it.
#
# Synthetic data only; ZERO secrets; ZERO Neon; ZERO network.

name: business documents — ר1–ר3

on:
  pull_request:
    branches: [main]
    paths:
      - "features/business-documents/**"
      - "lib/services/inventory/supplier-purchase-document.service.ts"
      - "app/(shell)/inventory/supplier-purchases/**"
      - "lib/services/business-documents/**"
      - "app/api/business-documents/**"
      - "app/(shell)/business-documents/**"
      - "app/(shell)/customers/**"
      - "components/customers/CustomerCard.tsx"
      - "lib/services/tasks/**"
      - "prisma/migrations/20261114090000_business_documents_records/**"
      - "prisma/migrations/20261121090000_business_documents_po_sheets/**"
      - "scripts/ci/erasure/**"
      - "lib/storage/**"
      - "lib/tenant/**"
      - "features/tasks/**"
      - "lib/i18n/messages/areas/**"
      - ".business-documents/**"
      - "lib/services/account/**"
      - "scripts/ci/test-coverage/business-documents.json"
      - ".github/workflows/business-documents-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The TypeScript check (tsc / next build) needs more than Node's default ~4 GB heap on this codebase: main alone sits at
  # the limit (clean build, Node 22). The runner has 16 GB. Measured 2026-11-14 on CI preview #1160.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  pure:
    name: Business documents (pure) + A0 golden
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Customer documents timeline model
        run: npx tsx features/business-documents/customer-documents-model.test.ts
      - name: Supplier order document unchanged by the builder extraction (purchase-order sheet)
        run: npx tsx lib/services/business-documents/po-sheet/supplier-document-unchanged.test.ts
      - name: Letter contracts, HTML and form model
        run: npx tsx lib/services/business-documents/letter/letter-core.test.ts
      - name: Quote validity (S08) core
        run: npx tsx lib/services/business-documents/quote-followup/quote-validity-core.test.ts
      - name: Daily Tasks — agenda, boundaries, i18n (S08 added as a source)
        run: |
          npx tsx lib/services/tasks/agenda-core.test.ts
          npx tsx lib/services/tasks/tasks-boundary.test.ts
          npx tsx lib/services/tasks/tasks-i18n.test.ts
      - name: Negative proof (a new source kind without its own characterization must be caught)
        run: |
          F="lib/services/tasks/agenda-core.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/"stock", "quote_validity", "quote_followup",\n\];/"stock", "quote_validity", "quote_followup", "fake_kind",\n];/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if ! node scripts/ci/expect-red.mjs --id "business-documents-ci.yml:pure:unregistered-source" --expect "FAIL] source fake_kind is registered with its own characterization" -- npx tsx lib/services/tasks/tasks-i18n.test.ts; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unregistered source kind went unnoticed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"
      - name: Negative proof (a removed legacy source must be caught)
        run: |
          F="lib/services/tasks/agenda-core.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/"documents_queue", "stock", "quote_validity",/"documents_queue", "quote_validity",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if ! node scripts/ci/expect-red.mjs --id "business-documents-ci.yml:pure:removed-legacy-source" --expect "FAIL] legacy source still exists: stock" -- npx tsx lib/services/tasks/tasks-i18n.test.ts; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a removed legacy source went unnoticed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"
      - name: Negative proof (a changed legacy source title must be caught by the legacy hash)
        run: |
          F="lib/i18n/messages/areas/system.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/      stock: "\{n\} פריטים במלאי נמוך",/      stock: "{n} פריטים במלאי נמוך מאוד",/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if ! node scripts/ci/expect-red.mjs --id "business-documents-ci.yml:pure:legacy-title" --expect "FAIL] queue titles + overdue labels (default) = legacy" -- npx tsx lib/services/tasks/tasks-i18n.test.ts; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a changed legacy title went unnoticed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"
      - name: Tenant transactions — existing callers unchanged by the optional isolation level (pure)
        run: npx tsx lib/tenant/tenant-tx-options.test.ts
      - name: Quote share — the owner's record, fingerprints, event input (pure)
        run: npx tsx lib/services/business-documents/quote-share/quote-share-core.test.ts
      - name: Storage — conditional writes, private business-docs domain, prefix listing
        run: npx tsx lib/storage/storage-conditional.test.ts
      - name: Storage — existing adapter behaviour unchanged
        run: npx tsx lib/storage/storage.verify.test.ts
      - name: Back navigation (every page has a parent)
        run: npx tsx lib/navigation/back-nav/back-nav.test.ts
      - name: Lint
        run: npx eslint lib/storage features/business-documents lib/services/business-documents app/api/business-documents "app/(shell)/business-documents" lib/services/tasks features/tasks/task-details.tsx features/tasks/task-icons.tsx "app/(shell)/customers/[id]/documents" components/customers/CustomerCard.tsx .business-documents
      - name: Test inventory
        run: node scripts/ci/security-test-coverage.mjs
      - name: Existing billing unchanged (A0 golden)
        run: npx tsx .billing-a0/golden.test.ts

  database:
    name: Business documents isolation + letter PDF (ephemeral PG17) + A0 issuance
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bd_owner
          POSTGRES_PASSWORD: bd_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_bd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bd_owner -d dubiz_bd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bd_owner:bd_ci_synthetic_owner_pw@localhost:5432/dubiz_bd
      DIRECT_URL: postgresql://bd_owner:bd_ci_synthetic_owner_pw@localhost:5432/dubiz_bd
      AUTH_TOKEN_SECRET: bd_ci_auth_secret_synthetic
      RENDER: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Install the Playwright Chromium (letter PDF)
        run: npx playwright install --with-deps chromium
      - name: Push schema (lab)
        run: npx prisma db push --skip-generate
      - name: Isolation and permissions battery
        run: npx tsx .business-documents/battery.mts
      - name: Existing billing unchanged (A0 issuance battery)
        run: npx tsx .billing-a0/battery.mts

  rls:
    name: Business documents under FORCE RLS (PG17, NOBYPASSRLS runtime)
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bdr_owner
          POSTGRES_PASSWORD: bdr_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_bdr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdr_owner -d dubiz_bdr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://bdr_owner:bdr_ci_synthetic_owner_pw@localhost:5432/dubiz_bdr
      RUNTIME_URL: postgresql://bdr_runtime:bdr_ci_synthetic_runtime_pw@localhost:5432/dubiz_bdr
      AUTH_TOKEN_SECRET: bdr_ci_auth_secret_synthetic
      RENDER: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Install the Playwright Chromium (letter PDF)
        run: npx playwright install --with-deps chromium
      - name: Push schema as the owner
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate
      - name: Create the governed runtime role
        env:
          PGPASSWORD: bdr_ci_synthetic_owner_pw
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q             -c "DROP ROLE IF EXISTS bdr_runtime;"             -c "CREATE ROLE bdr_runtime LOGIN PASSWORD 'bdr_ci_synthetic_runtime_pw' NOSUPERUSER NOBYPASSRLS;"             -c "GRANT USAGE ON SCHEMA public TO bdr_runtime;"             -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO bdr_runtime;"             -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO bdr_runtime;"
      - name: ר1–ר3 routes and S08 under FORCE RLS (policies from the migrations)
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
          AUTH_DATABASE_URL: ${{ env.RUNTIME_URL }}
          RLS_ADMIN_URL: ${{ env.OWNER_URL }}
        run: npx tsx .business-documents/rls.battery.mts

  records:
    name: Business documents records + services — the real migration AS the runtime role (PG17, Production topology)
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bd_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bd_ci_synthetic_super_pw
      LAB_PASSWORD: bd_ci_synthetic_role_pw
      AUTH_TOKEN_SECRET: bd_ci_auth_secret_synthetic

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Install the Playwright Chromium (the existing quote renderer)
        run: npx playwright install --with-deps chromium
      - name: Static guards — tenant RLS, account deletion, erasure contract (new debt recorded explicitly)
        run: |
          set -euo pipefail
          node scripts/ci/tenant-table-rls-guard.mjs
          bash scripts/ci/account-deletion-guard.sh .
          npm run verify:erasure-contract -- --baseline-check
      - name: Atomicity — the migration failing on its last statement leaves nothing behind
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_broken --broken-bd
          OWNER="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_broken"
          left="$(psql -X -At "$OWNER" -c "SELECT (SELECT count(*) FROM pg_class WHERE relname IN ('BusinessDocumentFile','BusinessDocumentRequest','QuoteShareCopy','QuoteShareEvent','BusinessLetter','BusinessDocumentErasure')) + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'business_documents%' OR proname LIKE 'business_letter%') + (SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE key = 'business_documents')")"
          echo "objects left by the failed migration: $left"
          [ "$left" = "0" ]
      - name: Atomicity — the purchase-order-sheet migration failing on its last statement leaves nothing of it
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_broken_po --broken-po
          OWNER="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_broken_po"
          left="$(psql -X -At "$OWNER" -c "SELECT (SELECT count(*) FROM pg_class WHERE relname = 'PurchaseOrderSheet') + (SELECT count(*) FROM pg_proc WHERE proname = 'business_documents_po_sheet_link_guard') + (SELECT count(*) FROM pg_enum WHERE enumlabel = 'PURCHASE_ORDER_SHEET') + (SELECT position('PurchaseOrderSheet' in prosrc) FROM pg_proc WHERE proname = 'business_documents_erase')")"
          kept="$(psql -X -At "$OWNER" -c "SELECT count(*) FROM pg_class WHERE relname = 'QuoteShareCopy'")"
          echo "objects left by the failed purchase-order-sheet migration: $left (records migration kept: $kept)"
          [ "$left" = "0" ] && [ "$kept" = "1" ]
      - name: Purchase-order sheet records battery — privileges, isolation, the draft link (same business, own number), append-only, frozen snapshot, not while erasing, erasure
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_po --with-po
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_po"           DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_po?connection_limit=10"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_po"             npx tsx .business-documents/po-sheet-records.battery.mts | tee /tmp/po-records.out
          grep -qxE '[0-9]+ passed, 0 failed' /tmp/po-records.out
      - name: Purchase-order sheet service battery — saving (number, external, header language, date), retry = one copy, isolation, frozen snapshot, stored-file download, inventory untouched, storage failure
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_po_svc --with-po
          mkdir -p "$RUNNER_TEMP/bd-po"
          STORAGE_PROVIDER=local LOCAL_STORAGE_ROOT="$RUNNER_TEMP/bd-po"           OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_po_svc"           DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_po_svc?connection_limit=10"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_po_svc"             npx tsx .business-documents/po-sheet.battery.mts | tee /tmp/po-svc.out
          grep -qxE '[0-9]+ passed, 0 failed' /tmp/po-svc.out
      - name: Records battery — privileges, isolation, quote link, events, append-only and every bypass, record vs delete (both orders, 200 pairs), letters, purge, erasure
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_records --with-bd
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_records"           DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_records?connection_limit=20"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_records"             npx tsx .business-documents/records.battery.mts
      - name: Service battery — keys, read-only copy, change during render (two timed transactions), the owner's record, the fence (R2 semantics), erasure runner, reminders
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_service --with-bd
          mkdir -p "$RUNNER_TEMP/bd-store"
          STORAGE_PROVIDER=local LOCAL_STORAGE_ROOT="$RUNNER_TEMP/bd-store" BILLING_PDF_STORAGE_ROOT="$RUNNER_TEMP/bd-store/legacy"           OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_service"           DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_service?connection_limit=20"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_service"             npx tsx .business-documents/service.battery.mts
      - name: "Account deletion battery — the real deletion with business documents (durable job in the purge, objects after commit, storage outage + sweep, purge failure, uploads in flight, concurrency, isolation)"
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_account --with-bd
          STORAGE_PROVIDER=local LOCAL_STORAGE_ROOT="$RUNNER_TEMP/bd-account" BILLING_PDF_STORAGE_ROOT="$RUNNER_TEMP/bd-account/legacy"           SUPER_URL="postgresql://lab_super:bd_ci_synthetic_super_pw@localhost:5432/bd_account"           OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_account"           DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_account?connection_limit=20"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_account"           AUTH_DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_account"             npx tsx .business-documents/account-erasure.battery.mts | tee /tmp/account-erasure.out
          grep -qxE '[0-9]+ passed, 0 failed' /tmp/account-erasure.out
      - name: Saved letters battery — save, replay, conflict, isolation, customer deleted (snapshot kept), hide, purge (explicit age), erasure runner
        run: |
          set -euo pipefail
          bash .business-documents/lab.sh bd_letters --with-bd
          mkdir -p "$RUNNER_TEMP/bd-letters"
          STORAGE_PROVIDER=local LOCAL_STORAGE_ROOT="$RUNNER_TEMP/bd-letters"           OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/bd_letters"           DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_letters?connection_limit=20"           DIRECT_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/bd_letters"             npx tsx .business-documents/letters.battery.mts

  r2:
    name: Business documents — the fence against REAL R2 (dedicated test bucket; manual dispatch only)
    if: github.event_name == 'workflow_dispatch'
    # The test bucket's credentials live ONLY in this protected Environment (required reviewer = owner,
    # deployment branches restricted): never repository secrets, never the Production bucket.
    environment: business-docs-r2-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A lab database (synthetic, in the runner) so scenario 7 — account erasure while an upload is streaming — runs
    # against the real bucket too. Nothing here can reach a Production database or the Production bucket.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bd_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bd_ci_synthetic_super_pw
      LAB_PASSWORD: bd_ci_synthetic_role_pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Lab database (the real migration, Production role topology)
        run: bash .business-documents/lab.sh bd_r2 --with-bd
      - name: R2 battery — create-once, upload vs marker (both orders), abandoned upload, retries, listing, erasure during upload
        env:
          R2_TEST_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          OWNER_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/bd_r2
          DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2
          DIRECT_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2
        run: npx tsx .business-documents/r2.battery.mts
      - name: Lab database for the purchase-order sheet (both business-documents migrations, Production role topology)
        run: bash .business-documents/lab.sh bd_r2_po --with-po
      - name: Purchase-order sheet against REAL R2 — save, listed, download = stored, double click, retry, account deletion (records + objects)
        env:
          R2_TEST_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          OWNER_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po
          SUPER_URL: postgresql://lab_super:bd_ci_synthetic_super_pw@localhost:5432/bd_r2_po
          DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po?connection_limit=10
          DIRECT_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po
          AUTH_DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po
        run: |
          set -euo pipefail
          npx tsx .business-documents/po-sheet-r2.battery.mts | tee /tmp/po-r2.out
          grep -qxE '[0-9]+ passed, 0 failed' /tmp/po-r2.out

  r2-prod:
    name: Purchase-order sheet — the app in PRODUCTION MODE (next build + next start) against REAL R2 (dedicated test bucket; manual dispatch only)
    if: github.event_name == 'workflow_dispatch'
    environment: business-docs-r2-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bd_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bd_ci_synthetic_super_pw
      LAB_PASSWORD: bd_ci_synthetic_role_pw
      AUTH_TOKEN_SECRET: po-r2-synthetic-auth-token-secret-0123456789
      TASK_REQUEST_HMAC_KEY: po-r2-synthetic-request-hmac-key-0123456789abcdef
      TASK_REQUEST_HMAC_KEY_ID: lab1
      CRON_SECRET: po_r2_ci_cron_secret_synthetic_at_least_32
      AUTH_PLANE_ENABLED: "true"
      RATE_LIMIT_BACKEND: memory
      DUBIZ_I18N_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OUT: /tmp/po-r2-prod
      E2E_BASE: http://localhost:3740
      OWNER_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod
      SUPER_URL: postgresql://lab_super:bd_ci_synthetic_super_pw@localhost:5432/po_r2_prod
      DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod?connection_limit=20
      DIRECT_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod
      AUTH_DATABASE_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Build FIRST, before any apt install (see appointments-calendar-ci.yml). The build needs no database and no secret.
      - name: Build the app (production)
        run: mkdir -p "$OUT" && { npm run build > "$OUT/build.log" 2>&1 || { tail -n 80 "$OUT/build.log"; exit 1; }; }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Lab database (both business-documents migrations, Production role topology)
        run: bash .business-documents/lab.sh po_r2_prod --with-po
      - name: Start the app (next start — production mode; storage = the test bucket)
        env:
          STORAGE_PROVIDER: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_TEST_BUCKET }}
        run: |
          case "$R2_BUCKET_NAME" in *test*|*Test*|*TEST*) ;; *) echo "refused: not a dedicated test bucket"; exit 1;; esac
          (nohup npx next start -p 3740 > "$OUT/server.log" 2>&1 &)
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3740/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3740/login
      - name: End to end in production mode — save, listed, download = stored, double click, retry, flag off, account deletion (records + objects)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_TEST_BUCKET }}
        run: |
          set -euo pipefail
          npx tsx .business-documents/po-sheet-r2-prod.e2e.mts | tee "$OUT/e2e.out"
          grep -qxE '[0-9]+ passed, 0 failed' "$OUT/e2e.out"
      - name: Server log (on failure)
        if: failure()
        run: grep -vE "auth_sidless_token_accepted" "$OUT/server.log" | tail -n 120 || true
