# D2 / P7-W4D — Documents/OCR/Learning tenant-isolation battery on PG17.
# Real upload/process/approve handlers, approval atomicity+idempotency,
# VendorLearning tenant separation, parent-join proofs, learning-center on
# the admin client (no silent zero), rollback + re-apply.
# Synthetic CI-only creds; ZERO secrets; ZERO Neon; ZERO real OCR/Google.

name: d2/p7 — w4d documents battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-p7-w4d]
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20260827090000_d2_p7_w4d_documents_tenant_rls/**"
      - "scripts/security/d2-p7-w4d-*.sql"
      - ".p7w4d/**"
      - "app/api/documents/**"
      - "app/api/reports/**"
      - "app/api/search/**"
      - "lib/services/documents/**"
      - "lib/services/learning-center/**"
      - "lib/documents/**"
      - "lib/reports/**"
      - "lib/business-status/**"
      - "lib/tenant/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w4d-battery:
    name: W4D battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p7w4d_owner
          POSTGRES_PASSWORD: p7w4d_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_p7w4d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p7w4d_owner -d dubiz_p7w4d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .p7w4d/battery.mjs

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: postgresql://p7w4d_owner:p7w4d_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4d
          DIRECT_URL: postgresql://p7w4d_owner:p7w4d_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4d
        run: npx prisma db push --skip-generate

      - name: Run W4D battery
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: postgresql://p7w4d_owner:p7w4d_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4d
          DIRECT_URL: postgresql://p7w4d_owner:p7w4d_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4d
          RUNTIME_URL: postgresql://wave1_runtime:p7w1_ci_synthetic_pw@localhost:5432/dubiz_p7w4d
          ADMIN_LOGIN_ROLE: app_admin_lab
          W2G_ADMIN_PW: p7w2g_ci_synthetic_admin_pw
          AUTH_TOKEN_SECRET: p7w4d_ci_auth_secret_synthetic
        run: npx tsx .p7w4d/battery.mjs
