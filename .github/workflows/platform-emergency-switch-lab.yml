# Leads L1.5-a · emergency switch / migration 20261113090000_platform_feature_emergency_switch — proof on PostgreSQL
# BEFORE it reaches Production (ephemeral PG17). Migration-first: this PR ships the migration and its proof only (no
# schema.prisma, no runtime code). The admin tool that calls the function comes in the application PR.
#
# .pfe/lab.sh builds the acquisition objects from their REAL migrations with their RLS replayed, the control-plane
# privileges of 20261003090000 exactly as Production has them, a LOGIN member of app_ctlplane, and a ledger of every
# other migration (pending: only this one).
#
#   0. Evidence files are SELECT-only and selectable; the proof pins migration.sql's sha256; the migration is additive.
#   1. Baseline (pending): the preflight passes whole (8/8); the proof refuses (1-7 fail; 8-10 hold already).
#   2. `prisma migrate deploy` (the release-migrate mechanism) applies it: the proof passes whole (10/10); the preflight
#      then fails exactly its "not there yet" checks (1, 3).
#   3. Role battery (.pfe/battery.ts): who may call it, what it does (flag + audit in one transaction), what it refuses
#      (nothing written, nothing audited), the FG lock (waits for a shared holder, gives up after 5 s with nothing done).
#   4. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#   5. Rollback (.pfe/rollback.sql): the preflight is whole again.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: platform emergency switch — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261113090000_platform_feature_emergency_switch/**"
      - "ops/evidence/platform-emergency-switch-*.sql"
      - ".pfe/**"
      - ".github/workflows/platform-emergency-switch-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: platform emergency switch (PG17, real migration via migrate deploy, control-plane privileges as in Production)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: pfe_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: pfe_ci_synthetic_super_pw
      LAB_PASSWORD: pfe_ci_synthetic_role_pw
      ACQUISITION_CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AUTH_TOKEN_SECRET: pfe_ci_secret_synthetic_at_least_32_characters_long
      PREFLIGHT: ops/evidence/platform-emergency-switch-preflight.sql
      PROOF: ops/evidence/platform-emergency-switch-production-evidence.sql
      MIGRATION: prisma/migrations/20261113090000_platform_feature_emergency_switch/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files — SELECT-only, checksum pinned, selectable; the migration is additive
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$PROOF"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          sum=$(sha256sum "$MIGRATION" | cut -d' ' -f1)
          grep -q "'$sum'" "$PROOF" || { echo "the proof does not pin $sum"; exit 1; }
          # Additive only: no DROP / ALTER / CREATE OR REPLACE, and the one CREATE is the switch function.
          body=$(grep -vE '^\s*--' "$MIGRATION")
          if echo "$body" | grep -inE '\b(drop|alter|truncate|delete)\b|or[[:space:]]+replace'; then echo "not additive"; exit 1; fi
          test "$(echo "$body" | grep -cE '^CREATE ')" = "1" || { echo "expected exactly 1 CREATE statement"; exit 1; }
          test "$(echo "$body" | grep -cE '^CREATE FUNCTION public\.platform_set_feature_emergency\($')" = "1" || { echo "the CREATE is not the switch function"; exit 1; }
          echo "evidence clean; checksum pinned $sum; additive (one new function, nothing existing touched)"

      - name: 1. Baseline — pending; the preflight passes whole, the proof refuses
        run: |
          set -euo pipefail
          bash .pfe/lab.sh pfe_base
          q() { psql -X -A -t -F'|' -U lab_super -d "$1" -v ON_ERROR_STOP=1 -f "$2" | grep -E '^[0-9]+\|' ; }
          q pfe_base "$PREFLIGHT" | tee /tmp/pre.out
          ! grep -q '|FAIL|' /tmp/pre.out || { echo "preflight not whole on the baseline"; exit 1; }
          test "$(wc -l < /tmp/pre.out)" -eq 8 || { echo "expected 8 preflight lines"; exit 1; }
          q pfe_base "$PROOF" | tee /tmp/proof0.out
          fails=$(grep '|FAIL|' /tmp/proof0.out | cut -d'|' -f1 | tr '\n' ' ')
          test "$fails" = "1 2 3 4 5 6 7 " || { echo "before the migration the proof should fail exactly 1-7, got: $fails"; exit 1; }
          echo "the proof refuses before the migration (8-10 already hold)"

      - name: 2. Release — migrate deploy applies exactly this one; the proof passes whole
        run: |
          set -euo pipefail
          bash .pfe/lab.sh pfe_proof --with-pfe
          dirs=$(ls -d prisma/migrations/*/ | wc -l)
          fin=$(psql -X -At -U lab_super -d pfe_proof -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")
          test "$fin" = "$dirs" || { echo "ledger: $fin finished, $dirs migrations in the checkout"; exit 1; }
          echo "ledger whole: $fin/$dirs finished"
          q() { psql -X -A -t -F'|' -U lab_super -d "$1" -v ON_ERROR_STOP=1 -f "$2" | grep -E '^[0-9]+\|' ; }
          q pfe_proof "$PROOF" | tee /tmp/proof.out
          ! grep -q '|FAIL|' /tmp/proof.out || { echo "proof not whole after the release"; exit 1; }
          test "$(wc -l < /tmp/proof.out)" -eq 10 || { echo "expected 10 proof lines"; exit 1; }
          q pfe_proof "$PREFLIGHT" | tee /tmp/pre2.out
          fails=$(grep '|FAIL|' /tmp/pre2.out | cut -d'|' -f1 | tr '\n' ' ')
          test "$fails" = "1 3 " || { echo "after the release the preflight should fail exactly 1 3, got: $fails"; exit 1; }
          # Read-only session, as prod-readonly-evidence.yml runs it.
          PGOPTIONS="-c default_transaction_read_only=on" psql -X -A -t -F'|' -U lab_super -d pfe_proof -v ON_ERROR_STOP=1 -f "$PROOF" >/dev/null
          PGOPTIONS="-c default_transaction_read_only=on" psql -X -A -t -F'|' -U lab_super -d pfe_proof -v ON_ERROR_STOP=1 -f "$PREFLIGHT" >/dev/null

      - name: 3. Role battery — who may call it, what it does, what it refuses, the FG lock
        env:
          OWNER_URL: postgresql://lab_super:pfe_ci_synthetic_super_pw@localhost:5432/pfe_proof
          RUNTIME_URL: postgresql://app_runtime:pfe_ci_synthetic_role_pw@localhost:5432/pfe_proof
          CTL_URL: postgresql://pfe_ctl:pfe_ci_synthetic_role_pw@localhost:5432/pfe_proof
          OUTSIDER_URL: postgresql://lrp_outsider:pfe_ci_synthetic_role_pw@localhost:5432/pfe_proof
        run: npx tsx .pfe/battery.ts

      - name: 4. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .pfe/lab.sh pfe_broken --broken-pfe
          left=$(psql -X -At -U lab_super -d pfe_broken -v ON_ERROR_STOP=1 -c "SELECT
              (SELECT count(*) FROM pg_proc WHERE proname = 'platform_set_feature_emergency')
            + (SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261113090000_platform_feature_emergency_switch' AND finished_at IS NOT NULL)")
          echo "objects left=$left"
          test "$left" = "0" || { echo "NOT atomic"; exit 1; }

      - name: 5. Rollback — the function goes; the preflight is whole again
        run: |
          set -euo pipefail
          psql -X -q -U lab_super -d pfe_proof -v ON_ERROR_STOP=1 -f .pfe/rollback.sql
          fails=$(psql -X -A -t -F'|' -U lab_super -d pfe_proof -v ON_ERROR_STOP=1 -f "$PREFLIGHT" | grep -E '^[0-9]+\|FAIL' | cut -d'|' -f1 | tr '\n' ' ' || true)
          test -z "$fails" || { echo "after rollback the preflight should be whole, got: $fails"; exit 1; }
          echo "rollback whole: function dropped, ledger row removed"
