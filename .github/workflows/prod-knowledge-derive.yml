# M2/M3 — run the knowledge derivation for ONE tenant, in Production.
#
# This is a WRITE to production, and it is gated exactly like a migration: manual dispatch only, the
# `production-db` environment for human approval, and one explicit tenant per run. There is no cadence
# and no "all businesses" mode on purpose — a scheduled derivation is an M4 decision, and this exists to
# prove the pipeline works before anything is automated.
#
# It connects with DATABASE_URL, the RUNTIME credential (`app_runtime_prod`, NOBYPASSRLS), and the
# script MEASURES that posture before writing. Running as the owner role would prove the SQL is valid
# and nothing else; running as the restricted role proves the tenant context reaches the database.
name: prod-knowledge-derive

on:
  workflow_dispatch:
    inputs:
      business_id:
        description: "The ONE business to derive knowledge for"
        required: true
      reason:
        description: "Audit note: why this run is happening"
        required: false

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-latest
    environment: production-db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate the tenant input before any secret is touched
        run: |
          set -euo pipefail
          case "${BID}" in
            ''|*[!0-9]*) echo "::error::business_id must be a positive integer"; exit 1;;
          esac
          [ "${BID}" -gt 0 ] || { echo "::error::business_id must be > 0"; exit 1; }
          echo "deriving for business ${BID}"
        env:
          BID: ${{ inputs.business_id }}

      - run: npm ci
      - run: npx prisma generate

      - name: Derive (runtime role, single tenant)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KNOWLEDGE_BUSINESS_ID: ${{ inputs.business_id }}
        run: npx tsx ops/knowledge/derive-for-tenant.mts
