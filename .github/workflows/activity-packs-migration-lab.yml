# Activity packs / migration 20261216090000_activity_packs — proof on PostgreSQL 17 BEFORE it reaches Production.
# Migration-only PR: the table BusinessActivityProfile (one row per business, FORCE RLS, runtime SELECT/INSERT/UPDATE
# only) and the feature activity_packs (OFF). The Prisma model and the code that reads it come in a separate PR, after
# the owner approves applying this migration.
#
#   1. Current schema (prisma db push of this branch = main's schema) + the app_runtime role, as in Production.
#   2. The read-only preflight passes (nothing of the migration exists yet).
#   3. The migration applies in ONE transaction; applying it again is refused and changes nothing.
#   4. The lab: feature OFF, FORCE RLS, exact grants, tenant isolation as app_runtime, integrity checks, cascade.
#   5. The read-only evidence passes after the migration.
#   6. Rollback restores the previous state; the migration then applies again and the lab passes again.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network beyond the image and npm.

name: activity packs — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261216090000_activity_packs/**"
      - "prisma/migrations/20261221200000_activity_packs_open_all/**"
      - ".activity-packs/**"
      - "ops/evidence/activity-packs-*.sql"
      - ".github/workflows/activity-packs-migration-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: activity packs migration (PG17, one transaction, tenant isolation, rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_owner
          POSTGRES_PASSWORD: ap_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_ap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_owner -d dubiz_ap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: lab_owner
      PGDATABASE: dubiz_ap
      PGPASSWORD: ap_ci_synthetic_owner_pw
      OWNER_URL: postgresql://lab_owner:ap_ci_synthetic_owner_pw@localhost:5432/dubiz_ap
      MIGRATION: prisma/migrations/20261216090000_activity_packs/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 1. current schema, Production's runtime role, and a migration ledger like Production's
        run: |
          DATABASE_URL="$OWNER_URL" DIRECT_URL="$OWNER_URL" npx prisma db push --skip-generate
          # A branch stacked on this one carries the Prisma model, so db push builds a copy of the table: drop it, so the
          # migration (the real thing) is what creates it — exactly as in Production, where the table does not exist.
          psql -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS "BusinessActivityProfile";'
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS;" -c "GRANT USAGE ON SCHEMA public TO app_runtime;"
          # The ledger as Production has it: every migration on main recorded and finished, this one not recorded.
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE "_prisma_migrations" (id varchar(36) PRIMARY KEY, checksum varchar(64) NOT NULL, finished_at timestamptz, migration_name varchar(255) NOT NULL, logs text, rolled_back_at timestamptz, started_at timestamptz NOT NULL DEFAULT now(), applied_steps_count integer NOT NULL DEFAULT 0);'
          for d in prisma/migrations/*/; do
            n=$(basename "$d"); case "$n" in 20261216090000_activity_packs|20261221200000_activity_packs_open_all) continue;; esac
            echo "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES (md5('$n')::varchar(36), md5('$n'), now(), '$n', 1);"
          done | psql -v ON_ERROR_STOP=1 -q
          psql -tAc 'SELECT count(*) FROM "_prisma_migrations"'

      - name: 2. preflight (read-only) passes before the migration — the gate's verdict (no FAIL cell, at least one PASS)
        run: |
          psql -v ON_ERROR_STOP=1 -tA -f ops/evidence/activity-packs-preflight.sql | tee pre.out
          if grep -qE "\|FAIL\|" pre.out; then echo "FAIL row in pre.out"; exit 1; fi
          grep -qE "\|PASS\|" pre.out

      - name: 3. migration in one transaction; a second run is refused and changes nothing
        run: |
          psql -1 -v ON_ERROR_STOP=1 -f "$MIGRATION"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('activity-packs-lab', md5('x'), now(), '20261216090000_activity_packs', 1);"
          if psql -1 -v ON_ERROR_STOP=1 -f "$MIGRATION" 2> second.err; then echo "second run was accepted"; exit 1; fi
          grep -q "ACTIVITY_PACKS: BusinessActivityProfile already exists" second.err
          test "$(psql -tAc "SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE key = 'activity_packs'")" = "1"

      - name: 4. lab — feature OFF, FORCE RLS, grants, isolation, integrity, cascade
        run: psql -v ON_ERROR_STOP=1 -tA -f .activity-packs/migration-lab.sql | tee lab.out && grep -q "^MIGRATION_LAB_OK$" lab.out

      - name: 5. evidence (read-only) passes after the migration — no FAIL cell, at least one PASS
        run: |
          psql -v ON_ERROR_STOP=1 -tA -f ops/evidence/activity-packs-production-evidence.sql | tee ev.out
          if grep -qE "\|FAIL\|" ev.out; then echo "FAIL row in ev.out"; exit 1; fi
          grep -qE "\|PASS\|" ev.out

      - name: 6. the preflight FAILS once the migration is there (it can tell the states apart)
        run: |
          psql -v ON_ERROR_STOP=1 -tA -f ops/evidence/activity-packs-preflight.sql | tee pre2.out
          grep -qE "\|FAIL\|" pre2.out

      - name: 7. rollback restores the previous state; preflight passes again; apply again; lab and evidence again
        run: |
          psql -1 -v ON_ERROR_STOP=1 -tA -f .activity-packs/rollback.sql | grep -q "^ROLLBACK_OK$"
          psql -v ON_ERROR_STOP=1 -c "DELETE FROM \"_prisma_migrations\" WHERE migration_name = '20261216090000_activity_packs';"
          psql -v ON_ERROR_STOP=1 -tA -f ops/evidence/activity-packs-preflight.sql | tee pre3.out
          if grep -qE "\|FAIL\|" pre3.out; then echo "FAIL row in pre3.out"; exit 1; fi
          psql -c "DELETE FROM \"Business\" WHERE id IN (910001, 910002);"
          psql -1 -v ON_ERROR_STOP=1 -f "$MIGRATION"
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('activity-packs-lab', md5('x'), now(), '20261216090000_activity_packs', 1);"
          psql -v ON_ERROR_STOP=1 -tA -f .activity-packs/migration-lab.sql | grep -q "^MIGRATION_LAB_OK$"
          psql -v ON_ERROR_STOP=1 -tA -f ops/evidence/activity-packs-production-evidence.sql | tee ev2.out
          if grep -qE "\|FAIL\|" ev2.out; then echo "FAIL row in ev2.out"; exit 1; fi
          grep -qE "\|PASS\|" ev2.out

      - name: 8. pilot evidence (business 9) — S1 baseline, S2 after the switch-on, a non-pilot row is caught, S3 after a switch-off
        run: |
          set -euo pipefail
          ev() { psql -v ON_ERROR_STOP=1 -tA -f ops/evidence/activity-packs-pilot-business-9.sql | grep -E '^[0-9]+\|' > "$1"; cat "$1"; }
          # expect FILE "n=value ..." — value is the flag (t/f) or the count of row n
          expect() {
            f="$1"; shift
            for kv in "$@"; do
              n="${kv%%=*}"; want="${kv#*=}"
              got=$(awk -F'|' -v n="$n" '$1==n{print $2 $3}' "$f")
              if [ "$got" != "$want" ]; then echo "::error::$f row $n: expected $want, got '$got'"; exit 1; fi
            done
            echo "$f: $# rows as expected"
          }
          # Production has no saved choice anywhere: remove the lab businesses of steps 4 / 7 (their rows cascade).
          psql -v ON_ERROR_STOP=1 -q -c 'DELETE FROM "Business" WHERE id IN (910001, 910002);'
          test "$(psql -tAc 'SELECT count(*) FROM "BusinessActivityProfile"')" = "0"
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "Business" ("id", "name", "createdAt", "updatedAt") VALUES (9, 'lab nine', now(), now()), (910003, 'lab other', now(), now());
          INSERT INTO "User" (email, "businessId", role, "updatedAt") VALUES ('pilot-admin@lab.invalid', 9, 'PLATFORM_ADMIN', now());
          INSERT INTO "PlatformFeatureDefinition" ("key", "displayName", "category", "description", "defaultEnabled", "mutable", "createdAt")
            VALUES ('lab_other', 'lab other', 'service', 'lab', false, true, now());
          INSERT INTO "BusinessFeatureAccess" ("businessId", "featureKey", state, reason, "updatedAt") VALUES (9, 'lab_other', 'ENABLED', 'lab', now());
          SQL
          ev s1.out
          expect s1.out 1=t 2=f 3=f 4=t 5=0 6=0 7=t 8=t 9=0 10=f 11=f 12=f 13=0 14=0 15=0 17=1 18=0 19=1
          FP=$(awk -F'|' '$1==16{print $3}' s1.out); test -n "$FP"

          # S2 — what the platform admin's ENABLED writes: the override row and one audit row with the owner's reason.
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          INSERT INTO "BusinessFeatureAccess" ("businessId", "featureKey", state, reason, "updatedAt") VALUES (9, 'activity_packs', 'ENABLED', 'פיילוט מבוקר של חבילות הפעילות', now());
          INSERT INTO "PlatformAuditEvent" ("actorUserId", action, "targetType", "targetId", metadata)
            SELECT u.id, 'PLATFORM_FEATURE_ACCESS_UPDATED', 'Business', '9',
                   jsonb_build_object('featureKey', 'activity_packs', 'newState', 'ENABLED', 'effectiveAllowedAfter', true, 'reason', 'פיילוט מבוקר של חבילות הפעילות')
            FROM "User" u WHERE u.email = 'pilot-admin@lab.invalid';
          SQL
          ev s2.out
          expect s2.out 1=t 2=t 3=f 4=f 5=0 6=0 7=t 8=t 9=1 10=t 11=t 12=t 13=0 14=0 15=0 16="$FP" 17=1 18=0 19=1

          # The owner's choice on the phone (business 9 only) → 14 = 1, 15 still 0.
          psql -v ON_ERROR_STOP=1 -q -c "INSERT INTO \"BusinessActivityProfile\" (\"businessId\", \"primaryPack\", \"additionalPacks\", \"updatedAt\") VALUES (9, 'SERVICE', ARRAY['INVENTORY'], now());"
          ev s2b.out
          expect s2b.out 14=1 15=0 16="$FP"

          # A row for any other business is caught (5 / 6 / 15), then removed.
          psql -v ON_ERROR_STOP=1 -q -c "INSERT INTO \"BusinessFeatureAccess\" (\"businessId\", \"featureKey\", state, reason, \"updatedAt\") VALUES (910003, 'activity_packs', 'ENABLED', 'lab', now());" \
                                    -c "INSERT INTO \"BusinessActivityProfile\" (\"businessId\", \"primaryPack\", \"updatedAt\") VALUES (910003, 'LEADS', now());"
          ev bad.out
          expect bad.out 5=1 6=1 15=1
          psql -v ON_ERROR_STOP=1 -q -c "DELETE FROM \"BusinessFeatureAccess\" WHERE \"businessId\" = 910003;" -c "DELETE FROM \"BusinessActivityProfile\" WHERE \"businessId\" = 910003;"

          # A wrong reason text does not count as the owner's switch-on (10 = f).
          psql -v ON_ERROR_STOP=1 -q -c "UPDATE \"PlatformAuditEvent\" SET metadata = jsonb_set(metadata::jsonb, '{reason}', '\"other\"') WHERE \"targetId\" = '9';"
          ev wrong.out
          expect wrong.out 10=f
          psql -v ON_ERROR_STOP=1 -q -c "UPDATE \"PlatformAuditEvent\" SET metadata = jsonb_set(metadata::jsonb, '{reason}', to_jsonb('פיילוט מבוקר של חבילות הפעילות'::text)) WHERE \"targetId\" = '9';"

          # S3 — the kill switch: DISABLED (+ its audit row). The choice is kept (14 = 1); nothing else moves.
          psql -v ON_ERROR_STOP=1 -q <<'SQL'
          UPDATE "BusinessFeatureAccess" SET state = 'DISABLED', "updatedAt" = now() WHERE "businessId" = 9 AND "featureKey" = 'activity_packs';
          INSERT INTO "PlatformAuditEvent" ("actorUserId", action, "targetType", "targetId", metadata, "createdAt")
            SELECT u.id, 'PLATFORM_FEATURE_ACCESS_UPDATED', 'Business', '9',
                   jsonb_build_object('featureKey', 'activity_packs', 'newState', 'DISABLED', 'effectiveAllowedAfter', false, 'reason', 'כיבוי פיילוט'),
                   now() + interval '1 second'
            FROM "User" u WHERE u.email = 'pilot-admin@lab.invalid';
          SQL
          ev s3.out
          expect s3.out 1=t 2=f 3=t 4=f 5=0 6=0 7=t 8=t 9=2 10=f 13=0 14=1 15=0 16="$FP" 17=1 18=0 19=1

      - name: 9. open for every business (20261221200000) — preflight, apply, evidence, emergency switch, the failure path, rollback
        run: |
          set -euo pipefail
          run() { psql -v ON_ERROR_STOP=1 -tA -f "$1" | grep -E '^[0-9]+\|' > "$2"; cat "$2"; }
          v() { awk -F'|' -v n="$2" '$1==n{print $2 $3}' "$1"; }
          expect() {
            f="$1"; shift
            for kv in "$@"; do
              n="${kv%%=*}"; want="${kv#*=}"; got=$(v "$f" "$n")
              if [ "$got" != "$want" ]; then echo "::error::$f row $n: expected $want, got '$got'"; exit 1; fi
            done
            echo "$f: $# rows as expected"
          }
          OPEN=prisma/migrations/20261221200000_activity_packs_open_all/migration.sql
          # Production's state after the pilot: business 9 ENABLED with its saved choice (step 8 ended on DISABLED).
          psql -v ON_ERROR_STOP=1 -q -c "UPDATE \"BusinessFeatureAccess\" SET state = 'ENABLED' WHERE \"businessId\" = 9 AND \"featureKey\" = 'activity_packs';"

          run ops/evidence/activity-packs-open-all-preflight.sql pre.out
          test "$(wc -l < pre.out)" = "15"
          expect pre.out 1=t 2=t 3=1 4=1 5=0 7=1 8=0 9=1 14=t

          # A missing policy row fails the whole migration and changes nothing.
          if psql -v ON_ERROR_STOP=1 -q 2> miss.err <<SQL
          BEGIN;
          DELETE FROM "PlatformFeaturePolicy" WHERE "featureKey" = 'activity_packs';
          \i $OPEN
          COMMIT;
          SQL
          then echo "::error::migration accepted a missing policy row"; exit 1; fi
          grep -q "activity_packs policy: expected 1 row, found 0" miss.err
          run ops/evidence/activity-packs-open-all-preflight.sql pre-miss.out
          cmp pre.out pre-miss.out

          # Apply as release-migrate does: one transaction, then the ledger row.
          psql -1 -v ON_ERROR_STOP=1 -f "$OPEN"
          psql -v ON_ERROR_STOP=1 -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('ap-open-all-lab', md5('y'), now(), '20261221200000_activity_packs_open_all', 1);"
          run ops/evidence/activity-packs-open-all-production-evidence.sql post.out
          test "$(wc -l < post.out)" = "13"
          expect post.out 1=t 2=t 3=1 4="$(v pre.out 7)" 5="$(v pre.out 8)" 6="$(v pre.out 9)" 7="$(v pre.out 12)" 8="$(v pre.out 13)" 9=t 10="$(v pre.out 15)" 13=0
          # No choice was written for anyone: the only row is still business 9's.
          test "$(psql -tAc 'SELECT count(*) FROM "BusinessActivityProfile" WHERE "businessId" <> 9')" = "0"

          # The emergency switch still closes it for everyone, and lifting it restores the same state.
          psql -v ON_ERROR_STOP=1 -q -c "UPDATE \"PlatformFeaturePolicy\" SET \"emergencyDisabled\" = true WHERE \"featureKey\" = 'activity_packs';"
          run ops/evidence/activity-packs-open-all-production-evidence.sql emerg.out
          expect emerg.out 2=f
          psql -v ON_ERROR_STOP=1 -q -c "UPDATE \"PlatformFeaturePolicy\" SET \"emergencyDisabled\" = false WHERE \"featureKey\" = 'activity_packs';"

          # Rollback: the exact reverse; the preflight passes again with business 9's choice kept.
          psql -1 -v ON_ERROR_STOP=1 -tA -f .activity-packs/close-all.sql | grep -q "^CLOSE_ALL_OK$"
          psql -v ON_ERROR_STOP=1 -q -c "DELETE FROM \"_prisma_migrations\" WHERE migration_name = '20261221200000_activity_packs_open_all';"
          run ops/evidence/activity-packs-open-all-preflight.sql back.out
          expect back.out 1=t 2=t 5=0 7=1 8=0 9=1 12="$(v pre.out 12)" 13="$(v pre.out 13)" 15="$(v pre.out 15)"
          echo "open-all: preflight, failure path, apply, evidence, emergency switch and rollback as expected"
