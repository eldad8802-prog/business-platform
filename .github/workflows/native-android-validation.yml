name: native-android-validation

# DIAGNOSTIC BRANCH ONLY (diag/android-app-login) — issue 3: the Android app opens on sign-in.
# Builds the app twice on the runner — BEFORE = origin/main, AFTER = this branch — with the apex
# rewrite (/ → /home) applied to localhost exactly as promaxgroup.co.il has it, serves each on
# localhost:3000 to a debug APK pointed at it (cleartext in this throwaway build only), and drives
# the real Capacitor WebView through the sign-in scenarios with mocked APIs. Desktop Chromium and
# iPhone WebKit check the public site is unchanged. No secret, no database, no Production contact.
# The dispatch inputs are kept only so the main-branch dispatch form accepts it.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'ignored on the diagnostic branch'
        required: true
        default: 'https://promaxgroup.co.il'
        type: string
      api_level:
        description: 'ignored on the diagnostic branch (matrix below)'
        required: true
        default: '36'
        type: choice
        options: ['36', '35', '34']

permissions:
  contents: read

jobs:
  html-bytes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: |
          npm ci
          npx prisma generate
      - name: Build AFTER and BEFORE (merge-base), i18n flag ON as in the i18n proof
        env:
          DUBIZ_I18N_ENABLED: 'true'
        run: |
          npx next build > build-after.log 2>&1 || { tail -40 build-after.log; exit 1; }
          mv .next .next-after
          BASE=$(git merge-base origin/main HEAD)
          CHANGED=$(git diff --name-only --diff-filter=M "$BASE" HEAD -- app components lib)
          echo "reverted for BEFORE: $CHANGED"
          git checkout "$BASE" -- $CHANGED
          npx next build > build-before.log 2>&1 || { tail -40 build-before.log; exit 1; }
          mv .next .next-before
          git checkout HEAD -- $CHANGED
      - name: Fetch English HTML (same headers as the i18n proof) and diff
        env:
          DUBIZ_I18N_ENABLED: 'true'
        run: |
          mkdir -p html
          for MODE in before after; do
            rm -rf .next && cp -r ".next-$MODE" .next
            (npx next start -p 3000 > "server-$MODE.log" 2>&1 &)
            sleep 3; grep -q EADDRINUSE "server-$MODE.log" && { echo "!! $MODE server did not start"; exit 1; }
            for i in $(seq 1 60); do curl -s -m 5 -o /dev/null http://localhost:3000/login && break; sleep 2; done
            for r in home about privacy login app; do
              curl -s -H 'accept-language: he-IL' -H 'accept-encoding: identity' -H 'cookie: dz_locale=en' "http://localhost:3000/$r" -o "html/$MODE-$r.html"
            done
            pkill -9 -f "next-server" 2>/dev/null; pkill -9 -f "next start" 2>/dev/null
            for i in $(seq 1 30); do curl -s -m 2 -o /dev/null http://localhost:3000/login || break; sleep 1; done
          done
          ls -l html
          echo "entry script in after-login: $(grep -c data-shell html/after-login.html) / before-login: $(grep -c data-shell html/before-login.html)"
          node scripts/native/html-bytes-diff.mjs html | tee html/diff.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: html-bytes
          path: html/**
          retention-days: 14
