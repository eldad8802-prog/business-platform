name: native-android-validation

# DIAGNOSTIC BRANCH ONLY (diag/android-statusbar) — issue 2 follow-up: Android <= 14 status bar.
# Builds the app twice on the runner — BEFORE = origin/main exactly, AFTER = this branch
# (StatusBar overlay off) — serves each on localhost:3000 to a debug APK whose server.url
# is that address (adb reverse, cleartext in this throwaway build only), and measures the
# real Capacitor WebView in screen pixels. No secret, no database, no Production contact.
# The dispatch inputs are kept only so the main-branch dispatch form accepts it.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'ignored on the diagnostic branch'
        required: true
        default: 'https://promaxgroup.co.il'
        type: string
      api_level:
        description: 'ignored on the diagnostic branch (matrix below)'
        required: true
        default: '36'
        type: choice
        options: ['36', '35', '34']

permissions:
  contents: read

jobs:
  safe-area-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: '34', profile: 'pixel_6' }
          - { api: '35', profile: 'pixel_6' }
          - { api: '36', profile: 'pixel_7_pro' }
          - { api: '37.0', profile: 'pixel_6' }

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: |
          npm ci
          npx prisma generate

      - name: Build AFTER (this branch) and BEFORE (origin/main native-shell.ts)
        run: |
          npx next build > build-after.log 2>&1 || { tail -40 build-after.log; exit 1; }
          mv .next .next-after
          git show origin/main:lib/native/native-shell.ts > lib/native/native-shell.ts
          git diff --stat origin/main -- lib app components | tail -3
          npx next build > build-before.log 2>&1 || { tail -40 build-before.log; exit 1; }
          mv .next .next-before
          git checkout -- lib/native/native-shell.ts

      - name: Debug APK pointing at the runner (throwaway — cleartext localhost only)
        env:
          CAP_SERVER_URL: http://localhost:3000
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug

      - name: Measure before / after on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/native/android-statusbar-run.sh

      - name: Upload sweep evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: statusbar-api${{ matrix.api }}-${{ matrix.profile }}
          path: |
            native-evidence/**
          if-no-files-found: warn
          retention-days: 30
