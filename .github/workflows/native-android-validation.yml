name: native-android-validation

# DIAGNOSTIC BRANCH ONLY (diag/android-file-chooser) — documents fix 1, issue B.
# This copy replaces the W7 battery on this branch: it builds the APK with the
# bundled file-chooser probe page as its start page (CAP_SERVER_URL unset —
# nothing remote, no Production/Preview contact) and runs
# scripts/native/android-file-chooser-probe.sh. Never merged.
# The dispatch inputs are kept only so the main-branch dispatch form accepts it.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'ignored on the diagnostic branch'
        required: true
        default: 'https://promaxgroup.co.il'
        type: string
      api_level:
        description: 'ignored on the diagnostic branch (matrix below)'
        required: true
        default: '36'
        type: choice
        options: ['36', '35', '34']

permissions:
  contents: read

jobs:
  file-chooser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: ['34', '36']
        target: ['google_apis', 'google_apis_playstore']

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install dependencies
        run: npm ci

      - name: Bundle the probe page and sync (no server.url)
        run: |
          cp scripts/native/file-chooser-probe.html capacitor/www/index.html
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Run the file-chooser probe on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/native/android-file-chooser-probe.sh

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-chooser-probe-api${{ matrix.api }}-${{ matrix.target }}
          path: |
            native-evidence/**
          if-no-files-found: warn
          retention-days: 30
