name: native-android-validation

# DIAGNOSTIC BRANCH ONLY (diag/android-google-native) — transport proof for Google sign-in inside the
# Android app, before any implementation: WebView start (httpOnly cookie) → Custom Tab → existing
# callback path → back to the app by Android intent → completion with the WebView's own cookie.
# A dependency-free stand-in server (scripts/native/google-native-proof-server.mjs) plays both Dubiz
# and "Google" on localhost:3000; the debug APK points at it (cleartext + one http intent filter in this
# throwaway build only). No real Google, no Dubiz server code, no secret, no Production contact.
# The dispatch inputs are kept only so the main-branch dispatch form accepts it.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'ignored on the diagnostic branch'
        required: true
        default: 'https://promaxgroup.co.il'
        type: string
      api_level:
        description: 'ignored on the diagnostic branch (matrix below)'
        required: true
        default: '36'
        type: choice
        options: ['36', '35', '34']

permissions:
  contents: read

jobs:
  google-native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: '34', profile: 'pixel_6' }
          - { api: '37.0', profile: 'pixel_6' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'
      - run: npm ci
      - name: Debug APK → localhost:3000, + http intent filter for /native/google/return (throwaway)
        env:
          CAP_SERVER_URL: http://localhost:3000
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$M"
          # The production build would use an https App Link (autoVerify + assetlinks.json); a debug build on
          # localhost can only use a plain deep link, which is exactly the "App Link did not fire" fallback path.
          sed -i '0,/<\/intent-filter>/s|</intent-filter>|</intent-filter>\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="http" android:host="localhost" android:port="3000" android:path="/native/google/return" />\n            </intent-filter>|' "$M"
          grep -n "native/google/return" "$M"
          npx cap sync android
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Prove the round trip on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/native/google-native-proof-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: google-native-proof-api${{ matrix.api }}
          path: native-evidence/**
          retention-days: 14
