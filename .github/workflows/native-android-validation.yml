name: native-android-validation

# DIAGNOSTIC BRANCH ONLY (diag/android-error-page) — issue 4: the bundled load-error page on real
# emulators against 404, 500, server down, no internet, connection coming back and a cold start without
# history. The debug APK points at a stand-in site on localhost:3000 (cleartext, http local scheme so the
# page's server probe is same-scheme as in Production; throwaway build only). No secret, no Production.
# The dispatch inputs are kept only so the main-branch dispatch form accepts it.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'ignored on the diagnostic branch'
        required: true
        default: 'https://promaxgroup.co.il'
        type: string
      api_level:
        description: 'ignored on the diagnostic branch (matrix below)'
        required: true
        default: '36'
        type: choice
        options: ['36', '35', '34']

permissions:
  contents: read

jobs:
  error-page:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: '34', profile: 'pixel_6' }
          - { api: '35', profile: 'pixel_6' }
          - { api: '36', profile: 'pixel_7_pro' }
          - { api: '37.0', profile: 'pixel_6' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platform-tools'
      - run: npm ci
      - name: Debug APK → localhost:3000 (throwaway)
        env:
          CAP_SERVER_URL: http://localhost:3000
        run: |
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|androidScheme: "https"|androidScheme: "http"|' capacitor.config.ts
          grep -n "androidScheme" capacitor.config.ts
          npx cap sync android
          grep -c "DubizErrorPage" android/app/src/main/assets/public/index.html
          cd android && ./gradlew --no-daemon assembleDebug
      - name: Error-page scenarios on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/native/error-page-run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: error-page-api${{ matrix.api }}
          path: native-evidence/**
          retention-days: 14
