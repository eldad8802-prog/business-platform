# SEC-E — durable, resumable, authority-revoking account erasure (ephemeral PG17).
#
# Every DB proof runs in a laboratory of its OWN (.ad2a/fresh-lab.mjs): a new database,
# a new NOSUPERUSER/NOBYPASSRLS runtime role and a new auth-plane role, the Production
# RLS contract applied verbatim and the runtime grants MEASURED equal to the declared
# set. The schema comes from `prisma db push`, exactly as AD-2A does: this repository's
# migration history is not replayable from empty (see d2-cutover-3a1-ci.yml), so
# `migrate deploy` cannot build a lab.
#
# Negative proofs are recorded in six fields by .sec-e/prove.sh (mutation applied and
# proven, specific label, crash != red, byte-identical restore); the final unmutated run
# is the post-restore green.
#
# Synthetic CI-only credentials; ZERO secrets, ZERO Neon, ZERO network, ZERO Production.

name: sec-e — durable account erasure (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "app/api/account/**"
      - "app/api/auth/**"
      - "prisma/schema.prisma"
      - ".ad2a/**"
      - ".sec-e/**"
      - "scripts/ci/erasure/**"
      - "vercel.json"
      - ".github/workflows/sec-e-erasure-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-e-erasure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sec-e:
    name: SEC-E erasure proofs (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sece_owner
          POSTGRES_PASSWORD: sece_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_sece
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sece_owner -d dubiz_sece"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AD2A_ADMIN_URL: postgresql://sece_owner:sece_ci_synthetic_owner_pw@localhost:5432/postgres
      DATABASE_URL: postgresql://sece_owner:sece_ci_synthetic_owner_pw@localhost:5432/dubiz_sece
      DIRECT_URL: postgresql://sece_owner:sece_ci_synthetic_owner_pw@localhost:5432/dubiz_sece
      AUTH_TOKEN_SECRET: sece_ci_auth_secret_synthetic_value

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: |
          for f in battery mutate auth-plane; do node --check .sec-e/$f.mjs; done
          bash -n .sec-e/prove.sh

      # ── DB-free ──────────────────────────────────────────────────────────────
      - name: Unit — orchestrator, durable job, erasure authority
        run: |
          npx tsx lib/services/account/account-deletion.test.ts
          npx tsx lib/services/account/erasure-job.test.ts
          npx tsx lib/tenant/erasure-authority.guard.test.ts
          npx tsx lib/tenant/context.test.ts
          npx tsx lib/tenant/job.test.ts

      - name: Existing guard families (no regression)
        run: |
          bash scripts/ci/account-deletion-guard.sh .
          bash scripts/ci/account-deletion-guard.sh --self-test
          bash scripts/ci/admin-boundary-guard.sh .
          bash scripts/ci/tenant-context-guard.sh .

      - name: Erasure contract — ratchet (C27 external eraser, C28 prefix surfaces, C29 shapes)
        run: npx tsx lib/services/account/erasure-contract.verify.test.ts --baseline-check

      # ── Contract negative proofs (no DB) ─────────────────────────────────────
      - name: "NEG · F-6: a personal column on indebted Appointment is a NEW shaped C12 key"
        run: bash .sec-e/prove.sh DEBT_APPOINTMENT red 'NEW .*\[key C12-UNMANAGED-PERSONAL-DATA::Appointment@[0-9a-f]{12}\]' "column-set change on an indebted model is new debt, not absorbed" -- npx tsx lib/services/account/erasure-contract.verify.test.ts --baseline-check
      - name: "NEG · F-6: nationalId on Supplier fails the ratchet with the specific key"
        run: |
          # Supplier is C12 debt on this base; if the supplier erasure (PR #503) lands first,
          # Supplier is a covered model and the same column is C6-NO-DISPOSITION instead.
          if grep -q 'key: "Supplier"' scripts/ci/erasure/erasure-contract-debt.ts; then
            EXP='NEW .*\[key C12-UNMANAGED-PERSONAL-DATA::Supplier@[0-9a-f]{12}\]'
          else
            EXP='NEW .*\[key C6-NO-DISPOSITION::Supplier.nationalId\]'
          fi
          bash .sec-e/prove.sh DEBT_SUPPLIER red "$EXP" "nationalId on Supplier cannot hide behind model-level debt" -- npx tsx lib/services/account/erasure-contract.verify.test.ts --baseline-check
      - name: "NEG · L-18: the WhatsApp number tombstone removed"
        run: bash .sec-e/prove.sh IDENT_OFF red 'NEW .*\[key C3-DECLARED-NOT-IMPLEMENTED::WhatsAppConnection.phoneNumberId\]' "the number would stay locked to the deleted business" -- npx tsx lib/services/account/erasure-contract.verify.test.ts --baseline-check
      - name: "NEG · C27: the auth-plane session erasure no longer called"
        run: bash .sec-e/prove.sh SESSIONS_OFF red 'NEW .*\[key C27-EXTERNAL-ERASER-BROKEN::AuthSession\]' "AuthSession claims ERASURE_MANAGED with nothing erasing it" -- npx tsx lib/services/account/erasure-contract.verify.test.ts --baseline-check
      - name: "NEG · C28: the content-prefix erasure removed (static)"
        run: bash .sec-e/prove.sh CONTENT_OFF red 'NEW .*\[key C28-PREFIX-ERASURE-NOT-IMPLEMENTED::prefix:content\]' "pointer-less content uploads would survive" -- npx tsx lib/services/account/erasure-contract.verify.test.ts --baseline-check

      # ── Fresh-lab batteries ─────────────────────────────────────────────────
      - name: AD-2A battery (regression, now with the auth plane)
        run: node .ad2a/fresh-lab.mjs ad2a -- npx tsx .ad2a/battery.mjs --baseline-check

      - name: SEC-E battery — fault matrix, sweeper, provider revoke, authority, in-flight writers, content
        run: node .ad2a/fresh-lab.mjs sece -- npx tsx .sec-e/battery.mjs

      # ── DB negative proofs, each in its own fresh lab ───────────────────────
      - name: "NEG · H-5: sweeper disabled → the stranded business stays stranded"
        run: bash .sec-e/prove.sh SWEEP_OFF red '\[FAIL\] H5-SWEEP-CONVERGES .*stranded lifecycle=DELETION_REQUESTED' "no sweeper, no convergence" -- node .ad2a/fresh-lab.mjs nsweep -- npx tsx .sec-e/battery.mjs --only sweeper
      - name: "NEG · H-5: pre-fix route → a failure after quarantine is an HTTP 500"
        run: bash .sec-e/prove.sh ACCEPT_OFF red '\[FAIL\] H5-FAULT-PURGE-DB · the request is ACCEPTED \(202\).*http=500' "the owner gets an unretryable 500" -- node .ad2a/fresh-lab.mjs naccept -- npx tsx .sec-e/battery.mjs --only fault
      - name: "PROOF · M-12(a): lifecycle gate removed — pre-deletion credentials STILL rejected"
        run: bash .sec-e/prove.sh GATE_OFF green '\[PASS\] M12A-TOKEN-REJECTED · a session-bound token' "revocation is a second, independent control" -- node .ad2a/fresh-lab.mjs ngate -- npx tsx .sec-e/battery.mjs --only m12a
      - name: "NEG · M-12(a): gate AND revocation removed → the pre-deletion token is honoured"
        run: bash .sec-e/prove.sh GATE_AND_REVOKE_OFF red '\[FAIL\] M12A-TOKEN-REJECTED · a session-bound token' "with neither control the credential lives" -- node .ad2a/fresh-lab.mjs ngaterev -- npx tsx .sec-e/battery.mjs --only m12a
      - name: "NEG · M-12(c): in-transaction gate removed → a late writer commits into the quarantined business"
        run: bash .sec-e/prove.sh INFLIGHT_OFF red '\[FAIL\] M12C-INFLIGHT-REFUSED' "the tenant wrapper admits writes after quarantine" -- node .ad2a/fresh-lab.mjs ninflight -- npx tsx .sec-e/battery.mjs --only m12c
      - name: "NEG · M-12(b): exhausted revoke reported as REVOKED"
        run: bash .sec-e/prove.sh TRUTH_OFF red '\[FAIL\] M12B-TRUTHFUL · a provider that never confirms' "provider deletion claimed where only local deletion happened" -- node .ad2a/fresh-lab.mjs ntruth -- npx tsx .sec-e/battery.mjs --only provider
      - name: "NEG · M-12(b): credentials destroyed before the provider revoke"
        run: bash .sec-e/prove.sh ORDER_OFF red '\[FAIL\] M12B-PLAINTEXT · Google received the REFRESH token' "the plaintext is gone before the revoke" -- node .ad2a/fresh-lab.mjs norder -- npx tsx .sec-e/battery.mjs --only provider
      - name: "NEG · M-13: content-prefix erasure removed → objects survive"
        run: bash .sec-e/prove.sh CONTENT_OFF red '\[FAIL\] M13-CONTENT-ERASED' "pointer-less uploads survive the deletion" -- node .ad2a/fresh-lab.mjs ncontent -- npx tsx .sec-e/battery.mjs --only content

      - name: "NEG · wrapper W1_SESSION_GUC: the GUC leaks onto the pooled connection"
        run: bash .sec-e/prove.sh W1_SESSION_GUC red '\[FAIL\] W1-GUC-TX-LOCAL' "the GUC leaks onto the pooled connection" -- node .ad2a/fresh-lab.mjs w1_session_g -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W2_WRONG_TENANT: the GUC names a tenant other than the context"
        run: bash .sec-e/prove.sh W2_WRONG_TENANT red '\[FAIL\] W2-GUC-MATCHES-CONTEXT' "the GUC names a tenant other than the context" -- node .ad2a/fresh-lab.mjs w2_wrong_ten -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W3_DEFAULT_TENANT: a missing context falls back to a default tenant"
        run: bash .sec-e/prove.sh W3_DEFAULT_TENANT red '\[FAIL\] W3-NO-CONTEXT-FAILS-CLOSED · withTenant' "a missing context falls back to a default tenant" -- node .ad2a/fresh-lab.mjs w3_default_t -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W4_SILENT_SWITCH: a nested tenant switch is honoured"
        run: bash .sec-e/prove.sh W4_SILENT_SWITCH red '\[FAIL\] W4-CROSS-TENANT-REFUSED' "a nested tenant switch is honoured" -- node .ad2a/fresh-lab.mjs w4_silent_sw -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W5_SWALLOW: a failing callback commits its partial work"
        run: bash .sec-e/prove.sh W5_SWALLOW red '\[FAIL\] W5-ROLLBACK' "a failing callback commits its partial work" -- node .ad2a/fresh-lab.mjs w5_swallow -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W6_SILENT_NEST: a nested call silently opens a second transaction"
        run: bash .sec-e/prove.sh W6_SILENT_NEST red '\[FAIL\] W6-NO-SILENT-NESTING · a tenant transaction opened' "a nested call silently opens a second transaction" -- node .ad2a/fresh-lab.mjs w6_silent_ne -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W7_BARE_CLIENT: the callback receives the bare client"
        run: bash .sec-e/prove.sh W7_BARE_CLIENT red '\[FAIL\] W7-NO-BARE-FALLBACK' "the callback receives the bare client" -- node .ad2a/fresh-lab.mjs w7_bare_clie -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "NEG · wrapper W8_WIDE_BYPASS: erasure authority for one business admits writes to another"
        run: bash .sec-e/prove.sh W8_WIDE_BYPASS red '\[FAIL\] W8-BYPASS-NARROW' "erasure authority for one business admits writes to another" -- node .ad2a/fresh-lab.mjs w8_wide_bypa -- npx tsx .sec-e/battery.mjs --only wrapper
      - name: "COMPAT · workstream F #521 (append-only audit, DZ010) and C #530 (composite tenant FKs) applied under the erasure"
        run: |
          # Read each peer migration from the tree once it has merged, from its branch until then.
          get() { # <path> <branch> <out>
            if [ -f "$1" ]; then cp "$1" "$3"; return; fi
            git fetch --no-tags --depth=1 origin "$2:refs/remotes/origin/$2"
            git show "origin/$2:$1" > "$3"
          }
          get prisma/migrations/20260926140000_sec_f_append_only_audit_fiscal_immutability_security_events/migration.sql sec/f-observability-migration "$RUNNER_TEMP/f521.sql"
          get prisma/migrations/20260926110000_sec_c_tenant_composite_fk/migration.sql sec/c-tenant-db-migration "$RUNNER_TEMP/c530.sql"
          SEC_E_EXTRA_MIGRATION="$RUNNER_TEMP/f521.sql" node .ad2a/fresh-lab.mjs compatf -- npx tsx .sec-e/battery.mjs
          SEC_E_EXTRA_MIGRATION="$RUNNER_TEMP/c530.sql" node .ad2a/fresh-lab.mjs compatc -- npx tsx .sec-e/battery.mjs
      - name: Post-restore green (unmutated, fresh lab)
        run: node .ad2a/fresh-lab.mjs postgreen -- npx tsx .sec-e/battery.mjs
      - name: The tree is exactly the commit (every mutation restored)
        run: git diff --exit-code

      - name: Typecheck
        run: npx tsc --noEmit
