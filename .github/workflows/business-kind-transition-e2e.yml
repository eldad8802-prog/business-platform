# "מעבר לעוסק מורשה" — end to end on an ephemeral PG17 with Production's role topology.
# Lab mode follows the tree (migration-first: the wiring migration and this code ship in separate PRs):
#   - migration 20261225090000 (T1 wiring) present → .bkt/lab.sh --with-wiring (the declaration, DZ010, the transition,
#     4a T1/T1a and the wiring, all by migrate deploy), and first one app battery run on --t1-base (Production before
#     the wiring: the application deployed before the migration — A20);
#   - absent → .bkt/lab.sh --with-bkt (20261221090000 only: A20 runs, A18/A19 are not reachable and are not claimed).
#   1. app battery (.bkt/app-battery.ts): the real handlers → service → definer function, real session + proof;
#      on the wired lab, declared businesses end to end through the 4a writer (A18, A19)
#   2. browser, flag ON (.bkt/ui-e2e.mts): next dev on the lab; Chromium desktop/phone + WebKit iPhone-sized viewport
#      (emulation, not a physical phone); Google's page is intercepted (no real Google in CI)
#   3. browser + API, flag OFF (.bkt/ui-off.mts): no entry, page "not available", every route 404
# The wired run (A18/A19) needs migration 20261225090000 in the tree: after the migration PR merges, rebase and re-run.
# Synthetic only. ZERO secrets. ZERO network beyond localhost (and the npm / Playwright downloads). ZERO Production.

name: business kind transition — end to end (PG17 + next dev + browsers)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/business/legal-identity/**"
      - "app/api/business/legal-identity/**"
      - "components/legal-identity/**"
      - "lib/legal-identity/**"
      - "lib/services/legal-identity/**"
      - "lib/auth/sensitive-reauth.ts"
      - "lib/auth/google-reauth.ts"
      - "prisma/migrations/20261221090000_business_kind_transition/**"
      - "prisma/migrations/20261225090000_kind_transition_issuer_declaration_wiring/**"
      - ".bkt/**"
      - ".billing-4a/lab.sh"
      - ".github/workflows/business-kind-transition-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-kind-transition-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind transition end to end (app battery, browsers flag ON, flag OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bkt_e2e_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bkt_e2e_synthetic_super_pw
      LAB_PASSWORD: bkt_e2e_synthetic_role_pw
      OWNER_URL: postgresql://lab_owner:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e
      DATABASE_URL: postgresql://app_runtime_prod:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e?connection_limit=20
      DIRECT_URL: postgresql://app_runtime_prod:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e
      AUTH_DATABASE_URL: postgresql://lab_owner:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e
      AUTH_TOKEN_SECRET: bkt-e2e-synthetic-auth-token-secret-0123456789
      TASK_REQUEST_HMAC_KEY: bkt-e2e-synthetic-request-hmac-key-0123456789abcdef
      TASK_REQUEST_HMAC_KEY_ID: lab1
      CRON_SECRET: bkt_e2e_ci_cron_secret_synthetic_at_least_32
      AUTH_PLANE_ENABLED: "true"
      RATE_LIMIT_BACKEND: memory
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_ROOT: /tmp/bkt-e2e-store
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_GOOGLE_LOGIN_ENABLED: "true"
      AUTH_GOOGLE_LOGIN_MODE: open
      GOOGLE_LOGIN_CLIENT_ID: lab-client.apps.googleusercontent.com
      GOOGLE_LOGIN_CLIENT_SECRET: lab-secret
      GOOGLE_LOGIN_REDIRECT_BASE_URL: http://localhost:3797
      E2E_BASE: http://localhost:3797
      OUT: /tmp/bkt-e2e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Which lab — is the T1 wiring migration in the tree?
        id: mode
        run: |
          if [ -d prisma/migrations/20261225090000_kind_transition_issuer_declaration_wiring ]; then echo "wired=true" >> "$GITHUB_OUTPUT"; echo "wiring migration present: wired lab";
          else echo "wired=false" >> "$GITHUB_OUTPUT"; echo "::notice::wiring migration 20261225090000 not in the tree: unwired lab only (A18/A19 not run)"; fi
      - name: 0. App battery on the unwired lab (Production before 20261225090000)
        if: steps.mode.outputs.wired == 'true'
        env:
          OWNER_URL: postgresql://lab_owner:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e_pre
          DATABASE_URL: postgresql://app_runtime_prod:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e_pre?connection_limit=20
          DIRECT_URL: postgresql://app_runtime_prod:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e_pre
          AUTH_DATABASE_URL: postgresql://lab_owner:bkt_e2e_synthetic_role_pw@localhost:5432/bkt_e2e_pre
        run: |
          set -euo pipefail
          bash .bkt/lab.sh bkt_e2e_pre --t1-base
          npx tsx .bkt/app-battery.ts | tee /tmp/app-pre.out
          grep -q "20261221090000 only (not wired)" /tmp/app-pre.out || { echo "::error::the unwired run did not see the unwired function"; exit 1; }
      - name: Lab (Production role topology; wired when the migration is in the tree)
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.wired }}" = "true" ]; then bash .bkt/lab.sh bkt_e2e --with-wiring; else bash .bkt/lab.sh bkt_e2e --with-bkt; fi
      - name: 1. App battery (real handlers → service → definer function)
        run: |
          set -euo pipefail
          npx tsx .bkt/app-battery.ts | tee /tmp/app.out
          if [ "${{ steps.mode.outputs.wired }}" = "true" ]; then
            grep -q "lab: WIRED" /tmp/app.out || { echo "::error::the app battery did not run on the wired function"; exit 1; }
          else
            grep -q "not wired" /tmp/app.out || { echo "::error::expected the unwired function"; exit 1; }
          fi
      - run: npx playwright install --with-deps chromium webkit
      - name: 2. Browser, flag ON
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$LOCAL_STORAGE_ROOT"
          (BUSINESS_KIND_TRANSITION_ENABLED=true nohup npx next dev -p 3797 > "$OUT/server-on.log" 2>&1 &)
          for i in $(seq 1 150); do curl -sf -o /dev/null http://localhost:3797/login && break; sleep 2; done
          curl -s -o /dev/null --max-time 300 http://localhost:3797/business/legal-identity/kind-transition
          curl -s -o /dev/null --max-time 300 http://localhost:3797/business
          npx tsx .bkt/ui-e2e.mts
          pkill -f "next dev -p 3797" || true
          sleep 3
      - name: 3. Browser + API, flag OFF
        run: |
          set -euo pipefail
          (nohup npx next dev -p 3797 > "$OUT/server-off.log" 2>&1 &)
          for i in $(seq 1 150); do curl -sf -o /dev/null http://localhost:3797/login && break; sleep 2; done
          curl -s -o /dev/null --max-time 300 http://localhost:3797/business/legal-identity/kind-transition
          curl -s -o /dev/null --max-time 300 http://localhost:3797/business
          npx tsx .bkt/ui-off.mts
      - name: Server logs and screenshots (on failure)
        if: failure()
        run: |
          tail -n 120 "$OUT/server-on.log" 2>/dev/null || true
          tail -n 120 "$OUT/server-off.log" 2>/dev/null || true
          ls -la "$OUT" || true
