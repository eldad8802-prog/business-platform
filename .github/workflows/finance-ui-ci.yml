name: finance ui (secretary + payables)

# The shared presentation layer of "המזכירה שלי" and "התחייבויות"
# (components/finance-ui): one money format, Israel calendar-day distances,
# one status vocabulary over the server's existing states, and Hebrew-only
# error text. Pure logic, no database, no network.
#
# The real-browser proof at desktop / tablet / mobile is
# scripts/qa/ui/finance-ui-redesign-qa.mjs against a local build with mocked APIs.

on:
  pull_request:
    paths:
      - "components/finance-ui/**"
      - "app/(shell)/secretary/**"
      - "app/(shell)/payables/**"
      - "lib/payables/payables-client.ts"
      - "lib/obligations/secretary-client.ts"
      - ".github/workflows/finance-ui-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-ui:
    name: finance ui (pure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:finance-ui
      - run: npm run verify:secretary-home
      - run: npm run verify:payables-list
