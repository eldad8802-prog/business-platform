# Monthly accountant workflow — the sweep (scheduled).
#
# On the 1st of every month (Israel time) the previous month's accountant package is prepared for every
# eligible business; every run after that re-evaluates months that changed, sends reminders (at most two,
# on the 5th and the 10th), and retries approved sends that are due. See lib/accountant/sweep.ts.
#
# THE SCHEDULER IS VERCEL CRON (vercel.json, hourly at :30 UTC — the team is on Vercel Pro, as #771 found
# for the email sweep). This GitHub workflow is only an optional backstop: GitHub fires its "hourly" schedule
# 4–6 times a day here (gaps up to 6 h), too irregular for send retries. Every step is idempotent, so the two
# overlapping is harmless.
#
# INERT UNTIL OWNER GATE G2. Two switches, both off today:
#   - vars.ACCOUNTANT_SWEEP_ENABLED == 'true'  (this workflow does not call anything otherwise), and
#   - the Production env ACCOUNTANT_SWEEP_ENABLED=true (the route answers {enabled:false} otherwise —
#     which also keeps the Vercel backstop inert).
# Sending to an accountant is a third, separate switch (ACCOUNTANT_DELIVERY_ENABLED, gate G4), and every
# single send still needs the owner's approval of that package inside Dubiz.
#
# The only secret is CRON_SECRET, read ONLY from the protected `cron` environment (main-only). The endpoint
# answers counts only.

name: accountant sweep (scheduled)

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accountant-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.ref == 'refs/heads/main' && vars.ACCOUNTANT_SWEEP_ENABLED == 'true'
    environment: cron
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # The endpoint answers 500 when any business failed, so an unhealthy run goes red.
      - name: Run the accountant sweep on Production
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SWEEP_URL: https://promaxgroup.co.il/api/accountant/sweep
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not configured for this repository."; exit 1
          fi
          code=$(curl -sS -o sweep.json -w "%{http_code}" -m 90 \
            -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$SWEEP_URL")
          echo "HTTP $code"
          cat sweep.json; echo
          # A package that failed to build is visible, never silent: a WARNING (the owner already has the
          # in-app notice, and the month is retried an hour later). It is reported only — it never turns a
          # failing run green: any non-200 answer (a business error, a crash, no CRON_SECRET) stays an error.
          failed=$(node -e 'try { const j = JSON.parse(require("fs").readFileSync("sweep.json", "utf8")); const n = j && j.summary ? j.summary.buildFailed : 0; process.stdout.write(Number.isInteger(n) && n >= 0 ? String(n) : (n === undefined ? "0" : "unreadable")); } catch { process.stdout.write("unreadable"); }')
          {
            echo "### Accountant sweep — HTTP $code"
            echo "Package builds failed in this run: **$failed**"
            echo '```json'; cat sweep.json; echo; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" = "unreadable" ]; then
            echo "::warning::accountant sweep: the answer could not be read, so failed package builds are unknown for this run"
          elif [ "$failed" -gt 0 ]; then
            echo "::warning::accountant sweep: $failed package build(s) failed in this run — the months are PREPARATION_FAILED and are retried after an hour"
          fi
          [ "$code" = "200" ] || { echo "::error::accountant sweep answered $code"; exit 1; }
