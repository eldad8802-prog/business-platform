# Service Desk 1.2c / M2 / migration 20261115090000_service_parts — proof on PostgreSQL BEFORE it reaches Production
# (ephemeral PG17). Migration-first PR-1: this PR ships the migration and its proof only (no schema.prisma models, no
# application code).
#
# .sdp/lab.sh builds the 1.2b lab (1.2b applied by `migrate deploy`, as in Production since 2026-11-06), adds the
# Production inventory RLS (wave 3, as-is) and leaves this migration as the only pending one.
#
#   0. Evidence files are SELECT-only, never touch the read-only boundary, pass the output guard; the proof pins
#      migration.sql's sha256; the migration names only its own objects and the tables it builds on; no schema models.
#   1. Baseline (pending): PREFLIGHT passes whole; the proof refuses; checks 1, 3 and 4 are live.
#   2. `prisma migrate deploy` applies it: proof 15/15; the preflight then fails exactly its "not there yet" checks.
#   3. Faults: each injected defect is caught by the proof check meant for it.
#   4. Rollback: refused while rows exist (step 5's database); on an empty database it reverts whole (preflight whole
#      again) and the release re-applies it whole.
#   5. M2 battery (.sdp/battery.ts) as the real roles — 29/29: structure, isolation, journal, movements, split, costs,
#      the M2‑2 close guard and the M2‑1 supplier-return guard with their races, the deadlock rule, erasure, atomicity.
#      The lab simulates M0's enum value (--m0-sim, lab only) so the issue / return checks can write movements.
#   6. Locks (.sdp/locks.ts) on the same database: lock semantics, deadlocks, the cancel gap with the parts side (C4/C5)
#      live, M0 reproduced in SQL — all pass, none pending.
#   7. Regressions with M2 applied: the 1.2b battery (with its 1.2a regression) on the M2 database; the 1.2a foundation
#      battery on the M2 database (only its structural 1.6 / 1.7 fail — exactly as on a 1.2b-only lab); the real
#      account-erasure purge with M2 applied.
#
# The case-row lock rule (part guards take FOR UPDATE on the case, nothing takes FOR SHARE) is NOT a Production
# evidence check: its SQL needs the words the evidence guard forbids. It is proven here instead — battery 1.6
# (catalog), locks A5 / A6 (catalog) and B4 / B5 / battery 5.3 / 5.5 / 5.6 (behaviour) — and Production evidence
# check 15 pins the ledger checksum to this reviewed migration.sql, so the guard bodies there are these.
#   8. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: service parts — M2 migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261115090000_service_parts/**"
      - "ops/evidence/service-parts-*.sql"
      - ".sdp/**"
      - ".github/workflows/service-parts-lab.yml"
      - "lib/services/service-desk/parts.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service parts M2 lab (PG17, 1.2b applied, inventory RLS as Production)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sdp_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sdp_ci_synthetic_super_pw
      LAB_PASSWORD: sdp_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/service-parts-preflight.sql
      EVIDENCE: ops/evidence/service-parts-production-evidence.sql
      SDP: prisma/migrations/20261115090000_service_parts/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only; checksum pinned; the migration names only its own objects; no schema models
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            if grep -inE '(default_)?transaction_read_only|read[[:space:]]+write|session[[:space:]]+characteristics|reset[[:space:]]+all|session[[:space:]]+authorization' "$f"; then
              echo "$f touches the read-only boundary"; exit 1
            fi
          done
          node scripts/ci/evidence-output-guard.mjs
          # Selectable in prod-readonly-evidence.yml: added by the release step (its own PR), not here.
          sum=$(sha256sum "$SDP" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$SDP sha256 $sum (pinned)"
          prefix='^"(ServicePart|ServicePartEvent|ServiceCase|ServiceExternalWork)_[A-Za-z_]+"$'
          own='"ServicePart"|"ServicePartEvent"|"ServicePartState"|"ServicePartSource"|"ServicePartCostSource"|"ServicePartWriteOffReason"|"ServicePartEventKind"'
          base='"Business"|"User"|"ServiceCase"|"ServiceDevice"|"ServiceQuote"|"ServiceExternalWork"|"ServiceActor"|"ServiceCaseStatus"|"ServiceExternalWorkState"|"InventoryItem"|"InventoryMovement"|"InventoryUnitType"|"PurchaseOrder"|"PurchaseOrderLine"'
          others=$(sed 's/--.*$//' "$SDP" | grep -oE '"[A-Z][A-Za-z_]*"' | sort -u | grep -vE "$prefix" | grep -vxE "$own|$base" || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261115090000_service_parts" ]] || continue
            if sed 's/--.*$//' "$d/migration.sql" | grep -nE '"ServicePart(Event)?"|service_part_|service_parts_|service_case_parts_|service_external_parts_'; then
              echo "$n names a service parts object"; exit 1
            fi
          done
          if grep -nE 'model ServicePart\b|model ServicePartEvent\b' prisma/schema.prisma; then echo "schema.prisma models M2 — PR-2's job, not PR-1's"; exit 1; fi
          echo "the migration names only its own objects and the tables it builds on; no other migration names its objects; no schema models"

      - name: 1. Baseline (pending) — PREFLIGHT passes whole; the proof refuses; checks 1, 3 and 4 are live
        run: |
          set -euo pipefail
          bash .sdp/lab.sh sdp_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdp_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "baseline: expected no preflight failure, got: $fails"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "12" || { echo "expected 12 PASS"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          lab -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('lab-later', 'x', now(), '20261199000000_lab_later', 1)"
          c3=$(lab -f "$PREFLIGHT" | grep -E '^ +3 \|' | tr -d ' ')
          lab -q -c "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-later'"
          test "$c3" = "3|FAIL|1" || { echo "check 3 did not refuse a later finished migration: $c3"; exit 1; }
          lab -q -c "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '20261113090000_service_external_work'"
          c4=$(lab -f "$PREFLIGHT" | grep -E '^ +4 \|' | tr -d ' ')
          c1=$(lab -f "$PREFLIGHT" | grep -E '^ +1 \|' | tr -d ' ')
          lab -q -c "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '20261113090000_service_external_work'"
          test "$c4" = "4|FAIL|0" || { echo "check 4 did not refuse an unfinished 1.2b: $c4"; exit 1; }
          test "$c1" = "1|FAIL|1" || { echo "check 1 did not see the unfinished row: $c1"; exit 1; }
          echo "baseline whole; checks 1, 3 and 4 are live"

      - name: 2. prisma migrate deploy applies it — proof 15/15; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .sdp/lab.sh sdp_pre --deploy-only | tee /tmp/post.log
          grep -q 'Applying migration `20261115090000_service_parts`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdp_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "15" || { echo "expected 15 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 5 6 7 " || { echo "after the release: expected '2 5 6 7 ', got: $fails"; exit 1; }

      - name: 3. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdp_pre -v ON_ERROR_STOP=1 "$@"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test -z "$(failing)" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "NO FORCE row-level security" "3 " 'ALTER TABLE "ServicePart" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "ServicePart" FORCE ROW LEVEL SECURITY'
          fault "a permissive FOR ALL policy" "4 5 " 'CREATE POLICY sdp_fault_all ON "ServicePartEvent" USING (true)' 'DROP POLICY sdp_fault_all ON "ServicePartEvent"'
          fault "removal privilege for app_runtime" "6 " 'GRANT DELETE ON "ServicePart" TO app_runtime' 'REVOKE DELETE ON "ServicePart" FROM app_runtime'
          fault "journal change privilege for app_runtime" "6 " 'GRANT UPDATE ON "ServicePartEvent" TO app_runtime' 'REVOKE UPDATE ON "ServicePartEvent" FROM app_runtime'
          fault "PUBLIC read" "7 " 'GRANT SELECT ON "ServicePart" TO PUBLIC' 'REVOKE SELECT ON "ServicePart" FROM PUBLIC'
          fault "search_path without pg_temp last" "8 " \
            'ALTER FUNCTION public.service_part_guard() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_part_guard() SET search_path = pg_catalog, public, pg_temp'
          fault "PUBLIC EXECUTE on the erasure" "9 " 'GRANT EXECUTE ON FUNCTION public.service_parts_erase_business() TO PUBLIC' 'REVOKE EXECUTE ON FUNCTION public.service_parts_erase_business() FROM PUBLIC'
          fault "SECURITY INVOKER erasure" "10 " 'ALTER FUNCTION public.service_parts_erase_business() SECURITY INVOKER' 'ALTER FUNCTION public.service_parts_erase_business() SECURITY DEFINER'
          fault "case-close guard disabled" "11 " 'ALTER TABLE "ServiceCase" DISABLE TRIGGER "ServiceCase_parts_resolved_on_close"' 'ALTER TABLE "ServiceCase" ENABLE TRIGGER "ServiceCase_parts_resolved_on_close"'
          fault "supplier-return guard disabled" "11 " 'ALTER TABLE "ServiceExternalWork" DISABLE TRIGGER "ServiceExternalWork_parts_resolved_on_return"' 'ALTER TABLE "ServiceExternalWork" ENABLE TRIGGER "ServiceExternalWork_parts_resolved_on_return"'
          fault "UNIQUE issue movement index gone" "12 " 'DROP INDEX "ServicePart_issueMovementId_key"' \
            'CREATE UNIQUE INDEX "ServicePart_issueMovementId_key" ON "ServicePart"("issueMovementId")'
          fault "the 1.2b erasure loses pg_temp" "14 " \
            'ALTER FUNCTION public.service_external_erase_business() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_external_erase_business() SET search_path = pg_catalog, public, pg_temp'
          sum=$(sha256sum "$SDP" | cut -d' ' -f1)
          fault "a ledger checksum that is not the reviewed file" "15 " \
            "UPDATE \"_prisma_migrations\" SET checksum = repeat('0', 64) WHERE migration_name = '20261115090000_service_parts'" \
            "UPDATE \"_prisma_migrations\" SET checksum = '$sum' WHERE migration_name = '20261115090000_service_parts'"
          test -z "$(failing)" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 4. Rollback on an empty database — whole (preflight whole again); the release re-applies it whole
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdp_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f .sdp/rollback.sql
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "after rollback the preflight is not whole: $fails"; exit 1; }
          bash .sdp/lab.sh sdp_pre --deploy-only | grep -q "service parts applied"
          test -z "$(lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; })" || { echo "re-apply after rollback is not whole"; exit 1; }
          echo "rollback whole on an empty database; the release re-applies cleanly"

      - name: 5. M2 battery — 29/29 as the real roles (lab M0 simulation for issue / return)
        run: |
          set -euo pipefail
          bash .sdp/lab.sh sdp_post --with-m2 --m0-sim | tee /tmp/sdp_post.log
          grep -q 'Applying migration `20261115090000_service_parts`' /tmp/sdp_post.log
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdp_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdp_post" \
            npx tsx .sdp/battery.ts | tee /tmp/battery.out
          grep -qxE '29 passed, 0 failed' /tmp/battery.out || { echo "the M2 battery is not 29/29"; exit 1; }

      - name: 5b. Rollback refuses while rows exist
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sdp_post -v ON_ERROR_STOP=1 "$@"; }
          if lab -f .sdp/rollback.sql 2>/tmp/rb.err >/dev/null; then echo "rollback ran over rows"; exit 1; fi
          grep -q "SERVICE_PARTS_ROLLBACK_REFUSED" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          test "$(lab -At -c "SELECT count(*) FROM pg_class WHERE relname IN ('ServicePart','ServicePartEvent')")" = "2" || { echo "refused rollback changed something"; exit 1; }
          echo "rollback refused over rows; nothing changed"

      - name: 6. Locks, deadlocks, cancel gap (parts side live), M0 reproduction — all pass, none pending
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdp_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdp_post" \
            npx tsx .sdp/locks.ts | tee /tmp/locks.out
          grep -qE '^[0-9]+ passed, 0 failed, [0-9]+ info, 0 pending' /tmp/locks.out || { echo "locks failed or left checks pending"; exit 1; }

      - name: 7. Regressions with M2 applied — 1.2b battery, 1.2a foundation battery, the real erasure purge
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdp_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdp_post" \
            npx tsx .sdx/battery.ts
          # 1.2a on the M2 database. Its structural checks 1.6 / 1.7 count every service_* function as the foundation's,
          # so they already fail with 1.2b alone (the same 117 passed / 2 failed on a 1.2b-only lab). Every functional
          # 1.2a check must pass and those two must be the only failures: M2 adds no 1.2a failure.
          set +e
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdp_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdp_post" \
            npx tsx .sdf/battery.ts > /tmp/sdf.out 2>&1
          set -e
          cat /tmp/sdf.out
          got=$(grep -oE '^ +\[FAIL\] [0-9]+\.[0-9]+' /tmp/sdf.out | awk '{print $2}' | tr '\n' ' ')
          test "$got" = "1.6 1.7 " || { echo "1.2a on the M2 database: expected only the structural 1.6 1.7, got: $got"; exit 1; }
          grep -qE '^117 passed, 2 failed' /tmp/sdf.out || { echo "the 1.2a pass count changed"; exit 1; }
          bash .sdp/lab.sh sdp_erase --with-m2 >/dev/null
          bash .sdf/erasure-prereq.sh sdp_erase
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdp_erase"
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdp_erase" \
          DATABASE_URL="$R" DIRECT_URL="$R" AUTH_DATABASE_URL="$R" AUTH_TOKEN_SECRET="sdp-ci-synthetic-auth-secret-0123456789abcdef" \
            npx tsx .sdf/erasure-battery.ts

      - name: 8. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .sdp/lab.sh sdp_broken --broken-m2
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d sdp_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relnamespace = 'public'::regnamespace AND relname IN ('ServicePart','ServicePartEvent'))
            + (SELECT count(*) FROM pg_proc WHERE pronamespace = 'public'::regnamespace AND (proname LIKE 'service\_part\_%' OR proname IN ('service_parts_erase_business','service_case_parts_resolved_on_close','service_external_parts_resolved_on_return')))
            + (SELECT count(*) FROM pg_type WHERE typname IN ('ServicePartState','ServicePartSource','ServicePartCostSource','ServicePartWriteOffReason','ServicePartEventKind'))
            + (SELECT count(*) FROM pg_trigger WHERE tgname IN ('ServiceCase_parts_resolved_on_close','ServiceExternalWork_parts_resolved_on_return'))")
          echo "objects left=$left"
          test "$left" = "0" || { echo "NOT atomic"; exit 1; }
