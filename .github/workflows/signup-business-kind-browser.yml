# The business kind at signup (#1103) in a real browser: this build under `next start` (public signup open), every
# /api/** request answered by the script (scripts/qa/auth/signup-business-kind.browser.mjs). Android WebView UA at
# 390 px and desktop at 1440 px: the required kind select, the form stop, the posted kind, the server refusal.
# Screenshots are uploaded as an artifact.
# Synthetic only; ZERO secrets; ZERO Production; no email is sent.

name: signup business kind — browser (Chromium, Android WebView + desktop)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/register/**"
      - "lib/auth/signup-identity.ts"
      - "lib/i18n/messages/areas/account*.ts"
      - "scripts/qa/auth/signup-business-kind.browser.mjs"
      - ".github/workflows/signup-business-kind-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: signup business kind — browser (390 WebView + 1440 desktop)
    runs-on: ubuntu-24.04 # pinned: Playwright cannot install Chromium on ubuntu-26.04 (ubuntu-latest) yet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      # Built before the Chromium install (see i18n-multicurrency-ci.yml: the font resolution after
      # `playwright install --with-deps`).
      - name: Build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          PUBLIC_SIGNUP_ENABLED: "true"
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser check
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          AUTH_TOKEN_SECRET: sbk_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef
          RATE_LIMIT_BACKEND: memory
          PUBLIC_SIGNUP_ENABLED: "true"
        run: |
          set -euo pipefail
          (nohup npx next start -p 3631 > "$RUNNER_TEMP/next.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3631/login && break; sleep 2; done
          BASE=http://localhost:3631 OUT="$GITHUB_WORKSPACE/signup-business-kind-shots" \
            node scripts/qa/auth/signup-business-kind.browser.mjs || { tail -50 "$RUNNER_TEMP/next.log"; exit 1; }

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signup-business-kind-shots
          path: signup-business-kind-shots/
          retention-days: 7
