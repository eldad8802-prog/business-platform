name: Prod PurchaseOrder Backfill Audit (Read-Only)

# Manual, gated, READ-ONLY audit for the Supplier Foundation S4-P3A backfill.
# Runs ONLY the SELECT queries in ops/evidence/purchase-order-backfill-audit.sql
# against the verified Production database. No writes, no migrations, no schema
# changes, NO backfill. This is evidence collection only.
#
# The SQL file is HARD-CODED here — the workflow accepts NO file path, SQL text,
# or command input, so an arbitrary-SQL path is impossible.
#
# Safety controls:
#   - workflow_dispatch only (no push / schedule triggers)
#   - environment: production-db  -> human approval before secrets are exposed
#   - host allowlist: DIRECT_URL must target endpoint ep-flat-brook-am4bhq1y
#   - SQL static guard: comment-stripped, rejects any non-SELECT (write) keyword
#   - the SQL itself opens a READ ONLY transaction and never commits
#   - ON_ERROR_STOP + statement timeout; secrets never printed

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: prod-purchase-order-backfill-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only PurchaseOrder backfill audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SQL static guard (SELECT-only, comment-aware)
        run: |
          set -euo pipefail
          SQL_FILE="ops/evidence/purchase-order-backfill-audit.sql"
          test -f "$SQL_FILE" || { echo "::error::SQL file missing: $SQL_FILE"; exit 1; }
          # Strip comments BEFORE scanning so documentation text cannot false-positive:
          #   1) block comments /* ... */   2) line comments -- ...
          STRIPPED="$(sed -E ':a;s#/\*[^*]*\*+([^/*][^*]*\*+)*/##g;ta' "$SQL_FILE" | sed -E 's/--.*$//')"
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          MATCHES="$(printf '%s\n' "$STRIPPED" | grep -inE "$FORBIDDEN" || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Forbidden write keyword found in SQL (after stripping comments) — aborting before any DB connection."
            echo "$MATCHES"
            exit 1
          fi
          echo "SQL guard passed: file is SELECT-only."

      - name: Host allowlist assertion (verified Production only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          ALLOW="ep-flat-brook-am4bhq1y"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set in the production-db environment."; exit 1
          fi
          case "$DIRECT_URL" in
            *"$ALLOW"*) echo "Host allowlist OK: DIRECT_URL targets endpoint $ALLOW." ;;
            *) echo "::error::DIRECT_URL does not target the verified Production endpoint ($ALLOW) — aborting."; exit 1 ;;
          esac

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run read-only audit queries
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          psql "$DIRECT_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=ops/evidence/purchase-order-backfill-audit.sql
