name: secretary-ledger-cutover-dry-run

# Phase 2 cutover — PRODUCTION DRY RUN ONLY. "Human approves, the Runner reads."
#
# Reads Production and reports what the secretary → ledger cutover WOULD do.
# It cannot write, by construction, three times over:
#   1. There is no execute input and no execute step in this file. The script is
#      invoked with `--mode dry-run` literally; nothing here can change that.
#   2. The cutover service runs every dry-run transaction as
#      `SET TRANSACTION READ ONLY` — Postgres itself refuses any write.
#   3. The SQL preflight runs with default_transaction_read_only=on.
#
# Same safety model as release-migrate: manual trigger only; bound to the
# protected `production-db` environment (required reviewer), so the Production
# connection secrets exist only inside this approved job; read-only repo token.
#
# The write phase is a SEPARATE, later, owner-approved step. It is not here.
#
# Output: counts and row ids only — never a name, a note or an amount.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Audit note: why this dry run is happening (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: secretary-ledger-cutover-production
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    environment: production-db
    steps:
      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Cutover dry run (application logic, READ ONLY transactions)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          npx tsx scripts/payables/secretary-ledger-cutover.ts --mode dry-run --json-out cutover-dry-run.json | tee cutover-dry-run.txt

      - name: SQL preflight (independent cross-check, read-only session)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGOPTIONS: "-c default_transaction_read_only=on"
        run: |
          psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -X -f scripts/payables/secretary-ledger-cutover-preflight.sql | tee cutover-preflight.txt

      - name: Upload the report (counts and ids only)
        uses: actions/upload-artifact@v4
        with:
          name: secretary-ledger-cutover-dry-run
          path: |
            cutover-dry-run.json
            cutover-dry-run.txt
            cutover-preflight.txt
          retention-days: 30

      - name: Job Summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          {
            echo "## secretary-ledger-cutover — PRODUCTION DRY RUN (read-only)"
            echo ""
            echo "- Trigger: manual, approved via \`production-db\`. Reason: ${REASON:-'(none provided)'}"
            echo "- No write path exists in this workflow. The write phase is a separate owner gate."
            echo ""
            echo '```'
            sed -n '/^mode /,/^{/p' cutover-dry-run.txt 2>/dev/null | sed '$d' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
