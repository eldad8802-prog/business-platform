# M0 — Tenant-Safe Knowledge Foundation.
#
# This repository already runs 44 database-backed batteries in CI. Not one of them covered the
# knowledge layer, and that is precisely why the defect survived: 21 Business Memory suites ran green
# while the read and write paths were both broken in Production, because every one of them injected a
# fake client and none ever exercised the DEFAULT binding.
#
# So this is not a new capability — it is the missing coverage, in the idiom the other 44 established.
# It runs on every push that touches the knowledge layer, because a guard that runs only on the
# author's machine would have exactly the blind spot that produced this bug.
name: m0-knowledge-tenant-safety

on:
  pull_request:
    paths:
      - "lib/business-memory/**"
      - "lib/tenant/**"
      - "lib/identity/**"
      - "lib/services/collection/**"
      - "lib/services/documents/memory/**"
      - "lib/sensors/**"
      - "lib/services/**"
      - "lib/data-transfer/**"
      - "app/api/**"
      - "docs/learning/**"
      - "lib/business-status/**"
      - "lib/knowledge/**"
      - "app/api/knowledge/**"
      - "app/api/insights/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/**"
      - "scripts/ci/tenant-context-guard.sh"
      - ".m0/**"
      - ".github/workflows/m0-knowledge-tenant-safety.yml"
  push:
    branches: [main]
    paths:
      - "lib/business-memory/**"
      - "lib/tenant/**"
      - ".m0/**"

permissions:
  contents: read

jobs:
  knowledge-tenant-safety:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_owner
          POSTGRES_PASSWORD: lab_pw
          POSTGRES_DB: m0_lab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # A throwaway container that exists for the life of this job. The battery additionally refuses
      # the Production and Preview endpoints by name, so a mis-set secret cannot point it at real data.
      M0_ADMIN_URL: postgresql://lab_owner:lab_pw@localhost:5432/m0_lab
      DATABASE_URL: postgresql://lab_owner:lab_pw@localhost:5432/m0_lab
      DIRECT_URL: postgresql://lab_owner:lab_pw@localhost:5432/m0_lab

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The static ratchet first: it is cheap, and if the seams have drifted back to the global client
      # there is no point paying for a database to find out.
      - name: CI-TC tenant context guard (incl. M0 knowledge checks)
        run: bash scripts/ci/tenant-context-guard.sh .

      - name: Guard negative proof — the guard must FAIL on the pre-M0 wiring
        run: |
          set -euo pipefail
          cp lib/business-memory/read/coordinator.ts /tmp/coordinator.bak
          node -e "
            const fs=require('fs');
            const p='lib/business-memory/read/coordinator.ts';
            let s=fs.readFileSync(p,'utf8');
            s=s.replace('import { tenantTx } from \"@/lib/tenant/tenant-tx\";','import { prisma } from \"@/lib/prisma\";');
            s=s.replace(/return await tenantTx\(query\.businessId, \(tx\) =>\s*\n\s*readClaim\(query, tx as unknown as ClaimReaderClient\),\s*\n\s*\);/,'return await readClaim(query, prisma as unknown as ClaimReaderClient);');
            fs.writeFileSync(p,s);
          "
          if bash scripts/ci/tenant-context-guard.sh . > /tmp/neg.txt 2>&1; then
            echo '::error::CI-TC PASSED on the pre-M0 wiring — the guard does not actually detect it.'
            cat /tmp/neg.txt
            cp /tmp/coordinator.bak lib/business-memory/read/coordinator.ts
            exit 1
          fi
          grep -q 'FAIL. CI-TC-14' /tmp/neg.txt || {
            echo '::error::the guard failed, but not on CI-TC-14 — it failed for the wrong reason.'
            cat /tmp/neg.txt; cp /tmp/coordinator.bak lib/business-memory/read/coordinator.ts; exit 1; }
          cp /tmp/coordinator.bak lib/business-memory/read/coordinator.ts
          echo "negative proof held: CI-TC-14 detects the pre-M0 wiring."

      - run: npx prisma generate

      - name: Push the schema into the throwaway lab
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Business Memory unit suites (all 21)
        run: |
          set -euo pipefail
          fail=0
          for t in $(find lib/business-memory -name '*.test.ts' | sort); do
            if ! npx tsx "$t" > /tmp/o.txt 2>&1; then
              echo "::error::FAILED $t"; tail -20 /tmp/o.txt; fail=1
            fi
          done
          [ "$fail" -eq 0 ]

      # The battery lives in a dot-directory, which TypeScript globs skip — so it was never checked
      # and a duplicate declaration reached CI as a runtime transform error. Now it is checked first.
      - name: Type-check the proof harness
        run: npx tsc -p .m0/tsconfig.json --noEmit

      - name: M1 L0 fact-layer contracts (pure)
        run: npx tsx lib/business-status/translators/payables.test.ts

      - name: M2 DOC-04 rule contracts (pure)
        run: npx tsx lib/knowledge/rules/documents-paperwork-lag.test.ts

      - name: M3 insight composer contracts (pure)
        run: npx tsx lib/knowledge/insight-composer.test.ts

      - name: Derivation route security contract
        run: npx tsx lib/knowledge/derive-route.verify.test.ts

      - name: Owner-decision surface contract
        run: npx tsx lib/knowledge/insight-decision-route.verify.test.ts

      - name: M0-M3 knowledge battery (real DB, NOBYPASSRLS role)
        run: npx tsx .m0/knowledge-tenant-battery.ts
      - name: M4 rule contracts (pure — 89 assertions across four domains)
        run: npx tsx lib/knowledge/rules/m4-rules.test.ts

      - name: M4/M5 surface contracts (identity, collection, derivation)
        run: npx tsx lib/knowledge/m4-m5-surfaces.verify.test.ts

      # The second battery. It answers a different question from the first — not "does the knowledge
      # layer reach the database under tenant context" but "given evidence in four domains and two
      # tenants that look alike, does it learn the right things and refuse the rest". Two files
      # because those are two failures, and when this one is red the verdict should be about the
      # RULES rather than about the plumbing the first battery already owns.
      - name: M4/M5 multi-domain + identity battery (real DB, NOBYPASSRLS role)
        run: npx tsx .m0/m4-m5-battery.ts

      # M5.5 — the sensor fabric. The pure contract first (occurrences, not interpretations; actor AND
      # source decided at every call site; no personal data in any payload), then the battery against a
      # real database under a MEASURED NOBYPASSRLS role: tenant, actor, source, entity, time,
      # idempotency inside a caller transaction, UNKNOWN staying UNKNOWN, CollectionAction append-only
      # through the same privilege inheritance Production uses, and the three M4 rule corrections.
      - name: M5.5 sensor contract (pure + static privacy/actor checks)
        run: npx tsx lib/sensors/sensors.test.ts

      - name: M5.5 sensor battery (real DB, NOBYPASSRLS role)
        run: npx tsx .m0/m55-sensor-battery.ts

      # M6 — temporal knowledge. The pure engine first (insufficient history, robust baselines, spike
      # vs trend, shift vs anomaly, no poisoning, determinism, and the sensor-manifest boundary parsed
      # from docs/learning/SENSOR_COVERAGE.md), then the battery: the real derivation service and
      # writer, as a MEASURED NOBYPASSRLS role, across tenants that look alike.
      - name: M6 temporal engine (pure + manifest boundary)
        run: npx tsx lib/knowledge/temporal/temporal.test.ts

      - name: M6 temporal battery (real DB, NOBYPASSRLS role)
        run: npx tsx .m0/m6-temporal-battery.ts

      # M7 — the Business Knowledge Snapshot: governed knowledge for ONE business, gaps apart from
      # knowledge, conflicts kept, duplicates collapsed, cross-domain findings only through authority,
      # non-causal, deterministic, bounded, and free of raw personal content. Pure first, then the
      # real derivations + builder as a MEASURED NOBYPASSRLS role.
      - name: M7 snapshot assembly (pure + no-AI / privacy static checks)
        run: npx tsx lib/knowledge/snapshot/snapshot.test.ts

      - name: M7 snapshot battery (real DB, NOBYPASSRLS role)
        run: npx tsx .m0/m7-snapshot-battery.ts
