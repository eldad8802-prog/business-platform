name: Prod derive authority — pre-enrollment proof

# #575 PRE-ENROLLMENT proof, against the live Production route, with nobody enrolled:
#   probe       dedicated secret, businessId=0      → 400 invalid_business  (proves the #575 code AND the
#               Production KNOWLEDGE_DERIVE_SECRET are live: the old route answers 401 to this secret, a
#               #575 build without the secret answers 503. Anything but 400 stops here — CRON_SECRET is
#               never sent to a route that might still accept it.)
#   cron        CRON_SECRET,  businessId=0          → 401 unauthorized (0: never a derivable target, on any build)
#   business 3  dedicated secret                     → 403 not_enrolled
#   business 9  dedicated secret                     → 403 not_enrolled
# bracketed by a read-only fingerprint of every table the derive pipeline can write (before/after), the
# KNOWLEDGE_DERIVE SecurityEvents carrying this run id, feature state and runtime tenant isolation —
# scripts/ops/derive-preenrollment-evidence.ts. Secrets are sent as headers, never echoed; responses are
# printed as status + error code only. Database sessions are READ ONLY by Postgres.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-derive-preenrollment-proof
  cancel-in-progress: false

jobs:
  proof:
    name: Derive pre-enrollment proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-db
    env:
      DERIVE_URL: https://promaxgroup.co.il/api/knowledge/derive
      EVIDENCE_ARGS: --expected-runtime-user app_runtime_prod --allow-host ep-flat-brook-am4bhq1y --businesses 3,9
    steps:
      - name: Secrets present and distinct (fail closed, nothing printed)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          KNOWLEDGE_DERIVE_SECRET: ${{ secrets.KNOWLEDGE_DERIVE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for v in DIRECT_URL RUNTIME_DATABASE_URL KNOWLEDGE_DERIVE_SECRET CRON_SECRET; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is not configured — NOT RUN (this is not a pass)."; exit 1; fi
          done
          if [ "$DIRECT_URL" = "$RUNTIME_DATABASE_URL" ]; then echo "::error::owner and runtime URLs are identical — two identities are required."; exit 1; fi
          if [ "$KNOWLEDGE_DERIVE_SECRET" = "$CRON_SECRET" ]; then echo "::error::KNOWLEDGE_DERIVE_SECRET equals CRON_SECRET — refusing."; exit 1; fi
          [ "${#KNOWLEDGE_DERIVE_SECRET}" -ge 32 ] || { echo "::error::KNOWLEDGE_DERIVE_SECRET is shorter than 32 characters."; exit 1; }
          echo "All four secrets present; derive secret distinct from CRON_SECRET and >= 32 chars."

      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: node_modules/.bin/prisma generate

      - name: BEFORE — fingerprint (read-only)
        env:
          OWNER_DATABASE_URL: ${{ secrets.DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
        run: node_modules/.bin/tsx scripts/ops/derive-preenrollment-evidence.ts $EVIDENCE_ARGS --phase snapshot --out before.json

      - name: Calls against the live route
        id: calls
        env:
          KNOWLEDGE_DERIVE_SECRET: ${{ secrets.KNOWLEDGE_DERIVE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CALLER_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          call() { # $1 label, $2 which secret, $3 businessId, $4 expected status, $5 expected error code
            local tok; if [ "$2" = derive ]; then tok="$KNOWLEDGE_DERIVE_SECRET"; else tok="$CRON_SECRET"; fi
            local code; code=$(curl -sS -o body.json -w "%{http_code}" -m 60 -X POST \
              -H "Authorization: Bearer ${tok}" -H "X-Derive-Caller-Run: ${CALLER_RUN}" "${DERIVE_URL}?businessId=$3")
            local err; err=$(jq -r '.error // "-"' body.json 2>/dev/null || echo "non-json")
            echo "$1: HTTP $code error=$err (expected $4 $5)"
            echo "$1=$code:$err" >> results.txt
            [ "$code" = "$4" ] && [ "$err" = "$5" ]
          }
          ok=1
          if ! call probe derive 0 400 invalid_business; then
            echo "::error::probe did not return 400 invalid_business — 401 means the #575 code is NOT live; 503 means the Production KNOWLEDGE_DERIVE_SECRET is NOT loaded. Stopping before any other call."
            echo "ok=0" >> "$GITHUB_OUTPUT"; exit 1
          fi
          # businessId=0 is never a derivable target on ANY build: even if the sentinel were somehow wrong,
          # this request cannot create business state. The #575 route refuses it at authentication (401)
          # before the businessId is read.
          call cron_secret cron 0 401 unauthorized || ok=0
          call business_3 derive 3 403 not_enrolled || ok=0
          call business_9 derive 9 403 not_enrolled || ok=0
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          [ "$ok" = 1 ] || { echo "::error::at least one call did not answer as expected"; exit 1; }
          echo "All four calls answered as expected."

      - name: AFTER — verify zero mutation, audit, feature, isolation (read-only)
        if: always() && steps.calls.outcome != 'skipped'
        env:
          OWNER_DATABASE_URL: ${{ secrets.DIRECT_URL }}
          RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
          KNOWLEDGE_DERIVE_SECRET: ${{ secrets.KNOWLEDGE_DERIVE_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node_modules/.bin/tsx scripts/ops/derive-preenrollment-evidence.ts $EVIDENCE_ARGS --phase verify --before before.json --caller-run ${{ github.run_id }}
