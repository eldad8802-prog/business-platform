name: payables phase 1a migration

# PR-1 of the migration-first rule: the three Phase 1a migrations, and NOTHING
# else. No prisma/schema.prisma, no application code — the shape documented in
# scripts/ci/migration-first-guard.mjs.
#
# WHY THE SCHEMA IS NOT HERE. A datamodel change is not automatically inert.
# Phase 1a extends the shared `PaymentMethod` enum, and that enum is read by an
# exhaustiveness guard in the Billing validator: adding two members makes main's
# own code stop compiling until the matching code lands. So the datamodel and
# the code that answers for it travel together, in PR-2, after this migration
# has been applied.
#
# WHAT THIS JOB PROVES. This is the half that reaches PRODUCTION, via the gated
# release-migrate, so the SQL is exercised before the owner is ever offered the
# approval step:
#
#   1. The migrations APPLY to a production-SHAPED database — not to an empty
#      one. Replaying the whole tree from zero is impossible in this repo:
#      20260210120000_billing_invoice_profile_fields fails on an empty database
#      because BusinessProfile's table is not created by any migration. So the
#      baseline is built from the datamodel as it stands on the base branch —
#      i.e. production's shape today — and the three new migrations are applied
#      on top, exactly as release-migrate will apply them.
#
#   2. The structures they promise EXIST: the partial unique index really is
#      partial, and RLS is enabled and forced on all seven tables.
#
#   3. The two migrations documented as idempotent really are — they are run a
#      second time and must succeed unchanged. A partial release-migrate run
#      can then be resumed instead of hand-repaired.
#
# Whether the SQL agrees with the Prisma client is a question about the
# datamodel, which is not in this PR; it is proven in PR-2 (#450) before any
# code merges.
#
# Ephemeral postgres:17. No Neon branch, no shared database, no production
# credential is reachable from this workflow.

on:
  push:
    branches: [feat/payables-phase-1a-migration]
  pull_request:
    paths:
      - "prisma/migrations/20260917090000_payables_phase_1a_foundation/**"
      - "prisma/migrations/20260917090100_payables_phase_1a_tenant_rls/**"
      - "prisma/migrations/20260917090200_payables_phase_1a_obligation_backfill/**"
      - ".github/workflows/payables-phase-1a-migration-ci.yml"

# I-3: explicit least privilege (was the repository default).
permissions:
  contents: read

jobs:
  migration:
    name: payables migration apply (PG17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payables_owner
          POSTGRES_PASSWORD: payables_ci_synthetic_pw
          POSTGRES_DB: dubiz_payables_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payables_owner -d dubiz_payables_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The only database this workflow ever opens. The datamodel declares both
      # url and directUrl, so both must resolve or the schema will not load;
      # there is no pooler in front of a service container, so they are equal.
      DATABASE_URL: postgresql://payables_owner:payables_ci_synthetic_pw@localhost:5432/dubiz_payables_shadow
      DIRECT_URL: postgresql://payables_owner:payables_ci_synthetic_pw@localhost:5432/dubiz_payables_shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Production's shape today. This PR does not change the datamodel, so the
      # checked-out schema IS the pre-payables baseline.
      - name: Build the baseline (production's current shape)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Apply the three migrations, in order
        run: |
          for m in 20260917090000_payables_phase_1a_foundation \
                   20260917090100_payables_phase_1a_tenant_rls \
                   20260917090200_payables_phase_1a_obligation_backfill; do
            echo "── applying $m"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "prisma/migrations/$m/migration.sql"
          done
          echo "all three applied cleanly"

      # The index the datamodel cannot express. A plain unique constraint would
      # forbid re-allocating a pair after a legitimate reversal, so the WHERE
      # clause is the whole point of it and is asserted literally.
      - name: The allocation index is really PARTIAL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "SELECT indexdef FROM pg_indexes
              WHERE indexname = 'PaymentAllocation_active_payment_installment_key';" > idx.txt
          cat idx.txt
          grep -q 'UNIQUE INDEX' idx.txt || { echo "FAIL: not a unique index"; exit 1; }
          grep -q 'WHERE ("reversedAt" IS NULL)' idx.txt || { echo "FAIL: index is not partial on active allocations"; exit 1; }
          echo "OK - unique only across ACTIVE allocations"

      - name: RLS is enabled and FORCED on all seven tables
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relrowsecurity AND c.relforcerowsecurity
                AND c.relname IN ('Payee','Commitment','Installment','Payment',
                                  'PaymentAllocation','PaymentEvidence','PayablesAuditEvent');" > rls.txt
          cat rls.txt
          [ "$(cat rls.txt)" = "7" ] || { echo "FAIL: expected 7 tables with RLS enabled AND forced"; exit 1; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "SELECT count(*) FROM pg_policies
              WHERE schemaname = 'public' AND policyname = 'payables_p1a_tenant';" > pol.txt
          cat pol.txt
          [ "$(cat pol.txt)" = "7" ] || { echo "FAIL: expected 7 tenant policies"; exit 1; }
          echo "OK - 7 tables forced, 7 tenant policies"

      # A release-migrate run that dies halfway must be resumable. The two
      # migrations documented as idempotent are re-applied and must succeed.
      # The foundation migration is deliberately NOT re-run: it creates types
      # and tables outright and is not claimed to be repeatable.
      - name: The idempotent migrations really are idempotent
        run: |
          for m in 20260917090100_payables_phase_1a_tenant_rls \
                   20260917090200_payables_phase_1a_obligation_backfill; do
            echo "── re-applying $m"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "prisma/migrations/$m/migration.sql"
          done
          echo "OK - re-application is a no-op, a partial run can be resumed"
