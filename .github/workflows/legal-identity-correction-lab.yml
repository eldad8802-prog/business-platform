# Migration 20261128100000_legal_identity_correction — correction requests for the confirmed legal identity, on an
# ephemeral PG17 with Production's role topology (.sli/lab.sh on top of .agl/lab.sh --with-issuer):
#   0. the evidence files are SELECT-only and selectable in Production; the proof pins the migration's checksum;
#      the migration names none of #1091's objects;
#   1. baseline (20261128090000 applied, this one pending): PREFLIGHT 9/9; the proof refuses;
#   2. one `prisma migrate deploy` applies 20261128090000 then this one: proof 14/14; #1140's proof still 12/12;
#      PREFLIGHT now fails exactly 2, 4, 5;
#   3. batteries with the real roles: the correction battery C1–C23 (dedicated approver permission, notes, info
#      requests, attachments, app_admin read plane), and #1140's battery L1–L13 still whole;
#   4. atomicity: this migration failing on its last statement leaves nothing of it behind (#1140's stays applied);
#   5. rollback (.sli/correction-rollback.sql): reverts whole — PREFLIGHT 9/9 again, the proof refuses, #1140 intact.
# Synthetic only. ZERO secrets. ZERO network. ZERO Production.

name: legal identity correction — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261128100000_legal_identity_correction/**"
      - "prisma/migrations/20261128090000_signup_legal_identity/**"
      - "ops/evidence/legal-identity-correction-*.sql"
      - "ops/evidence/signup-legal-identity-production-evidence.sql"
      - ".sli/**"
      - ".agl/lab.sh"
      - ".github/workflows/legal-identity-correction-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legal-identity-correction-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: legal identity correction (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: lic_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: lic_ci_synthetic_super_pw
      LAB_PASSWORD: lic_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/legal-identity-correction-preflight.sql
      EVIDENCE: ops/evidence/legal-identity-correction-production-evidence.sql
      SLI_EVIDENCE: ops/evidence/signup-legal-identity-production-evidence.sql
      MIGRATION: prisma/migrations/20261128100000_legal_identity_correction/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable; the proof pins the checksum; no #1091 object named
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "::error::$f is not SELECT-only"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "::error::$f is not selectable in prod-readonly-evidence.yml"; exit 1; }
          done
          sum=$(sha256sum "$MIGRATION" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "::error::the proof pins a different checksum (migration is $sum)"; exit 1; }
          if grep -vE '^\s*--' "$MIGRATION" | grep -nE 'Issuer|issuer_|SeriesOpening|AuthEmailToken'; then
            echo "::error::the migration names an object of the issuer declaration (#1091 / #1105)"; exit 1
          fi
          echo "guard OK; migration checksum $sum"

      - name: 1. Baseline (20261128090000 applied, this one pending) — PREFLIGHT 9/9; the proof refuses
        run: |
          set -euo pipefail
          bash .sli/lab.sh lic_pre --with-sli
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d lic_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "9" || { echo "::error::preflight is not 9/9 before the migration"; exit 1; }
          if out=$(lab -f "$EVIDENCE" 2>&1); then
            echo "$out" | grep -qE '^ +[0-9]+ \| FAIL' || { echo "::error::the proof passed before the migration"; exit 1; }
          fi
          echo "the proof refuses before the migration"

      - name: 2. One migrate deploy applies both — proof 14/14; #1140 proof 12/12; preflight fails exactly 2 4 5
        run: |
          set -euo pipefail
          bash .sli/lab.sh lic_post --with-correction | tee /tmp/post.log
          grep -q "20261128100000_legal_identity_correction" /tmp/post.log || { echo "::error::the migration was not applied"; exit 1; }
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d lic_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "14" || { echo "::error::the proof is not 14/14"; exit 1; }
          got=$(lab -f "$SLI_EVIDENCE" | { grep -cE '^ +[0-9]+ \| PASS' || true; })
          test "$got" = "12" || { echo "::error::#1140's proof is $got/12 after this migration"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 4 5 " || { echo "::error::preflight after the migration fails '$fails', expected '2 4 5 '"; exit 1; }

      - name: 3. Batteries — correction C1–C23 and #1140 L1–L13 (real roles, app_admin read plane)
        run: |
          set -euo pipefail
          export OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/lic_post"
          export RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/lic_post"
          export AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/lic_post"
          export ADMIN_URL="postgresql://lic_admin_login:$LAB_PASSWORD@localhost:5432/lic_post"
          npx tsx .sli/correction-battery.ts
          npx tsx .sli/battery.ts

      - name: 4. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .sli/lab.sh lic_broken --broken-correction
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d lic_broken -v ON_ERROR_STOP=1 -At "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relname IN ('LegalIdentityApprover', 'LegalIdentityCorrectionRequest', 'LegalIdentityCorrectionAttachment'))
                              + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'legal_identity_correction%')")
          test "$left" = "0" || { echo "::error::a failed migration left $left objects behind"; exit 1; }
          done_rows=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261128100000_legal_identity_correction' AND finished_at IS NOT NULL")
          test "$done_rows" = "0" || { echo "::error::the failed migration is recorded as finished"; exit 1; }
          sli=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261128090000_signup_legal_identity' AND finished_at IS NOT NULL")
          test "$sli" = "1" || { echo "::error::20261128090000 should have committed before the failing migration"; exit 1; }
          echo "atomic: nothing left behind"

      - name: 5. Rollback — reverts whole; PREFLIGHT 9/9 again; the proof refuses; #1140 intact
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d lic_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f .sli/correction-rollback.sql
          lab -f "$PREFLIGHT" | tee /tmp/rb.out
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/rb.out)" = "9" || { echo "::error::preflight is not 9/9 after the rollback"; exit 1; }
          if out=$(lab -f "$EVIDENCE" 2>&1); then
            echo "$out" | grep -qE '^ +[0-9]+ \| FAIL' || { echo "::error::the proof still passes after the rollback"; exit 1; }
          fi
          got=$(lab -f "$SLI_EVIDENCE" | { grep -cE '^ +[0-9]+ \| PASS' || true; })
          test "$got" = "12" || { echo "::error::#1140's proof is $got/12 after the rollback"; exit 1; }
          echo "rollback reverts whole"
