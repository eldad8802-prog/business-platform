# Set the Collection QA tenant's password. ONE row, ONE column.
#
# WHY THIS EXISTS
#
# The QA tenant was provisioned with an unusable credential: the local secret
# file held a UTF-8 byte-order mark and nothing else, so the stored password is
# the single character U+FEFF. The login API accepts it; the login FORM cannot
# submit it, because the submit button is disabled while `password.trim()` is
# empty. The product has no change-password and no reset route, so the account
# is unreachable through the product it exists to test.
#
# This is the narrowest write that repairs it, behind the same gates as
# everything else that touches Production.
#
# WHAT IT CAN DO: assign one column, `password`, on one row pinned four ways —
# user id, address, business id, business name. Nothing else, nowhere else. The
# containment guard proves that statically before a connection is opened, and
# the pre-flight below refuses the run unless exactly ONE row matches all four.
#
# WHAT IT DOES NOT DO: create anything, delete anything, touch another column
# (`updatedAt` included — the approval was for the credential alone), touch
# another user, or touch another tenant.
#
# GATES, in the order they stop a mistake:
#   1. manual dispatch only, no inputs
#   2. the production-db environment — human approval, every run
#   3. the containment guard reads both SQL files BEFORE anything connects
#   4. the host allowlist pins the connection to the verified Production endpoint
#   5. the hash must be bcrypt cost 10, or the run stops
#   6. a read-only pre-flight: exactly one row matches, or the run stops
#   7. the write itself: one transaction, one UPDATE, RETURNING the row it hit
#   8. a read-only verification afterwards, asserted line by line

name: Prod — set the Collection QA tenant password

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-collection-qa-tenant-password
  cancel-in-progress: false

jobs:
  repair:
    name: Set the Collection QA tenant password (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-db

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Containment guard (one row, one column, approved target only)
        run: node scripts/ci/collection-qa-tenant-guard.mjs

      - name: Host allowlist assertion (verified Production only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          ALLOW="ep-flat-brook-am4bhq1y"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set in the production-db environment."; exit 1
          fi
          case "$DIRECT_URL" in
            *"$ALLOW"*) echo "Host allowlist OK: DIRECT_URL targets endpoint $ALLOW." ;;
            *) echo "::error::DIRECT_URL does not target the verified Production endpoint ($ALLOW) — aborting."; exit 1 ;;
          esac

      - name: Credential shape (bcrypt cost 10, never printed)
        env:
          QA_PASSWORD_HASH: ${{ secrets.COLLECTION_QA_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            const { BCRYPT_COST_10_SHAPE } = await import("./scripts/ci/collection-qa-tenant-hash-shape.mjs");
            const hash = process.env.QA_PASSWORD_HASH ?? "";
            if (hash === "") {
              console.error("::error::COLLECTION_QA_PASSWORD_HASH is not set in the production-db environment.");
              process.exit(1);
            }
            if (!BCRYPT_COST_10_SHAPE.test(hash)) {
              console.error("::error::the secret is not a bcrypt cost-10 hash (length " + hash.length + "). Refusing to write a credential nobody can log in with.");
              process.exit(1);
            }
            console.log("Credential shape OK: bcrypt cost 10, 60 characters.");
          '

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      # Gate 6. The precondition, asked before the write rather than asserted
      # after it: exactly one row may match all four identifiers. Zero means the
      # target moved and the run must not guess; more than one is impossible and
      # therefore worth stopping for.
      - name: Pre-flight — exactly one target row
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          set -a; . ./ops/tenant/collection-qa-tenant.identity.env; set +a

          TARGETS=$({
            printf "\\set qa_email '%s'\n" "$COLLECTION_QA_EMAIL"
            printf "\\set qa_business_name '%s'\n" "$COLLECTION_QA_BUSINESS_NAME"
            printf "\\set qa_user_id %s\n" "$COLLECTION_QA_USER_ID"
            printf "\\set qa_business_id %s\n" "$COLLECTION_QA_BUSINESS_ID"
            printf 'SELECT count(*) FROM "User" u JOIN "Business" b ON b."id" = u."businessId" WHERE u."id" = :qa_user_id AND u."email" = :%s AND u."businessId" = :qa_business_id AND b."name" = :%s;\n' "'qa_email'" "'qa_business_name'"
          } | psql "$DIRECT_URL" --no-psqlrc -tAX --set=ON_ERROR_STOP=1 -f -)

          echo "rows matching the approved target: $TARGETS"
          if [ "$TARGETS" != "1" ]; then
            echo "::error::expected exactly one target row, found $TARGETS — refusing to write."; exit 1
          fi

      - name: Repair (one transaction, one UPDATE)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          QA_PASSWORD_HASH: ${{ secrets.COLLECTION_QA_PASSWORD_HASH }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          set -a; . ./ops/tenant/collection-qa-tenant.identity.env; set +a

          {
            printf "\\set qa_email '%s'\n" "$COLLECTION_QA_EMAIL"
            printf "\\set qa_business_name '%s'\n" "$COLLECTION_QA_BUSINESS_NAME"
            printf "\\set qa_user_id %s\n" "$COLLECTION_QA_USER_ID"
            printf "\\set qa_business_id %s\n" "$COLLECTION_QA_BUSINESS_ID"
            printf "\\set qa_password_hash '%s'\n" "$QA_PASSWORD_HASH"
            cat ops/tenant/collection-qa-tenant-password.sql
          } | psql "$DIRECT_URL" --no-psqlrc --set=ON_ERROR_STOP=1 -f - | tee repair.out

          grep -q "REPAIR" repair.out || {
            echo "::error::the UPDATE returned no row — nothing was changed"; exit 1; }
          grep -q "UPDATE 1" repair.out || {
            echo "::error::the UPDATE did not report exactly one row"; exit 1; }
          echo "Exactly one row updated."

      - name: Verify (read-only) and assert every invariant
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          set -a; . ./ops/tenant/collection-qa-tenant.identity.env; set +a

          {
            printf "\\set qa_email '%s'\n" "$COLLECTION_QA_EMAIL"
            printf "\\set qa_business_name '%s'\n" "$COLLECTION_QA_BUSINESS_NAME"
            printf "\\set qa_user_name '%s'\n" "$COLLECTION_QA_USER_NAME"
            printf "\\set qa_user_id %s\n" "$COLLECTION_QA_USER_ID"
            cat ops/tenant/collection-qa-tenant-password-verify.sql
          } | psql "$DIRECT_URL" --no-psqlrc -tAX --set=ON_ERROR_STOP=1 -f - | tee verify.out

          LINE=$(grep '^VERIFY_PASSWORD|' verify.out || true)
          if [ -z "$LINE" ]; then
            echo "::error::verification returned no row"; exit 1
          fi

          IFS='|' read -r _ USER_COUNT BUSINESS_COUNT USER_ID BUSINESS_ID LINK_OK ROLE \
            TOKEN_VERSION LOGIN_COUNT BCRYPT_OK HASH_LENGTH FINGERPRINT \
            USER_NAME_OK BUSINESS_NAME_OK BUSINESS_LIVE CONNECTIONS DOCUMENTS REQUESTS <<< "$LINE"

          fail=0
          assert() {
            if [ "$2" = "$3" ]; then echo "  ok   $1 = $3"
            else echo "::error::$1 is '$2', expected '$3'"; fail=1; fi
          }

          assert "exactly one user with that address" "$USER_COUNT" "1"
          assert "exactly one business with that name" "$BUSINESS_COUNT" "1"
          assert "user id"                             "$USER_ID" "$COLLECTION_QA_USER_ID"
          assert "business id"                         "$BUSINESS_ID" "$COLLECTION_QA_BUSINESS_ID"
          assert "the user is linked to that business" "$LINK_OK" "t"
          assert "role"                                "$ROLE" "USER"
          assert "token generation"                    "$TOKEN_VERSION" "0"
          assert "credential is bcrypt cost 10"        "$BCRYPT_OK" "t"
          assert "credential length"                   "$HASH_LENGTH" "60"
          assert "display name"                        "$USER_NAME_OK" "t"
          assert "business name"                       "$BUSINESS_NAME_OK" "t"
          assert "business is live"                    "$BUSINESS_LIVE" "t"

          echo "credential fingerprint: $FINGERPRINT (of the hash, not the password)"
          echo "logins so far: $LOGIN_COUNT"
          echo "provider connections: $CONNECTIONS   documents: $DOCUMENTS   payment requests: $REQUESTS"

          [ "$fail" = "0" ] || exit 1
          echo "COLLECTION QA TENANT PASSWORD: REPAIRED AND VERIFIED"
