# security/gate — the one check that runs the security proof system on EVERY change.
#
# No path filter: a security regression can arrive from any file, and a gate that only
# wakes for "relevant" paths is a gate a change can walk around. It runs:
#
#   1. the self-tests of every guard below (each guard must be able to FAIL);
#   2. the AST security guard (ad-hoc PrismaClient, tenant-client fallbacks/bare access
#      pinned in an exact-set ratchet, privileged-client reachability, admin handlers);
#   3. the delivery-pipeline policy guard (permissions, SHA pins, secrets only in protected
#      main-only environments, no push/PR triggers on secret-bearing workflows);
#   4. the evidence-output guard (Production evidence never prints row data);
#   5. the test-coverage inventory (every test classified; every SECURITY_REQUIRED test
#      invoked) and then EVERY SECURITY_REQUIRED test itself, straight from the manifest,
#      in four labs: pure · test-db (app-layer, fresh DB per test) · rls-db (NOSUPERUSER
#      NOBYPASSRLS runtime role, refuses otherwise) · owner-lab (empty DB, shipped DDL).
#
# Synthetic, CI-only credentials. ZERO repository secrets, ZERO network targets, ZERO
# Production. The job name is the required-check context: `security/gate`.

name: security-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: security/gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gate_owner
          POSTGRES_PASSWORD: gate_ci_synthetic_owner_pw
          POSTGRES_DB: gate_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gate_owner -d gate_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      GATE_PG_URL: postgresql://gate_owner:gate_ci_synthetic_owner_pw@localhost:5432/gate_admin
      GATE_PG_TEMPLATE: gate_template
      GATE_RLS_ROLE: gate_runtime
      GATE_RLS_PASSWORD: gate_ci_synthetic_runtime_pw
      TEMPLATE_URL: postgresql://gate_owner:gate_ci_synthetic_owner_pw@localhost:5432/gate_template

    steps:
      - name: Checkout (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # A pinned test runner, installed once, outside the project tree (no lockfile change).
      - name: Install tsx (pinned)
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/tsx" --no-audit --no-fund --no-save tsx@4.23.15 >/dev/null
          echo "TSX_CLI=$RUNNER_TEMP/tsx/node_modules/tsx/dist/cli.mjs" >> "$GITHUB_ENV"

      # ── 1. every guard proves it can fail ──────────────────────────────────
      - name: Guard self-tests (each must be able to fail)
        run: |
          set -euo pipefail
          node scripts/ci/negative-proof.mjs --self-test
          node scripts/ci/ast-security-guard.mjs --self-test
          node scripts/ci/workflow-policy-guard.mjs --self-test
          node scripts/ci/evidence-output-guard.mjs --self-test
          node scripts/ci/evidence-redact.mjs --self-test
          node scripts/ci/security-test-coverage.mjs --self-test

      # ── 2-4. static guards on the real tree ───────────────────────────────
      - name: AST security guard (F-7 / F-11)
        run: node scripts/ci/ast-security-guard.mjs .

      # The legacy tenant guards used to run only on narrow path filters; here they run on
      # every change, beside the AST guard that supersedes their grep logic.
      - name: Tenant guards on every PR (tenant-scoped access, tenant context, admin boundary)
        run: |
          set -euo pipefail
          node scripts/ci/tenant-scoped-access-guard.mjs .
          bash scripts/ci/tenant-context-guard.sh .
          bash scripts/ci/admin-boundary-guard.sh .

      - name: Workflow policy guard (H-3 / I-3 / L-21)
        run: node scripts/ci/workflow-policy-guard.mjs .

      - name: Evidence output guard (M-1)
        run: node scripts/ci/evidence-output-guard.mjs . --sql

      # ── 5. inventory, then the tests themselves ───────────────────────────
      - name: Test-coverage inventory (every test classified, every security test invoked)
        run: node scripts/ci/security-test-coverage.mjs

      - name: Security tests — lab pure
        run: node scripts/ci/security-test-coverage.mjs --run --lab pure

      # ── the gate's OWN negative proofs ───────────────────────────────────
      # Each breaks one property this gate exists to protect, in the real tree, and requires
      # the gate component to go red for THAT reason (label), not merely exit non-zero; the
      # file is restored byte-identical (sha256) and the positive steps above are the GREEN.
      - name: Gate self-proof G1 — an aliased, multi-line PrismaClient is caught (AST-1)
        run: |
          node scripts/ci/negative-proof.mjs --id G1-ast-prismaclient --file lib/services/crm/customer.service.ts \
            --anchor 'import { prisma } from "@/lib/prisma";' \
            --replace 'import { prisma } from "@/lib/prisma"; import { PrismaClient as C } from "@prisma/client"; export const g1 = new
            C();' \
            --expect '[FAIL] AST-1 lib/services/crm/customer.service.ts' \
            -- node scripts/ci/ast-security-guard.mjs .

      - name: Gate self-proof G2 — a new run(prisma) tenant fallback is caught (AST-2 ratchet)
        run: |
          node scripts/ci/negative-proof.mjs --id G2-ast-fallback --file lib/services/crm/customer.service.ts \
            --anchor 'import { prisma } from "@/lib/prisma";' \
            --replace 'import { prisma } from "@/lib/prisma"; export function g2(o?: { tx?: unknown }) { const run = (db: unknown) => db; return o?.tx ? run(o.tx) : run(prisma); }' \
            --expect '[FAIL] AST-2 NEW-SITE lib/services/crm/customer.service.ts::g2::arg' \
            -- node scripts/ci/ast-security-guard.mjs .

      - name: Gate self-proof G3 — a security test dropped from the inventory is caught (C1)
        run: |
          node scripts/ci/negative-proof.mjs --id G3-coverage-unclassified --file scripts/ci/test-coverage/workstream-a.json \
            --anchor '"lib/auth/token-revocation.verify.test.ts": {' \
            --replace '"lib/auth/token-revocation.verify.test.ts.removed": {' \
            --expect '[FAIL] C1 UNCLASSIFIED lib/auth/token-revocation.verify.test.ts' \
            -- node scripts/ci/security-test-coverage.mjs

      - name: Gate self-proof G4 — a broken token signature check fails the security suite
        run: |
          node scripts/ci/negative-proof.mjs --id G4-token-signature --file lib/auth-token.ts \
            --anchor '    !timingSafeEqual(receivedSig, expectedSig)' \
            --replace '    false' \
            --expect 'editing the generation breaks the signature' \
            -- node "$TSX_CLI" lib/auth/token-revocation.verify.test.ts

      - name: Gate self-proof G5 — an unpinned action is caught (WP-2)
        run: |
          node scripts/ci/negative-proof.mjs --id G5-unpinned-action --file .github/workflows/release-migrate.yml \
            --anchor 'uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0' \
            --replace 'uses: actions/setup-node@v4' \
            --expect '[FAIL] WP-2 release-migrate.yml: unpinned action actions/setup-node@v4' \
            -- node scripts/ci/workflow-policy-guard.mjs .

      - name: Build the lab template (schema + NOBYPASSRLS runtime role)
        env:
          DATABASE_URL: ${{ env.TEMPLATE_URL }}
          DIRECT_URL: ${{ env.TEMPLATE_URL }}
        run: |
          set -euo pipefail
          psql "$GATE_PG_URL" -v ON_ERROR_STOP=1 -qc "CREATE DATABASE gate_template"
          npx prisma db push --skip-generate --accept-data-loss
          psql "$GATE_PG_URL" -v ON_ERROR_STOP=1 -qc "CREATE ROLE gate_runtime LOGIN PASSWORD 'gate_ci_synthetic_runtime_pw' NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE"
          psql "$TEMPLATE_URL" -v ON_ERROR_STOP=1 -qc "GRANT USAGE ON SCHEMA public TO gate_runtime; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO gate_runtime; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO gate_runtime;"
          # The runtime role must be able to FAIL an isolation proof: assert its posture.
          test "$(psql "$GATE_PG_URL" -tAc "SELECT rolsuper::text||','||rolbypassrls::text FROM pg_roles WHERE rolname='gate_runtime'")" = "false,false"

      - name: Security tests — lab test-db (app layer, fresh database per test)
        run: node scripts/ci/security-test-coverage.mjs --run --lab test-db

      - name: Security tests — lab rls-db (NOSUPERUSER NOBYPASSRLS runtime role)
        run: node scripts/ci/security-test-coverage.mjs --run --lab rls-db

      - name: Gate self-proof G6 — the rls-db lab refuses a role that bypasses RLS (F-5)
        run: |
          node scripts/ci/expect-red.mjs --id G6-rls-lab-refuses-superuser \
            --expect "must be NOSUPERUSER NOBYPASSRLS" --expect "SECURITY-GATE LAB rls-db: FAIL" \
            -- env GATE_RLS_ROLE=gate_owner GATE_RLS_PASSWORD=gate_ci_synthetic_owner_pw node scripts/ci/security-test-coverage.mjs --run --lab rls-db

      - name: Security tests — lab owner-lab (empty database, shipped DDL)
        run: node scripts/ci/security-test-coverage.mjs --run --lab owner-lab
