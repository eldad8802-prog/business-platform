name: Prod Proof rehearsal (Payables Phases 4-6)

# Runs the EXACT Production proof script against an ephemeral postgres:17 before
# anyone is asked to approve it against Production. A proof that errors on its
# own syntax, or a claim line that can never fire, should cost a CI run — not an
# owner approval on the production-db gate.
#
# The baseline is built the same way as the Phase 3 migration CI (the tree
# cannot be replayed from zero): main's datamodel via `db push`, then the Phase
# 3 migration SQL on top, then a `_prisma_migrations` row recording it as
# finished, because the proof's structural assertion reads that table.
#
# The claim list is NOT duplicated here: it is read out of the Production
# workflow, so the rehearsal checks precisely what Production will check.

on:
  pull_request:
    paths:
      - "prisma/migrations/20260922130000_payables_p4_p6_outbound_foundation/**"
      - "ops/evidence/payables-p4-p6-evidence.sql"
      - ".github/workflows/prod-proof-payables-p4-p6.yml"
      - ".github/workflows/prod-proof-payables-p4-p6-rehearsal.yml"

permissions:
  contents: read

jobs:
  rehearsal:
    name: payables p4-p6 migration + proof rehearsal (PG17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payables_owner
          POSTGRES_PASSWORD: payables_ci_synthetic_pw
          POSTGRES_DB: dubiz_p46_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payables_owner -d dubiz_p46_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://payables_owner:payables_ci_synthetic_pw@localhost:5432/dubiz_p46_rehearsal
      DIRECT_URL: postgresql://payables_owner:payables_ci_synthetic_pw@localhost:5432/dubiz_p46_rehearsal
      MIG_NAME: 20260922130000_payables_p4_p6_outbound_foundation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build the baseline (production shape before Phases 4-6)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Apply the Phase 3 migration and record it as finished
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "prisma/migrations/$MIG_NAME/migration.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q <<SQL
          CREATE TABLE IF NOT EXISTS _prisma_migrations (
            id                  VARCHAR(36) PRIMARY KEY,
            checksum            VARCHAR(64) NOT NULL,
            finished_at         TIMESTAMPTZ,
            migration_name      VARCHAR(255) NOT NULL,
            logs                TEXT,
            rolled_back_at      TIMESTAMPTZ,
            started_at          TIMESTAMPTZ NOT NULL DEFAULT now(),
            applied_steps_count INTEGER NOT NULL DEFAULT 0
          );
          INSERT INTO _prisma_migrations (id, checksum, finished_at, migration_name, applied_steps_count)
          VALUES ('rehearsal-p46', 'rehearsal', now(), '$MIG_NAME', 1);
          SQL

      - name: Run the Production proof script, unmodified
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file=ops/evidence/payables-p4-p6-evidence.sql \
            2>&1 | tee proof.out

      - name: Every claim the Production workflow checks actually fired
        run: |
          set -euo pipefail
          grep -oE "'PROOF [^']+'" .github/workflows/prod-proof-payables-p4-p6.yml \
            | tr -d "'" > claims.txt
          n=$(wc -l < claims.txt)
          [ "$n" -ge 22 ] || { echo "::error::expected at least 22 claims, read $n"; exit 1; }
          while IFS= read -r claim; do
            grep -qF "$claim" proof.out || { echo "::error::claim never fired: $claim"; exit 1; }
            echo "  fired: $claim"
          done < claims.txt
          echo "All $n claims fired in rehearsal."
