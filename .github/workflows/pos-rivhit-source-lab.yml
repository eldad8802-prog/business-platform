name: s1a — pos.rivhit source migration lab (ephemeral PG17)

# Migration 20261104090000_pos_rivhit_source on a Production-topology lab: preflight before, proof after,
# behaviour of the widened CHECKs, atomicity, rollback. Synthetic credentials only; no network beyond the runner.

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261104090000_pos_rivhit_source/**"
      - "ops/evidence/pos-rivhit-source-*.sql"
      - ".s1a/**"
      - ".rev/lab.sh"
      - ".github/workflows/pos-rivhit-source-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: S1-A migration lab (PG17, Production topology, migrate deploy, proof, CHECK behaviour, atomicity, rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: s1a_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: s1a_ci_synthetic_super_pw
      LAB_PASSWORD: s1a_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/pos-rivhit-source-preflight.sql
      EVIDENCE: ops/evidence/pos-rivhit-source-production-evidence.sql
      S1A: prisma/migrations/20261104090000_pos_rivhit_source/migration.sql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Both files pass the Production workflow's SELECT-only guard and are selectable there; checksum pinned
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          sum=$(sha256sum "$S1A" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum (file is $sum)"; exit 1; }
          echo "S1-A sha256 $sum (pinned)"

      - name: 1. Production before S1-A — PREFLIGHT 9/9; the proof fails exactly what S1-A adds
        run: |
          set -euo pipefail
          bash .s1a/lab.sh s1a_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d s1a_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/pre.out; then echo "preflight fails on the pre-S1-A lab"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "9" || { echo "expected 9 PASS"; exit 1; }
          fails=$(lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          echo "proof on the pre-S1-A lab fails: $fails"
          test "$fails" = "1 3 4 5 7 8 9 " || { echo "expected 1 3 4 5 7 8 9"; exit 1; }

      - name: 2. S1-A by prisma migrate deploy — PROOF 11/11; the preflight fails exactly its S1-A-absent checks
        run: |
          set -euo pipefail
          bash .s1a/lab.sh s1a_post --with-s1a
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d s1a_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/post.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/post.out; then echo "proof FAILS after a correct apply"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/post.out)" = "11" || { echo "expected 11 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 3 4 6 9 " || { echo "post-S1-A lab: expected preflight 2 3 4 6 9 to fail, got: $fails"; exit 1; }

      - name: 3. The widened CHECKs — pos.rivhit needs its company id and an encrypted credential; revenue is a route target
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d s1a_post -v ON_ERROR_STOP=1 "$@"; }
          bid=$(lab -Atc "INSERT INTO \"Business\" (name, \"updatedAt\") VALUES ('s1a-check-lab', now()) RETURNING id" | head -1)
          ok() { lab -q -c "$1" >/dev/null; }
          refused() { if lab -q -c "$1" >/dev/null 2>&1; then echo "accepted but must be refused: $2"; exit 1; fi; echo "refused: $2"; }
          ok "INSERT INTO \"AcquisitionConnection\" (\"businessId\", \"sourceKey\", \"publicId\", \"externalResourceId\", \"credentialCiphertext\", \"credentialIv\", \"credentialTag\", \"credentialKeyId\", \"updatedAt\") VALUES ($bid, 'pos.rivhit', 'pubs1alab000000000000001', '1001', 'c', 'i', 't', 'acq-v1', now())"
          echo "accepted: pos.rivhit with company id + encrypted credential"
          refused "INSERT INTO \"AcquisitionConnection\" (\"businessId\", \"sourceKey\", \"publicId\", \"credentialCiphertext\", \"credentialIv\", \"credentialTag\", \"credentialKeyId\", \"updatedAt\") VALUES ($bid, 'pos.rivhit', 'pubs1alab000000000000002', 'c', 'i', 't', 'acq-v1', now())" "pos.rivhit without a company id"
          refused "INSERT INTO \"AcquisitionConnection\" (\"businessId\", \"sourceKey\", \"publicId\", \"externalResourceId\", \"updatedAt\") VALUES ($bid, 'pos.rivhit', 'pubs1alab000000000000003', '1002', now())" "pos.rivhit without a credential"
          refused "INSERT INTO \"AcquisitionConnection\" (\"businessId\", \"sourceKey\", \"publicId\", \"externalResourceId\", \"credentialCiphertext\", \"credentialIv\", \"credentialTag\", \"credentialKeyId\", \"updatedAt\") VALUES ($bid, 'pos.rivhit', 'pubs1alab000000000000004', '1001', 'c', 'i', 't', 'acq-v1', now())" "the same Rivhit company live twice"
          refused "INSERT INTO \"AcquisitionConnection\" (\"businessId\", \"sourceKey\", \"publicId\", \"externalResourceId\", \"credentialCiphertext\", \"credentialIv\", \"credentialTag\", \"credentialKeyId\", \"updatedAt\") VALUES ($bid, 'pos.other', 'pubs1alab000000000000005', '1003', 'c', 'i', 't', 'acq-v1', now())" "an unknown pos.* source"
          for v in revenue call commerce; do
            test "$(lab -Atc "SELECT count(*) FROM pg_constraint WHERE conname = 'IntakeNormalizedEvent_routeTarget_vocab' AND pg_get_constraintdef(oid) LIKE '%''$v''%'")" = "1" || { echo "route vocabulary lacks $v"; exit 1; }
          done
          echo "route vocabulary: revenue added, call and commerce kept"
          lab -q -c "DELETE FROM \"AcquisitionConnection\" WHERE \"businessId\" = $bid" -c "DELETE FROM \"Business\" WHERE id = $bid"

      - name: 4. Atomicity — S1-A failing on its last statement leaves nothing behind
        run: |
          set -euo pipefail
          bash .s1a/lab.sh s1a_broken --broken-s1a
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d s1a_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -Atc "SELECT (SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE key = 'pos_rivhit')
                              + (SELECT count(*) FROM \"PlatformFeaturePolicy\" WHERE \"featureKey\" = 'pos_rivhit')
                              + (SELECT count(*) FROM pg_constraint WHERE pg_get_constraintdef(oid) LIKE '%pos.rivhit%' OR pg_get_constraintdef(oid) LIKE '%''revenue''%')")
          led=$(lab -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261104090000_pos_rivhit_source' AND finished_at IS NULL")
          echo "objects left=$left unfinished ledger rows=$led"
          test "$left" = "0" && test "$led" = "1" || { echo "NOT atomic"; exit 1; }

      - name: 5. Rollback (.s1a/rollback.sql) — refused while a pos.rivhit connection exists; then back to a whole preflight
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d s1a_post -v ON_ERROR_STOP=1 "$@"; }
          bid=$(lab -Atc "INSERT INTO \"Business\" (name, \"updatedAt\") VALUES ('s1a-rollback-guard', now()) RETURNING id" | head -1)
          lab -q -c "INSERT INTO \"AcquisitionConnection\" (\"businessId\", \"sourceKey\", \"publicId\", \"externalResourceId\", \"credentialCiphertext\", \"credentialIv\", \"credentialTag\", \"credentialKeyId\", \"updatedAt\") VALUES ($bid, 'pos.rivhit', 'pubs1alab000000000000009', '1009', 'c', 'i', 't', 'acq-v1', now())"
          if lab -1 -f .s1a/rollback.sql 2>/tmp/rb.err; then echo "rollback ran while a pos.rivhit connection existed"; exit 1; fi
          grep -q "rollback refused" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          echo "rollback refused while in use"
          lab -q -c "DELETE FROM \"AcquisitionConnection\" WHERE \"businessId\" = $bid" -c "DELETE FROM \"Business\" WHERE id = $bid"
          lab -q -1 -f .s1a/rollback.sql
          lab -f "$PREFLIGHT" | tee /tmp/rb.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/rb.out; then echo "after rollback the preflight is not whole"; exit 1; fi
          echo "rollback → preflight whole again (9/9)"
