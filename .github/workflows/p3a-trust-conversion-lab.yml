# P3-A / migrations 20261008090000_p3a_identity_enum_values + 20261008090100_p3a_trust_claims —
# proof on PostgreSQL BEFORE they reach Production (ephemeral PG17), as part of the JOINT release.
#
# M6 (20261009090000_m6_acquisition_connections) merged before P3-A and sorts after it, and
# `prisma migrate deploy` applies every pending migration in order — so one release-migrate run applies
# P3-A #1, P3-A #2 and M6. The workstreams stay separate (own migrations, proofs, approval records);
# this lab proves P3-A inside that real release.
#
# .p3a/lab.sh builds Production as it is before the joint release: 168 migrations applied
# (learning-coverage policies the last), the P2 tables built by the real P2 migration; non-superuser
# CREATEROLE/BYPASSRLS owner, NOLOGIN app_runtime + LOGIN app_runtime_prod, the owner's default
# privileges, app_auth / app_ctlplane, the D2 E4 narrowing; Business under B4's FORCE RLS.
#
#   1. Shared baseline: P3-A PREFLIGHT 20/20 (name-level: pending = exactly the three; 20 = M6 not built) and M6's own
#      PREFLIGHT 19/19 on the SAME lab; the P3-A proof fails exactly what P3-A creates.
#   2. The joint release by `prisma migrate deploy` (exactly three, in order): P3-A proof 20/20 AND
#      M6's own proof 15/15 on the same database; the P3-A preflight then fails exactly its
#      "not there yet" checks; ledger = 171.
#   3. Non-interaction: the catalog fingerprint of everything P3-A and P2 own is identical with and
#      without M6, and M6's SQL names none of those objects.
#   4. Release gate: the real gate allows exactly the three, and refuses any other expected set, a
#      fourth migration merged while a run waits, and an unfinished ledger row.
#   5. Battery (.p3a/battery.ts) as app_runtime_prod on the joint database.
#   6. Atomicity: P3-A #2 failing on its last statement leaves nothing of it behind, and M6 never runs.
#   7. Faults: DELETE grant, column change grant on "wording", NO FORCE, permissive FOR ALL — each
#      caught by the check meant for it.
#   8. Rollback in reverse release order (M6's, then P3-A's): P3-A #2 reverted whole, labels inert,
#      re-apply makes BOTH proofs whole; refused while a claim exists.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: p3a — trust + conversion migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261008090000_p3a_identity_enum_values/**"
      - "prisma/migrations/20261008090100_p3a_trust_claims/**"
      - "prisma/migrations/20261009090000_m6_acquisition_connections/**"
      - "ops/evidence/p3a-trust-conversion-*.sql"
      - "ops/evidence/m6-acquisition-connections-*.sql"
      - ".p3a/**"
      - ".m6/rollback.sql"
      - "scripts/ci/release-migrate-gate.mjs"
      - ".github/workflows/p3a-trust-conversion-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: p3a trust + conversion (PG17, real migrations via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: p3a_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: p3a_ci_synthetic_super_pw
      LAB_PASSWORD: p3a_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/p3a-trust-conversion-preflight.sql
      EVIDENCE: ops/evidence/p3a-trust-conversion-production-evidence.sql
      M6_PREFLIGHT: ops/evidence/m6-acquisition-connections-preflight.sql
      M6_EVIDENCE: ops/evidence/m6-acquisition-connections-production-evidence.sql
      P3A_ENUMS: prisma/migrations/20261008090000_p3a_identity_enum_values/migration.sql
      P3A: prisma/migrations/20261008090100_p3a_trust_claims/migration.sql
      M6: prisma/migrations/20261009090000_m6_acquisition_connections/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable in Production; checksums pinned; 171 migrations
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE" "$M6_PREFLIGHT" "$M6_EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          for m in "$P3A_ENUMS" "$P3A"; do
            sum=$(sha256sum "$m" | cut -d' ' -f1)
            grep -q "'$sum'" "$EVIDENCE" || { echo "the P3-A proof pins a different checksum for $m"; exit 1; }
            echo "$m sha256 $sum (pinned)"
          done
          sum=$(sha256sum "$M6" | cut -d' ' -f1)
          grep -q "$sum" "$M6_EVIDENCE" || { echo "the M6 proof pins a different checksum"; exit 1; }
          echo "$M6 sha256 $sum (pinned by M6's own proof)"
          test "$(ls -d prisma/migrations/*/ | wc -l)" = "171" || { echo "expected 171 migration directories (168 applied + the three pending)"; exit 1; }

      - name: 1. Shared baseline (168 applied; P3-A pair + M6 pending) — P3-A PREFLIGHT 20/20 and M6 PREFLIGHT 19/19 on the same lab
        run: |
          set -euo pipefail
          bash .p3a/lab.sh p3a_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3a_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/pre.out; then echo "P3-A preflight FAILS on the shared baseline"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "20" || { echo "expected 20 PASS"; exit 1; }
          lab -f "$M6_PREFLIGHT" | tee /tmp/m6pre.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/m6pre.out; then echo "M6 preflight FAILS on the shared baseline"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/m6pre.out)" = "19" || { echo "expected 19 M6 PASS"; exit 1; }
          fails=$(lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          echo "P3-A proof on the shared baseline fails: $fails"
          test "$fails" = "1 2 4 5 6 7 8 10 11 12 13 14 15 16 18 " || { echo "expected 1 2 4 5 6 7 8 10 11 12 13 14 15 16 18"; exit 1; }
          test "$(lab -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")" = "168"

      - name: 2. The joint release by prisma migrate deploy — exactly three, in order; P3-A proof 20/20 AND M6 proof 15/15; ledger 171
        run: |
          set -euo pipefail
          bash .p3a/lab.sh p3a_joint --joint | tee /tmp/joint.out
          order=$(grep 'Applying migration' /tmp/joint.out | awk -F'`' '{print $2}' | tr '\n' ' ')
          echo "applied: $order"
          test "$order" = "20261008090000_p3a_identity_enum_values 20261008090100_p3a_trust_claims 20261009090000_m6_acquisition_connections " || { echo "unexpected set/order"; exit 1; }
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3a_joint -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/post.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/post.out; then echo "P3-A proof FAILS after the joint release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/post.out)" = "20" || { echo "expected 20 PASS"; exit 1; }
          lab -f "$M6_EVIDENCE" | tee /tmp/m6post.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/m6post.out; then echo "M6 proof FAILS after the joint release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/m6post.out)" = "15" || { echo "expected 15 M6 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "3 4 5 6 7 8 9 10 11 20 " || { echo "after the joint release: expected P3-A preflight '3 4 5 6 7 8 9 10 11 20 ' to fail, got: $fails"; exit 1; }
          test "$(lab -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")" = "171"

      - name: 3. Non-interaction — M6 changes nothing P3-A or P2 owns
        run: |
          set -euo pipefail
          bash .p3a/lab.sh p3a_only --with-p3a >/dev/null
          fp() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d "$1" -v ON_ERROR_STOP=1 -Atf .p3a/surface-fingerprint.sql; }
          a=$(fp p3a_only); b=$(fp p3a_joint)
          echo "P3-A pair only : $a"
          echo "P3-A pair + M6 : $b"
          test "$a" = "$b" || { echo "M6 changed the P3-A / P2 catalog surface"; exit 1; }
          if grep -nE 'BusinessTrustClaim|BusinessIdentity|ConversionChannel|TrustClaim|TrustVerification|PUBLIC_WHATSAPP|CONVERSION_DECLARATION' "$M6"; then
            echo "M6 names a P3-A / P2 object"; exit 1
          fi
          echo "M6 names no P3-A / P2 object; the surface fingerprint is identical with and without M6"

      - name: 4. Release gate — the real gate allows exactly the three, nothing else
        run: |
          set -euo pipefail
          bash .p3a/gate-proof.sh p3a_pre

      - name: 5. Battery — isolation, authority, constraints, P2 extensions, cascade (as app_runtime_prod, joint database)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/p3a_joint" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/p3a_joint" \
            npx tsx .p3a/battery.ts

      - name: 6. Atomicity — P3-A #2 failing leaves nothing of it behind, and M6 never runs
        run: |
          set -euo pipefail
          bash .p3a/lab.sh p3a_broken --broken-p3a
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3a_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -Atc "SELECT (SELECT count(*) FROM pg_class WHERE relname LIKE 'BusinessTrustClaim%') + (SELECT count(*) FROM pg_type WHERE typname IN ('ConversionChannel','TrustClaimKind','TrustClaimClass','TrustClaimStatus','TrustVerificationMethod')) + (SELECT count(*) FROM pg_attribute WHERE attrelid = '\"BusinessIdentityStatement\"'::regclass AND attname = 'channel')")
          led=$(lab -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261008090100_p3a_trust_claims' AND finished_at IS NULL")
          m6=$(lab -Atc "SELECT (SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261009090000_m6_acquisition_connections') + (SELECT count(*) FROM pg_class WHERE relname LIKE 'AcquisitionConnection%')")
          echo "P3-A #2 objects left=$left unfinished ledger rows=$led M6 rows+objects=$m6"
          test "$left" = "0" && test "$led" = "1" && test "$m6" = "0" || { echo "NOT atomic, or M6 ran after a failure"; exit 1; }

      - name: 7. Faults — each is caught by the P3-A proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3a_joint -v ON_ERROR_STOP=1 "$@"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "DELETE grant to runtime" "7 9 " 'GRANT DELETE ON "BusinessTrustClaim" TO app_runtime' 'REVOKE DELETE ON "BusinessTrustClaim" FROM app_runtime'
          fault "column change grant on wording" "8 " 'GRANT UPDATE ("wording") ON "BusinessTrustClaim" TO app_runtime' 'REVOKE UPDATE ("wording") ON "BusinessTrustClaim" FROM app_runtime'
          fault "NO FORCE row-level security" "4 " 'ALTER TABLE "BusinessTrustClaim" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "BusinessTrustClaim" FORCE ROW LEVEL SECURITY'
          fault "permissive FOR ALL policy" "5 " 'CREATE POLICY p3_fault_all ON "BusinessTrustClaim" USING (true)' 'DROP POLICY p3_fault_all ON "BusinessTrustClaim"'
          got=$(failing); test -z "$got" || { echo "proof not whole again: $got"; exit 1; }

      - name: 8. Rollback in reverse release order — P3-A #2 reverted whole, labels inert, re-apply makes both proofs whole; refused while a claim exists
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d "$1" -v ON_ERROR_STOP=1 "${@:2}"; }
          failing() { lab "$1" -f "$2" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          bash .p3a/lab.sh p3a_rb --joint >/dev/null
          lab p3a_rb -q -f .m6/rollback.sql
          lab p3a_rb -q -f .p3a/rollback.sql
          got=$(failing p3a_rb "$PREFLIGHT")
          test "$got" = "3 4 7 8 " || { echo "after rollback: expected P3-A preflight '3 4 7 8 ' (20261008090000 recorded, its labels kept), got '$got'"; exit 1; }
          b=$(lab p3a_rb -Atqc "INSERT INTO \"Business\" (name, \"updatedAt\") VALUES ('rb', now()) RETURNING id" | head -1)
          if lab p3a_rb -q -c "INSERT INTO \"BusinessIdentityStatement\" (\"businessId\",\"dimension\",\"code\",\"source\",\"updatedAt\") VALUES ($b,'CONVERSION_DECLARATION','ACCEPTS_VISITS','OWNER_INPUT',now())" 2>/dev/null; then echo "a kept label is not inert"; exit 1; fi
          if lab p3a_rb -q -c "INSERT INTO \"BusinessIdentityFactAuthority\" (\"businessId\",\"fact\",\"sourceField\",\"valueHash\",\"updatedAt\") VALUES ($b,'PUBLIC_WHATSAPP','WhatsAppConnection.displayPhoneNumber',repeat('a',64),now())" 2>/dev/null; then echo "a kept label is not inert"; exit 1; fi
          echo "kept labels are inert under the restored P2 CHECKs"
          TMP="$(mktemp -d)"; mkdir -p "$TMP/prisma/migrations"
          cp prisma/schema.prisma "$TMP/prisma/"; cp prisma/migrations/migration_lock.toml "$TMP/prisma/migrations/"
          for d in prisma/migrations/*/; do cp -r "$d" "$TMP/prisma/migrations/"; done
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/p3a_rb"
          DATABASE_URL="$U" DIRECT_URL="$U" node_modules/.bin/prisma migrate deploy --schema "$TMP/prisma/schema.prisma" | grep -E "Applying migration"
          got=$(failing p3a_rb "$EVIDENCE"); test -z "$got" || { echo "re-apply: P3-A proof not whole: $got"; exit 1; }
          got=$(failing p3a_rb "$M6_EVIDENCE"); test -z "$got" || { echo "re-apply: M6 proof not whole: $got"; exit 1; }
          echo "re-apply applied 20261008090100 and M6; both proofs whole"
          lab p3a_rb -q -c "INSERT INTO \"BusinessTrustClaim\" (\"businessId\",\"claimKind\",\"claimClass\",\"params\",\"wording\",\"wordingHash\",\"confirmedByUserId\",\"updatedAt\") VALUES ($b,'FOUNDED_YEAR','OWNER_ASSERTED','{}'::jsonb,'w',encode(sha256(convert_to('w','UTF8')),'hex'),1,now())"
          if lab p3a_rb -q -f .p3a/rollback.sql 2>/tmp/rb.err; then echo "rollback ran despite a claim"; exit 1; fi
          grep -q "P3-A rollback refused" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          echo "rollback refused while a claim exists; nothing changed"
