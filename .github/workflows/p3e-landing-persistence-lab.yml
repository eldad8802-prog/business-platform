# P3-E / migration 20261013090000_p3e_landing_persistence — proof on PostgreSQL BEFORE it reaches
# Production (ephemeral PG17).
#
# .p3e/lab.sh builds Production's topology on top of the P3-A lab: non-superuser CREATEROLE/BYPASSRLS owner,
# NOLOGIN app_runtime + LOGIN app_runtime_prod, the owner's default privileges, Business under B4's FORCE
# RLS; ledger through M6 (171). The migrations merged after M6 are left out of the lab ledger (their objects
# come from db push here) — so preflight check 5 ("every name on main is finished") is a PRODUCTION premise
# that this lab cannot meet; every other preflight check must pass here. P3-E depends on Business alone, and
# step 0 proves it names nothing those migrations own.
#
#   0. Evidence files are SELECT-only and selectable in Production; the proof pins migration.sql's sha256.
#   1. Baseline (P3-E pending): PREFLIGHT passes all but 5 (lab topology); the proof refuses (no tables).
#   2. `prisma migrate deploy` (the release-migrate mechanism) applies P3-E: proof 17/17; the preflight then
#      fails exactly its "not there yet" checks (+ 5).
#   3. Battery (.p3e/battery.ts) as app_runtime_prod: isolation, authority, immutability, pointer integrity,
#      snapshot shape, idempotency, a concurrent approval race, privileges, cascade.
#   4. Atomicity: P3-E failing on its last statement leaves nothing of it behind.
#   5. Faults: DELETE grant, snapshot column grant, NO FORCE, permissive FOR ALL, guard trigger dropped,
#      PUBLIC read — each caught by the check meant for it.
#   6. Rollback: refused while a page exists; on an empty database it reverts whole (preflight whole again),
#      and a re-apply makes the proof whole.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: p3e — landing persistence migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261013090000_p3e_landing_persistence/**"
      - "ops/evidence/p3e-landing-persistence-*.sql"
      - ".p3e/**"
      - ".github/workflows/p3e-landing-persistence-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: p3e landing persistence (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: p3e_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: p3e_ci_synthetic_super_pw
      LAB_PASSWORD: p3e_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/p3e-landing-persistence-preflight.sql
      EVIDENCE: ops/evidence/p3e-landing-persistence-production-evidence.sql
      P3E: prisma/migrations/20261013090000_p3e_landing_persistence/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable in Production; checksum pinned; P3-E names nothing the post-M6 migrations own
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          sum=$(sha256sum "$P3E" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the P3-E proof pins a different checksum"; exit 1; }
          echo "$P3E sha256 $sum (pinned)"
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" > "20261009090000_m6_acquisition_connections" && "$n" != "20261013090000_p3e_landing_persistence" ]] || continue
            if grep -nE 'LandingPage|LandingVersion|p3e_landing' "$d/migration.sql"; then echo "$n names a P3-E object"; exit 1; fi
          done
          if grep -nE 'Onboarding|OutcomeRecommendation|BusinessBrain|User"|"User' "$P3E"; then echo "P3-E names an object of a post-M6 migration"; exit 1; fi
          echo "P3-E and the migrations merged after M6 name none of each other's objects"

      - name: 1. Baseline (P3-E pending) — PREFLIGHT passes all but 5 (lab topology); the proof refuses
        run: |
          set -euo pipefail
          bash .p3e/lab.sh p3e_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3e_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "5 " || { echo "baseline: expected only 5 (lab topology) to fail, got: $fails"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline (the tables do not exist yet)"

      - name: 2. prisma migrate deploy applies P3-E — proof 17/17; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .p3e/lab.sh p3e_post --with-p3e | tee /tmp/post.log
          grep -q 'Applying migration `20261013090000_p3e_landing_persistence`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3e_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "P3-E proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "17" || { echo "expected 17 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 3 5 6 8 9 10 11 " || { echo "after the release: expected '2 3 5 6 8 9 10 11 ', got: $fails"; exit 1; }

      - name: 3. Battery — isolation, authority, immutability, pointer integrity, snapshot, race, privileges (as app_runtime_prod)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/p3e_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/p3e_post" \
            npx tsx .p3e/battery.ts

      - name: 4. Atomicity — P3-E failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .p3e/lab.sh p3e_broken --broken-p3e
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3e_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -Atc "SELECT (SELECT count(*) FROM pg_class WHERE relname LIKE 'LandingPage%') + (SELECT count(*) FROM pg_type WHERE typname IN ('LandingVersionStatus','LandingVersionAuthority')) + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'p3e_landing_%')")
          led=$(lab -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261013090000_p3e_landing_persistence' AND finished_at IS NULL")
          echo "P3-E objects left=$left unfinished ledger rows=$led"
          test "$left" = "0" && test "$led" = "1" || { echo "NOT atomic"; exit 1; }

      - name: 5. Faults — each is caught by the P3-E proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d p3e_post -v ON_ERROR_STOP=1 "$@"; }
          # The battery left rows behind, so 17 (empty tables) fails throughout; every fault adds exactly its own check.
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test "$(failing)" = "17 " || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "DELETE grant to runtime" "13 17 " 'GRANT DELETE ON "LandingPageVersion" TO app_runtime' 'REVOKE DELETE ON "LandingPageVersion" FROM app_runtime'
          fault "snapshot column grant" "14 17 " 'GRANT UPDATE ("blueprintSnapshot") ON "LandingPageVersion" TO app_runtime' 'REVOKE UPDATE ("blueprintSnapshot") ON "LandingPageVersion" FROM app_runtime'
          fault "NO FORCE row-level security" "4 17 " 'ALTER TABLE "LandingPage" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "LandingPage" FORCE ROW LEVEL SECURITY'
          fault "permissive FOR ALL policy" "5 6 17 " 'CREATE POLICY p3e_fault_all ON "LandingPageVersion" USING (true)' 'DROP POLICY p3e_fault_all ON "LandingPageVersion"'
          fault "guard trigger dropped" "7 17 " 'DROP TRIGGER "LandingPageVersion_guard" ON "LandingPageVersion"' 'CREATE TRIGGER "LandingPageVersion_guard" BEFORE UPDATE OR DELETE ON "LandingPageVersion" FOR EACH ROW EXECUTE FUNCTION public.p3e_landing_version_guard()'
          fault "PUBLIC read" "16 17 " 'GRANT SELECT ON "LandingPage" TO PUBLIC' 'REVOKE SELECT ON "LandingPage" FROM PUBLIC'
          test "$(failing)" = "17 " || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 6. Rollback — refused while a page exists; reverts whole on an empty database; re-apply makes the proof whole
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d "$1" -v ON_ERROR_STOP=1 "${@:2}"; }
          if lab p3e_post -q -f .p3e/rollback.sql 2>/tmp/rb.err; then echo "rollback ran despite landing pages"; exit 1; fi
          grep -q "P3-E rollback refused" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          echo "rollback refused while landing pages exist; nothing changed"
          bash .p3e/lab.sh p3e_rb --with-p3e >/dev/null
          lab p3e_rb -q -f .p3e/rollback.sql
          fails=$(lab p3e_rb -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "5 " || { echo "after rollback: expected only 5 (lab topology), got: $fails"; exit 1; }
          TMP="$(mktemp -d)"; mkdir -p "$TMP/prisma/migrations"
          cp prisma/schema.prisma "$TMP/prisma/"; cp prisma/migrations/migration_lock.toml "$TMP/prisma/migrations/"
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            if [[ ! "$n" > "20261009090000_m6_acquisition_connections" || "$n" == "20261013090000_p3e_landing_persistence" ]]; then cp -r "$d" "$TMP/prisma/migrations/"; fi
          done
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/p3e_rb"
          DATABASE_URL="$U" DIRECT_URL="$U" node_modules/.bin/prisma migrate deploy --schema "$TMP/prisma/schema.prisma" | grep -E "Applying migration"
          got=$(lab p3e_rb -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$got" || { echo "re-apply: proof not whole: $got"; exit 1; }
          echo "rollback reverted P3-E whole; re-apply made the proof whole"
