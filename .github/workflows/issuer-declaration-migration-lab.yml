# Issuer declaration (#1081): the migration 20261123090000_issuer_declaration applied on top of the current schema,
# then the lab check (49 checks: chain, authority, designation origin, series opening, enforcement, profile lock,
# erase, RLS) as a NOSUPERUSER NOBYPASSRLS runtime member. Negative proof: without the designation-origin trigger
# the runtime forges a platform designation, and the check must catch it (N1).
#
# Synthetic data only; ZERO secrets; no network beyond the service container.
#
# Job 3 (the #1081 code): D1/D2/D4 pure, then the declaration flow (D3 and session 23's checks (a)-(d)) on session
# 23's Production auth-topology lab with their link migration (.agl/lab.sh --with-issuer), billing's migration
# applied after it as the owner.
#
# Job 2 runs TODAY's account deletion (deleteOwnBusinessAccount) on the Production-topology lab with the migration applied
# by `prisma migrate deploy` — the window between the migration and the #1081 code (.issuer-declaration/).

name: issuer declaration migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261123090000_issuer_declaration/**"
      - "scripts/ci/issuer-declaration/**"
      - ".issuer-declaration/**"
      - "lib/services/account/**"
      - "lib/billing/issuer-declaration/**"
      - "lib/services/billing/issuer-declaration/**"
      - "lib/services/billing/billing-issue.service.ts"
      - "app/api/billing/issuer-declaration/**"
      - "app/api/billing/invoice-profile/**"
      - "app/billing/issuer-declaration/**"
      - ".github/workflows/issuer-declaration-migration-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Issuer declaration migration (PG17, NOBYPASSRLS runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: decl_owner
          POSTGRES_PASSWORD: decl_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_decl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decl_owner -d dubiz_decl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://decl_owner:decl_ci_synthetic_owner_pw@localhost:5432/dubiz_decl
      NEG_URL: postgresql://decl_owner:decl_ci_synthetic_owner_pw@localhost:5432/dubiz_decl_neg
      MIGRATION: prisma/migrations/20261123090000_issuer_declaration/migration.sql
      CHECK: scripts/ci/issuer-declaration/migration-lab-check.sql
      SECF: prisma/migrations/20260926140000_sec_f_append_only_audit_fiscal_immutability_security_events/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # Migration-only PR (migration-first guard): schema.prisma does not model the new tables yet, so db push
      # builds today's schema and the migration creates the tables, exactly as it will in Production.
      - name: Base schema (db push), roles, fiscal-immutability replay — for both databases
        run: |
          set -euo pipefail
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE dubiz_decl_neg"
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE app_runtime NOLOGIN NOSUPERUSER NOBYPASSRLS;" \
            -c "CREATE ROLE app_admin NOLOGIN NOSUPERUSER NOBYPASSRLS;"
          for url in "$OWNER_URL" "$NEG_URL"; do
            DATABASE_URL="$url" DIRECT_URL="$url" npx prisma db push --skip-generate
            psql "$url" -q -f "$SECF" > /dev/null
            # The code PR models the declaration tables: drop what db push built (no-op on the migration-only PR).
            psql "$url" -v ON_ERROR_STOP=1 -q -f .issuer-declaration/drop-pushed.sql > /dev/null 2>&1
          done

      - name: Apply the migration
        run: psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q -f "$MIGRATION"

      - name: Lab check — every check passes
        run: |
          set -uo pipefail
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -f "$CHECK" 2>&1 | tee lab.log
          pass=$(grep -c "PASS  " lab.log || true); fail=$(grep -c "FAIL  " lab.log || true)
          echo "PASS=$pass FAIL=$fail"
          grep "FAIL  " lab.log || true
          if [ "$fail" -ne 0 ] || [ "$pass" -lt 58 ]; then echo "::error::lab check: $pass passed, $fail failed (expected 58/0)"; exit 1; fi
          if grep -q "ERROR:" lab.log; then echo "::error::the lab check itself raised an error"; exit 1; fi

      - name: Negative proof — without the designation-origin trigger, N1 is caught
        run: |
          set -uo pipefail
          psql "$NEG_URL" -v ON_ERROR_STOP=1 -q -f "$MIGRATION"
          psql "$NEG_URL" -v ON_ERROR_STOP=1 -q -c 'DROP TRIGGER "BusinessIssuerDeclaration_designation_origin" ON "BusinessIssuerDeclaration";'
          psql "$NEG_URL" -f "$CHECK" > neg.log 2>&1 || true
          if ! grep -q "FAIL  N1 " neg.log; then echo "::error::NEGATIVE-PROOF FAIL: N1 stayed green without the trigger"; grep -E "(PASS|FAIL)  N1" neg.log || true; exit 1; fi
          echo "negative proof OK — a forged designation is caught by N1"

  account-deletion:
    name: Account deletion with the migration applied (real purge, Production-topology lab, PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: decl_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: decl_ci_synthetic_super_pw
      LAB_PASSWORD: decl_ci_synthetic_role_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Lab (P4 + purge prerequisites) → migrate deploy 20261123090000 → today's account deletion
        run: |
          set -euo pipefail
          bash .issuer-declaration/lab.sh decl
          bash .issuer-declaration/lab.sh decl --deploy-only
          O="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/decl"
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/decl"
          OWNER_URL="$O" DATABASE_URL="$R?connection_limit=20" DIRECT_URL="$R" AUTH_DATABASE_URL="$O" AUTH_PLANE_ENABLED=true \
          STORAGE_PROVIDER=local LOCAL_STORAGE_ROOT="$RUNNER_TEMP/decl-store" \
          TASK_REQUEST_HMAC_KEY=decl-ci-synthetic-hmac-key-0123456789abcdef TASK_REQUEST_HMAC_KEY_ID=decl-ci \
          AUTH_TOKEN_SECRET=decl-ci-synthetic-auth-secret-0123456789abcdef \
            npx tsx .issuer-declaration/account-deletion.battery.mts | tee /tmp/decl-del.out
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/decl-del.out || { echo "the account-deletion battery is not green"; exit 1; }

  declaration-code:
    name: Declaration code — D1 D2 D4 (pure) + D3 (a)-(d) flow (link + declaration migrations, PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: idc_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: idc_ci_synthetic_super_pw
      LAB_PASSWORD: idc_ci_synthetic_role_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: D1 issuer details per track (pure)
        run: npx tsx lib/billing/issuer-declaration/details.test.ts
      - name: D2 canonical statement and digest (pure)
        run: npx tsx lib/billing/issuer-declaration/statement.test.ts
      - name: D4 issuance gate OFF/ON and identity lock (pure)
        run: npx tsx lib/services/billing/issuer-declaration/issuer-declaration-gates.test.ts

      - name: Lab — link migration (migrate deploy) → drop db-push copies → declaration migration (owner)
        run: |
          set -euo pipefail
          if [ ! -f prisma/migrations/20261126090000_auth_issuer_declaration_link/migration.sql ]; then
            echo "::error::the link migration (#1105) is not in the tree"; exit 1
          fi
          bash .agl/lab.sh idc --with-issuer | tail -3
          O="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/idc"
          psql "$O" -v ON_ERROR_STOP=1 -q -f .issuer-declaration/drop-pushed.sql > /dev/null 2>&1
          psql "$O" -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261123090000_issuer_declaration/migration.sql > /dev/null
          psql "$O" -Atc "SELECT count(*) FROM pg_proc WHERE proname IN ('auth_issuer_declaration_consume','issuer_issue_requires_declaration')" | grep -qx 2

      - name: D3 + (a)-(d) + E (real issue chain) — the declaration flow, real auth plane + tenant transaction as the runtime
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/idc"           RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/idc"           AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/idc"             npx tsx .issuer-declaration/declaration-flow.battery.mts | tee /tmp/idc.out
          grep -qx "ALL PASS" /tmp/idc.out || { echo "::error::the declaration flow battery is not green"; exit 1; }

      - name: Negative proof — the spend in its own transaction must fail (a)
        run: |
          set -uo pipefail
          O="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/postgres"
          psql "$O" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE idc_neg" > /dev/null
          bash .agl/lab.sh idc_neg --with-issuer > /dev/null
          N="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/idc_neg"
          psql "$N" -v ON_ERROR_STOP=1 -q -f .issuer-declaration/drop-pushed.sql > /dev/null 2>&1
          psql "$N" -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261123090000_issuer_declaration/migration.sql > /dev/null
          NEG=non-atomic OWNER_URL="$N" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/idc_neg" \
          AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/idc_neg" \
            npx tsx .issuer-declaration/declaration-flow.battery.mts > /tmp/idc-neg.out 2>&1 || true
          grep -E '^\s+\(a\):' /tmp/idc-neg.out || true
          if grep -qx "ALL PASS" /tmp/idc-neg.out || ! grep -q "\[FAIL\] (a)" /tmp/idc-neg.out; then
            echo "::error::NEGATIVE-PROOF FAIL: a non-atomic spend was not caught by (a)"; exit 1
          fi
          echo "negative proof OK — a spend outside the declaration transaction is caught by (a)"
