# release-migrate gate (docs/security/RELEASE_MIGRATE_AUTHORITY_GATE.md) — proof BEFORE the owner
# decides to wire it into release-migrate. Ephemeral PG17, the real gate, the real
# `prisma migrate deploy`, the real GitHub runs API (read-only). ZERO secrets; ZERO Neon.
#
#   1. self-tests (gate + classifier); classification of #594, P2 and B4 (all authority-changing)
#   2. chain lab (.release-gate/chain-lab.sh), APPROVED-PREFIX semantics: B4 approved alone while
#      the unapproved P2 runs before it is refused; a migration inside the approved run is refused,
#      one after it is reported held; wrong order is refused; the controlled chain P2 → B4 applies
#      exactly one approved migration per run (P2 proof 13/13, B4 proof 14/14); in the #594 replay
#      P2 is held, never applied; a half-applied ledger is refused
#   3. plan (no DB, the real runs API): an authority migration without a record, with a wrong
#      checksum, with a run that is not the preflight, with a preflight that started before the
#      merge, or with a preflight that does not name its file, is refused; a plain migration needs
#      no record
#   4. wiring of release-migrate.yml: required exact input, plan before the protected job, no secret
#      in the plan job; in the protected job: stage (pinned to github.sha, authority re-checked,
#      ledger, prefix) before the only apply, the apply against the STAGED directory only, confirm
#      (ledger proof) after it
#   5. approved prefix (.release-gate/prefix-lab.sh): the owner's 12 cases on the real
#      stage → prisma migrate deploy → confirm path, the actual ledger checked after each
#
# Until B4 (#611) and the P2 forensic (#614) are on main, their files are read from those PR
# branches (read-only git); the B4 file must hash to the reviewed sha256.

name: release-migrate gate lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/release-migrate-gate.mjs"
      - "scripts/ci/migration-security-classifier.mjs"
      - ".release-gate/**"
      - ".github/workflows/release-migrate.yml"
      - ".github/workflows/release-gate-lab.yml"
      - "ops/release-approvals/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lab:
    name: release-migrate gate (PG17, real migrate deploy, real runs API)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: gate_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: gate_ci_synthetic_super_pw
      LAB_PASSWORD: gate_ci_synthetic_role_pw
      P2: 20261004090000_p2_business_identity
      B4: 20261006090000_business_tenant_write_rls
      M594: 20261003090000_control_plane_production_privileges
      B4_SHA256: d507e6efa79ade6e

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Assemble the B4 migration and both proofs (from their PR branches until merged)
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/assets"; mkdir -p "$A"
          get() {  # get <path> <branch> <out>
            if [ -f "$1" ]; then cp "$1" "$3"; else
              git fetch -q --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$2"
              git show "FETCH_HEAD:$1" > "$3"; fi
          }
          get "prisma/migrations/$B4/migration.sql" db/business-tenant-write-rls "$A/b4.sql"
          get ops/evidence/business-tenant-write-rls-production-evidence.sql db/business-tenant-write-rls "$A/b4-proof.sql"
          get ops/evidence/sec-p2-business-identity-production-evidence.sql ops/p2-forensic "$A/p2-proof.sql"
          sha256sum "$A/b4.sql" | grep -q "^$B4_SHA256" || { echo "B4 migration is not the reviewed file"; exit 1; }
          { echo "B4_SQL=$A/b4.sql"; echo "B4_PROOF=$A/b4-proof.sql"; echo "P2_PROOF=$A/p2-proof.sql"; } >> "$GITHUB_ENV"

      - name: 1. Self-tests and classification (#594, P2, B4 are authority-changing)
        run: |
          set -euo pipefail
          node scripts/ci/release-migrate-gate.mjs --self-test
          node --input-type=module -e '
            import { classify } from "./scripts/ci/migration-security-classifier.mjs";
            import { readFileSync } from "node:fs";
            const env = process.env;
            for (const [n, f] of [[env.M594, `prisma/migrations/${env.M594}/migration.sql`], [env.P2, `prisma/migrations/${env.P2}/migration.sql`], [env.B4, env.B4_SQL]]) {
              const c = classify(readFileSync(f, "utf8"));
              console.log(`${n}: ${c.join(", ") || "plain"}`);
              if (!c.length) { console.log("expected authority-changing"); process.exit(1); }
            }'

      - name: 2. Chain lab — real ledger, real gate, real prisma migrate deploy
        run: bash .release-gate/chain-lab.sh

      - name: 3. Plan — approval records against the real runs API (no database, no secret)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sum=$(sha256sum "prisma/migrations/$P2/migration.sql" | cut -d' ' -f1)
          rec() {  # rec <sha> <run> <file>
            printf '{"migration":"%s","sha256":"%s","decision":"https://github.com/%s/pull/614","approvedBy":"lab","preflightRun":%s,"preflightFile":"%s"}\n' \
              "$P2" "$1" "$GITHUB_REPOSITORY" "$2" "$3" > "ops/release-approvals/$P2.json"
          }
          refused() {  # refused <why-regex> <expected>
            set +e; node scripts/ci/release-migrate-gate.mjs plan --expected "$2" > /tmp/plan.out 2>&1; rc=$?; set -e
            sed 's/^/    | /' /tmp/plan.out
            test $rc -ne 0 || { echo "FAIL: plan allowed $2"; exit 1; }
            grep -qE "$1" /tmp/plan.out || { echo "FAIL: refused for another reason (wanted: $1)"; exit 1; }
          }
          echo "P2 without a record";              refused "no approval record" "$P2"
          echo "#594 without a record";            refused "no approval record" "$M594"
          echo "a migration not in the checkout";  refused "not a migration in this checkout" "20261009990000_not_here"
          rec "$(printf '0%.0s' {1..64})" 36923986799 ops/evidence/migration-ledger-audit.sql
          echo "P2 with a wrong checksum";         refused "checksum" "$P2"
          rec "$sum" "$GITHUB_RUN_ID" ops/evidence/migration-ledger-audit.sql
          echo "P2 with a run that is not the preflight workflow"; refused "is not prod-readonly-evidence.yml" "$P2"
          rec "$sum" 36802128390 ops/evidence/migration-ledger-audit.sql
          echo "P2 with a preflight that started before P2 reached main"; refused "started before the migration reached main" "$P2"
          rec "$sum" 36923986799 ops/evidence/migration-ledger-audit.sql
          echo "P2 with a real post-merge preflight that does not name its file (no run-name before the gate)"
          refused "does not name ops/evidence/migration-ledger-audit.sql" "$P2"
          rm -f "ops/release-approvals/$P2.json"
          plain=$(node --input-type=module -e '
            import { classify } from "./scripts/ci/migration-security-classifier.mjs";
            import { readdirSync, readFileSync } from "node:fs";
            const d = readdirSync("prisma/migrations").filter((n) => /^\d{14}_/.test(n)).sort().reverse();
            console.log(d.find((n) => !classify(readFileSync(`prisma/migrations/${n}/migration.sql`, "utf8")).length));')
          echo "a plain migration ($plain) needs no record (it must still be named)"
          node scripts/ci/release-migrate-gate.mjs plan --expected "$plain" | sed 's/^/    | /'

      - name: 4. Wiring of the draft release-migrate.yml
        run: |
          set -euo pipefail
          W=.github/workflows/release-migrate.yml
          node -e '
            const y = require("js-yaml").load(require("fs").readFileSync(process.argv[1], "utf8"));
            const inp = y.on.workflow_dispatch.inputs.expected_migrations;
            const ok = (c, m) => { if (!c) { console.log("FAIL: " + m); process.exit(1); } console.log("ok: " + m); };
            ok(inp && inp.required === true && inp.type === "string", "expected_migrations is a required input");
            ok(y.jobs.plan && !y.jobs.plan.environment, "plan job exists and is outside the protected environment");
            ok(!JSON.stringify(y.jobs.plan).includes("secrets."), "plan job reads no secret");
            ok(y.jobs.migrate.needs === "plan" || (y.jobs.migrate.needs || []).includes("plan"), "the protected job needs plan");
            ok(y.jobs.migrate.environment === "production-db", "the protected job is the production-db environment");
            const mig = y.jobs.migrate.steps;
            const steps = mig.map((s) => s.run || "");
            const v = steps.findIndex((r) => r.includes("release-migrate-gate.mjs stage"));
            const applies = (r) => /^\s*(node_modules\/\.bin\/|npx )?prisma migrate deploy\b/m.test(r);
            const d = steps.findIndex(applies);
            const c = steps.findIndex((r) => r.includes("release-migrate-gate.mjs confirm"));
            ok(v >= 0 && d > v, "stage (authority + ledger + prefix) runs before the only apply step");
            ok(steps.filter(applies).length === 1, "exactly one step runs prisma migrate deploy");
            ok(c > d, "confirm (the ledger proof) runs after the apply");
            // APPROVED PREFIX: the apply sees ONLY the staged directory (applied + the approved prefix).
            const OUT = "$RUNNER_TEMP/release";
            ok(steps[v].includes(`--out "${OUT}"`), "stage writes the staged directory");
            ok(steps[d].includes(`--schema "${OUT}/prisma/schema.prisma"`), "the apply runs against the staged directory, never the checkout");
            ok(steps.filter(applies).every((r) => r.split("\n").filter((l) => applies(l)).every((l) => l.includes(`--schema "${OUT}/prisma/schema.prisma"`))), "no apply against the full checkout");
            ok(steps[c].includes(`--out "${OUT}"`), "confirm reads the same staged manifest");
            // RACE: the protected job re-checks AFTER approval: the dispatch commit, authority, ledger.
            // An Actions expression string, built so the dollar-brace sequence never appears in this script (Actions would expand it).
            const expr = (e) => "$" + "{{ " + e + " }}";
            ok(steps[v].includes("--pinned-sha") && (mig[v].env || {}).PINNED_SHA === expr("github.sha"), "stage pins the dispatch commit (github.sha)");
            ok((mig[v].env || {}).GITHUB_TOKEN === expr("github.token"), "stage re-checks approval records and preflight runs after approval");
            const perm = y.jobs.migrate.permissions || {};
            ok(perm.actions === "read" && perm.contents === "read" && Object.keys(perm).length === 2, "the protected job reads contents + actions only");
            const co = mig.find((s) => String(s.uses || "").startsWith("actions/checkout@"));
            ok(co && co.with && co.with["fetch-depth"] === 0, "the protected checkout has history (merge times for the authority re-check)");
            // RACE: a migration merged to main while a run waits for approval must not enter that run.
            // Every checkout in both jobs is the DISPATCH commit (github.sha): no ref override, no fetch of
            // another ref, no pull. stage, deploy and confirm run in the same job, on the same files.
            const checkouts = ["plan", "migrate"].flatMap((j) => y.jobs[j].steps.filter((s) => String(s.uses || "").startsWith("actions/checkout@")));
            ok(checkouts.length === 2 && checkouts.every((s) => !s.with || s.with.ref === undefined), "both jobs check out the dispatch commit (no ref override)");
            ok(!y.jobs.migrate.steps.some((s) => /git\s+(fetch|pull|checkout|switch|reset)/.test(s.run || "")), "the protected job never moves its checkout");
            ok(y.jobs.migrate.if === "github.ref == '"'"'refs/heads/main'"'"'" && y.jobs.plan.if === "github.ref == '"'"'refs/heads/main'"'"'", "both jobs run only from main");
          ' "$W"

      - name: 5. Approved prefix — 12 cases on the real stage → migrate deploy → confirm path, ledger after each
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The real P3-A preflight (read-only, from main) that passed in full — the authority the lab's
          # P3A2 record names. M6 uses its real record and preflight run.
          P3A_PREFLIGHT_RUN: "37227137539"
        run: bash .release-gate/prefix-lab.sh
