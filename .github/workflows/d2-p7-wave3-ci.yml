# D2 / P7 Wave 3 — adversarial battery on ephemeral PG17 (Inventory /
# Suppliers / POS cluster). Full provision, direct+indirect matrix, relational
# cross-tenant attacks, POS trust model (x-pos-key), real routes, rollback
# proof, idempotent re-apply. Synthetic CI-only creds; ZERO secrets; ZERO Neon.

name: d2/p7 — wave 3 battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-p7-wave3]
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20260825200000_d2_p7_wave3_tenant_rls/**"
      - "scripts/security/d2-p7-wave3-*.sql"
      - ".p7w3/**"
      - "app/api/inventory/**"
      - "app/(shell)/inventory/alerts/**"
      - "lib/services/inventory/**"
      - "lib/tenant/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave3-battery:
    name: Wave-3 battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p7w3_owner
          POSTGRES_PASSWORD: p7w3_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_p7w3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p7w3_owner -d dubiz_p7w3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .p7w3/battery.mjs

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: postgresql://p7w3_owner:p7w3_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w3
          DIRECT_URL: postgresql://p7w3_owner:p7w3_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w3
        run: npx prisma db push --skip-generate

      - name: Run Wave-3 battery
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: postgresql://p7w3_owner:p7w3_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w3
          DIRECT_URL: postgresql://p7w3_owner:p7w3_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w3
          RUNTIME_URL: postgresql://wave1_runtime:p7w1_ci_synthetic_pw@localhost:5432/dubiz_p7w3
          ADMIN_LOGIN_ROLE: app_admin_lab
          W2G_ADMIN_PW: p7w2g_ci_synthetic_admin_pw
          AUTH_TOKEN_SECRET: p7w3_ci_auth_secret_synthetic_not_a_real_secret
        run: npx tsx .p7w3/battery.mjs
