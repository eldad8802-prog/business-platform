# Monthly accountant workflow / migration 20261027090000_accountant_month_close — proof on PostgreSQL BEFORE it
# reaches Production (ephemeral PG17). Migration-first: this PR ships the migration and its proof only.
#
# .acct/lab.sh builds Production's topology on top of the task reminders lab: non-superuser CREATEROLE/BYPASSRLS
# owner, NOLOGIN app_runtime + LOGIN app_runtime_prod, the owner's DEFAULT PRIVILEGES, Business under B4's FORCE RLS,
# and the ledger completed with EVERY other migration on this checkout, as Production's is — so the baseline holds
# 20261024090000_platform_admin_a1 (applied in Production 2026-10-22). The migration was re-timed from 20261023090000
# to 20261027090000 so it sorts after every applied migration and after the pending 20261025 / 20261026 ones
# (docs/payments/MIGRATION-ORDER.md). Its content, and so its sha256, is unchanged.
#
#   0. Evidence files are SELECT-only and selectable in Production; the proof pins migration.sql's sha256; the
#      migration names only its own objects and the tables it builds on, and no other migration names its objects.
#   1. Baseline (pending): PREFLIGHT passes whole on that ledger; the proof refuses (no tables); a finished
#      migration sorting after this one makes check 3 FAIL (the ordering check is live).
#   2. `prisma migrate deploy` (the release-migrate mechanism) applies it: proof 19/19 on the empty database; the
#      preflight then fails exactly its "not there yet" checks (4-8).
#   3. Role battery (.acct/battery.ts) as the real roles: catalog, four-sided isolation per table, cross-business
#      references refused, package and approval immutability, the append-only trail, closed payloads, the
#      bootstrap lookups (ids only, exact match), account erasure.
#   4. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#   5. Rollback: refused while rows exist; on an empty database it reverts whole (preflight whole again).
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: accountant month close — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261027090000_accountant_month_close/**"
      - "ops/evidence/accountant-month-close-*.sql"
      - ".acct/**"
      - ".trp/**"
      - ".dt/**"
      - ".github/workflows/accountant-month-close-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: accountant month close (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: acct_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: acct_ci_synthetic_super_pw
      LAB_PASSWORD: acct_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/accountant-month-close-preflight.sql
      EVIDENCE: ops/evidence/accountant-month-close-production-evidence.sql
      ACCT: prisma/migrations/20261027090000_accountant_month_close/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable; checksum pinned; the migration names only its own objects
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          sum=$(sha256sum "$ACCT" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$ACCT sha256 $sum (pinned)"
          own='"AccountantPeriod"|"AccountantPackage"|"AccountantRecipient"|"AccountantDelivery"|"AccountantWorkflowEvent"|"AccountantPeriod_id_seq"|"AccountantPackage_id_seq"|"AccountantDelivery_id_seq"|"AccountantWorkflowEvent_id_seq"'
          base='"Business"|"User"|"PlatformFeatureDefinition"|"PlatformFeaturePolicy"'
          others=$(grep -oE '"[A-Z][A-Za-z_]*"' "$ACCT" | sort -u | grep -vE '^"Accountant[A-Za-z]*_[A-Za-z_]+"$' | grep -vxE "$own|$base" || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261027090000_accountant_month_close" ]] || continue
            # Later accountant migrations extend these objects on purpose (each with its own lab and proof).
            [[ "$n" != "20261105090000_accountant_link_events" ]] || continue
            [[ "$n" != "20261107091000_accountant_delivery_complained" ]] || continue
            [[ "$n" != "20261109090000_accountant_delivery_permission" ]] || continue
            [[ "$n" != "20261109091000_accountant_link_otp" ]] || continue
            [[ "$n" != "20261110090000_accountant_open_all" ]] || continue
            [[ "$n" != "20261110092000_accountant_delivery_emergency_stop" ]] || continue
            # SQL only: a migration may NAME ours in a comment (e.g. its release order) without touching anything.
            if sed -E 's/--.*$//' "$d/migration.sql" | grep -nE 'Accountant(Period|Package|Recipient|Delivery|WorkflowEvent)|accountant_(link|delivery|erase|user|package|event)|accountant_month_close'; then echo "$n names an accountant object"; exit 1; fi
          done
          echo "the migration names only its own objects and the tables it builds on; no other migration names its objects"

      - name: 1. Baseline (pending) — PREFLIGHT passes whole; the proof refuses
        run: |
          set -euo pipefail
          bash .acct/lab.sh acct_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d acct_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "baseline: expected no preflight failure, got: $fails"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline (the tables do not exist yet)"
          # Ordering — the reason for the re-time. The applied platform_admin_a1 (20261024) is finished in the
          # baseline ledger and sorts BEFORE this migration, and check 3 passed above. Prove check 3 is live: a
          # finished migration sorting after this one makes it FAIL with observed 1; the ledger is then restored.
          a1=$(lab -At -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261024090000_platform_admin_a1' AND finished_at IS NOT NULL")
          test "$a1" = "1" || { echo "the baseline ledger lacks the applied platform_admin_a1"; exit 1; }
          # Migrations merged after this one was applied in Production (2026-10-24) sort after it. The lab reproduces
          # the release that happened ("applied + the approved prefix"), so none of them is in the baseline ledger.
          later=$(ls prisma/migrations | awk '$0 > "20261027090000_accountant_month_close" && $0 != "migration_lock.toml"' | sed "s/.*/'&'/" | paste -sd, -)
          if [ -n "$later" ]; then
            inl=$(lab -At -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name IN ($later)")
            test "$inl" = "0" || { echo "the baseline ledger records a migration that sorts after the accountant migration"; exit 1; }
          fi
          lab -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('lab-later', 'x', now(), '20261099000000_lab_later', 1)"
          c3=$(lab -f "$PREFLIGHT" | grep -E '^ +3 \|' | tr -d ' ')
          lab -q -c "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-later'"
          test "$c3" = "3|FAIL|1" || { echo "check 3 did not refuse a later finished migration: $c3"; exit 1; }
          echo "check 3 refuses a later finished migration (3|FAIL|1) and passes with platform_admin_a1 finished before it"

      - name: 2. prisma migrate deploy applies it — proof 19/19; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .acct/lab.sh acct_post --with-acct | tee /tmp/post.log
          grep -q 'Applying migration `20261027090000_accountant_month_close`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d acct_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "19" || { echo "expected 19 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "4 5 6 7 8 " || { echo "after the release: expected '4 5 6 7 8 ', got: $fails"; exit 1; }

      - name: 3. Role battery — catalog, isolation, references, immutability, trail, lookups, erasure (real roles)
        run: |
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/acct_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/acct_post" \
            npx tsx .acct/battery.ts

      - name: 4. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .acct/lab.sh acct_broken --broken-acct
          left=$(PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d acct_broken -c "SELECT (SELECT count(*) FROM pg_class WHERE relname LIKE 'Accountant%') + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'accountant\_%') + (SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE key = 'accountant_month_close')")
          test "$left" = "0" || { echo "a failed migration left $left objects"; exit 1; }

      - name: 5. Rollback — refused with rows; whole on an empty database
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -v ON_ERROR_STOP=1 "$@"; }
          if lab -d acct_post -f .acct/rollback.sql >/dev/null 2>&1; then echo "rollback ran over rows"; exit 1; fi
          bash .acct/lab.sh acct_rb --with-acct
          lab -d acct_rb -f .acct/rollback.sql
          left=$(lab -d acct_rb -At -c "SELECT (SELECT count(*) FROM pg_class WHERE relname LIKE 'Accountant%') + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'accountant\_%')")
          test "$left" = "0" || { echo "rollback left $left objects"; exit 1; }
          fails=$(lab -d acct_rb -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "after rollback the preflight should be whole, got: $fails"; exit 1; }
