# Service Desk 1.3-0 erasure texts — migration 20261121090000_service_desk_ui_erasure_text, in Production's role topology
# (ephemeral PG17). NOT applied anywhere by this workflow except its own throwaway database.
#
#   1. The 1.3-0 lab (.sd3/lab.sh --with-sd3), then PHASE=pre: fixtures, and a business erased with the APPLIED door.
#   2. `prisma migrate deploy` applies exactly 20261121090000 (.sd3x/lab.sh --deploy-only).
#   3. PHASE=post: structure, nothing opened for the runtime, settings deleted, offer texts anonymized, facts kept,
#      ServiceTextVersion.body unchanged, idempotent, completes a business the previous version erased, neighbour intact.
#   4. Regression: the existing 1.3-0 battery (.sd3/battery.ts) on a fresh lab with 20261121090000 applied.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: service desk UI erasure texts — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261121090000_service_desk_ui_erasure_text/**"
      - "prisma/migrations/20261120090000_service_desk_ui_foundation/**"
      - ".sd3x/**"
      - ".sd3/**"
      - ".github/workflows/service-desk-ui-erasure-text-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service desk UI erasure texts (PG17, 1.3-0 applied, then 20261121090000 via migrate deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sd3x_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sd3x_ci_synthetic_super_pw
      LAB_PASSWORD: sd3x_ci_synthetic_role_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 1–3. pre (applied door) → migrate deploy → post
        run: |
          set -euo pipefail
          bash .sd3x/lab.sh sd3x
          export OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sd3x" RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sd3x"
          PHASE=pre npx tsx .sd3x/battery.ts | tee /tmp/pre.out
          grep -qxE '1 passed, 0 failed' /tmp/pre.out || { echo "pre is not 1/1"; exit 1; }
          bash .sd3x/lab.sh sd3x --deploy-only
          PHASE=post npx tsx .sd3x/battery.ts | tee /tmp/post.out
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/post.out || { echo "post is not green"; exit 1; }

      - name: 4. Regression — the 1.3-0 battery with 20261121090000 applied
        run: |
          set -euo pipefail
          bash .sd3x/lab.sh sd3x_reg
          bash .sd3x/lab.sh sd3x_reg --deploy-only
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sd3x_reg" RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sd3x_reg" \
            npx tsx .sd3/battery.ts | tee /tmp/reg.out
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/reg.out || { echo "the 1.3-0 battery regressed"; exit 1; }
