name: release-deploy

# Gated production release for the BTRL pilot: build, then promote.
#
# WHY THIS EXISTS
#
# Vercel's Ignored Build Step can refuse a build, but only after Vercel has
# already created the Deployment object, so a refusal there is a deployment
# that exists and was cancelled. For an unsafe release to produce NO deployment
# at all, the decision has to happen before anything asks Vercel to deploy. So
# business-platform-btrl is disconnected from Git and this workflow is the only
# thing that may deploy it.
#
# WHY BUILD AND PROMOTE ARE SEPARATE
#
# `vercel deploy --prod` goes live the moment it finishes building. The commit
# is therefore exposed for the WHOLE BUILD, one to three minutes, during which
# main can move and the now-stale commit still goes live. Splitting the two
# closes that: `--skip-domain` produces a real production-target deployment
# that no domain points at, and the release only becomes visible at the
# `promote` call, which is an alias flip measured in seconds.
#
# `--prod --skip-domain` rather than a preview build, deliberately: a preview
# deployment is built with PREVIEW environment variables, and promoting it
# would put a preview-configured artifact into production, because promote does
# not rebuild. The target is production throughout.
#
# WHAT THIS DOES AND DOES NOT CLAIM
#
# There is no shared transaction between GitHub's ref state and Vercel's alias,
# so no compare-and-swap between "main is still X" and "X is live" exists. The
# race is not impossible. It is bounded to the promote call, detected right
# after it, and automatically remediated by restoring the exact deployment that
# was production before this run touched it. That is the claim, and no more.
#
#   gate (no Vercel contact) -> build without alias -> verify the artifact ->
#   capture current production -> freshness -> promote by exact id ->
#   re-check -> restore on drift
#
# SCOPE: business-platform-btrl ONLY. The primary project is untouched and
# stays Git-connected; its Preview and Production flows are unaffected.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Existing main commit SHA to release (same-SHA resume). Defaults to current main.'
        required: false
        type: string

# SERIALISE. Never cancel-in-progress: a cancellation landing between promote
# and its verification, or inside remediation, would leave production in a
# state no run is still watching. Queueing costs latency; cancelling costs
# knowing what is live. A queued run re-reads main and refuses on its own if it
# has gone stale, so serialising is safe as well as necessary.
concurrency:
  group: release-deploy-btrl
  cancel-in-progress: false

permissions:
  contents: read
  # The gate reads the attestation artifact and the metadata of the run that
  # produced it. Without actions:read those calls 403 and the gate refuses with
  # CANNOT_VERIFY: fail-closed, but for the wrong reason.
  actions: read

env:
  VERCEL_API: https://api.vercel.com

jobs:
  release:
    runs-on: ubuntu-latest
    # ASCII only, deliberately: an earlier draft used an en-dash here. GitHub
    # creates a referenced environment on demand, so a hyphen typed where an
    # en-dash was meant yields a DIFFERENT, empty environment and every release
    # fails looking for secrets sitting in the other one.
    environment: 'production-btrl-release'
    steps:
      - name: Resolve TARGET_SHA
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            TARGET="$INPUT_SHA"
            echo "target from workflow_dispatch input: $TARGET"
          else
            TARGET="$EVENT_SHA"
            echo "target from event: $TARGET"
          fi
          if ! printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "TARGET_SHA must be a full 40-character commit sha, got: $TARGET" >&2
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact TARGET_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the workspace IS TARGET_SHA
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checkout=$HEAD_SHA target=$TARGET_SHA"
          [ "$HEAD_SHA" = "$TARGET_SHA" ] || { echo "workspace is not TARGET_SHA" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI (pinned)
        run: npm i -g vercel@54.9.0

      # The migration decision, before the first step that reads any Vercel
      # credential. A block therefore costs zero Vercel API calls, not even a
      # read, and can be proven before a token exists.
      - name: Release gate — migrations and attestation
        id: gate
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_GUARD_REPO: ${{ github.repository }}
          RELEASE_GUARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/release-deploy-gate.mjs decide

      - name: Prove the credentials resolve to business-platform-btrl
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          NAME="$(curl -sS --fail \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).name??"")}catch{console.log("")}})')"
          echo "credentials resolve to project: $NAME"
          if [ "$NAME" != "business-platform-btrl" ]; then
            echo "REFUSING — credentials resolve to '$NAME', not business-platform-btrl" >&2
            exit 1
          fi

      # Builds a real production-target deployment that NO domain points at.
      # Nothing is live when this step finishes. --meta carries the provenance
      # the artifact is identified by later; after the Git disconnect Vercel has
      # no commit metadata of its own, so we supply it.
      - name: Build the production artifact without promoting it
        id: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          vercel deploy --prod --skip-domain --yes \
            --token "$VERCEL_TOKEN" \
            --project "$VERCEL_PROJECT_ID" \
            --meta releaseTargetSha="$TARGET_SHA" \
            --meta releaseWorkflowRunId="${GITHUB_RUN_ID}" \
            --meta releaseWorkflowRunAttempt="${GITHUB_RUN_ATTEMPT}" \
            --meta releaseRepository="${GITHUB_REPOSITORY}" \
            --meta releaseGateOutcome="${{ steps.gate.outputs.outcome }}" \
            --meta releaseAttestationRun="${{ steps.gate.outputs.attestation_run }}" \
            > deploy-stdout.txt
          # stdout is a hint only. The authoritative identity is established in
          # the next step from the API, keyed on this run's own meta.
          URL="$(grep -Eo 'https://[a-zA-Z0-9.-]+' deploy-stdout.txt | tail -1)"
          echo "built (unpromoted): $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Identity is established by asking Vercel which deployment carries THIS
      # run's meta, not by trusting the CLI's stdout. The meta query must match
      # exactly one deployment and it must be the one stdout named; anything
      # else means we cannot say what we built, so we do not promote it.
      - name: Resolve and verify the built artifact
        id: artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          URL: ${{ steps.build.outputs.url }}
        run: |
          set -euo pipefail
          HOST="${URL#https://}"
          curl -sS --fail -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API/v13/deployments/${HOST}?teamId=$VERCEL_ORG_ID" > by-url.json
          curl -sS --fail -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100&meta-releaseWorkflowRunId=${GITHUB_RUN_ID}&meta-releaseWorkflowRunAttempt=${GITHUB_RUN_ATTEMPT}" > by-meta.json
          node -e '
            const fs = require("fs");
            const byUrl = JSON.parse(fs.readFileSync("by-url.json", "utf8"));
            const byMeta = JSON.parse(fs.readFileSync("by-meta.json", "utf8")).deployments ?? [];
            const id = byUrl.id ?? byUrl.uid;
            if (byMeta.length !== 1) {
              console.error(`ARTIFACT_UNVERIFIED: meta query matched ${byMeta.length} deployments, expected exactly 1`);
              process.exit(1);
            }
            const metaId = byMeta[0].uid ?? byMeta[0].id;
            if (metaId !== id) {
              console.error(`ARTIFACT_UNVERIFIED: meta query names ${metaId}, stdout named ${id}`);
              process.exit(1);
            }
            import("./scripts/ci/release-deploy-gate.mjs").then((m) => {
              const r = m.verifyArtifact({
                deployment: { ...byUrl, projectId: byUrl.projectId ?? byUrl.project?.id },
                expected: {
                  deploymentId: id,
                  projectName: "business-platform-btrl",
                  projectId: process.env.VERCEL_PROJECT_ID,
                  targetSha: process.env.TARGET_SHA,
                  runId: process.env.GITHUB_RUN_ID,
                },
              });
              console.log(`artifact: ${r.outcome} — ${r.detail}`);
              if (!r.ok) process.exit(1);
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${id}\n`);
            }).catch((e) => { console.error(`ARTIFACT_UNVERIFIED: ${e?.message ?? e}`); process.exit(1); });
          '

      # Captured BEFORE anything is promoted, so remediation can name the exact
      # deployment that was production, rather than asking Vercel for "the
      # previous one" after the fact.
      - name: Capture the current production deployment
        id: prev
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          PREV="$(curl -sS --fail -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$VERCEL_API/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).targets?.production?.id??"")}catch{console.log("")}})')"
          if [ -z "$PREV" ]; then
            echo "no current production deployment — remediation will be UNAVAILABLE for this release"
          else
            echo "current production deployment: $PREV"
          fi
          echo "id=$PREV" >> "$GITHUB_OUTPUT"

      # THE LAST TWO ACTIONS, IN ONE SHELL, IN THIS ORDER. Nothing may be
      # inserted between them: the freshness answer is only as good as the
      # distance to the alias flip it authorises. `set -e` means a non-zero
      # freshness exit ends the step before promote is reached.
      - name: Final freshness check, then promote the exact artifact
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.artifact.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node scripts/ci/release-deploy-gate.mjs freshness
          vercel promote "$DEPLOYMENT_ID" --yes --token "$VERCEL_TOKEN"

      # The promote boundary is the only place the race can still cross. This
      # looks, and if it crossed, puts production back to the exact deployment
      # captured before the promote. Runs even if promote failed, so a partial
      # promotion is still inspected rather than left unexamined.
      - name: Verify after promote, and restore production on drift
        if: always() && steps.prev.outcome == 'success'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.artifact.outputs.deployment_id }}
          PREV_PROD_ID: ${{ steps.prev.outputs.id }}
        run: |
          set -euo pipefail
          prod_id() {
            curl -sS --fail -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$VERCEL_API/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).targets?.production?.id??"")}catch{console.log("")}})'
          }
          git fetch origin main --quiet
          AFTER="$(git rev-parse origin/main)"
          PROD_NOW="$(prod_id)"
          echo "after-promote: main=$AFTER production=$PROD_NOW promoted=${DEPLOYMENT_ID:-<none>}"

          FRESH="$AFTER" PROD_NOW="$PROD_NOW" node -e '
            const fs = require("fs");
            const write = (o) => fs.writeFileSync("verdict.json", JSON.stringify(o));
            import("./scripts/ci/release-deploy-gate.mjs").then((m) => {
              write(m.decidePostPromote({
                targetSha: process.env.TARGET_SHA,
                freshMain: process.env.FRESH,
                promotedId: process.env.DEPLOYMENT_ID || "",
                productionId: process.env.PROD_NOW || null,
                previousProductionId: process.env.PREV_PROD_ID || null,
              }));
            }).catch((e) => write({ ok: false, remediate: false, restoreTo: null, outcome: "CANNOT_VERIFY", detail: String(e?.message ?? e) }));
          '
          field() { node -pe "JSON.parse(require('fs').readFileSync('verdict.json','utf8'))['$1'] ?? ''"; }
          OK="$(field ok)"; REMEDIATE="$(field remediate)"; RESTORE="$(field restoreTo)"
          OUTCOME="$(field outcome)"; DETAIL="$(field detail)"
          echo "post-promote: $OUTCOME — $DETAIL"

          if [ "$OK" = "true" ]; then
            echo "release stands: production is the artifact this run built, and it is still main"
            exit 0
          fi

          if [ "$REMEDIATE" != "true" ]; then
            echo "::error::$OUTCOME - $DETAIL"
            exit 1
          fi

          # The race crossed the promote boundary. Restore the EXACT deployment
          # captured before promoting; never "the latest", never "the previous".
          echo "::warning::restoring production to $RESTORE"
          vercel promote "$RESTORE" --yes --token "$VERCEL_TOKEN" || echo "restore command failed; verifying actual state anyway"
          PROD_AFTER="$(prod_id)"
          RESTORE="$RESTORE" PROD_AFTER="$PROD_AFTER" node -e '
            const fs = require("fs");
            const write = (o) => fs.writeFileSync("remediation.json", JSON.stringify(o));
            import("./scripts/ci/release-deploy-gate.mjs").then((m) => {
              write(m.decideRemediationResult({ restoreTo: process.env.RESTORE, productionIdAfter: process.env.PROD_AFTER || null }));
            }).catch((e) => write({ outcome: "STALE_AFTER_PROMOTE_RECOVERY_FAILED", detail: String(e?.message ?? e) }));
          '
          rfield() { node -pe "JSON.parse(require('fs').readFileSync('remediation.json','utf8'))['$1'] ?? ''"; }
          R_OUTCOME="$(rfield outcome)"; R_DETAIL="$(rfield detail)"
          echo "::error::$R_OUTCOME - $R_DETAIL"
          echo "  promoted artifact : ${DEPLOYMENT_ID:-<none>}"
          echo "  restore target    : $RESTORE"
          echo "  production now    : ${PROD_AFTER:-<unreadable>}"
          # Either way this run did not deliver a standing release.
          exit 1

      - name: Job summary
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "## release-deploy (business-platform-btrl)"
            echo ""
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Migration gate: \`${{ steps.gate.outputs.outcome || '(not reached)' }}\`"
            echo "- Gate detail: ${{ steps.gate.outputs.detail }}"
            echo "- Built artifact: \`${{ steps.artifact.outputs.deployment_id || '(none built)' }}\`"
            echo "- Production before: \`${{ steps.prev.outputs.id || '(none)' }}\`"
            echo "- Promote step: \`${{ steps.promote.outcome || '(not reached)' }}\`"
            echo ""
            echo "A non-SAFE gate ends the run before any deployment is created."
            echo "A stale target ends the run with an artifact built but never promoted."
          } >> "$GITHUB_STEP_SUMMARY"
