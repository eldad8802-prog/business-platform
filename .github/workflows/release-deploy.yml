name: release-deploy

# Gated production release for the BTRL pilot.
#
# WHY THIS EXISTS
#
# Vercel's Ignored Build Step can refuse a build, but only after Vercel has
# already created the Deployment object — the refusal is a deployment that
# exists and was cancelled. To make an unsafe release produce NO deployment at
# all, the decision has to happen before anything asks Vercel to deploy. So
# business-platform-btrl is deliberately disconnected from Git, and this
# workflow is the only thing that can deploy it.
#
# The migration decision is not reimplemented here: scripts/ci/release-guard.mjs
# supplies evaluate()/verifyRun()/fetchAttestation(), the same functions the
# Vercel-side guard uses. This workflow adds the two things that can only be
# checked at the deployment boundary — that the workspace really is the commit
# we mean to ship, and that the commit is still the head of main at the moment
# we ship it.
#
# ORDER IS THE CONTRACT, AND THE ORDER IS DELIBERATE
#
#   resolve -> checkout TARGET_SHA -> prove workspace -> node -> npm ci ->
#   install Vercel CLI -> MIGRATION GATE -> prove project is BTRL ->
#   [freshness + deploy, same shell] -> prove provenance
#
# Two placements in that list carry weight:
#
#   1. Everything slow — dependency install, CLI install, the project lookup —
#      happens BEFORE the freshness check. Every second between "main is still
#      X" and "deploy X" is time for main to move, so nothing that can be done
#      earlier is allowed to sit in that gap. The freshness check and the deploy
#      command are in the SAME step, adjacent, with no step boundary between.
#
#   2. The migration gate runs BEFORE the first step that reads VERCEL_TOKEN.
#      A BLOCKED release therefore makes zero Vercel API calls of any kind, not
#      even a read. That is a property of the ordering, not an aspiration — and
#      it is what lets a block be proven before any Vercel credential exists.
#
# WHAT THIS DOES NOT CLAIM
#
# The race is narrowed to one process boundary, not eliminated. GitHub's ref
# state and Vercel's deployment API are two systems with no shared transaction,
# so no atomic compare-and-swap between them is possible. The post-deploy step
# DETECTS a main that moved during the deploy and fails the run loudly; it
# cannot prevent it.
#
# SCOPE: business-platform-btrl ONLY. The primary project is untouched and stays
# Git-connected; its Preview and Production flows are unaffected by this file.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Existing main commit SHA to release (same-SHA resume). Defaults to current main.'
        required: false
        type: string

# Serialise runs so two releases cannot interleave. This reduces races; it is
# NOT the stale-release protection — that is the fresh origin/main comparison
# immediately before deploying, which holds even if concurrency is misconfigured.
concurrency:
  group: release-deploy-btrl
  cancel-in-progress: false

permissions:
  contents: read
  # The gate reads the attestation artifact and the metadata of the run that
  # produced it (/actions/artifacts, /actions/runs). Without actions:read those
  # calls 403 and the gate correctly refuses with CANNOT_VERIFY — fail-closed,
  # but for the wrong reason, and every release would stall.
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Scopes the Vercel credentials to this job. The environment also gives the
    # owner a place to require review before a production release.
    #
    # ASCII only, and deliberately so: an earlier draft used an en-dash in this
    # name. GitHub creates a referenced environment on demand, so a hyphen typed
    # where an en-dash was meant produces a DIFFERENT, empty environment, and
    # every release then fails looking for secrets sitting in the other one.
    environment: 'production-btrl-release'
    steps:
      - name: Resolve TARGET_SHA
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            TARGET="$INPUT_SHA"
            echo "target from workflow_dispatch input: $TARGET"
          else
            TARGET="$EVENT_SHA"
            echo "target from event: $TARGET"
          fi
          if ! printf '%s' "$TARGET" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "TARGET_SHA must be a full 40-character commit sha, got: $TARGET" >&2
            exit 1
          fi
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact TARGET_SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          # Full history so origin/main can be re-read later in the run.
          fetch-depth: 0
          persist-credentials: false

      - name: Prove the workspace IS TARGET_SHA
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "checkout=$HEAD_SHA target=$TARGET_SHA"
          [ "$HEAD_SHA" = "$TARGET_SHA" ] || { echo "workspace is not TARGET_SHA" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Pinned, and installed HERE rather than after the gate: this is the
      # slowest remaining step, and it must not sit between the freshness check
      # and the deploy command.
      - name: Install Vercel CLI (pinned)
        run: npm i -g vercel@54.9.0

      # The migration decision. Exits non-zero on BLOCKED / CANNOT_VERIFY /
      # checkout mismatch, so no later step can run. Reads no Vercel credential:
      # a block here happens with zero Vercel contact.
      - name: Release gate — migrations and attestation
        id: gate
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_GUARD_REPO: ${{ github.repository }}
          RELEASE_GUARD_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/release-deploy-gate.mjs decide

      # Proves the credentials point at the pilot BEFORE anything is deployed.
      # Read-only: one GET, no deployment object is created.
      - name: Prove the deploy target is business-platform-btrl
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          NAME="$(curl -sS --fail \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).name??"")}catch{console.log("")}})')"
          echo "credentials resolve to project: $NAME"
          if [ "$NAME" != "business-platform-btrl" ]; then
            echo "REFUSING TO DEPLOY — credentials resolve to '$NAME', not business-platform-btrl" >&2
            exit 1
          fi

      # THE LAST TWO ACTIONS OF THE RUN, IN ONE SHELL, IN THIS ORDER.
      #
      # Nothing may be inserted between them. The freshness check is the final
      # automated enforcement that we are not shipping a stale commit, and the
      # very next command is the deploy. `set -e` means a non-zero freshness
      # exit ends the step before `vercel deploy` is ever reached.
      #
      # --project is passed as well as the env vars so the target is stated
      # twice and cannot silently fall back to a linked project. --meta carries
      # provenance: after the Git disconnect Vercel has no commit metadata of
      # its own, so we supply it.
      - name: Final freshness check, then immediate production deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          node scripts/ci/release-deploy-gate.mjs freshness
          URL="$(vercel deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --project "$VERCEL_PROJECT_ID" \
            --meta releaseTargetSha="$TARGET_SHA" \
            --meta releaseWorkflowRunId="${GITHUB_RUN_ID}" \
            --meta releaseWorkflowRunAttempt="${GITHUB_RUN_ATTEMPT}" \
            --meta releaseRepository="${GITHUB_REPOSITORY}" \
            --meta releaseGateOutcome="${{ steps.gate.outputs.outcome }}" \
            --meta releaseAttestationRun="${{ steps.gate.outputs.attestation_run }}")"
          echo "deployment url: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Provenance: read the deployment back and prove which commit it carries.
      # Also DETECTS the residual race — main moving while the deploy was in
      # flight. It cannot undo that; it makes it loud and fails the run so that
      # superseding the release is an explicit act rather than an assumption.
      - name: Prove deployed SHA provenance and detect main drift
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          HOST="${URL#https://}"
          curl -sS --fail \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${HOST}?teamId=$VERCEL_ORG_ID" \
            > deployment.json
          node -e '
            const d = require("./deployment.json");
            const meta = d.meta ?? {};
            const target = process.env.TARGET_SHA;
            const out = {
              deploymentId: d.id ?? d.uid,
              target: d.target,
              state: d.readyState ?? d.status,
              createdAt: new Date(d.createdAt ?? d.created).toISOString(),
              project: d.name,
              releaseTargetSha: meta.releaseTargetSha ?? null,
              releaseWorkflowRunId: meta.releaseWorkflowRunId ?? null,
            };
            console.log(JSON.stringify(out, null, 2));
            if (out.releaseTargetSha !== target) {
              console.error(`PROVENANCE MISMATCH: deployment carries ${out.releaseTargetSha}, expected ${target}`);
              process.exit(1);
            }
            if (out.project !== "business-platform-btrl") {
              console.error(`WRONG PROJECT: ${out.project}`);
              process.exit(1);
            }
          '
          git fetch origin main --quiet
          AFTER="$(git rev-parse origin/main)"
          if [ "$AFTER" != "$TARGET_SHA" ]; then
            echo "MAIN DRIFTED DURING DEPLOY: origin/main is now $AFTER, deployed $TARGET_SHA" >&2
            echo "The deployment is live but is no longer the head of main. Re-run this" >&2
            echo "workflow against $AFTER to supersede it." >&2
            exit 1
          fi
          echo "origin/main is still $TARGET_SHA — no drift during deploy"

      - name: Job summary
        if: always()
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "## release-deploy (business-platform-btrl)"
            echo ""
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Migration gate: \`${{ steps.gate.outputs.outcome }}\`"
            echo "- Gate detail: ${{ steps.gate.outputs.detail }}"
            echo "- Freshness: \`${{ steps.deploy.outputs.outcome || '(not reached)' }}\`"
            echo "- Deployment: ${{ steps.deploy.outputs.url || '(none created)' }}"
            echo ""
            echo "A non-SAFE gate ends the run before any deployment is created."
          } >> "$GITHUB_STEP_SUMMARY"
