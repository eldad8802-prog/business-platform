# Account recovery — email verification, password reset, login hardening (ephemeral PG17).
#
#   1. Pure suite (lib/auth/account-recovery.test.ts): link derivation, payload contract, flags OFF and
#      fail-closed, identical forgot-password answers, limits, honeypot, Hebrew messages, static scope.
#   2. App battery (.aet/app-battery.ts): the REAL routes and libraries against the .aet lab with
#      migration 20261017090000_auth_email_tokens applied, as the real planes (app_auth login for the auth
#      plane, app_runtime_prod for the tenant plane): forgot → the recorded email → its rendered link →
#      reset → the real login route; session revocation; verification; the per-account failure limit;
#      another business untouched.
#   3. Ledger battery (.aet/ledger-battery.ts): the sign-in failure ledger on a REAL Redis through the
#      Upstash REST emulator (the production Lua scripts: atomic reserve, rolling window, lock, clear,
#      a parallel burst of 20 → exactly 4) — and on the in-memory backend.
#   4. The app battery again with the REAL Redis limiter: the 4-failure lock end to end on Lua.
#
# The TE lab creates app_auth after the AuthSession privilege migrations ran (they are role-guarded and
# idempotent), so the battery replays those two migrations first — exactly Production's grants.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network; no email is sent (delivery OFF).

name: auth account recovery — pure suite + app battery (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "app/api/auth/**"
      - "app/login/**"
      - "app/register/**"
      - "app/forgot-password/**"
      - "app/reset-password/**"
      - "app/verify-email/**"
      - "components/auth/**"
      - "lib/auth/**"
      - "lib/auth.ts"
      - "lib/email/transactional/**"
      - "lib/security/rate-limit.ts"
      - "lib/security/rate-limiter/**"
      - "lib/security/log-safe-error*.ts"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261017090000_auth_email_tokens/**"
      - ".aet/**"
      - ".github/workflows/auth-account-recovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-account-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: account recovery (pure + PG17 app battery)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: aet_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The sign-in failure ledger runs as Lua inside Redis in Production (Upstash). These two run the
      # REAL scripts: a real Redis, behind serverless-redis-http — the Upstash REST emulator the
      # @upstash/redis client speaks to. Local only, synthetic token.
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http:0.0.10@sha256:65128347949bca511e448fd7238780d624573d74c22b79155a7563db19e9b678
        env:
          SRH_MODE: env
          SRH_TOKEN: aet_ci_synthetic_upstash_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: aet_ci_synthetic_super_pw
      LAB_PASSWORD: aet_ci_synthetic_role_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 1. Pure suite
        run: npx tsx lib/auth/account-recovery.test.ts

      - name: 1b. Auth limits while Redis is unreachable (local fallback, recovery, bursts) + safe auth logs
        run: |
          npx tsx lib/security/rate-limiter/auth-fallback.verify.test.ts
          npx tsx lib/security/log-safe-error.test.ts

      - name: 2. App battery — real routes, real roles, migration applied
        run: |
          set -euo pipefail
          bash .aet/lab.sh aet_app --with-aet
          for m in 20260908200000_auth_session_privilege_contract 20260913120000_authsession_user_agent; do
            PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d aet_app -v ON_ERROR_STOP=1 -q -f "prisma/migrations/$m/migration.sql"
          done
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/aet_app"
          OWNER_URL="$U" DIRECT_URL="$U" \
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/aet_app" \
          AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/aet_app" \
          AUTH_PLANE_ENABLED=true \
          AUTH_TOKEN_SECRET=aet_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef \
          RATE_LIMIT_BACKEND=memory \
            npx tsx .aet/app-battery.ts

      - name: 3. Sign-in failure ledger on REAL Redis (the Lua scripts, via the Upstash REST emulator) — and on memory
        env:
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: aet_ci_synthetic_upstash_token
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do curl -sf -H "Authorization: Bearer $UPSTASH_REDIS_REST_TOKEN" "$UPSTASH_REDIS_REST_URL/ping" >/dev/null && break; sleep 1; done
          RATE_LIMIT_BACKEND=redis npx tsx .aet/ledger-battery.ts
          RATE_LIMIT_BACKEND=memory npx tsx .aet/ledger-battery.ts

      - name: 4. App battery again with the REAL Redis limiter (the login lock end to end on Lua)
        env:
          UPSTASH_REDIS_REST_URL: http://localhost:8079
          UPSTASH_REDIS_REST_TOKEN: aet_ci_synthetic_upstash_token
        run: |
          set -euo pipefail
          PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d postgres -qc "CREATE DATABASE aet_app_redis TEMPLATE aet_app" || bash .aet/lab.sh aet_app_redis --with-aet
          for m in 20260908200000_auth_session_privilege_contract 20260913120000_authsession_user_agent; do
            PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d aet_app_redis -v ON_ERROR_STOP=1 -q -f "prisma/migrations/$m/migration.sql"
          done
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/aet_app_redis"
          OWNER_URL="$U" DIRECT_URL="$U" \
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/aet_app_redis" \
          AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/aet_app_redis" \
          AUTH_PLANE_ENABLED=true \
          AUTH_TOKEN_SECRET=aet_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef \
          RATE_LIMIT_BACKEND=redis \
            npx tsx .aet/app-battery.ts
