# Languages + multi-currency — everything provable WITHOUT Production, on an ephemeral PG17.
#
#   1. pure tests      i18n dictionaries (parity/placeholders), money engine, coverage, titles
#   2. regression      the DB-backed unit tests on this branch AND on main, same database:
#                      a failure is "new" only if main passes the same test
#   3. battery         multi-currency collection + tenant isolation through the real routes (flag OFF)
#   4. e2e             two builds (flag ON / OFF — the flag takes effect per build), signed-in owner in Chromium at
#                      phone / tablet / desktop × he / en; screenshots uploaded as an artifact
#   6. activation     (job 2) EVERY page route on two builds of the same commit running side by side:
#      readiness      route matrix he/en × 3 widths, Hebrew parity flag ON (no cookie / he / English browser)
#                     = flag OFF, isolation, public / customer-facing pages, emails, static-vs-dynamic table
#   (the C-2 migration itself — prisma/migrations/20261025090000_currency_settings_fx_rates — is proven by
#    .github/workflows/currency-fx-migration-lab.yml in Production's role topology; the earlier proposal-only
#    proof that lived here was retired with docs/i18n-multicurrency/proposed-migration.sql)
#
# Synthetic CI-only credentials; ZERO secrets; ZERO Neon; ZERO Production.

name: i18n + multi-currency (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/i18n/**"
      - "lib/money/**"
      - "components/i18n/**"
      - "app/api/preferences/**"
      - "docs/i18n-multicurrency/**"
      - ".i18n/**"
      - ".github/workflows/i18n-multicurrency-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-multicurrency:
    name: i18n + multi-currency (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fx_owner
          POSTGRES_PASSWORD: fx_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_fx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fx_owner -d dubiz_fx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      DIRECT_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      AUTH_DATABASE_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      TEST_DATABASE_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      AUTH_TOKEN_SECRET: fx_ci_auth_secret_synthetic_at_least_32_chars
      CRON_SECRET: fx_ci_cron_secret_synthetic_at_least_32_chars
      PGPASSWORD: fx_ci_synthetic_owner_pw

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund

      - name: 1 · Pure tests (no database)
        run: |
          npx tsx lib/i18n/i18n.verify.test.ts
          npx tsx lib/money/money.verify.test.ts
          npx tsx lib/money/scenarios.verify.test.ts
          npx tsx lib/services/tasks/tasks-i18n.test.ts
          npx tsx lib/services/crm/lead-history-i18n.test.ts
          npx tsx lib/email/transactional/transactional-email-i18n.test.ts
          npx tsx lib/navigation/app-title-metadata.test.ts
          npx tsx lib/knowledge/coverage/feature-coverage.test.ts
          npx tsx components/navigation/nav-destinations.test.tsx
          npx tsx .i18n/readiness-lib.test.ts

      - name: Push schema (lab)
        run: npx prisma db push --skip-generate

      - name: 2 · DB-backed regression — branch vs main on the same database
        run: |
          git worktree add --detach ../base origin/main
          (cd ../base && npm ci --no-audit --no-fund >/dev/null && npx prisma generate >/dev/null)
          bash .i18n/regression.sh . ../base

      - name: 3 · Multi-currency battery (real routes, real auth, flag OFF)
        run: npx tsx .i18n/battery.mts

      # The flag is read at render time, and a flag-OFF build pre-renders the root layout statically,
      # so each phase gets its own build (Production: set the env var AND redeploy).
      # Both builds run BEFORE the Chromium install: after `playwright install --with-deps` the Turbopack
      # build could not resolve the next/font (Heebo) files, 4 runs in a row (release/verify, which never
      # installs Playwright, builds the same commit fine).
      - name: Build (flag ON)
        if: ${{ !cancelled() }}
        env:
          DUBIZ_I18N_ENABLED: "true"
        run: npm run build && mv .next ${{ runner.temp }}/next-on

      - name: Build (flag OFF = Production today)
        if: ${{ !cancelled() }}
        run: npm run build && mv .next ${{ runner.temp }}/next-off

      - name: Install Chromium
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps chromium

      - name: 4a · E2E flag ON — signed-in owner, 3 widths × 2 languages, persistence, data, isolation
        if: ${{ !cancelled() }}
        env:
          DUBIZ_I18N_ENABLED: "true"
          E2E_PHASE: "on"
          E2E_SHOTS: ${{ runner.temp }}/i18n-shots
        run: |
          rm -rf .next && mv ${{ runner.temp }}/next-on .next
          (npx next start -p 3611 > ${{ runner.temp }}/on.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3611/login && break; sleep 2; done
          npx tsx .i18n/e2e.mts
          pkill -f "next start -p 3611" || true

      - name: 4b · E2E flag OFF — cookie ignored, Hebrew/RTL, endpoint 404
        if: ${{ !cancelled() }}
        env:
          E2E_PHASE: "off"
          E2E_SHOTS: ${{ runner.temp }}/i18n-shots
        run: |
          rm -rf .next && mv ${{ runner.temp }}/next-off .next
          (npx next start -p 3612 > ${{ runner.temp }}/off.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3612/login && break; sleep 2; done
          npx tsx .i18n/e2e.mts

      - name: Upload screenshots + report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: i18n-e2e-screenshots
          path: ${{ runner.temp }}/i18n-shots
          if-no-files-found: ignore

  activation-readiness:
    name: English activation readiness — every route (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fx_owner
          POSTGRES_PASSWORD: fx_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_fx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fx_owner -d dubiz_fx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      DIRECT_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      AUTH_DATABASE_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      TEST_DATABASE_URL: postgresql://fx_owner:fx_ci_synthetic_owner_pw@localhost:5432/dubiz_fx
      AUTH_TOKEN_SECRET: fx_ci_auth_secret_synthetic_at_least_32_chars
      CRON_SECRET: fx_ci_cron_secret_synthetic_at_least_32_chars

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Report directory
        run: echo "READINESS_OUT=$RUNNER_TEMP/readiness" >> "$GITHUB_ENV"

      - name: Push schema (lab)
        run: npx prisma db push --skip-generate

      # Two builds of the SAME commit, both before the Chromium install (see job 1). The flag-OFF build
      # lives in a second worktree so both servers can run side by side for the parity comparison.
      - name: Build (flag ON)
        shell: bash
        env:
          DUBIZ_I18N_ENABLED: "true"
        run: |
          mkdir -p "$READINESS_OUT"
          npm run build 2>&1 | tee "$READINESS_OUT/build-on.log"

      - name: Build (flag OFF = Production today) in a second worktree of the same commit
        shell: bash
        run: |
          git worktree add --detach ../off HEAD
          cd ../off
          npm ci --no-audit --no-fund >/dev/null
          npm run build 2>&1 | tee "$READINESS_OUT/build-off.log"

      - name: 6a · Static vs dynamic — route table flag OFF vs ON
        run: npx tsx .i18n/route-table.mts "$READINESS_OUT/build-off.log" "$READINESS_OUT/build-on.log" "$READINESS_OUT/route-table.json"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: 6b · Readiness — route matrix, Hebrew parity, isolation, public pages, emails
        shell: bash
        env:
          READINESS_WORKERS: "4"
        run: |
          (DUBIZ_I18N_ENABLED=true npx next start -p 3611 > "$READINESS_OUT/server-on.log" 2>&1 &)
          (cd ../off && npx next start -p 3612 > "$READINESS_OUT/server-off.log" 2>&1 &)
          for p in 3611 3612; do for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:$p/login && break; sleep 2; done; done
          npx tsx .i18n/activation-readiness.mts

      - name: Upload readiness report + screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: i18n-activation-readiness
          path: ${{ runner.temp }}/readiness
          if-no-files-found: ignore
