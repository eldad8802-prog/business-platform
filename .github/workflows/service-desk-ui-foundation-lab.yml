name: service desk UI foundation — 1.3-0 migration lab (ephemeral PG17)

# Service Desk 1.3-0: migration 20261120090000_service_desk_ui_foundation (PR-1) and its PR-2 code (Prisma models,
# account-erasure wiring, the post-commit object stage), proven on a throwaway PostgreSQL 17 with synthetic data only.
# The lab is the Production topology the migration is released onto: 1.2a, 1.2b and M2 applied (.sdp/lab.sh --with-m2),
# every migration before 1.3-0 in the ledger, then `prisma migrate deploy`.
# Nothing here connects to Production or Preview, and nothing applies anything there.

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261120090000_service_desk_ui_foundation/**"
      - "ops/evidence/service-desk-ui-foundation-*.sql"
      - ".sd3/**"
      - "prisma/migrations/20261122090000_service_desk_audit_journal/**"
      - ".github/workflows/service-desk-ui-foundation-lab.yml"
      - "prisma/schema.prisma"
      - ".sdf/lab.sh"
      - ".sdx/lab.sh"
      - ".sdp/lab.sh"
      - "lib/services/account/**"
      - "lib/services/service-desk/erasure/**"
      - "lib/services/service-desk/storage/**"
      - "lib/storage/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service desk UI foundation lab (PG17, 1.2a + 1.2b + M2 applied)
    runs-on: ubuntu-latest
    timeout-minutes: 150

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sd3_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sd3_ci_synthetic_super_pw
      LAB_PASSWORD: sd3_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/service-desk-ui-foundation-preflight.sql
      EVIDENCE: ops/evidence/service-desk-ui-foundation-production-evidence.sql
      SD3: prisma/migrations/20261120090000_service_desk_ui_foundation/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only; checksum pinned; the migration names only its own objects; no schema models, no code
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            if grep -inE '(default_)?transaction_read_only|read[[:space:]]+write|session[[:space:]]+characteristics|reset[[:space:]]+all|session[[:space:]]+authorization' "$f"; then
              echo "$f touches the read-only boundary"; exit 1
            fi
          done
          node scripts/ci/evidence-output-guard.mjs
          sum=$(sha256sum "$SD3" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$SD3 sha256 $sum (pinned)"
          new='ServiceTextVersion|ServiceSettings|ServiceIntakeTermsSnapshot|ServiceWarrantyOffer|ServiceIntakePhoto|ServiceShareEvent|ServicePhoneReminder|ServiceStorageErasure'
          prefix="^\"($new)_[A-Za-z_]+\"$"
          own="\"($new|ServiceTextKind|ServiceTextLegalStatus|ServiceDurationUnit|ServiceWarrantyOfferState|ServiceWarrantyOfferSource|ServiceReaffirmMethod|ServiceShareObjectKind|ServiceShareChannel|ServicePhoneReminderOutcome|ServiceStorageErasureState)\""
          base='"(Business|User|StaffMember|ServiceCase|ServiceCaseIntake|ServiceQuote|ServiceHandover|PlatformFeatureDefinition|PlatformFeaturePolicy)"'
          others=$(sed 's/--.*$//' "$SD3" | grep -oE '"[A-Z][A-Za-z_]*"' | sort -u | grep -vE "$prefix" | grep -vxE "$own|$base" || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          # The only statements on an existing relation are the two feature rows (INSERT … ON CONFLICT DO NOTHING); no
          # ALTER / DROP / trigger / policy on any table it does not create.
          if sed 's/--.*$//' "$SD3" | grep -nE '^(ALTER|DROP) ' | grep -vE "^[0-9]+:ALTER TABLE \"($new)\" "; then echo "the migration alters or drops an existing object"; exit 1; fi
          if sed 's/--.*$//' "$SD3" | grep -nE 'ON "(Business|User|StaffMember|ServiceCase|ServiceCaseIntake|ServiceQuote|ServiceHandover)"'; then echo "a trigger / policy / grant on an existing table"; exit 1; fi
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261120090000_service_desk_ui_foundation" ]] || continue
            # Service Desk P4 audit journal (#1035): its matches_case trigger reads "ServiceSettings" (version only) — named
            # one by one, never a pattern; its own lab (service-desk-audit-journal-lab.yml) proves what it does.
            [[ "$n" != "20261122090000_service_desk_audit_journal" ]] || continue
            [[ "$n" != "20261126090000_service_desk_case_charge" ]] || continue
            [[ "$n" != "20261127090000_service_desk_tracks" ]] || continue
            [[ "$n" != "20261130090000_service_handover_debt_record" ]] || continue
            # Service Desk loans (20261201090000): its loan insert guard calls service_ui_business_writable() (a business being
            # deleted lends nothing) — named one by one, never a pattern; its own lab (service-desk-loans-lab.yml) proves it.
            [[ "$n" != "20261201090000_service_desk_loans" ]] || continue
            if sed 's/--.*$//' "$d/migration.sql" | grep -nE "\"($new)\"|service_ui_|service_text_version_|service_settings_guard|service_intake_terms_|service_warranty_|service_intake_photo_|service_share_event_|service_phone_reminder_|service_storage_erasure_|service_desk_ui_"; then
              echo "$n names a 1.3-0 object"; exit 1
            fi
          done
          # PR-2 models the eight tables in schema.prisma (all of them, nothing else of 1.3-0).
          got=$(grep -oE "^model ($new) " prisma/schema.prisma | sort -u | wc -l)
          test "$got" -eq 8 || { echo "schema.prisma must model exactly the eight 1.3-0 tables, found $got"; exit 1; }
          echo "the migration names only its own objects and the tables it builds on; no other migration names its objects; schema.prisma models its eight tables"

      - name: 1. Baseline (pending) — PREFLIGHT passes whole; the proof refuses; checks 1, 3, 4, 5, 6 and 17 are live
        run: |
          set -euo pipefail
          bash .sd3/lab.sh sd3_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sd3_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "baseline: expected no preflight failure, got: $fails"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "16" || { echo "expected 16 PASS"; exit 1; }
          if lab -f "$EVIDENCE" 2>/dev/null | grep -qE '^ +1 \| PASS'; then echo "the proof passed before the migration"; exit 1; fi
          lab -At -f .sd3/fingerprint.sql > /tmp/fp.pre
          live() {  # live <n> <want> <inject> <undo>
            lab -q -c "$3"; got=$(lab -f "$PREFLIGHT" | grep -E "^ +$1 \|" | tr -d ' '); lab -q -c "$4"
            test "$got" = "$2" || { echo "check $1 is not live: $got (want $2)"; exit 1; }
          }
          live 3 "3|FAIL|1" "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('lab-later', 'x', now(), '20261199000000_lab_later', 1)" \
                            "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-later'"
          live 4 "4|FAIL|1" "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '20261113090000_service_external_work'" \
                            "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '20261113090000_service_external_work'"
          live 5 "5|FAIL|0" "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '20261114090000_business_documents_records'" \
                            "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '20261114090000_business_documents_records'"
          live 6 "6|FAIL|0" "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '20261115090000_service_parts'" \
                            "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '20261115090000_service_parts'"
          live 1 "1|FAIL|1" "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '20261115090000_service_parts'" \
                            "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '20261115090000_service_parts'"
          # 17: the appointments migration (#1001) must be APPLIED in the ledger — missing, unfinished, rolled back,
          # or a failed row beside a finished one all refuse.
          APPT=20261115100000_appointments_open_all
          test "$(lab -At -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '$APPT' AND finished_at IS NOT NULL")" = "1" || { echo "the lab ledger lacks $APPT"; exit 1; }
          live 17 "17|FAIL|0" "UPDATE \"_prisma_migrations\" SET migration_name = 'lab-hidden-$APPT' WHERE migration_name = '$APPT'" \
                              "UPDATE \"_prisma_migrations\" SET migration_name = '$APPT' WHERE migration_name = 'lab-hidden-$APPT'"
          live 17 "17|FAIL|0" "UPDATE \"_prisma_migrations\" SET finished_at = NULL WHERE migration_name = '$APPT'" \
                              "UPDATE \"_prisma_migrations\" SET finished_at = now() WHERE migration_name = '$APPT'"
          live 17 "17|FAIL|0" "UPDATE \"_prisma_migrations\" SET rolled_back_at = now() WHERE migration_name = '$APPT'" \
                              "UPDATE \"_prisma_migrations\" SET rolled_back_at = NULL WHERE migration_name = '$APPT'"
          live 17 "17|FAIL|0" "INSERT INTO \"_prisma_migrations\" (id, checksum, migration_name, applied_steps_count) VALUES ('lab-failed-appt', 'x', '$APPT', 0)" \
                              "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-failed-appt'"
          echo "baseline whole; checks 1, 3, 4, 5, 6 and 17 are live"

      - name: 2. prisma migrate deploy applies it — proof 16/16; preflight fails exactly its "not there yet" checks; no existing object changed
        run: |
          set -euo pipefail
          bash .sd3/lab.sh sd3_pre --deploy-only | tee /tmp/post.log
          grep -q 'Applying migration `20261120090000_service_desk_ui_foundation`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sd3_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "16" || { echo "expected 16 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 7 8 9 10 " || { echo "after the release: expected '2 7 8 9 10 ', got: $fails"; exit 1; }
          lab -At -f .sd3/fingerprint.sql > /tmp/fp.post
          diff /tmp/fp.pre /tmp/fp.post || { echo "an existing object changed"; exit 1; }
          echo "expand-only: functions, constraints, policies, triggers, ACLs, columns, indexes, enums and feature rows unchanged"

      - name: 3. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sd3_pre -v ON_ERROR_STOP=1 "$@"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test -z "$(failing)" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "NO FORCE row-level security" "3 " 'ALTER TABLE "ServiceWarrantyOffer" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "ServiceWarrantyOffer" FORCE ROW LEVEL SECURITY'
          fault "a permissive FOR ALL policy" "4 5 " 'CREATE POLICY sd3_fault_all ON "ServiceIntakePhoto" USING (true)' 'DROP POLICY sd3_fault_all ON "ServiceIntakePhoto"'
          fault "removal privilege for app_runtime" "6 " 'GRANT DELETE ON "ServiceTextVersion" TO app_runtime' 'REVOKE DELETE ON "ServiceTextVersion" FROM app_runtime'
          fault "journal change privilege for app_runtime" "6 " 'GRANT UPDATE ON "ServiceShareEvent" TO app_runtime' 'REVOKE UPDATE ON "ServiceShareEvent" FROM app_runtime'
          fault "the runtime may write the erasure job" "6 " 'GRANT INSERT ON "ServiceStorageErasure" TO app_runtime' 'REVOKE INSERT ON "ServiceStorageErasure" FROM app_runtime'
          fault "PUBLIC read" "7 " 'GRANT SELECT ON "ServicePhoneReminder" TO PUBLIC' 'REVOKE SELECT ON "ServicePhoneReminder" FROM PUBLIC'
          fault "search_path without pg_temp last" "8 " \
            'ALTER FUNCTION public.service_warranty_offer_guard() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_warranty_offer_guard() SET search_path = pg_catalog, public, pg_temp'
          fault "PUBLIC EXECUTE on the erasure door" "9 " 'GRANT EXECUTE ON FUNCTION public.service_desk_ui_erase_business() TO PUBLIC' 'REVOKE EXECUTE ON FUNCTION public.service_desk_ui_erase_business() FROM PUBLIC'
          fault "SECURITY INVOKER pass record" "10 " \
            'ALTER FUNCTION public.service_storage_erasure_record_pass(integer, integer, text) SECURITY INVOKER' \
            'ALTER FUNCTION public.service_storage_erasure_record_pass(integer, integer, text) SECURITY DEFINER'
          fault "a guard disabled" "11 " 'ALTER TABLE "ServiceIntakePhoto" DISABLE TRIGGER "ServiceIntakePhoto_guard"' 'ALTER TABLE "ServiceIntakePhoto" ENABLE TRIGGER "ServiceIntakePhoto_guard"'
          fault "one-live-offer index gone" "12 " 'DROP INDEX "ServiceWarrantyOffer_one_live_per_case"' \
            'CREATE UNIQUE INDEX "ServiceWarrantyOffer_one_live_per_case" ON "ServiceWarrantyOffer"("businessId", "caseId") WHERE "state" IN ('"'"'PRESENTED'"'"', '"'"'LOCKED'"'"')'
          fault "the flag switched on globally" "14 " \
            "UPDATE \"PlatformFeaturePolicy\" SET \"globalEnabled\" = true WHERE \"featureKey\" = 'service_desk'" \
            "UPDATE \"PlatformFeaturePolicy\" SET \"globalEnabled\" = false WHERE \"featureKey\" = 'service_desk'"
          fault "the 1.2a erasure loses pg_temp" "15 " \
            'ALTER FUNCTION public.service_erase_business() SET search_path = pg_catalog, public' \
            'ALTER FUNCTION public.service_erase_business() SET search_path = pg_catalog, public, pg_temp'
          sum=$(sha256sum "$SD3" | cut -d' ' -f1)
          fault "a ledger checksum that is not the reviewed file" "16 " \
            "UPDATE \"_prisma_migrations\" SET checksum = repeat('0', 64) WHERE migration_name = '20261120090000_service_desk_ui_foundation'" \
            "UPDATE \"_prisma_migrations\" SET checksum = '$sum' WHERE migration_name = '20261120090000_service_desk_ui_foundation'"
          test -z "$(failing)" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 4. Rollback on an empty database — whole (preflight whole, fingerprint as before); the release re-applies it whole
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sd3_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f .sd3/rollback.sql
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "after rollback the preflight is not whole: $fails"; exit 1; }
          lab -At -f .sd3/fingerprint.sql > /tmp/fp.rb
          diff /tmp/fp.pre /tmp/fp.rb || { echo "rollback left an existing object different"; exit 1; }
          bash .sd3/lab.sh sd3_pre --deploy-only | grep -q "service desk UI foundation applied"
          test -z "$(lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; })" || { echo "re-apply after rollback is not whole"; exit 1; }
          echo "rollback whole on an empty database; the release re-applies cleanly"

      - name: 5. 1.3-0 battery — 135/135 as the real roles
        run: |
          set -euo pipefail
          bash .sd3/lab.sh sd3_post --with-sd3 | tee /tmp/sd3_post.log
          grep -q 'Applying migration `20261120090000_service_desk_ui_foundation`' /tmp/sd3_post.log
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sd3_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sd3_post" \
            npx tsx .sd3/battery.ts | tee /tmp/battery.out
          grep -qxE '135 passed, 0 failed' /tmp/battery.out || { echo "the 1.3-0 battery is not 135/135"; exit 1; }

      - name: 5b. Rollback refuses while rows exist
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sd3_post -v ON_ERROR_STOP=1 "$@"; }
          if lab -f .sd3/rollback.sql 2>/tmp/rb.err >/dev/null; then echo "rollback ran over rows"; exit 1; fi
          grep -q "SERVICE_DESK_UI_ROLLBACK_REFUSED" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          test "$(lab -At -c "SELECT count(*) FROM pg_class WHERE relname IN ('ServiceTextVersion','ServiceWarrantyOffer','ServiceStorageErasure')")" = "3" || { echo "refused rollback changed something"; exit 1; }
          echo "rollback refused over rows; nothing changed"

      - name: 6. Regressions with 1.3-0 applied — M2, 1.2b and 1.2a batteries; the real account-deletion purge (twice)
        run: |
          set -euo pipefail
          bash .sd3/lab.sh sd3_reg --with-sd3 >/dev/null
          # LAB ONLY — the inventory session's M0 enum value, as .sdp/lab.sh --m0-sim adds it (M2's issue / return checks).
          PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d sd3_reg -v ON_ERROR_STOP=1 -q -c "ALTER TYPE \"InventoryMovementReason\" ADD VALUE IF NOT EXISTS 'SERVICE_PART'"
          export OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sd3_reg" RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sd3_reg"
          npx tsx .sdp/battery.ts | tee /tmp/m2.out
          grep -qxE '29 passed, 0 failed' /tmp/m2.out || { echo "M2 battery is not 29/29 with 1.3-0 applied"; exit 1; }
          npx tsx .sdx/battery.ts
          set +e
          npx tsx .sdf/battery.ts > /tmp/sdf.out 2>&1
          set -e
          cat /tmp/sdf.out
          # 1.6 / 1.7 count every service_* function and SECURITY DEFINER (structural since 1.2b, pinned in the M2 lab);
          # 1.8 asserts no service_desk feature row at all — true at 1.2a, and 1.3-0 seeds the row OFF by plan.
          # Test debt of the 1.2a battery, documented; never fixed by changing an applied function.
          got=$(grep -oE '^ +\[FAIL\] [0-9]+\.[0-9]+' /tmp/sdf.out | awk '{print $2}' | tr '\n' ' ')
          test "$got" = "1.6 1.7 1.8 " || { echo "1.2a on the 1.3-0 database: expected only the structural 1.6 1.7 1.8, got: $got"; exit 1; }
          grep -qE '^116 passed, 3 failed' /tmp/sdf.out || { echo "the 1.2a pass count changed"; exit 1; }
          unset OWNER_URL RUNTIME_URL
          bash .sd3/lab.sh sd3_erase --with-sd3 >/dev/null
          bash .sdf/erasure-prereq.sh sd3_erase
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sd3_erase"
          export OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sd3_erase" DATABASE_URL="$R" DIRECT_URL="$R" AUTH_DATABASE_URL="$R" \
                 AUTH_TOKEN_SECRET="sd3-ci-synthetic-auth-secret-0123456789abcdef"
          npx tsx .sdf/erasure-battery.ts
          npx tsx .sd3/purge-battery.ts | tee /tmp/purge.out
          grep -qxE '6 passed, 0 failed' /tmp/purge.out || { echo "the purge battery is not 6/6"; exit 1; }
          # PR-2 — the object stage after commit (delete, verify, record; the hour; failures, retries, concurrency,
          # isolation, refused uploads), real local storage in a temp directory, same database, its own businesses.
          npx tsx .sd3/storage-erasure-battery.ts | tee /tmp/storage-erasure.out
          grep -qxE '21 passed, 0 failed' /tmp/storage-erasure.out || { echo "the storage-erasure battery is not 21/21"; exit 1; }

      - name: 7. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .sd3/lab.sh sd3_broken
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d sd3_broken -v ON_ERROR_STOP=1 "$@"; }
          test "$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL")" = "0" || { echo "the ledger was not clean before the faulty deploy"; exit 1; }
          lab -f .sd3/fingerprint.sql > /tmp/fp.broken.pre
          bash .sd3/lab.sh sd3_broken --broken-deploy-only
          # The failure is the injected one (22012 on the appended last statement), not a refusal to start.
          test "$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261120090000_service_desk_ui_foundation' AND finished_at IS NULL AND rolled_back_at IS NULL AND logs LIKE '%22012%' AND logs LIKE '%division by zero%'")" = "1" || { echo "the deploy did not fail on the injected last statement"; exit 1; }
          # Prisma's own failure record is the only row: no finished row, no other ledger change.
          test "$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL OR migration_name >= '20261120090000_service_desk_ui_foundation'")" = "1" || { echo "unexpected ledger rows"; exit 1; }
          lab -f .sd3/fingerprint.sql > /tmp/fp.broken.post
          diff /tmp/fp.broken.pre /tmp/fp.broken.post || { echo "the failed deploy changed an existing object"; exit 1; }
          test "$(lab -c "SELECT count(*) FROM \"PlatformFeaturePolicy\" WHERE \"featureKey\" = 'service_desk'")" = "0" || { echo "a feature row survived the failed deploy"; exit 1; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relnamespace = 'public'::regnamespace AND relname IN ('ServiceTextVersion','ServiceSettings','ServiceIntakeTermsSnapshot','ServiceWarrantyOffer','ServiceIntakePhoto','ServiceShareEvent','ServicePhoneReminder','ServiceStorageErasure'))
            + (SELECT count(*) FROM pg_proc WHERE pronamespace = 'public'::regnamespace AND (proname LIKE 'service\_ui\_%' OR proname LIKE 'service\_warranty\_%' OR proname LIKE 'service\_storage\_erasure\_%' OR proname IN ('service_desk_ui_erase_business','service_text_version_guard','service_settings_guard','service_intake_terms_guard','service_intake_photo_guard','service_share_event_guard','service_phone_reminder_guard')))
            + (SELECT count(*) FROM pg_type WHERE typname IN ('ServiceTextKind','ServiceTextLegalStatus','ServiceDurationUnit','ServiceWarrantyOfferState','ServiceWarrantyOfferSource','ServiceReaffirmMethod','ServiceShareObjectKind','ServiceShareChannel','ServicePhoneReminderOutcome','ServiceStorageErasureState'))
            + (SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE key = 'service_desk')")
          echo "objects left=$left"
          test "$left" = "0" || { echo "NOT atomic"; exit 1; }
          echo "atomic: 0 objects, existing catalog unchanged, no feature row; the only trace is Prisma's unfinished failure row (blocks deploys until migrate resolve)"
