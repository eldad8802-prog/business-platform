# Business documents — the DEDICATED R2 TEST BUCKET against a CANDIDATE HEAD, before it is merged.
#
# Why this exists: the test bucket's credentials live only in the protected Environment business-docs-r2-test, whose
# deployment branches are restricted to main. A pull request's code must be proven against the real bucket BEFORE it
# reaches main, without opening the Environment to any other branch and without merging untested code.
#
# How: this workflow lives on main and is dispatched from main (so the Environment's branch rule is met by main itself).
# It takes a PR number and that PR's exact head SHA. A guard job — no Environment, no secret — checks:
#   - the run is on refs/heads/main;
#   - the SHA is 40 hex and is EXACTLY the open PR's current head, from THIS repository (never a fork), based on main;
#   - the Environment exists with its protections (required reviewer eldad8802-prog, deployment branches = main only,
#     no administrator bypass) — so a dispatch can never auto-create an unprotected one.
# Only then do the jobs below wait for the owner's approval in the Environment. The run's title names the PR and the SHA
# the owner approves. The jobs check out that SHA (not the branch, which may move), and only the step definitions here
# — on main — decide what runs with the secrets. Nothing is merged, deployed or written outside the lab database in the
# runner and the test bucket, and each run removes the objects it wrote.
name: business documents — R2 test bucket, candidate HEAD (owner-approved)
run-name: "R2 test bucket — PR #${{ inputs.pr }} @ ${{ inputs.candidate_sha }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number (this repository)'
        required: true
        type: number
      candidate_sha:
        description: 'The PR head SHA to test (40 hex) — must equal the PR head right now'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: business-docs-r2-test
  cancel-in-progress: false

env:
  # The TypeScript check (tsc / next build) needs more than Node's default ~4 GB heap on this codebase: main alone sits at
  # the limit (clean build, Node 22). The runner has 16 GB. Measured 2026-11-14 on CI preview #1160.
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  guard:
    name: Guard — main only, the exact PR head, the protected Environment exists (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatched from main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::only from refs/heads/main (got $GITHUB_REF)"; exit 1; }
      - name: The candidate is exactly the open PR's head, from this repository, based on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate_sha must be 40 lowercase hex"; exit 1; }
          j=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          state=$(jq -r .state <<<"$j"); head=$(jq -r .head.sha <<<"$j"); repo=$(jq -r .head.repo.full_name <<<"$j"); base=$(jq -r .base.ref <<<"$j")
          echo "PR #$PR: state=$state head=$head repo=$repo base=$base"
          [ "$state" = "open" ] || { echo "::error::PR is not open"; exit 1; }
          [ "$repo" = "$GITHUB_REPOSITORY" ] || { echo "::error::PR head is not from this repository"; exit 1; }
          [ "$base" = "main" ] || { echo "::error::PR is not based on main"; exit 1; }
          [ "$head" = "$SHA" ] || { echo "::error::candidate_sha is not the PR head right now ($head)"; exit 1; }
      - name: The Environment exists with its protections (never created by this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          e=$(gh api "repos/$GITHUB_REPOSITORY/environments/business-docs-r2-test") || { echo "::error::Environment business-docs-r2-test does not exist — create it with its protections first"; exit 1; }
          reviewers=$(jq -r '[.protection_rules[] | select(.type=="required_reviewers") | .reviewers[].reviewer.login] | join(",")' <<<"$e")
          # Explicit comparisons, never jq's `//`: it replaces false as well as null, so `false // true` is true.
          # A missing field fails closed (custom → false, bypass → true).
          custom=$(jq -r 'if .deployment_branch_policy.custom_branch_policies == true then "true" else "false" end' <<<"$e")
          bypass=$(jq -r 'if .can_admins_bypass == false then "false" else "true" end' <<<"$e")
          policies=$(gh api "repos/$GITHUB_REPOSITORY/environments/business-docs-r2-test/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | join(",")')
          echo "reviewers=$reviewers custom_branch_policies=$custom policies=$policies admins_bypass=$bypass"
          [[ ",$reviewers," == *",eldad8802-prog,"* ]] || { echo "::error::required reviewer eldad8802-prog missing"; exit 1; }
          [ "$custom" = "true" ] && [ "$policies" = "branch:main" ] || { echo "::error::deployment branches must be exactly: main"; exit 1; }
          [ "$bypass" = "false" ] || { echo "::error::administrators must not bypass the Environment's protections"; exit 1; }

  r2:
    name: Purchase-order sheet + the business-documents fence against the test bucket (service, real account deletion)
    needs: guard
    environment: business-docs-r2-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bd_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bd_ci_synthetic_super_pw
      LAB_PASSWORD: bd_ci_synthetic_role_pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: The checkout is the approved SHA
        env:
          SHA: ${{ inputs.candidate_sha }}
        run: '[ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checkout is not $SHA"; exit 1; }'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Lab databases (the real migrations, Production role topology)
        run: |
          bash .business-documents/lab.sh bd_r2 --with-bd
          bash .business-documents/lab.sh bd_r2_po --with-po
      - name: The business-documents fence against the test bucket
        env:
          R2_TEST_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          OWNER_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/bd_r2
          DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2
          DIRECT_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2
        run: npx tsx .business-documents/r2.battery.mts
      - name: Purchase-order sheet — save, listed, download = stored, double click, retry, account deletion (records + objects)
        env:
          R2_TEST_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_TEST_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_TEST_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_TEST_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
          OWNER_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po
          SUPER_URL: postgresql://lab_super:bd_ci_synthetic_super_pw@localhost:5432/bd_r2_po
          DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po?connection_limit=10
          DIRECT_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po
          AUTH_DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/bd_r2_po
        run: |
          set -euo pipefail
          npx tsx .business-documents/po-sheet-r2.battery.mts | tee /tmp/po-r2.out
          grep -qxE '[0-9]+ passed, 0 failed' /tmp/po-r2.out

  r2-prod:
    name: Purchase-order sheet — the app in production mode (next build + next start) against the test bucket
    needs: guard
    environment: business-docs-r2-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: bd_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: bd_ci_synthetic_super_pw
      LAB_PASSWORD: bd_ci_synthetic_role_pw
      AUTH_TOKEN_SECRET: po-r2-synthetic-auth-token-secret-0123456789
      TASK_REQUEST_HMAC_KEY: po-r2-synthetic-request-hmac-key-0123456789abcdef
      TASK_REQUEST_HMAC_KEY_ID: lab1
      CRON_SECRET: po_r2_ci_cron_secret_synthetic_at_least_32
      AUTH_PLANE_ENABLED: "true"
      RATE_LIMIT_BACKEND: memory
      DUBIZ_I18N_ENABLED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      OUT: /tmp/po-r2-prod
      E2E_BASE: http://localhost:3740
      OWNER_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod
      SUPER_URL: postgresql://lab_super:bd_ci_synthetic_super_pw@localhost:5432/po_r2_prod
      DATABASE_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod?connection_limit=20
      DIRECT_URL: postgresql://app_runtime_prod:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod
      AUTH_DATABASE_URL: postgresql://lab_owner:bd_ci_synthetic_role_pw@localhost:5432/po_r2_prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: The checkout is the approved SHA
        env:
          SHA: ${{ inputs.candidate_sha }}
        run: '[ "$(git rev-parse HEAD)" = "$SHA" ] || { echo "::error::checkout is not $SHA"; exit 1; }'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      # Build FIRST, before any apt install (see appointments-calendar-ci.yml). The build gets no secret.
      - name: Build the app (production)
        run: mkdir -p "$OUT" && { npm run build > "$OUT/build.log" 2>&1 || { tail -n 80 "$OUT/build.log"; exit 1; }; }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Lab database (both business-documents migrations, Production role topology)
        run: bash .business-documents/lab.sh po_r2_prod --with-po
      - name: Start the app (next start — production mode; storage = the test bucket)
        env:
          STORAGE_PROVIDER: r2
          R2_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_TEST_BUCKET }}
        run: |
          case "$R2_BUCKET_NAME" in *test*|*Test*|*TEST*) ;; *) echo "refused: not a dedicated test bucket"; exit 1;; esac
          (nohup npx next start -p 3740 > "$OUT/server.log" 2>&1 &)
          for i in $(seq 1 90); do curl -sf -o /dev/null http://localhost:3740/login && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3740/login
      - name: End to end in production mode — save, listed, download = stored, double click, retry, flag off, account deletion
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_TEST_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_TEST_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_TEST_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_TEST_BUCKET }}
        run: |
          set -euo pipefail
          npx tsx .business-documents/po-sheet-r2-prod.e2e.mts | tee "$OUT/e2e.out"
          grep -qxE '[0-9]+ passed, 0 failed' "$OUT/e2e.out"
      - name: Server log (on failure)
        if: failure()
        run: grep -vE "auth_sidless_token_accepted" "$OUT/server.log" | tail -n 120 || true
