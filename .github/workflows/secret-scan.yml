name: secret-scan

# WP3 SEC-8 / WP7 DEV-7 — secret scanning.
# Phase 1 (current): NON-BLOCKING dry-run. `continue-on-error: true` means findings are
# reported in the run but do NOT fail the build. Observe results over a stability period,
# then (a future, external decision) remove continue-on-error and/or add branch protection
# to promote it to a Required Gate.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (non-blocking dry-run)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
