name: secret-scan

# WP3 SEC-8 / WP7 DEV-7 — secret scanning.
# Promoted to BLOCKING after W10 validated a clean full-history scan in real CI
# (no leaks) and W11 review closure. The job now FAILS on any finding. Making it a
# Required status check is a branch-protection (repo settings) action for the owner.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
