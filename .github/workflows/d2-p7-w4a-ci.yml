# D2 / P7-W4A — async + provider tenant-context foundation battery (PG17).
# runTenantJob, real WhatsApp webhook trust matrix, env-fallback safety,
# documents after()-continuation, Gmail signed-state (Google stubbed locally),
# CI-W4 guard + negative self-proofs. LAB-ONLY policies; NO canonical RLS.
# Synthetic CI-only creds; ZERO secrets; ZERO Neon.

name: d2/p7 — w4a context foundation battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-p7-w4a]
  pull_request:
    branches: [main]
    paths:
      - "lib/tenant/**"
      - "lib/services/integrations/whatsapp/**"
      - "lib/services/integrations/gmail/**"
      - "lib/services/documents/process-document-pipeline.service.ts"
      - "app/api/integrations/**"
      - "app/api/documents/upload/**"
      - "app/api/documents/[id]/process/**"
      - "prisma/migrations/20260826090000_d2_p7_w4a_message_provider_unique/**"
      - "scripts/ci/w4-context-guard.sh"
      - ".p7w4a/**"
      - "docs/security-d2-provider-bootstrap-allowlist-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w4a-battery:
    name: W4A battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p7w4a_owner
          POSTGRES_PASSWORD: p7w4a_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_p7w4a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p7w4a_owner -d dubiz_p7w4a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .p7w4a/battery.mjs

      - name: CI-W4 guard + negative self-proofs
        run: |
          bash scripts/ci/w4-context-guard.sh .
          bash scripts/ci/w4-context-guard.sh --self-test

      - name: Unit proofs (runTenantJob + signed state)
        env:
          AUTH_TOKEN_SECRET: p7w4a_ci_auth_secret_synthetic
        run: |
          npx tsx lib/tenant/job.test.ts
          npx tsx lib/services/integrations/gmail/signed-state.service.test.ts

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: postgresql://p7w4a_owner:p7w4a_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4a
          DIRECT_URL: postgresql://p7w4a_owner:p7w4a_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4a
        run: npx prisma db push --skip-generate

      - name: Run W4A battery
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: postgresql://p7w4a_owner:p7w4a_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4a
          DIRECT_URL: postgresql://p7w4a_owner:p7w4a_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w4a
          AUTH_TOKEN_SECRET: p7w4a_ci_auth_secret_synthetic
        run: npx tsx .p7w4a/battery.mjs
