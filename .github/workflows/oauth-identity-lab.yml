# OAuth identity foundation / migration 20261030090000_oauth_identity_foundation — proof on PostgreSQL
# BEFORE it reaches Production (ephemeral PG17). "Continue with Google", milestone 1.
#
# .agl/lab.sh builds Production's topology on top of the auth email tokens lab: non-superuser
# CREATEROLE/BYPASSRLS owner, NOLOGIN app_runtime + LOGIN app_runtime_prod, NOLOGIN app_auth (D2 E4
# narrowing on User) + a LOGIN member te_auth_login, the owner's default privileges, Business under B4's
# FORCE RLS; ledger through M6 + P3-E + TE + AET. The migration depends on User and Business alone, and
# step 0 proves it names nothing else.
#
#   0. Evidence files are SELECT-only; the proof pins migration.sql's sha256; the migration names only its
#      own objects, User and Business.
#   1. Baseline (pending): PREFLIGHT passes all but 4 (the by-name ledger list is a PRODUCTION premise this
#      lab's partial history cannot meet); the proof refuses (no tables).
#   2. `prisma migrate deploy` (the release-migrate mechanism) applies it: proof 18/18; the preflight then
#      fails exactly its "not there yet" checks.
#   3. Battery (.agl/battery.ts) as the real roles: privileges, issue, read, a Google signup, replay,
#      ten concurrent signups with one ticket, refusals, rollback, attach guards, resolve, tenant plane,
#      purge, constraints, cascade.
#   4. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#   5. Faults: each widening of a privilege or of RLS is caught by the check meant for it.
#   6. Rollback: refused while rows exist; on an empty database it reverts whole (preflight whole again),
#      and a re-apply makes the proof whole.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: oauth identity — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261030090000_oauth_identity_foundation/**"
      - "prisma/migrations/20261101090000_oauth_ticket_cancel/**"
      - "ops/evidence/oauth-identity-*.sql"
      - ".agl/**"
      - ".aet/lab.sh"
      - ".github/workflows/oauth-identity-lab.yml"
      - "lib/auth/google-id-token*.ts"
      - "lib/auth/oauth-ticket*.ts"
      - "lib/auth/google-*.ts"
      - "lib/auth/signup*.ts"
      - "app/api/auth/**"
      - "app/login/**"
      - "app/register/**"
      - "app/auth/google/**"
      - "components/auth/**"
      - "app/api/transactional-email/sweep/**"
      - "prisma/schema.prisma"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-identity-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: oauth identity (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: agl_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: agl_ci_synthetic_super_pw
      LAB_PASSWORD: agl_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/oauth-identity-preflight.sql
      EVIDENCE: ops/evidence/oauth-identity-production-evidence.sql
      AGL: prisma/migrations/20261030090000_oauth_identity_foundation/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only; checksum pinned; the migration names only its own objects, User and Business
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          # The preflight's by-name ledger list is exactly every migration on main before this one.
          want=$(ls -d prisma/migrations/2*/ | xargs -n1 basename | awk '$0 < "20261030090000_oauth_identity_foundation"' | sort)
          have=$(grep -oE "^    [(]'[0-9]{14}_[a-z0-9_]+'[)]" "$PREFLIGHT" | grep -oE "[0-9]{14}_[a-z0-9_]+" | sort)
          test "$want" = "$have" || { echo "the preflight's ledger list is not main's history before this migration"; diff <(echo "$want") <(echo "$have") || true; exit 1; }
          echo "the preflight names all $(echo "$want" | wc -l) migrations before this one"
          sum=$(sha256sum "$AGL" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$AGL sha256 $sum (pinned)"
          others=$(grep -oE '"[A-Z][A-Za-z]*"' "$AGL" | sort -u | grep -vxE '"UserIdentity"|"OAuthSignupTicket"|"User"|"Business"' || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261030090000_oauth_identity_foundation" ]] || continue
            hits=$(sed 's/--.*$//' "$d/migration.sql" | grep -nE 'UserIdentity|OAuthSignupTicket|auth_oauth_' || true)
            [ -n "$hits" ] || continue
            case "$n" in
              # The server-side cancel (oauth-ticket-cancel-lab.yml) and the existing-account link (milestone 3,
              # oauth-identity-link-lab.yml) build on this migration — each only within this bound: they never
              # redefine or re-grant its six functions, never change a grant, policy or RLS of its two tables, and
              # alter them only by the cancel's end-reason vocabulary. Anything else fails here.
              20261101090000_oauth_ticket_cancel|20261102090000_oauth_identity_link)
                bad=$(echo "$hits" | grep -E 'auth_oauth_(ticket_issue|ticket_read|ticket_consume|identity_attach|identity_resolve|ticket_purge)\(' | grep -E 'CREATE|GRANT|REVOKE|ALTER|DROP' || true)
                bad="$bad$(echo "$hits" | grep -E '(GRANT|REVOKE)[^;]*"(UserIdentity|OAuthSignupTicket)"|POLICY|ROW LEVEL SECURITY' || true)"
                bad="$bad$(echo "$hits" | grep -E 'ALTER TABLE "(UserIdentity|OAuthSignupTicket)"' | grep -vE 'ALTER TABLE "OAuthSignupTicket" (DROP|ADD) CONSTRAINT "OAuthSignupTicket_end"' || true)" ;;
              *) bad="$hits" ;;
            esac
            if [ -n "$bad" ]; then echo "$bad"; echo "$n names an oauth identity object beyond its bound"; exit 1; fi
            echo "$n names oauth identity objects only within its bound"
          done
          echo "the migration names only UserIdentity, OAuthSignupTicket, User and Business; later migrations name its objects only within their bounds"

      - name: P. Pure suites — ID token verification (T23–T31), ticket secret + static scope + sign-in policy
        run: |
          set -euo pipefail
          npx tsx lib/auth/google-id-token.test.ts
          npx tsx lib/auth/oauth-ticket.test.ts
          npx tsx lib/auth/google-login.test.ts

      - name: 1. Baseline (pending) — PREFLIGHT passes all but 4 (lab topology); the proof refuses
        run: |
          set -euo pipefail
          bash .agl/lab.sh agl_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d agl_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          # 4 (every migration on main is finished) is a PRODUCTION premise: the lab ledger holds part of the history.
          test "$fails" = "4 " || { echo "baseline: expected only 4 (lab topology) to fail, got: $fails"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "16" || { echo "expected 16 PASS"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline (the tables do not exist yet)"

      - name: 2. prisma migrate deploy applies it — proof 18/18; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .agl/lab.sh agl_post --with-agl | tee /tmp/post.log
          grep -q 'Applying migration `20261030090000_oauth_identity_foundation`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d agl_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "18" || { echo "expected 18 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "2 3 4 5 6 7 8 9 " || { echo "after the release: expected '2 3 4 5 6 7 8 9 ', got: $fails"; exit 1; }

      - name: 3. Battery — privileges, single use, ten concurrent signups, replay, rollback, attach guards (real roles)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/agl_post" \
          AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/agl_post" \
            npx tsx .agl/battery.ts

      - name: 3b. App battery — the real modules, the real login route, ten concurrent completions (T1–T4, T11, T14, T32, T33, T37)
        run: |
          set -euo pipefail
          bash .agl/lab.sh agl_app --with-agl >/dev/null
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_app"
          OWNER_URL="$U" DIRECT_URL="$U" \
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/agl_app" \
          AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/agl_app?connection_limit=12&pool_timeout=60" \
          AUTH_PLANE_ENABLED=true \
          AUTH_TOKEN_SECRET=agl_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef \
          RATE_LIMIT_BACKEND=memory \
            npx tsx .agl/app-battery.ts

      - name: 3c. Milestone 2 battery — the real Google routes and the one account transaction (consent with the real grants, replay, ten concurrent completions, fault, linked / existing / closed / admin / deletion)
        run: |
          set -euo pipefail
          bash .agl/lab.sh agl_m2 --with-cancel >/dev/null
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_m2"
          OWNER_URL="$U" DIRECT_URL="$U" \
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/agl_m2" \
          AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/agl_m2?connection_limit=12&pool_timeout=60" \
          AUTH_PLANE_ENABLED=true \
          AUTH_TOKEN_SECRET=agl_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef \
          RATE_LIMIT_BACKEND=memory \
            npx tsx .agl/app-battery-m2.ts

      - name: 3d. Server-side cancel battery — the real cancel route on real rows (a copy of the secret, both race orders, a refused database and the retry, flag OFF, purge, no secret in the logs)
        run: |
          set -euo pipefail
          bash .agl/lab.sh agl_cancel --with-cancel >/dev/null
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_cancel"
          OWNER_URL="$U" DIRECT_URL="$U" \
          DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/agl_cancel" \
          AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/agl_cancel?connection_limit=12&pool_timeout=60" \
          AUTH_PLANE_ENABLED=true \
          AUTH_TOKEN_SECRET=agl_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef \
          RATE_LIMIT_BACKEND=memory \
            npx tsx .agl/app-battery-cancel.ts

      - name: 4. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .agl/lab.sh agl_broken --broken-agl
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d agl_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -Atc "SELECT (SELECT count(*) FROM pg_class WHERE relname LIKE 'UserIdentity%' OR relname LIKE 'OAuthSignupTicket%') + (SELECT count(*) FROM pg_policy WHERE polname LIKE 'user_identity_%') + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'auth_oauth_%') + (SELECT count(*) FROM pg_attribute WHERE attrelid = '\"User\"'::regclass AND attname = 'password' AND NOT attnotnull)")
          led=$(lab -Atc "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261030090000_oauth_identity_foundation' AND finished_at IS NULL")
          echo "objects left=$left unfinished ledger rows=$led"
          test "$left" = "0" && test "$led" = "1" || { echo "NOT atomic"; exit 1; }

      - name: 5. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d agl_post -v ON_ERROR_STOP=1 "$@"; }
          # The battery's rows (and its password-less users) were all written AFTER the migration finished (its
          # backdated, expired tickets are purged by its last section), so the proof is whole — 18 is timeless:
          # nothing predates the finish. Every fault adds exactly its own check.
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test "$(failing)" = "" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "ticket read for app_auth" "13 " 'GRANT SELECT ON "OAuthSignupTicket" TO app_auth' 'REVOKE SELECT ON "OAuthSignupTicket" FROM app_auth'
          fault "subject read for app_auth" "13 " 'GRANT SELECT ("providerSubject") ON "UserIdentity" TO app_auth' 'REVOKE SELECT ("providerSubject") ON "UserIdentity" FROM app_auth'
          fault "identity INSERT for app_auth" "13 " 'GRANT INSERT ON "UserIdentity" TO app_auth' 'REVOKE INSERT ON "UserIdentity" FROM app_auth'
          fault "sequence for app_auth" "13 " 'GRANT USAGE ON SEQUENCE "UserIdentity_id_seq" TO app_auth' 'REVOKE USAGE ON SEQUENCE "UserIdentity_id_seq" FROM app_auth'
          fault "subject read for app_runtime" "11 " 'GRANT SELECT ("providerSubject") ON "UserIdentity" TO app_runtime' 'REVOKE SELECT ("providerSubject") ON "UserIdentity" FROM app_runtime'
          fault "ticket read for app_runtime" "12 " 'GRANT SELECT ON "OAuthSignupTicket" TO app_runtime' 'REVOKE SELECT ON "OAuthSignupTicket" FROM app_runtime'
          fault "NO FORCE on tickets" "5 " 'ALTER TABLE "OAuthSignupTicket" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "OAuthSignupTicket" FORCE ROW LEVEL SECURITY'
          fault "NO FORCE on identities" "4 " 'ALTER TABLE "UserIdentity" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "UserIdentity" FORCE ROW LEVEL SECURITY'
          fault "a policy on tickets" "7 " 'CREATE POLICY agl_fault_all ON "OAuthSignupTicket" USING (true)' 'DROP POLICY agl_fault_all ON "OAuthSignupTicket"'
          fault "a catch-all identity policy" "6 " 'CREATE POLICY agl_fault_all ON "UserIdentity" USING (true)' 'DROP POLICY agl_fault_all ON "UserIdentity"'
          fault "PUBLIC read of identities" "14 " 'GRANT SELECT ON "UserIdentity" TO PUBLIC' 'REVOKE SELECT ON "UserIdentity" FROM PUBLIC'
          fault "EXECUTE for app_runtime" "16 " 'GRANT EXECUTE ON FUNCTION public.auth_oauth_ticket_consume(text, text) TO app_runtime' 'REVOKE EXECUTE ON FUNCTION public.auth_oauth_ticket_consume(text, text) FROM app_runtime'
          fault "EXECUTE for PUBLIC" "16 " 'GRANT EXECUTE ON FUNCTION public.auth_oauth_identity_attach(uuid, integer) TO PUBLIC' 'REVOKE EXECUTE ON FUNCTION public.auth_oauth_identity_attach(uuid, integer) FROM PUBLIC'
          fault "password change for app_auth" "17 " 'GRANT UPDATE ("password") ON "User" TO app_auth' 'REVOKE UPDATE ("password") ON "User" FROM app_auth'
          fault "SECURITY INVOKER" "15 " 'ALTER FUNCTION public.auth_oauth_ticket_consume(text, text) SECURITY INVOKER' 'ALTER FUNCTION public.auth_oauth_ticket_consume(text, text) SECURITY DEFINER'
          fault "a ticket that predates the migration (backfill)" "18 " "INSERT INTO \"OAuthSignupTicket\" (\"id\",\"purpose\",\"provider\",\"providerSubject\",\"email\",\"emailVerified\",\"secretHash\",\"issuedAt\",\"expiresAt\") VALUES (gen_random_uuid(), 'SIGNUP', 'google', 'agl-fault-backfill', 'fault@lab.invalid', true, encode(sha256('agl-fault-backfill'::bytea), 'hex'), timestamp '2000-01-01', timestamp '2000-01-01 00:10')" "DELETE FROM \"OAuthSignupTicket\" WHERE \"providerSubject\" = 'agl-fault-backfill'"
          test "$(failing)" = "" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 6. Rollback — refused while rows exist; reverts whole on an empty database; re-apply makes the proof whole
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d "$1" -v ON_ERROR_STOP=1 "${@:2}"; }
          if lab agl_post -q -f .agl/rollback.sql 2>/tmp/rb.err; then echo "rollback ran despite rows"; exit 1; fi
          grep -q "oauth identity rollback refused" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          echo "rollback refused while rows exist; nothing changed"
          bash .agl/lab.sh agl_rb --with-agl >/dev/null
          lab agl_rb -q -f .agl/rollback.sql
          fails=$(lab agl_rb -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "4 " || { echo "after rollback: expected only 4 (lab topology), got: $fails"; exit 1; }
          TMP="$(mktemp -d)"; mkdir -p "$TMP/prisma/migrations"
          cp prisma/schema.prisma "$TMP/prisma/"; cp prisma/migrations/migration_lock.toml "$TMP/prisma/migrations/"
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            if [[ ! "$n" > "20261009090000_m6_acquisition_connections" || "$n" == "20261013090000_p3e_landing_persistence" || "$n" == "20261015090000_transactional_email_foundation" || "$n" == "20261017090000_auth_email_tokens" || "$n" == "20261030090000_oauth_identity_foundation" ]]; then cp -r "$d" "$TMP/prisma/migrations/"; fi
          done
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_rb"
          DATABASE_URL="$U" DIRECT_URL="$U" node_modules/.bin/prisma migrate deploy --schema "$TMP/prisma/schema.prisma" | grep -E "Applying migration"
          got=$(lab agl_rb -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$got" || { echo "re-apply: proof not whole: $got"; exit 1; }
          echo "rollback reverted the migration whole; re-apply made the proof whole"

  # "Continue with Google", milestone 2, in a real browser: this build under `next start`, the .agl lab database
  # with the real role topology, and the local Google stand-in (.agl/mock-google.ts — honoured only with
  # GOOGLE_LOGIN_TEST_ENDPOINTS=1 outside Vercel). Desktop, tablet and phone; cancel and return; the flag OFF.
  browser:
    name: oauth identity — browser (Chromium, three widths, Google stand-in, flag ON then OFF)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: agl_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: agl_ci_synthetic_super_pw
      LAB_PASSWORD: agl_ci_synthetic_role_pw
      SHOTS: ${{ github.workspace }}/agl-shots

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Lab database (both oauth migrations applied, consent + session grants as in Production)
        run: bash .agl/lab.sh agl_web --with-cancel

      # Built before the Chromium install (see i18n-multicurrency-ci.yml: the font resolution after
      # `playwright install --with-deps`). The flag is read at request time, so one build serves ON and OFF.
      - name: Build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
          DIRECT_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — flag ON (three widths; new person, cancel, return, complete, sign in again; existing account; cancel at Google)
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/agl_web"
          export AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/agl_web"
          export AUTH_PLANE_ENABLED=true AUTH_TOKEN_SECRET=agl_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef
          export PUBLIC_SIGNUP_ENABLED=true RATE_LIMIT_BACKEND=memory
          (MOCK_GOOGLE_PORT=3901 MOCK_REDIRECT_URI=http://localhost:3611/api/auth/google/callback nohup npx tsx .agl/mock-google.ts > "$RUNNER_TEMP/mock.log" 2>&1 &)
          (AUTH_GOOGLE_LOGIN_ENABLED=true GOOGLE_LOGIN_CLIENT_ID=lab-client.apps.googleusercontent.com GOOGLE_LOGIN_CLIENT_SECRET=lab-secret \
           GOOGLE_LOGIN_REDIRECT_BASE_URL=http://localhost:3611 GOOGLE_LOGIN_TEST_ENDPOINTS=1 \
           GOOGLE_LOGIN_TEST_AUTHORIZE_URL=http://localhost:3901/authorize GOOGLE_LOGIN_TEST_TOKEN_URL=http://localhost:3901/token \
           GOOGLE_LOGIN_TEST_JWKS_URL=http://localhost:3901/jwks \
           nohup npx next start -p 3611 > "$RUNNER_TEMP/on.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3611/login && curl -sf -o /dev/null http://localhost:3901/jwks && break; sleep 2; done
          BASE=http://localhost:3611 MOCK=http://localhost:3901 MODE=on \
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_web" npx tsx .agl/browser-m2.ts
          pkill -f "next start -p 3611" || true

      - name: E2E — flag OFF (no button; every Google route and page 404)
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/agl_web"
          export AUTH_DATABASE_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/agl_web"
          export AUTH_PLANE_ENABLED=true AUTH_TOKEN_SECRET=agl_ci_synthetic_auth_token_secret_0123456789abcdef0123456789abcdef
          export PUBLIC_SIGNUP_ENABLED=true RATE_LIMIT_BACKEND=memory
          (nohup npx next start -p 3612 > "$RUNNER_TEMP/off.log" 2>&1 &)
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3612/login && break; sleep 2; done
          BASE=http://localhost:3612 MODE=off OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/agl_web" npx tsx .agl/browser-m2.ts
          pkill -f "next start -p 3612" || true

      - name: Server logs on failure
        if: failure()
        run: tail -n 120 "$RUNNER_TEMP/on.log" "$RUNNER_TEMP/off.log" "$RUNNER_TEMP/mock.log" 2>/dev/null || true

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-login-m2-screenshots
          path: ${{ github.workspace }}/agl-shots
          if-no-files-found: ignore
          retention-days: 14
