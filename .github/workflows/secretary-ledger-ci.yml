name: secretary ledger (phase 2)

# Phase 2 — the secretary writes the payables ledger instead of BusinessObligation.
#
#   core       payables core (cadences, anchored due dates, amount-change and end
#              planning) and the Daily Business Cost engine (end dates). No DB.
#
#   migration  (retired after release — see the note above the db job)
#
#   db         the full Phase 2 proof on PG17: ledger-mode secretary,
#              handled ≠ paid, snooze, release, amount change / end with history
#              kept, anchored materialisation, the new cadences, the cutover
#              (dry run, execute, idempotent re-run, conflicts untouched, no
#              Payment synthesized) and tenant isolation — including the new
#              table under a NOSUPERUSER NOBYPASSRLS role.
#
# No Production database is ever touched: every job runs on its own container.

on:
  push:
    branches: [feat/secretary-ledger-phase2]
  pull_request:
    paths:
      - "prisma/schema.prisma"
      - "package.json"
      - "package-lock.json"
      - "prisma/migrations/**"
      - "lib/services/payables/**"
      - "lib/services/obligations/**"
      - "lib/services/business-cost/**"
      - "scripts/payables/**"
      - "ops/evidence/secretary-ledger-cutover-evidence.sql"
      - ".github/workflows/prod-readonly-evidence.yml"
      - "scripts/ci/prod-evidence-readonly-proof.ts"
      - "scripts/ci/runtime-rls-evidence-proof.ts"
      - "scripts/ops/runtime-rls-evidence.ts"
      - ".github/workflows/prod-readonly-evidence-runtime-rls.yml"
      - ".github/workflows/prod-readonly-evidence-business-cost.yml"
      - "app/api/obligations/**"
      - "app/api/payables/**"
      - ".github/workflows/secretary-ledger-ci.yml"

permissions:
  contents: read

jobs:
  core:
    name: secretary ledger core (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Payables core
        run: npx tsx lib/services/payables/payables-core.test.ts
      - name: Daily Business Cost core
        run: npx tsx lib/services/business-cost/business-cost-core.test.ts
      - name: Secretary core (unchanged contract, legacy store)
        run: npx tsx lib/services/obligations/obligation-service.verify.test.ts

  # ── The migration job was RETIRED here, deliberately ─────────────────────
  #
  # It proved 20260927090000_payables_installment_workflow applies on top of
  # main's schema with zero drift, and it did its job: it ran green before the
  # owner-approved release-migrate applied it to Production (run 36267388509,
  # post-state "Database schema is up to date!").
  #
  # Its premise has now expired. #538 merged the model into main's schema, so
  # "apply the migration on top of main" fails with `relation already exists`
  # and can never pass again. A check that can never pass trains everyone to
  # ignore red — the same reasoning that retired the payables drift check.

  db:
    name: secretary ledger proof (PG17, real RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sl_owner
          POSTGRES_PASSWORD: sl_ci_synthetic_pw
          POSTGRES_DB: dubiz_sl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sl_owner -d dubiz_sl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://sl_owner:sl_ci_synthetic_pw@localhost:5432/dubiz_sl
      DIRECT_URL: postgresql://sl_owner:sl_ci_synthetic_pw@localhost:5432/dubiz_sl
      TEST_DATABASE_URL: postgresql://sl_owner:sl_ci_synthetic_pw@localhost:5432/dubiz_sl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the schema
        run: npx prisma db push --skip-generate
      - name: Generate the client
        run: npx prisma generate
      - name: Phase 2 proof
        run: npx tsx lib/services/payables/secretary-ledger.db.test.ts
      - name: Daily Business Cost proof still holds
        run: npx tsx lib/services/business-cost/business-cost.db.test.ts
      - name: Cutover evidence SQL runs cleanly (only the Production app_runtime role is absent here)
        run: |
          psql "$DATABASE_URL" -X -f ops/evidence/secretary-ledger-cutover-evidence.sql > evidence.out 2>&1 || true
          cat evidence.out
          if grep -E "ERROR" evidence.out | grep -vE "role \"app_runtime\" does not exist" | grep -q .; then
            echo "::error::the evidence SQL has an error beyond the missing Production role"; exit 1
          fi
      - name: Business-cost evidence script is read-only by the database
        run: |
          npx tsx scripts/payables/business-cost-evidence.ts --dates 2026-09-28,2026-10-05 | tee bc-evidence.out
          grep -q "session read-only: on" bc-evidence.out
          grep -q "\"readOnly\": \"on\"" bc-evidence.out

  evidence-readonly:
    name: Production evidence is read-only by Postgres (PG17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ev_owner
          POSTGRES_PASSWORD: ev_ci_synthetic_pw
          POSTGRES_DB: dubiz_evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ev_owner -d dubiz_evidence"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ev_owner:ev_ci_synthetic_pw@localhost:5432/dubiz_evidence
      DIRECT_URL: postgresql://ev_owner:ev_ci_synthetic_pw@localhost:5432/dubiz_evidence
      TEST_DATABASE_URL: postgresql://ev_owner:ev_ci_synthetic_pw@localhost:5432/dubiz_evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the schema
        run: npx prisma db push --skip-generate
      - name: Generate the client
        run: npx prisma generate
      - name: Guards + full evidence SQL under read-only + RLS probe + refused writes
        run: npx tsx scripts/ci/prod-evidence-readonly-proof.ts

  runtime-rls-evidence:
    name: Tenant isolation AS the runtime login — two-connection evidence (PG17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rls_owner
          POSTGRES_PASSWORD: rls_ci_synthetic_pw
          POSTGRES_DB: dubiz_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rls_owner -d dubiz_rls"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://rls_owner:rls_ci_synthetic_pw@localhost:5432/dubiz_rls
      DIRECT_URL: postgresql://rls_owner:rls_ci_synthetic_pw@localhost:5432/dubiz_rls
      TEST_DATABASE_URL: postgresql://rls_owner:rls_ci_synthetic_pw@localhost:5432/dubiz_rls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the schema
        run: npx prisma db push --skip-generate
      - name: Generate the client
        run: npx prisma generate
      - name: Runtime identity, isolation, fail-closed cases, refused writes
        run: npx tsx scripts/ci/runtime-rls-evidence-proof.ts
