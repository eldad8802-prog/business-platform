# Appointments / migration 20261029090000_appointments_foundation — proof on PostgreSQL BEFORE it reaches Production
# (ephemeral PG17). Migration-first: this PR ships the migration and its proof only.
#
# .appt/lab.sh builds Production's topology on top of the accountant lab: non-superuser CREATEROLE/BYPASSRLS owner
# (owner of the database, as Production's migration role is), NOLOGIN app_runtime + LOGIN app_runtime_prod, the
# owner's DEFAULT PRIVILEGES, Business under B4's FORCE RLS, "Appointment" under cutover-2B's FORCE RLS with its three
# p7pilot policies, and the ledger completed with every migration that sorts before this one.
#
#   0. Evidence files are SELECT-only and selectable in Production; the proof pins migration.sql's sha256; the
#      migration names only its own objects and the tables it builds on, and no other migration names its objects.
#   1. Baseline (pending): PREFLIGHT passes whole (btree_gist creatable, Appointment as Production has it, no
#      existing row affected); the proof refuses; a finished migration sorting after this one makes check 3 FAIL.
#      Existing appointments are seeded BEFORE the release (legacy shapes: no start, a start and duration, two at the
#      same start, a long note at the bound) and must survive it unchanged and still move through the lifecycle.
#   2. `prisma migrate deploy` (the release-migrate mechanism) applies it: proof 21/21; the preflight then fails
#      exactly its "not there yet" checks.
#   3. Role battery (.appt/battery.ts) as the real roles: isolation per table, cross-business references, no overlap,
#      twelve concurrent claims of one slot (exactly one wins), decision 6, the append-only journal, account erasure.
#   4. Faults: each injected defect is caught by the proof check meant for it.
#   5. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#   6. Rollback: refused while rows exist; on an empty database it reverts whole (preflight whole again).
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: appointments foundation — migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261029090000_appointments_foundation/**"
      - "ops/evidence/appointments-foundation-*.sql"
      - ".appt/**"
      - ".acct/**"
      - ".github/workflows/appointments-foundation-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: appointments foundation (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: appt_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: appt_ci_synthetic_super_pw
      LAB_PASSWORD: appt_ci_synthetic_role_pw
      PREFLIGHT: ops/evidence/appointments-foundation-preflight.sql
      EVIDENCE: ops/evidence/appointments-foundation-production-evidence.sql
      APPT: prisma/migrations/20261029090000_appointments_foundation/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable; checksum pinned; the migration names only its own objects
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          sum=$(sha256sum "$APPT" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum"; exit 1; }
          echo "$APPT sha256 $sum (pinned)"
          prefix='^"(Appointment|StaffMember|StaffServiceAssignment|AvailabilityRule|AvailabilityException|ServiceBookingPolicy|BookingSettings|BookingRequest|AppointmentManageToken|AppointmentEvent)_[A-Za-z_]+"$'
          own='"StaffMember"|"StaffServiceAssignment"|"AvailabilityRule"|"AvailabilityException"|"ServiceBookingPolicy"|"BookingSettings"|"BookingRequest"|"AppointmentManageToken"|"AppointmentEvent"|"AppointmentKind"|"AppointmentLocationKind"|"AppointmentCancelReason"|"AppointmentEventActor"|"AppointmentEventType"|"AvailabilityExceptionKind"|"BookingApprovalMode"|"BookingStaffChoice"|"BookingRequestStatus"'
          base='"Appointment"|"CreatedByActor"|"Business"|"User"|"BusinessService"|"PlatformFeatureDefinition"|"PlatformFeaturePolicy"'
          others=$(grep -oE '"[A-Z][A-Za-z_]*"' "$APPT" | sort -u | grep -vE "$prefix" | grep -vxE "$own|$base" || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          for d in prisma/migrations/*/; do
            n=$(basename "$d")
            [[ "$n" != "20261029090000_appointments_foundation" ]] || continue
            if grep -nE 'StaffMember|StaffServiceAssignment|AvailabilityRule|AvailabilityException|ServiceBookingPolicy|BookingSettings|BookingRequest|AppointmentManageToken|AppointmentEvent|appointment_(erase|event|user)|public_booking|btree_gist|Appointment_no_overlap' "$d/migration.sql"; then echo "$n names an appointments object"; exit 1; fi
          done
          echo "the migration names only its own objects and the tables it builds on; no other migration names its objects"

      - name: 1. Baseline (pending) — PREFLIGHT passes whole over existing appointments; the proof refuses
        run: |
          set -euo pipefail
          bash .appt/lab.sh appt_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d appt_pre -v ON_ERROR_STOP=1 "$@"; }
          # Existing appointments, as the two existing creation paths write them, before the release.
          lab -q <<'SQL'
          INSERT INTO "Business" ("id", "name", "updatedAt") VALUES (900001, 'legacy', now());
          INSERT INTO "User" ("id", "email", "password", "businessId", "updatedAt") VALUES (900001, 'legacy@appt.lab', 'x', 900001, now());
          INSERT INTO "Appointment" ("businessId", "status", "createdByActor", "sourceChannel", "createdByUserId", "startsAt", "durationMinutes", "title", "notes", "updatedAt") VALUES
            (900001, 'PROPOSED', 'OWNER', 'INBOX_WEB', 900001, NULL, NULL, NULL, 'אפשר ביום שלישי', now()),
            (900001, 'CONFIRMED', 'OWNER', 'INBOX_WEB', 900001, '2026-11-03 08:00', 60, 'תספורת', NULL, now()),
            (900001, 'CONFIRMED', 'OWNER', 'INBOX_WEB', 900001, '2026-11-03 08:00', 60, 'תספורת', NULL, now()),
            (900001, 'CANCELED', 'OWNER', 'INBOX_WEB', 900001, '2026-11-04 08:00', 30, NULL, repeat('x', 4000), now());
          SQL
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          fails=$({ grep -E '^ +[0-9]+ \| FAIL' /tmp/pre.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "baseline: expected no preflight failure, got: $fails"; exit 1; }
          grep -qE '^ +16 \| PASS \| +4$' /tmp/pre.out || { echo "check 16 should observe the 4 existing appointments"; exit 1; }
          if lab -f "$EVIDENCE" >/dev/null 2>&1; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline (the tables do not exist yet)"
          # check 17 is live: a note over the bound is reported
          lab -q -c "UPDATE \"Appointment\" SET notes = repeat('x', 4001) WHERE \"businessId\" = 900001 AND status = 'CANCELED'"
          c17=$(lab -f "$PREFLIGHT" | grep -E '^ +17 \|' | tr -d ' ')
          lab -q -c "UPDATE \"Appointment\" SET notes = repeat('x', 4000) WHERE \"businessId\" = 900001 AND status = 'CANCELED'"
          test "$c17" = "17|FAIL|1" || { echo "check 17 did not report an over-long note: $c17"; exit 1; }
          # check 3 is live: a finished migration sorting after this one makes it FAIL
          lab -q -c "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count) VALUES ('lab-later', 'x', now(), '20261099000000_lab_later', 1)"
          c3=$(lab -f "$PREFLIGHT" | grep -E '^ +3 \|' | tr -d ' ')
          lab -q -c "DELETE FROM \"_prisma_migrations\" WHERE id = 'lab-later'"
          test "$c3" = "3|FAIL|1" || { echo "check 3 did not refuse a later finished migration: $c3"; exit 1; }
          echo "checks 3 and 17 are live"
          # The release over existing rows: apply it on this very database and prove they are untouched and still move.
          before=$(lab -At -c "SELECT md5(string_agg(concat_ws('|', id, status, \"startsAt\", \"durationMinutes\", title, notes, \"createdByUserId\"), ',' ORDER BY id)) FROM \"Appointment\"")
          TMP="$(mktemp -d)"; mkdir -p "$TMP/prisma/migrations"
          cp prisma/schema.prisma "$TMP/prisma/"; cp prisma/migrations/migration_lock.toml "$TMP/prisma/migrations/"
          for d in prisma/migrations/*/; do [[ "$(basename "$d")" > "20261029090000_appointments_foundation" ]] && continue; cp -r "$d" "$TMP/prisma/migrations/"; done
          U="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/appt_pre"
          DATABASE_URL="$U" DIRECT_URL="$U" node_modules/.bin/prisma migrate deploy --schema "$TMP/prisma/schema.prisma" | grep -E "Applying migration"
          after=$(lab -At -c "SELECT md5(string_agg(concat_ws('|', id, status, \"startsAt\", \"durationMinutes\", title, notes, \"createdByUserId\"), ',' ORDER BY id)) FROM \"Appointment\"")
          test "$before" = "$after" || { echo "existing appointments changed"; exit 1; }
          shape=$(lab -At -c "SELECT count(*) FROM \"Appointment\" WHERE kind = 'CUSTOMER' AND \"endsAt\" IS NULL AND \"staffMemberId\" IS NULL AND version = 1 AND \"bufferBeforeMinutes\" = 0")
          test "$shape" = "4" || { echo "existing appointments did not get the neutral defaults: $shape"; exit 1; }
          moved=$(lab -At -c "UPDATE \"Appointment\" SET status = 'COMPLETED' WHERE \"businessId\" = 900001 AND status = 'CONFIRMED' RETURNING id" | wc -l)
          test "$moved" = "2" || { echo "the two overlapping existing appointments could not move: $moved"; exit 1; }
          appended=$(lab -At -c "UPDATE \"Appointment\" SET status = 'CANCELED', notes = notes || ' בוטל' WHERE \"businessId\" = 900001 AND status = 'PROPOSED' RETURNING id" | wc -l)
          test "$appended" = "1" || { echo "an existing appointment could not be cancelled with a note"; exit 1; }
          echo "existing appointments: unchanged by the release, neutral defaults, still move through the lifecycle (the two overlapping ones too)"

      - name: 2. prisma migrate deploy applies it — proof 21/21; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          bash .appt/lab.sh appt_post --with-appt | tee /tmp/post.log
          grep -q 'Applying migration `20261029090000_appointments_foundation`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d appt_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "21" || { echo "expected 21 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "4 5 6 7 8 9 13 " || { echo "after the release: expected '4 5 6 7 8 9 13 ', got: $fails"; exit 1; }

      - name: 3. Role battery — isolation, references, no overlap, concurrency, decision 6, journal, erasure (real roles)
        run: |
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/appt_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/appt_post" \
            npx tsx .appt/battery.ts

      - name: 4. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          bash .appt/lab.sh appt_fault --with-appt >/dev/null
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d appt_fault -v ON_ERROR_STOP=1 "$@"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test -z "$(failing)" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            lab -q -c "$3"; got=$(failing); lab -q -c "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          fault "NO FORCE row-level security" "4 " 'ALTER TABLE "StaffMember" NO FORCE ROW LEVEL SECURITY' 'ALTER TABLE "StaffMember" FORCE ROW LEVEL SECURITY'
          fault "a permissive FOR ALL policy" "5 6 7 "'CREATE POLICY appt_fault_all ON "BookingRequest" USING (true)' 'DROP POLICY appt_fault_all ON "BookingRequest"'
          fault "a policy that reads every business" "6 " \
            'ALTER POLICY staff_member_tenant_select ON "StaffMember" USING (true)' \
            "ALTER POLICY staff_member_tenant_select ON \"StaffMember\" USING (\"businessId\" = NULLIF(current_setting('app.current_business_id', true), '')::int)"
          fault "a remove-rows policy on Appointment" "7 " 'CREATE POLICY appt_fault_del ON "Appointment" FOR DELETE USING (true)' 'DROP POLICY appt_fault_del ON "Appointment"'
          fault "removal privilege for app_runtime" "8 " 'GRANT DELETE ON "StaffMember" TO app_runtime' 'REVOKE DELETE ON "StaffMember" FROM app_runtime'
          fault "journal change privilege for app_runtime" "8 " 'GRANT UPDATE ON "AppointmentEvent" TO app_runtime' 'REVOKE UPDATE ON "AppointmentEvent" FROM app_runtime'
          fault "PUBLIC read" "8 " 'GRANT SELECT ON "BookingRequest" TO PUBLIC' 'REVOKE SELECT ON "BookingRequest" FROM PUBLIC'
          fault "column read for another role" "9 " 'GRANT SELECT ("contactPhone") ON "BookingRequest" TO app_auth' 'REVOKE SELECT ("contactPhone") ON "BookingRequest" FROM app_auth'
          fault "a cross-business staff link allowed" "10 " 'ALTER TABLE "Appointment" DROP CONSTRAINT "Appointment_staffMemberId_tenant_fkey"' \
            'ALTER TABLE "Appointment" ADD CONSTRAINT "Appointment_staffMemberId_tenant_fkey" FOREIGN KEY ("businessId", "staffMemberId") REFERENCES "StaffMember"("businessId", "id") ON DELETE NO ACTION ON UPDATE NO ACTION'
          def=$(lab -At -c "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conname = 'Appointment_no_overlap'")
          fault "overlap allowed (constraint gone)" "11 " 'ALTER TABLE "Appointment" DROP CONSTRAINT "Appointment_no_overlap"' "ALTER TABLE \"Appointment\" ADD CONSTRAINT \"Appointment_no_overlap\" $def"
          fault "an OWNER action without a user allowed" "12 " 'ALTER TABLE "Appointment" DROP CONSTRAINT "Appointment_owner_has_user"' \
            "ALTER TABLE \"Appointment\" ADD CONSTRAINT \"Appointment_owner_has_user\" CHECK (\"createdByActor\" <> 'OWNER' OR \"createdByUserId\" IS NOT NULL)"
          fault "append-only trigger disabled" "13 " 'ALTER TABLE "AppointmentEvent" DISABLE TRIGGER "AppointmentEvent_append_only"' 'ALTER TABLE "AppointmentEvent" ENABLE TRIGGER "AppointmentEvent_append_only"'
          fault "SECURITY INVOKER erasure" "15 " 'ALTER FUNCTION public.appointment_erase_business() SECURITY INVOKER' 'ALTER FUNCTION public.appointment_erase_business() SECURITY DEFINER'
          fault "EXECUTE on a trigger function for app_runtime" "16 " 'GRANT EXECUTE ON FUNCTION public.appointment_user_same_business() TO app_runtime' 'REVOKE EXECUTE ON FUNCTION public.appointment_user_same_business() FROM app_runtime'
          fault "the flag switched on" "17 " \
            "UPDATE \"PlatformFeaturePolicy\" SET \"globalEnabled\" = true WHERE \"featureKey\" = 'appointments'" "UPDATE \"PlatformFeaturePolicy\" SET \"globalEnabled\" = false WHERE \"featureKey\" = 'appointments'"
          test -z "$(failing)" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 5. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .appt/lab.sh appt_broken --broken-appt
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d appt_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relname IN ('StaffMember','StaffServiceAssignment','AvailabilityRule','AvailabilityException','ServiceBookingPolicy','BookingSettings','BookingRequest','AppointmentManageToken','AppointmentEvent'))
            + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'appointment\_%')
            + (SELECT count(*) FROM pg_constraint WHERE conname = 'Appointment_no_overlap')
            + (SELECT count(*) FROM pg_attribute WHERE attrelid = '\"Appointment\"'::regclass AND attname IN ('kind','endsAt','staffMemberId') AND NOT attisdropped)
            + (SELECT count(*) FROM pg_extension WHERE extname = 'btree_gist')
            + (SELECT count(*) FROM \"PlatformFeatureDefinition\" WHERE key IN ('appointments', 'public_booking'))")
          nn=$(lab -c "SELECT attnotnull FROM pg_attribute WHERE attrelid = '\"Appointment\"'::regclass AND attname = 'createdByUserId'")
          echo "objects left=$left createdByUserId NOT NULL=$nn"
          test "$left" = "0" && test "$nn" = "t" || { echo "NOT atomic"; exit 1; }

      - name: 6. Rollback — refused with rows; whole on an empty database
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -v ON_ERROR_STOP=1 "$@"; }
          if lab -d appt_post -f .appt/rollback.sql 2>/tmp/rb.err >/dev/null; then echo "rollback ran over rows"; exit 1; fi
          grep -q "appointments rollback refused" /tmp/rb.err || { cat /tmp/rb.err; exit 1; }
          bash .appt/lab.sh appt_rb --with-appt
          lab -d appt_rb -f .appt/rollback.sql
          left=$(lab -d appt_rb -At -c "SELECT (SELECT count(*) FROM pg_class WHERE relname IN ('StaffMember','AppointmentEvent','BookingRequest')) + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'appointment\_%') + (SELECT count(*) FROM pg_extension WHERE extname = 'btree_gist')")
          test "$left" = "0" || { echo "rollback left $left objects"; exit 1; }
          fails=$(lab -d appt_rb -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test -z "$fails" || { echo "after rollback the preflight should be whole, got: $fails"; exit 1; }
          echo "rollback reverted the migration whole (the CUSTOMER enum value stays by design, unused)"
