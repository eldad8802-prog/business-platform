name: Prod Read-Only Evidence (CardCom E2E)
run-name: "Prod Read-Only Evidence — ${{ inputs.sql_file || 'ops/evidence/cardcom-e2e-evidence.sql' }}"

# Manual, gated, READ-ONLY verification of the completed CardCom Sandbox E2E.
# Runs ONLY the SELECT queries in the SELECTED ops/evidence/*.sql file against
# the verified Production database. No writes, no migrations, no schema changes.
#
# Safety controls:
#   - workflow_dispatch only (no push / schedule triggers)
#   - environment: production-db  -> human approval before secrets are exposed
#   - host allowlist: DIRECT_URL must target endpoint ep-flat-brook-am4bhq1y
#   - SQL static guard: rejects any non-SELECT (write) keyword before connecting
#   - READ ONLY transaction + session read_only + statement_timeout
#   - secrets are never printed (GitHub masks them; host is matched, not echoed)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Which read-only evidence query set to run'
        required: false
        default: 'ops/evidence/cardcom-e2e-evidence.sql'
        type: choice
        options:
          - 'ops/evidence/cardcom-e2e-evidence.sql'
          - 'ops/evidence/migration-state-evidence.sql'
          - 'ops/evidence/migration-ledger-audit.sql'
          - 'ops/evidence/auth-token-version-evidence.sql'
          - 'ops/evidence/conversation-coherence-evidence.sql'
          - 'ops/evidence/i8a-historical-fiscal-evidence.sql'
          - 'ops/evidence/i8a-runtime-role-evidence.sql'
          - 'ops/evidence/c2-draft-allocation-evidence.sql'
          - 'ops/evidence/c25-allocation-integrity-evidence.sql'
          - 'ops/evidence/c3-billing-runtime-privilege-evidence.sql'
          - 'ops/evidence/payables-runtime-grants-evidence.sql'
          - 'ops/evidence/c3-migration-closure-evidence.sql'
          - 'ops/evidence/collection-production-closure-evidence.sql'
          - 'ops/evidence/m1-reconciliation-qa-evidence.sql'
          - 'ops/evidence/sec-f-521-production-evidence.sql'
          - 'ops/evidence/sec-c-530-preflight.sql'
          - 'ops/evidence/secretary-ledger-cutover-evidence.sql'
          - 'ops/evidence/sec-p1-business-offering-production-evidence.sql'
          - 'ops/evidence/sec-c-530-production-evidence.sql'
          - 'ops/evidence/m4-identity-routing-preflight.sql'
          - 'ops/evidence/m4-identity-routing-production-evidence.sql'
          - 'ops/evidence/m5-crm-lead-lifecycle-preflight.sql'
          - 'ops/evidence/m5-crm-lead-lifecycle-production-evidence.sql'
          - 'ops/evidence/m6-acquisition-connections-preflight.sql'
          - 'ops/evidence/m6-acquisition-connections-production-evidence.sql'
          - 'ops/evidence/m6-operational-evidence.sql'
          - 'ops/evidence/m6-website-live-proof-evidence.sql'
          - 'ops/evidence/c594-control-plane-privileges-preflight.sql'
          - 'ops/evidence/c594-control-plane-privileges-production-evidence.sql'
          - 'ops/evidence/p2-business-identity-preflight.sql'
          - 'ops/evidence/business-runtime-columns-preflight.sql'
          - 'ops/evidence/p2-business-identity-catalog-preflight.sql'
          - 'ops/evidence/sec-p2-business-identity-production-evidence.sql'
          - 'ops/evidence/p2-business-identity-initial-state.sql'
          - 'ops/evidence/cost-learning-wave1-evidence.sql'
          - 'ops/evidence/cost-learning-wave1-verdict.sql'
          - 'ops/evidence/business-tenant-write-rls-preflight.sql'
          - 'ops/evidence/business-tenant-write-rls-production-evidence.sql'
          - 'ops/evidence/business-b4-role-classification.sql'
          - 'ops/evidence/cost-learning-tenant-breakdown.sql'
          - 'ops/evidence/cost-learning-wave2-preflight.sql'
          - 'ops/evidence/cost-learning-lineages-evidence.sql'
          - 'ops/evidence/p3a-trust-conversion-preflight.sql'
          - 'ops/evidence/p3a-trust-conversion-production-evidence.sql'
          - 'ops/evidence/m0-signup-production-evidence.sql'
          - 'ops/evidence/m1-onboarding-preflight.sql'
          - 'ops/evidence/learning-enrollment-inventory.sql'
          - 'ops/evidence/m1-onboarding-production-evidence.sql'
          - 'ops/evidence/m7a-foundation-preflight.sql'
          - 'ops/evidence/m7a-foundation-production-evidence.sql'
          - 'ops/evidence/closed-loop-recommendation-evidence-preflight.sql'
          - 'ops/evidence/closed-loop-recommendation-evidence-production-evidence.sql'

permissions:
  contents: read

concurrency:
  group: prod-readonly-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Read-only SELECT evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: SQL static guard (SELECT-only)
        env:
          SQL_FILE_INPUT: ${{ inputs.sql_file }}
        run: |
          set -euo pipefail
          SQL_FILE="${SQL_FILE_INPUT:-ops/evidence/cardcom-e2e-evidence.sql}"
          echo "Selected evidence file: $SQL_FILE"
          test -f "$SQL_FILE" || { echo "::error::SQL file missing: $SQL_FILE"; exit 1; }
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          MATCHES="$(grep -inE "$FORBIDDEN" "$SQL_FILE" || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Forbidden write keyword found in SQL — aborting before any DB connection."
            echo "$MATCHES"
            exit 1
          fi
          # The database enforces read-only below (PGOPTIONS). A session may switch
          # that setting itself, so the file must never touch the boundary.
          BOUNDARY='(default_)?transaction_read_only|read[[:space:]]+write|session[[:space:]]+characteristics|reset[[:space:]]+all|session[[:space:]]+authorization'
          # The only allowed form is switching read-only ON (several files do so).
          ALLOWED_ON='[[:space:]]*set[[:space:]]+(session[[:space:]]+)?default_transaction_read_only[[:space:]]*(=|to)[[:space:]]*(on|true)[[:space:]]*;?[[:space:]]*(--.*)?$'
          TOUCHES="$(grep -inE "$BOUNDARY" "$SQL_FILE" | grep -viE "^[0-9]+:$ALLOWED_ON" || true)"
          if [ -n "$TOUCHES" ]; then
            echo "::error::The SQL file tries to change the read-only boundary — aborting before any DB connection."
            echo "$TOUCHES"
            exit 1
          fi
          echo "SQL guard passed: file is SELECT-only."

      - name: Host allowlist assertion (verified Production only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          ALLOW="ep-flat-brook-am4bhq1y"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set in the production-db environment."; exit 1
          fi
          case "$DIRECT_URL" in
            *"$ALLOW"*) echo "Host allowlist OK: DIRECT_URL targets endpoint $ALLOW." ;;
            *) echo "::error::DIRECT_URL does not target the verified Production endpoint ($ALLOW) — aborting."; exit 1 ;;
          esac

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run read-only evidence queries
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
          # Postgres itself refuses writes: every transaction in this session
          # starts READ ONLY. Independent of the static guard above.
          PGOPTIONS: "-c default_transaction_read_only=on"
          SQL_FILE_INPUT: ${{ inputs.sql_file }}
        run: |
          set -euo pipefail
          SQL_FILE="${SQL_FILE_INPUT:-ops/evidence/cardcom-e2e-evidence.sql}"
          RO="$(psql "$DIRECT_URL" --no-psqlrc -At -c 'SHOW default_transaction_read_only')"
          if [ "$RO" != "on" ]; then
            echo "::error::Postgres did not accept the read-only session (default_transaction_read_only=$RO) — aborting."; exit 1
          fi
          echo "Postgres read-only session confirmed: default_transaction_read_only=$RO"
          psql "$DIRECT_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file="$SQL_FILE" \
            | node scripts/ci/evidence-redact.mjs
