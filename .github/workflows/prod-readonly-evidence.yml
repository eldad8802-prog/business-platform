name: Prod Read-Only Evidence (CardCom E2E)

# Manual, gated, READ-ONLY verification of the completed CardCom Sandbox E2E.
# Runs ONLY the SELECT queries in the SELECTED ops/evidence/*.sql file against
# the verified Production database. No writes, no migrations, no schema changes.
#
# Safety controls:
#   - workflow_dispatch only (no push / schedule triggers)
#   - environment: production-db  -> human approval before secrets are exposed
#   - host allowlist: DIRECT_URL must target endpoint ep-flat-brook-am4bhq1y
#   - SQL static guard: rejects any non-SELECT (write) keyword before connecting
#   - READ ONLY transaction + session read_only + statement_timeout
#   - secrets are never printed (GitHub masks them; host is matched, not echoed)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Which read-only evidence query set to run'
        required: false
        default: 'ops/evidence/cardcom-e2e-evidence.sql'
        type: choice
        options:
          - 'ops/evidence/cardcom-e2e-evidence.sql'
          - 'ops/evidence/migration-state-evidence.sql'
          - 'ops/evidence/auth-token-version-evidence.sql'

permissions:
  contents: read

concurrency:
  group: prod-readonly-evidence
  cancel-in-progress: false

jobs:
  evidence:
    name: Read-only SELECT evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SQL static guard (SELECT-only)
        env:
          SQL_FILE_INPUT: ${{ inputs.sql_file }}
        run: |
          set -euo pipefail
          SQL_FILE="${SQL_FILE_INPUT:-ops/evidence/cardcom-e2e-evidence.sql}"
          echo "Selected evidence file: $SQL_FILE"
          test -f "$SQL_FILE" || { echo "::error::SQL file missing: $SQL_FILE"; exit 1; }
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          MATCHES="$(grep -inE "$FORBIDDEN" "$SQL_FILE" || true)"
          if [ -n "$MATCHES" ]; then
            echo "::error::Forbidden write keyword found in SQL — aborting before any DB connection."
            echo "$MATCHES"
            exit 1
          fi
          echo "SQL guard passed: file is SELECT-only."

      - name: Host allowlist assertion (verified Production only)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          ALLOW="ep-flat-brook-am4bhq1y"
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set in the production-db environment."; exit 1
          fi
          case "$DIRECT_URL" in
            *"$ALLOW"*) echo "Host allowlist OK: DIRECT_URL targets endpoint $ALLOW." ;;
            *) echo "::error::DIRECT_URL does not target the verified Production endpoint ($ALLOW) — aborting."; exit 1 ;;
          esac

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run read-only evidence queries
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PGSSLMODE: require
          SQL_FILE_INPUT: ${{ inputs.sql_file }}
        run: |
          set -euo pipefail
          SQL_FILE="${SQL_FILE_INPUT:-ops/evidence/cardcom-e2e-evidence.sql}"
          psql "$DIRECT_URL" \
            --no-psqlrc \
            --set=ON_ERROR_STOP=1 \
            --file="$SQL_FILE"
