# D2 / P7 Wave 1 — adversarial tenant-isolation battery on ephemeral PG17.
#
# Provisions a NOBYPASSRLS lab role, applies the CANONICAL Wave-1 policy
# migration + grants artifact, runs the adversarial SQL matrix + REAL Wave-1
# route handlers with real Bearer auth, proves the rollback artifact, and
# re-applies (idempotency). Synthetic CI-only creds; ZERO secrets; ZERO Neon.

name: d2/p7 — wave 1 battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-p7-wave1]
  pull_request:
    branches: [main]
    paths:
      - "lib/tenant/**"
      - "prisma/migrations/20260824210000_d2_p7_wave1_tenant_rls/**"
      - "prisma/migrations/20260825120000_d2_p7_wave1_businessprofile_rls/**"
      - "scripts/security/d2-p7-wave1-*.sql"
      - ".p7w1/**"
      - "app/api/obligations/**"
      - "app/api/crm/**"
      - "app/api/pricing/**"
      - "app/api/deals/**"
      - "lib/services/obligations/**"
      - "lib/services/crm/**"
      - "lib/collaboration/matchingEngine.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1-battery:
    name: Wave-1 battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p7w1_owner
          POSTGRES_PASSWORD: p7w1_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_p7w1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p7w1_owner -d dubiz_p7w1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: node --check .p7w1/battery.mjs

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: postgresql://p7w1_owner:p7w1_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w1
          DIRECT_URL: postgresql://p7w1_owner:p7w1_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w1
        run: npx prisma db push --skip-generate

      - name: Run Wave-1 battery (adversarial + real handlers + rollback proof)
        env:
          BATTERY_TARGET: pg
          DATABASE_URL: postgresql://p7w1_owner:p7w1_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w1
          DIRECT_URL: postgresql://p7w1_owner:p7w1_ci_synthetic_owner_pw@localhost:5432/dubiz_p7w1
          RUNTIME_URL: postgresql://wave1_runtime:p7w1_ci_synthetic_pw@localhost:5432/dubiz_p7w1
          RUNTIME_ROLE: wave1_runtime
          AUTH_TOKEN_SECRET: p7w1_ci_auth_secret_synthetic_not_a_real_secret
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_ROOT: /tmp/p7w1-storage
        run: npx tsx .p7w1/battery.mjs
