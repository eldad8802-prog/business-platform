name: payables phase 2 migration

# PR-1 of the migration-first rule for Phase 2: the document-evidence migration
# and nothing else. No prisma/schema.prisma, no application code.
#
# This is the half that reaches PRODUCTION via the gated release-migrate, so the
# SQL is exercised here before the owner is offered the approval step. The whole
# tree cannot be replayed from zero in this repo (20260210120000 fails on an
# empty database because BusinessProfile's table is created by no migration), so
# the baseline is built from the datamodel as it stands on main — production's
# shape today — and this migration is applied on top, exactly as release-migrate
# will apply it.
#
# What it proves: the SQL applies; the double-count index really is PARTIAL on
# active evidence rather than merely unique; RLS is enabled AND forced on the
# new table with its tenant policy; and the rejection pair key genuinely rejects
# a duplicate while still allowing a different pairing.

on:
  push:
    branches: [feat/payables-phase-2-migration]
  pull_request:
    paths:
      - "prisma/migrations/20260918090000_payables_phase_2_document_evidence/**"
      - ".github/workflows/payables-phase-2-migration-ci.yml"

# I-3: explicit least privilege (was the repository default).
permissions:
  contents: read

jobs:
  migration:
    name: payables p2 migration apply (PG17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payables_owner
          POSTGRES_PASSWORD: payables_ci_synthetic_pw
          POSTGRES_DB: dubiz_payables_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payables_owner -d dubiz_payables_shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://payables_owner:payables_ci_synthetic_pw@localhost:5432/dubiz_payables_shadow
      DIRECT_URL: postgresql://payables_owner:payables_ci_synthetic_pw@localhost:5432/dubiz_payables_shadow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Production's shape today. This PR changes no datamodel, so the
      # checked-out schema IS the pre-Phase-2 baseline.
      - name: Build the baseline (production's current shape)
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Apply the Phase 2 migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -f prisma/migrations/20260918090000_payables_phase_2_document_evidence/migration.sql
          echo "applied cleanly"

      - name: The double-count index is really PARTIAL on active evidence
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "SELECT indexdef FROM pg_indexes WHERE indexname = 'PaymentEvidence_active_document_key';" > idx.txt
          cat idx.txt
          grep -q 'UNIQUE INDEX' idx.txt || { echo "FAIL: not unique"; exit 1; }
          grep -q '"revokedAt" IS NULL' idx.txt || { echo "FAIL: not partial on active evidence"; exit 1; }
          echo "OK - one document may evidence at most one payment AT A TIME"

      - name: RLS is enabled and FORCED on the new table
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname='public' AND c.relrowsecurity AND c.relforcerowsecurity
                AND c.relname='PayablesMatchRejection';" > rls.txt
          [ "$(cat rls.txt)" = "1" ] || { echo "FAIL: RLS not enabled and forced"; exit 1; }
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t -A -c \
            "SELECT count(*) FROM pg_policies WHERE policyname='payables_p2_tenant';" > pol.txt
          [ "$(cat pol.txt)" = "1" ] || { echo "FAIL: tenant policy missing"; exit 1; }
          echo "OK - forced, with its tenant policy"

      # The guard is worth nothing if it does not actually refuse. Prove it
      # refuses a duplicate and still permits a different pairing.
      - name: The guards actually refuse
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            INSERT INTO \"Business\" (\"name\", \"createdAt\", \"updatedAt\") VALUES ('p2-ci', NOW(), NOW());
            INSERT INTO \"Document\" (\"businessId\",\"fileUrl\",\"source\",\"mimeType\",\"status\")
              SELECT id,'x','ci','application/pdf','APPROVED' FROM \"Business\" WHERE \"name\"='p2-ci';"

          BID=$(psql "$DATABASE_URL" -t -A -c "SELECT id FROM \"Business\" WHERE \"name\"='p2-ci';")
          DID=$(psql "$DATABASE_URL" -t -A -c "SELECT id FROM \"Document\" WHERE \"businessId\"=$BID;")

          # Two ACTIVE evidence rows for the same document must be refused.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            INSERT INTO \"Payment\" (\"businessId\",\"payeeNameSnapshot\",\"amount\",\"currency\",\"paidAt\",\"method\",\"status\",\"createdAt\",\"updatedAt\")
              VALUES ($BID,'p',10,'ILS',NOW(),'CASH','RECORDED',NOW(),NOW()), ($BID,'p',10,'ILS',NOW(),'CASH','RECORDED',NOW(),NOW());"
          P1=$(psql "$DATABASE_URL" -t -A -c "SELECT id FROM \"Payment\" WHERE \"businessId\"=$BID ORDER BY id LIMIT 1;")
          P2=$(psql "$DATABASE_URL" -t -A -c "SELECT id FROM \"Payment\" WHERE \"businessId\"=$BID ORDER BY id DESC LIMIT 1;")

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            INSERT INTO \"PaymentEvidence\" (\"businessId\",\"paymentId\",\"kind\",\"documentId\",\"confirmedAt\",\"createdAt\")
              VALUES ($BID,$P1,'DOCUMENT',$DID,NOW(),NOW());"

          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
               INSERT INTO \"PaymentEvidence\" (\"businessId\",\"paymentId\",\"kind\",\"documentId\",\"confirmedAt\",\"createdAt\")
                 VALUES ($BID,$P2,'DOCUMENT',$DID,NOW(),NOW());" 2>/dev/null; then
            echo "FAIL: the same document evidenced two payments at once"; exit 1
          fi
          echo "OK - a second ACTIVE document evidence is refused"

          # After an audited revocation the document may be re-attached.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            UPDATE \"PaymentEvidence\" SET \"revokedAt\" = NOW() WHERE \"documentId\" = $DID;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            INSERT INTO \"PaymentEvidence\" (\"businessId\",\"paymentId\",\"kind\",\"documentId\",\"confirmedAt\",\"createdAt\")
              VALUES ($BID,$P2,'DOCUMENT',$DID,NOW(),NOW());"
          echo "OK - re-attachable after revocation, so reconciliation is not a one-way door"

          # A repeated rejection of the same pairing is refused; a different one is not.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
            INSERT INTO \"PayablesMatchRejection\" (\"businessId\",\"documentId\",\"createdAt\") VALUES ($BID,$DID,NOW());"
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "
               INSERT INTO \"PayablesMatchRejection\" (\"businessId\",\"documentId\",\"createdAt\") VALUES ($BID,$DID,NOW());" 2>/dev/null; then
            echo "FAIL: duplicate rejection accepted"; exit 1
          fi
          echo "OK - a rejection is recorded once"
