# D2 / ACCOUNT-DELETION-2A — lifecycle + erasure-execution battery (ephemeral PG17).
#
# Runs the REAL orchestrator, the REAL Prisma erasure adapter, the REAL session check
# and the REAL payment settlement store against tenant tables that are actually under
# FORCE RLS — because the defect this wave fixes is invisible without RLS.
#
# Synthetic CI-only credentials; ZERO secrets, ZERO Neon, ZERO network, ZERO Production.

name: d2/ad2a — account-deletion lifecycle battery (ephemeral PG17)

on:
  push:
    branches: [feat/d2-account-deletion-2a]
  pull_request:
    branches: [main]
    paths:
      - "lib/services/account/**"
      - "lib/tenant/**"
      - "lib/auth.ts"
      - "lib/services/payments/**"
      - "app/api/account/**"
      - "scripts/security/conversation-integrity-scan.mjs"
      - "scripts/ci/account-deletion-guard.sh"
      - ".ad2a/**"
      - "lib/data-transfer/historical/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ad2a-battery:
    name: AD-2A battery (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ad2a_owner
          POSTGRES_PASSWORD: ad2a_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_ad2a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ad2a_owner -d dubiz_ad2a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      OWNER_URL: postgresql://ad2a_owner:ad2a_ci_synthetic_owner_pw@localhost:5432/dubiz_ad2a

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: |
          node --check .ad2a/battery.mjs
          node --check .ad2a/production-contract.mjs
          node --check .ad2a/known-defects.mjs
          node --check scripts/security/conversation-integrity-scan.mjs

      - name: CI-AD guards + negative self-proofs (blocking)
        run: |
          bash scripts/ci/account-deletion-guard.sh .
          bash scripts/ci/account-deletion-guard.sh --self-test

      - name: Existing guard families (no regression)
        run: |
          bash scripts/ci/prisma-centralization-guard.sh .
          bash scripts/ci/admin-boundary-guard.sh .
          bash scripts/ci/w4-context-guard.sh .
          bash scripts/ci/privwrite-guard.sh .

      - name: Account-deletion orchestrator unit matrix
        run: npx tsx lib/services/account/account-deletion.test.ts

      - name: Late-webhook quarantine proof (no payment resurrection)
        run: npx tsx lib/services/payments/payment-webhook-quarantine.test.ts

      - name: Tenant primitives (context + job)
        run: |
          npx tsx lib/tenant/context.test.ts
          npx tsx lib/tenant/job.test.ts

      - name: Push schema (lab; migrate-from-zero is a known separate defect)
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: npx prisma db push --skip-generate

      # THE BATTERY IS HONESTLY RED ON MAIN TODAY, and that is the point.
      #
      # It now applies the PRODUCTION policy contract — per-command pilot
      # policies with no DELETE, and the five RLS tables the old lab omitted —
      # so it reproduces three proven product defects instead of hiding them
      # behind a `FOR ALL` policy that was broader than Production.
      #
      # Running it in default mode here would paint every unrelated PR red until
      # the product is fixed, and a red that nobody can act on is a red everyone
      # learns to ignore. `--baseline-check` is the ratchet instead: it passes
      # ONLY when the failure set is exactly the defects recorded in
      # .ad2a/known-defects.mjs. A new failure fails the build. A recorded defect
      # that starts passing ALSO fails the build, so the repair has to be written
      # down rather than absorbed.
      #
      # There is one harness, measuring the same properties before and after. The
      # product fix empties that list, and this step then means exactly what the
      # default mode means.
      - name: AD-2A battery — Production-faithful contract (known-defect ratchet)
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          AUTH_TOKEN_SECRET: ad2a_ci_auth_secret_synthetic
        run: npx tsx .ad2a/battery.mjs --baseline-check

      # ── C12-E1 — laboratory fidelity, the half a static contract cannot prove ──
      #
      # Two gates, proved separately because they ARE separate: row-level security
      # (which rows a statement can reach) and table privilege (which verbs the role
      # may use at all). A `FOR ALL` policy governs DELETE; it does not grant it.
      #
      # The tenant FILTER is not proved here (E3/E3B are in erasure-contract-ci.yml):
      # under FORCE RLS a widened `where` clears exactly the same rows, so this battery
      # cannot tell the difference — that was measured, not assumed.

      # A table the fixture does not model is a table the lab leaves WITHOUT
      # row-level security, and an erasure proved there is proved against a database
      # Production does not have. Defect B's shape exactly. The battery resets the
      # three tables before applying the contract, so leftovers from the green run
      # above cannot keep this passing.
      - name: negative proof — E4 the lab stops reproducing the line's tenant RLS
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          AUTH_TOKEN_SECRET: ad2a_ci_auth_secret_synthetic
        run: |
          F=".ad2a/production-contract.mjs"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E4
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npx tsx .ad2a/battery.mjs --baseline-check > "$RUNNER_TEMP/E4.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the battery stayed green"; exit 1; fi
          grep -qF "[FAIL] E1-R1 · GUC=A cannot see B's purchase line" "$RUNNER_TEMP/E4.out" || { tail -60 "$RUNNER_TEMP/E4.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      # Production's runtime holds SELECT, INSERT and UPDATE on these three and no
      # DELETE (scripts/security/d2-p7-wave3-grants.sql). A lab that granted DELETE
      # would be proving against a capability the product does not have.
      - name: negative proof — E4P the lab runtime is granted DELETE Production does not hold
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          AUTH_TOKEN_SECRET: ad2a_ci_auth_secret_synthetic
        run: |
          F=".ad2a/battery.mjs"
          cp "$F" "$F.bak"
          npx tsx scripts/ci/erasure-mutate.ts E4P
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          set +e; npx tsx .ad2a/battery.mjs --baseline-check > "$RUNNER_TEMP/E4P.out" 2>&1; rc=$?; set -e
          mv "$F.bak" "$F"
          if [ $rc -eq 0 ]; then echo "NEGATIVE-PROOF FAIL: the battery stayed green"; exit 1; fi
          grep -qF "[FAIL] E1-P · PurchaseOrderLine: lab runtime privileges" "$RUNNER_TEMP/E4P.out" || { tail -60 "$RUNNER_TEMP/E4P.out"; echo "NEGATIVE-PROOF FAIL: red, but not for the reason under test"; exit 1; }
          echo "NEGATIVE-PROOF PASS"

      - name: Confirm the tree is byte-identical after the C12-E1 mutations
        run: git diff --exit-code

      # ── I-8A.1 — fiscal history through the erasure lifecycle ───────────────
      - name: I-8A structural firewall (no database)
        run: npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts

      # Each mutation below removes one real part of the contract, and is
      # confirmed to have applied before its result is believed.
      - name: negative proof — fiscal history dropped from the retained set
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/  "historicalFiscalDocument",\n//' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1 \
             && npx tsx lib/services/account/account-deletion.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unretained fiscal model passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — fiscal history moved into a purge set
        run: |
          F="lib/services/account/account-erasure-manifest.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/export const DELETE_MODELS = \[\n/export const DELETE_MODELS = [\n  "historicalFiscalDocument",\n/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/services/account/account-deletion.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: a purged fiscal model passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — the erasure executor reaching a fiscal row
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          # The manifest may NAME the model. The adapter may not touch it.
          # Anchored on the conversation ANONYMISATION. Stage 2 rewrites the graph
          # in place instead of deleting it, so the `conversation.deleteMany` line
          # this proof used to target no longer exists. The proof is unchanged in
          # substance: inject a fiscal delete into the erasure executor, and the
          # structural firewall must refuse it.
          perl -0pi -e 's/          await tx\.messageAnalysis\.updateMany\(\{/          await tx.historicalFiscalDocument.deleteMany({ where: { businessId } });\n          await tx.messageAnalysis.updateMany({/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an executor touching fiscal history passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — an arbitrary consumer outside the allowlist
        run: |
          F="lib/services/documents/document-duplicate.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/^/\/\/ historicalFiscalDocument\n/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: an unlisted consumer passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — fiscal history reaching the uniform export
        run: |
          F="lib/services/billing/uniform/uniform-export-loader.ts"
          cp "$F" "$F.bak"
          perl -0pi -e 's/^/\/\/ historicalFiscalDocument\n/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          if npx tsx lib/data-transfer/historical/historical-fiscal-persistence.verify.test.ts >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: the tax filing reached fiscal history"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: negative proof — erasure deleting the artifact fiscal history cites
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
          AUTH_TOKEN_SECRET: ad2a_ci_auth_secret_synthetic
        run: |
          F="lib/services/account/account-deletion.prisma-store.ts"
          cp "$F" "$F.bak"
          # Documents are retained, and a historical record cites one through a
          # RESTRICT foreign key. An erasure that started deleting them would
          # fail on that key rather than quietly destroying fiscal evidence.
          perl -0pi -e 's/          await tx\.messageAnalysis\.updateMany\(\{/          await tx.document.deleteMany({ where: { businessId } });\n          await tx.messageAnalysis.updateMany({/' "$F"
          if cmp -s "$F" "$F.bak"; then mv "$F.bak" "$F"; echo "MUTATION NOT APPLIED"; exit 1; fi
          # --baseline-check, NOT the default mode. The battery is legitimately red
          # on main today, so "did it fail?" would now be true no matter what this
          # mutation did, and the proof would quietly stop discriminating. The
          # ratchet still does: it fails only when the failure set CHANGES, which
          # is exactly what deleting a cited artifact would do.
          if npx tsx .ad2a/battery.mjs --baseline-check >/dev/null 2>&1; then
            mv "$F.bak" "$F"; echo "NEGATIVE-PROOF FAIL: deleting the cited artifact passed"; exit 1
          fi
          mv "$F.bak" "$F"
          echo "NEGATIVE-PROOF PASS"

      - name: Confirm the tree is byte-identical after every mutation
        run: git diff --exit-code
