name: service desk 1d-B — parts data service lab, no stock movement (ephemeral PG17)

# Stage 1, 1d-B (owner-approved 2026-11-10): the parts data service WITHOUT stock movements over the existing core and tables, AS the
# runtime role, on the P4 lab (1.2a + 1.2b + M2 + 1.3-0 + P4 applied by migrate deploy). Synthetic only; no secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/services/service-desk/**"
      - "app/api/service-desk/**"
      - "lib/tenant/**"
      - ".sdparts/**"
      - ".sd3p4/lab.sh"
      - ".sd3/lab.sh"
      - "prisma/schema.prisma"
      - ".github/workflows/service-desk-parts-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service desk 1d-B (PG17, runtime role, P4 applied)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sdparts_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sdparts_ci_synthetic_super_pw
      LAB_PASSWORD: sdparts_ci_synthetic_role_pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: The parts data service as the runtime role
        run: |
          set -euo pipefail
          bash .sd3p4/lab.sh sdparts >/dev/null
          bash .sd3p4/lab.sh sdparts --deploy-only >/dev/null
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdparts"
          A="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdparts"
          S="postgresql://lab_super:$PGPASSWORD@localhost:5432/sdparts"
          OWNER_URL="$A" SUPER_URL="$S" DATABASE_URL="$R?connection_limit=20" DIRECT_URL="$R" AUTH_DATABASE_URL="$A" AUTH_PLANE_ENABLED=true \
          TASK_REQUEST_HMAC_KEY=sdparts-ci-synthetic-hmac-key-0123456789abcdef TASK_REQUEST_HMAC_KEY_ID=sdparts-ci \
          AUTH_TOKEN_SECRET=sdparts-ci-synthetic-auth-secret-0123456789abcdef \
            npx tsx .sdparts/battery.ts | tee /tmp/sdparts.out
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/sdparts.out || { echo "the 1d-B battery is not green"; exit 1; }
