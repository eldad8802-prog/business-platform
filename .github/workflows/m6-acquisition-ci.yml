# M6 — first-wave acquisition connectors (website forms, Google Ads lead forms, Meta Lead Ads).
#
#   core      the no-database acquisition suite + the intake / identity / sensor suites it touches
#   battery   PostgreSQL 17, Production's RLS (replayed verbatim from the migrations), the REAL M6
#             migration, a NOBYPASSRLS runtime running the app code: the real webhook routes and
#             owner API, the real intake processor, M4 identity, routeToLead, M5 lifecycle, the
#             Secretary briefing, learning-signal privacy, tenant isolation.
#
# Synthetic credentials; ZERO secrets; ZERO network (the Meta Graph read is stubbed in-process).

name: m6 — acquisition connectors (PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "lib/intake/**"
      - "app/api/intake/acquisition/**"
      - "app/api/integrations/acquisition/**"
      - "lib/services/crm/lead-briefing.ts"
      - "lib/services/crm/lead.service.ts"
      - "lib/services/crm/lead-lifecycle.service.ts"
      - "lib/sensors/catalogue.ts"
      - "lib/security/rate-limiter/**"
      - "components/leads/**"
      - "prisma/schema.prisma"
      - "prisma/migrations/20261009090000_m6_acquisition_connections/**"
      - ".m6/**"
      - ".m7a/strip-schema.mjs"
      - ".m7a/prereq.sql"
      - "ops/evidence/m6-website-live-proof-evidence.sql"
      - "app/api/intake/sweep/**"
      - "components/settings/LeadSourcesPanel.tsx"
      - "lib/intake/sweep-auth.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/m6-acquisition-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: M6 acquisition core (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npx tsx lib/intake/acquisition/acquisition-core.test.ts
      - run: npx tsx lib/intake/core/intake-core.test.ts
      - run: npx tsx lib/intake/identity/identity-core.test.ts
      - run: npx tsx lib/sensors/sensors.test.ts
      - run: npx tsx lib/intake/sweep-auth.test.ts
      - run: npx tsx lib/services/billing/settlement/settlement-recovery-auth.test.ts

  qstash-lab:
    name: QStash lab (official local QStash server — schedule cadence, signatures, retry, DLQ, URL binding)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Start the official QStash development server (in-memory, published dev credentials)
        run: |
          set -euo pipefail
          (npx -y @upstash/qstash-cli@2.37.18 dev -port=8080 > /tmp/qstash-dev.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer eyJVc2VySUQiOiJkZWZhdWx0VXNlciIsIlBhc3N3b3JkIjoiZGVmYXVsdFBhc3N3b3JkIn0=" http://127.0.0.1:8080/v2/schedules | grep -q 200; then echo "up"; exit 0; fi
            sleep 2
          done
          cat /tmp/qstash-dev.log; exit 1
      - name: Real scheduler behaviour (no database, no Production)
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          DIRECT_URL: postgresql://unused:unused@127.0.0.1:1/unused
        run: npx tsx .m6/qstash-lab.ts

  battery:
    name: M6 battery (PG17, Production RLS, real M6 migration, NOBYPASSRLS runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: m6_owner
          POSTGRES_PASSWORD: m6_ci_synthetic_owner_pw
          POSTGRES_DB: dubiz_m6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m6_owner -d dubiz_m6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OWNER_URL: postgresql://m6_owner:m6_ci_synthetic_owner_pw@localhost:5432/dubiz_m6
      RUNTIME_URL: postgresql://app_runtime:m6_ci_synthetic_runtime_pw@localhost:5432/dubiz_m6
      AUTH_TOKEN_SECRET: m6_ci_secret_synthetic_at_least_32_characters_long
      META_LEAD_ADS_APP_SECRET: m6_ci_synthetic_meta_app_secret
      META_LEAD_ADS_VERIFY_TOKEN: m6_ci_synthetic_verify_token
      ACQUISITION_CREDENTIAL_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PGPASSWORD: m6_ci_synthetic_owner_pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 1. Roles as in Production (runtime NOSUPERUSER NOBYPASSRLS; app_auth / app_ctlplane / app_admin groups)
        run: |
          set -euo pipefail
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE app_runtime LOGIN PASSWORD 'm6_ci_synthetic_runtime_pw' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE ROLE app_auth NOLOGIN NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE ROLE app_ctlplane NOLOGIN NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE ROLE app_admin NOLOGIN NOSUPERUSER NOBYPASSRLS"

      - name: 2. Schema without M6 / M7-A (db push), then the REAL M6 and M7-A migrations
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
          DIRECT_URL: ${{ env.OWNER_URL }}
        run: |
          set -euo pipefail
          # M7-A models reference AcquisitionConnection and the lead briefing reads CallActivity, so the
          # M6 lab carries M7-A too: both tables come from their REAL migrations, not from db push.
          node .m7a/strip-schema.mjs prisma/schema.prisma /tmp/base.prisma
          npx prisma db push --schema /tmp/base.prisma --skip-generate
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q             -c "GRANT USAGE ON SCHEMA public TO app_runtime"             -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_runtime"             -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_runtime"
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261009090000_m6_acquisition_connections/migration.sql
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q -f .m7a/prereq.sql
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -q -f prisma/migrations/20261013090000_m7a_commerce_telephony_foundation/migration.sql
          npx prisma generate

      - name: 3. Production row-level security, replayed verbatim from the migrations
        run: node .m6/replay-rls.mjs "$OWNER_URL" 20261009090000_m6_acquisition_connections 20261013090000_m7a_commerce_telephony_foundation

      - name: 3b. A clean copy of this database for the live-proof rehearsal (before the battery writes anything)
        run: psql "postgresql://m6_owner:m6_ci_synthetic_owner_pw@localhost:5432/postgres" -v ON_ERROR_STOP=1 -q -c "CREATE DATABASE dubiz_live TEMPLATE dubiz_m6"

      - name: 4. M6 acquisition battery — real routes, real intake, M4 identity, M5 lifecycle, Secretary, isolation
        env:
          DATABASE_URL: ${{ env.RUNTIME_URL }}
          DIRECT_URL: ${{ env.RUNTIME_URL }}
        run: npx tsx .m6/acquisition-battery.ts

      - name: 5. Website LIVE-PROOF rehearsal — the Production evidence, proven on the real path (clean database)
        env:
          LIVE_OWNER: postgresql://m6_owner:m6_ci_synthetic_owner_pw@localhost:5432/dubiz_live
          LIVE_RUNTIME: postgresql://app_runtime:m6_ci_synthetic_runtime_pw@localhost:5432/dubiz_live
        run: |
          set -euo pipefail
          EV=ops/evidence/m6-website-live-proof-evidence.sql
          rehearse() { OWNER_URL="$LIVE_OWNER" DATABASE_URL="$LIVE_RUNTIME" DIRECT_URL="$LIVE_RUNTIME" npx tsx .m6/live-proof-rehearsal.ts "$1"; }
          evidence() { psql "$LIVE_OWNER" -X -v ON_ERROR_STOP=1 -f "$EV" > /tmp/ev.out; grep -E '^ +[0-9]+ \| (PASS|FAIL)' /tmp/ev.out; }
          fails() { { grep -E '^ +[0-9]+ \| FAIL' /tmp/ev.out || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          echo "== enabled for one business and connected, no enquiry yet: the chain checks must fail (not vacuous)"
          rehearse enable; evidence
          test "$(fails)" = "4 9 12 13 " || { echo "before any enquiry: expected 4 9 12 13 to fail, got: $(fails)"; exit 1; }
          echo "== one genuine-shaped enquiry + the same enquiry resubmitted: 17/17"
          rehearse submit; evidence
          test -z "$(fails)" || { echo "after the enquiry: expected no FAIL, got: $(fails)"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "17" || { echo "expected 17 PASS"; exit 1; }
          test "$(psql "$LIVE_OWNER" -Atc "SELECT count(*) FROM \"IntakeEvent\" WHERE \"sourceKey\" = 'web.form'")" = "1" || { echo "the resubmitted enquiry made a second receipt"; exit 1; }
          echo "== a second business enabled: the one-business check must fail"
          rehearse widen; evidence
          test "$(fails)" = "2 " || { echo "widened: expected only 2 to fail, got: $(fails)"; exit 1; }
          echo "live-proof evidence: not vacuous before, 17/17 on the real chain, refuses a second enabled business"
