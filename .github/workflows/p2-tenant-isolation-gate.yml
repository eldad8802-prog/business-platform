name: P2 Tenant-Isolation Adversarial Proof (ephemeral PG17)

# D2 / P2 MUTATION #2 — tenant-isolation adversarial proof on an ephemeral PG17 service.
# Synthetic CI-only credentials; ZERO secrets; ZERO Neon/Prod. Service destroyed at job end.
# migrate-from-zero is a KNOWN separate repo defect -> lab schema via `prisma db push`.

on:
  push:
    branches: [ci/p2-tenant-isolation-gate]

permissions:
  contents: read

jobs:
  adversarial-proof:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p2_owner
          POSTGRES_PASSWORD: p2_ci_synthetic_pw
          POSTGRES_DB: dubiz_p2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2_owner -d dubiz_p2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://p2_owner:p2_ci_synthetic_pw@localhost:5432/dubiz_p2
      DIRECT_URL: postgresql://p2_owner:p2_ci_synthetic_pw@localhost:5432/dubiz_p2
      PGPASSWORD: p2_ci_synthetic_pw

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Isolation assert (no Neon / prod)
        run: |
          case "$DATABASE_URL" in
            *neon.tech*|*ep-flat-brook*|*ep-square-grass*|*ep-wispy-dawn*|*ep-icy-violet*) echo "FATAL non-local"; exit 1;;
            postgresql://p2_owner:*@localhost:5432/dubiz_p2) echo "OK local ephemeral";;
            *) echo "FATAL unexpected DATABASE_URL"; exit 1;;
          esac
          test -f .env && { echo "FATAL unexpected .env"; exit 1; } || echo "OK no .env"

      - name: Ensure psql client
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

      - name: Schema bootstrap (prisma db push — lab only, not migration history)
        run: npx --yes prisma@6.16.0 db push --skip-generate

      - name: P2 setup — runtime role + fixtures + RLS policies (as owner)
        run: |
          set -euo pipefail
          psql -h localhost -U p2_owner -d dubiz_p2 -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS p2_runtime;
          CREATE ROLE p2_runtime LOGIN PASSWORD 'p2_runtime_ci_pw'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;
          GRANT USAGE ON SCHEMA public TO p2_runtime;
          GRANT SELECT, INSERT, UPDATE, DELETE ON
            "Business","Customer","BillingDocument","BillingDocumentLine","PlatformFeatureDefinition" TO p2_runtime;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO p2_runtime;

          INSERT INTO "Business"(name,"updatedAt") VALUES ('p2-a-business', now());
          INSERT INTO "Business"(name,"updatedAt") VALUES ('p2-b-business', now());
          CREATE TABLE p2_meta(k text PRIMARY KEY, business_id int);
          INSERT INTO p2_meta VALUES
            ('A',(SELECT id FROM "Business" WHERE name='p2-a-business')),
            ('B',(SELECT id FROM "Business" WHERE name='p2-b-business'));
          GRANT SELECT ON p2_meta TO p2_runtime;

          INSERT INTO "Customer"("businessId",name,"updatedAt") SELECT business_id,'p2-a-customer',now() FROM p2_meta WHERE k='A';
          INSERT INTO "Customer"("businessId",name,"updatedAt") SELECT business_id,'p2-b-customer',now() FROM p2_meta WHERE k='B';
          INSERT INTO "BillingDocument"("businessId","documentType","updatedAt") SELECT business_id,'QUOTE',now() FROM p2_meta WHERE k='A';
          INSERT INTO "BillingDocument"("businessId","documentType","updatedAt") SELECT business_id,'QUOTE',now() FROM p2_meta WHERE k='B';
          INSERT INTO "BillingDocumentLine"("billingDocumentId","lineIndex",description,quantity,"unitPrice","vatRatePercent","lineSubtotal","vatAmount","lineTotal","updatedAt")
            SELECT d.id,0,'p2-a-line',1,100,17,100,17,117,now() FROM "BillingDocument" d JOIN p2_meta m ON m.k='A' AND d."businessId"=m.business_id;
          INSERT INTO "BillingDocumentLine"("billingDocumentId","lineIndex",description,quantity,"unitPrice","vatRatePercent","lineSubtotal","vatAmount","lineTotal","updatedAt")
            SELECT d.id,0,'p2-b-line',1,200,17,200,34,234,now() FROM "BillingDocument" d JOIN p2_meta m ON m.k='B' AND d."businessId"=m.business_id;
          INSERT INTO "PlatformFeatureDefinition"(key,"displayName",category) VALUES ('p2-global-feature','P2 Global','p2');

          ALTER TABLE "Business" ENABLE ROW LEVEL SECURITY; ALTER TABLE "Business" FORCE ROW LEVEL SECURITY;
          CREATE POLICY p2_tenant ON "Business"
            USING (id = NULLIF(current_setting('app.current_business_id', true), '')::int)
            WITH CHECK (id = NULLIF(current_setting('app.current_business_id', true), '')::int);
          ALTER TABLE "Customer" ENABLE ROW LEVEL SECURITY; ALTER TABLE "Customer" FORCE ROW LEVEL SECURITY;
          CREATE POLICY p2_tenant ON "Customer"
            USING ("businessId" = NULLIF(current_setting('app.current_business_id', true), '')::int)
            WITH CHECK ("businessId" = NULLIF(current_setting('app.current_business_id', true), '')::int);
          ALTER TABLE "BillingDocument" ENABLE ROW LEVEL SECURITY; ALTER TABLE "BillingDocument" FORCE ROW LEVEL SECURITY;
          CREATE POLICY p2_tenant ON "BillingDocument"
            USING ("businessId" = NULLIF(current_setting('app.current_business_id', true), '')::int)
            WITH CHECK ("businessId" = NULLIF(current_setting('app.current_business_id', true), '')::int);
          ALTER TABLE "BillingDocumentLine" ENABLE ROW LEVEL SECURITY; ALTER TABLE "BillingDocumentLine" FORCE ROW LEVEL SECURITY;
          CREATE POLICY p2_tenant ON "BillingDocumentLine"
            USING (EXISTS (SELECT 1 FROM "BillingDocument" d WHERE d.id="BillingDocumentLine"."billingDocumentId" AND d."businessId" = NULLIF(current_setting('app.current_business_id', true), '')::int))
            WITH CHECK (EXISTS (SELECT 1 FROM "BillingDocument" d WHERE d.id="BillingDocumentLine"."billingDocumentId" AND d."businessId" = NULLIF(current_setting('app.current_business_id', true), '')::int));
          SQL
          echo "setup complete"

      - name: P2 adversarial matrix (as p2_runtime) + mechanical PASS/FAIL
        run: |
          set -uo pipefail
          A_ID=$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT business_id FROM p2_meta WHERE k='A'")
          B_ID=$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT business_id FROM p2_meta WHERE k='B'")
          echo "A_ID=$A_ID B_ID=$B_ID"

          # Run the whole matrix as the NON-BYPASS runtime role. ON_ERROR_ROLLBACK keeps the
          # batch alive across the intentionally-denied write (RLS WITH CHECK violation).
          OUT=$(PGPASSWORD=p2_runtime_ci_pw psql -h localhost -U p2_runtime -d dubiz_p2 -tA -q \
                  -v ON_ERROR_STOP=0 -v a_id="$A_ID" -v b_id="$B_ID" 2>&1 <<'SQL'
          \set ON_ERROR_ROLLBACK on
          BEGIN;
          SET LOCAL app.current_business_id = :'a_id';
          SELECT 'A_own_customer|'||count(*) FROM "Customer" WHERE name LIKE 'p2-a-%';
          SELECT 'A_own_billdoc|'||count(*) FROM "BillingDocument";
          SELECT 'A_own_billline|'||count(*) FROM "BillingDocumentLine" WHERE description LIKE 'p2-a-%';
          WITH i AS (INSERT INTO "Customer"("businessId",name,"updatedAt") VALUES(:a_id,'p2-a-tmp',now()) RETURNING 1) SELECT 'A_insert_own|'||count(*) FROM i;
          WITH u AS (UPDATE "Customer" SET city='x' WHERE name='p2-a-tmp' RETURNING 1) SELECT 'A_update_own|'||count(*) FROM u;
          WITH d AS (DELETE FROM "Customer" WHERE name='p2-a-tmp' RETURNING 1) SELECT 'A_delete_own|'||count(*) FROM d;
          SELECT 'A_see_B_business|'||count(*) FROM "Business" WHERE id=:b_id;
          SELECT 'A_see_B_customer|'||count(*) FROM "Customer" WHERE "businessId"=:b_id;
          SELECT 'A_see_B_marker|'||count(*) FROM "Customer" WHERE name LIKE 'p2-b-%';
          SELECT 'A_broad_customer|'||count(*) FROM "Customer";
          SELECT 'A_see_B_billdoc|'||count(*) FROM "BillingDocument" WHERE "businessId"=:b_id;
          SELECT 'A_see_B_billline|'||count(*) FROM "BillingDocumentLine" WHERE description LIKE 'p2-b-%';
          WITH u AS (UPDATE "Customer" SET city='hacked' WHERE "businessId"=:b_id RETURNING 1) SELECT 'A_update_B|'||count(*) FROM u;
          WITH d AS (DELETE FROM "Customer" WHERE "businessId"=:b_id RETURNING 1) SELECT 'A_delete_B|'||count(*) FROM d;
          INSERT INTO "Customer"("businessId",name,"updatedAt") VALUES(:b_id,'p2-evil',now());
          SELECT 'A_global|'||count(*) FROM "PlatformFeatureDefinition";
          COMMIT;
          BEGIN; SELECT 'noctx_customer|'||count(*) FROM "Customer"; COMMIT;
          BEGIN; SET LOCAL app.current_business_id = ''; SELECT 'emptyctx_customer|'||count(*) FROM "Customer"; COMMIT;
          BEGIN; SET LOCAL app.current_business_id = :'b_id';
          SELECT 'B_own_customer|'||count(*) FROM "Customer" WHERE name LIKE 'p2-b-%';
          SELECT 'B_see_A_marker|'||count(*) FROM "Customer" WHERE name LIKE 'p2-a-%';
          SELECT 'B_global|'||count(*) FROM "PlatformFeatureDefinition";
          COMMIT;
          BEGIN; SET LOCAL app.current_business_id = :'a_id'; SELECT 'iso_txA|'||count(*) FROM "Customer" WHERE name LIKE 'p2-a-%'; COMMIT;
          BEGIN; SET LOCAL app.current_business_id = :'b_id'; SELECT 'iso_txB|'||count(*) FROM "Customer" WHERE name LIKE 'p2-b-%'; COMMIT;
          BEGIN; SELECT 'iso_none|'||count(*) FROM "Customer"; COMMIT;
          BEGIN; SET LOCAL app.current_business_id = :'a_id'; ROLLBACK;
          BEGIN; SELECT 'iso_afterRB|'||count(*) FROM "Customer"; COMMIT;
          SQL
          )
          echo "---------------- RAW RUNTIME OUTPUT ----------------"
          echo "$OUT"
          echo "----------------------------------------------------"

          PASS=0; FAIL=0
          has(){ if grep -qxF "$1" <<<"$OUT"; then echo "PASS | $1"; PASS=$((PASS+1)); else echo "FAIL | expected line: $1"; FAIL=$((FAIL+1)); fi; }
          eq(){ if [ "$2" = "$3" ]; then echo "PASS | $1 ($3)"; PASS=$((PASS+1)); else echo "FAIL | $1 expect=$2 actual=$3"; FAIL=$((FAIL+1)); fi; }

          echo "== A. same-tenant allowed =="
          has "A_own_customer|1"; has "A_own_billdoc|1"; has "A_own_billline|1"
          has "A_insert_own|1"; has "A_update_own|1"; has "A_delete_own|1"
          echo "== B. cross-tenant denied (context=A) =="
          has "A_see_B_business|0"; has "A_see_B_customer|0"; has "A_see_B_marker|0"
          has "A_broad_customer|1"; has "A_see_B_billdoc|0"; has "A_see_B_billline|0"
          has "A_update_B|0"; has "A_delete_B|0"
          # WITH CHECK: the cross-tenant INSERT must have been rejected (control sees zero p2-evil)
          EVIL=$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT count(*) FROM \"Customer\" WHERE name='p2-evil'")
          eq "A_insert_as_B_rejected(WITH CHECK)" 0 "$EVIL"
          grep -qi "row-level security" <<<"$OUT" && echo "PASS | RLS WITH CHECK error surfaced" && PASS=$((PASS+1)) || { echo "FAIL | expected RLS violation error text"; FAIL=$((FAIL+1)); }
          echo "== C. fail-closed =="
          has "noctx_customer|0"; has "emptyctx_customer|0"
          MAL=$(PGPASSWORD=p2_runtime_ci_pw psql -h localhost -U p2_runtime -d dubiz_p2 -tA -v ON_ERROR_STOP=1 2>&1 <<'SQL' || true
          BEGIN; SET LOCAL app.current_business_id = 'not-an-int'; SELECT count(*) FROM "Customer"; COMMIT;
          SQL
          )
          case "$MAL" in *invalid*|*ERROR*) echo "PASS | malformed-context denied"; PASS=$((PASS+1));; *) echo "FAIL | malformed not denied: [$MAL]"; FAIL=$((FAIL+1));; esac
          echo "== D. transaction/context isolation =="
          has "iso_txA|1"; has "iso_txB|1"; has "iso_none|0"; has "iso_afterRB|0"
          echo "== E. bypass controls =="
          eq "runtime-non-super-non-bypass" "f/f" "$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT rolsuper||'/'||rolbypassrls FROM pg_roles WHERE rolname='p2_runtime'")"
          eq "runtime-owns-no-tables" 0 "$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tableowner='p2_runtime'")"
          eq "control-superuser-sees-both-tenants" 2 "$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc 'SELECT count(*) FROM "Customer"')"
          has "A_broad_customer|1"   # runtime under A sees exactly its own (already asserted; RLS is the blocker, not missing data)
          echo "== F. global control (no tenant RLS) =="
          has "A_global|1"; has "B_global|1"
          eq "global-visible-no-context" 1 "$(PGPASSWORD=p2_runtime_ci_pw psql -h localhost -U p2_runtime -d dubiz_p2 -tAc 'SELECT count(*) FROM "PlatformFeatureDefinition"')"
          echo "== RLS active assertions =="
          eq "force-rls-on-4-tenant-tables" 4 "$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT count(*) FROM pg_class WHERE relrowsecurity AND relforcerowsecurity AND relname IN ('Business','Customer','BillingDocument','BillingDocumentLine')")"
          eq "four-tenant-policies" 4 "$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT count(*) FROM pg_policies WHERE policyname='p2_tenant'")"
          eq "global-table-has-no-policy" 0 "$(psql -h localhost -U p2_owner -d dubiz_p2 -tAc "SELECT count(*) FROM pg_policies WHERE tablename='PlatformFeatureDefinition'")"

          echo "======================================================================"
          echo "TOTALS: PASS=$PASS FAIL=$FAIL"
          [ "$FAIL" = "0" ] || { echo "P2 TENANT ISOLATION = FAIL"; exit 1; }
          echo "P2 TENANT ISOLATION = PASS"
