name: P2 Tenant-Isolation Migration Gate (ephemeral PG17)

# D2 / P2 MUTATION #1 — Migration Gate ONLY (no roles/RLS/fixtures).
# Ephemeral PostgreSQL 17 service; synthetic CI-only credentials; ZERO secrets; ZERO Neon/Prod.
# Runs on push to its own dedicated branch. Service + runner destroyed at job end.

on:
  push:
    branches: [ci/p2-tenant-isolation-gate]

permissions:
  contents: read

jobs:
  migration-gate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: p2_owner
          POSTGRES_PASSWORD: p2_ci_synthetic_pw
          POSTGRES_DB: dubiz_p2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p2_owner -d dubiz_p2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # Literal synthetic CI-only URL — NOT a secret, NOT Neon, destroyed with the job.
      DATABASE_URL: postgresql://p2_owner:p2_ci_synthetic_pw@localhost:5432/dubiz_p2
      DIRECT_URL: postgresql://p2_owner:p2_ci_synthetic_pw@localhost:5432/dubiz_p2
      PGPASSWORD: p2_ci_synthetic_pw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Isolation assert (fail on any Neon / prod / non-local host)
        run: |
          echo "DATABASE_URL (host portion only) => localhost:5432/dubiz_p2"
          case "$DATABASE_URL" in
            *neon.tech*|*ep-flat-brook*|*ep-square-grass*|*ep-wispy-dawn*|*ep-icy-violet*)
              echo "FATAL: non-local / Neon endpoint detected"; exit 1;;
            postgresql://p2_owner:*@localhost:5432/dubiz_p2)
              echo "OK: local ephemeral CI service";;
            *)
              echo "FATAL: unexpected DATABASE_URL shape"; exit 1;;
          esac
          test -f .env && { echo "FATAL: unexpected .env in checkout (possible fallback)"; exit 1; } || echo "OK: no .env in checkout"

      - name: Ensure psql client
        run: command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

      - name: Migrate from zero (canonical Prisma migrations)
        run: npx --yes prisma@6.16.0 migrate deploy

      - name: Gate #1 verification (read-only) + mechanical PASS/FAIL
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U p2_owner -d dubiz_p2 -v ON_ERROR_STOP=1"

          echo "::group::PostgreSQL version"
          $PSQL -c "SELECT version();"
          echo "::endgroup::"

          echo "::group::Migrations applied"
          $PSQL -c "SELECT count(*) AS migration_dirs_applied FROM _prisma_migrations WHERE finished_at IS NOT NULL;"
          FAILEDM=$($PSQL -tAc "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL;")
          echo "pending/failed migrations = $FAILEDM"
          [ "$FAILEDM" = "0" ] || { echo "FAIL: pending/failed migrations present"; exit 1; }
          echo "::endgroup::"

          echo "::group::Zero application data (5 core tenant/user tables MUST be 0)"
          $PSQL -c 'SELECT (SELECT count(*) FROM "Business") business,(SELECT count(*) FROM "User") users,(SELECT count(*) FROM "Customer") customer,(SELECT count(*) FROM "BillingDocument") billingdocument,(SELECT count(*) FROM "BillingDocumentLine") billingdocumentline;'
          CORE=$($PSQL -tAc 'SELECT (SELECT count(*) FROM "Business")+(SELECT count(*) FROM "User")+(SELECT count(*) FROM "Customer")+(SELECT count(*) FROM "BillingDocument")+(SELECT count(*) FROM "BillingDocumentLine");')
          echo "core tenant/user row total = $CORE"
          [ "$CORE" = "0" ] || { echo "FAIL: nonzero user/business data"; exit 1; }
          echo "::endgroup::"

          echo "::group::Non-empty table inventory (ANALYZE for accurate live counts)"
          $PSQL -c "ANALYZE;" >/dev/null
          $PSQL -c "SELECT relname, n_live_tup FROM pg_stat_user_tables WHERE n_live_tup > 0 AND relname <> '_prisma_migrations' ORDER BY n_live_tup DESC, relname;"
          # Any non-empty table MUST be within the known migration-seeded reference allowlist.
          UNEXPECTED=$($PSQL -tAc "SELECT count(*) FROM pg_stat_user_tables WHERE n_live_tup > 0 AND relname NOT IN ('_prisma_migrations','DerivationPolicy','DerivationPolicyVersion','PlatformFeatureDefinition','PlatformFeaturePolicy');")
          echo "unexpected non-empty tables (outside migration-seeded reference allowlist) = $UNEXPECTED"
          [ "$UNEXPECTED" = "0" ] || { echo "FAIL: unexpected non-empty application table(s)"; exit 1; }
          echo "NOTE: any rows above are migration-seeded reference/config data (feature/derivation policies) — not user/business/PII data."
          echo "::endgroup::"

          echo "::group::Pilot schema present (5 locked models) + indirect-tenant FK"
          $PSQL -c 'SELECT to_regclass('"'"'public."Business"'"'"') business, to_regclass('"'"'public."Customer"'"'"') customer, to_regclass('"'"'public."BillingDocument"'"'"') billingdocument, to_regclass('"'"'public."BillingDocumentLine"'"'"') billingdocumentline, to_regclass('"'"'public."PlatformFeatureDefinition"'"'"') platformfeaturedefinition;'
          MISSING=$($PSQL -tAc 'SELECT count(*) FROM (VALUES ('"'"'public."Business"'"'"'),('"'"'public."Customer"'"'"'),('"'"'public."BillingDocument"'"'"'),('"'"'public."BillingDocumentLine"'"'"'),('"'"'public."PlatformFeatureDefinition"'"'"')) v(t) WHERE to_regclass(v.t) IS NULL;')
          echo "missing pilot tables = $MISSING"
          [ "$MISSING" = "0" ] || { echo "FAIL: pilot schema incomplete"; exit 1; }
          echo "-- BillingDocumentLine parent FK (indirect tenancy path):"
          $PSQL -c 'SELECT conname, confrelid::regclass AS references FROM pg_constraint WHERE conrelid = '"'"'public."BillingDocumentLine"'"'"'::regclass AND contype = '"'"'f'"'"';'
          echo "::endgroup::"

          echo "::group::Security baseline CLEAN (no P2 role / no RLS / no policies)"
          $PSQL -c "SELECT count(*) AS rls_policies FROM pg_policies;"
          $PSQL -c "SELECT count(*) AS rls_enabled_tables FROM pg_class WHERE relrowsecurity AND relkind='r';"
          $PSQL -c "SELECT count(*) AS p2_runtime_role FROM pg_roles WHERE rolname='p2_runtime';"
          POL=$($PSQL -tAc "SELECT count(*) FROM pg_policies;")
          RLS=$($PSQL -tAc "SELECT count(*) FROM pg_class WHERE relrowsecurity AND relkind='r';")
          ROLE=$($PSQL -tAc "SELECT count(*) FROM pg_roles WHERE rolname='p2_runtime';")
          echo "policies=$POL rls_tables=$RLS p2_runtime=$ROLE"
          [ "$POL" = "0" ] && [ "$RLS" = "0" ] && [ "$ROLE" = "0" ] || { echo "FAIL: baseline not clean (unexpected RLS/role)"; exit 1; }
          echo "::endgroup::"

          echo "GATE #1 = PASS"
