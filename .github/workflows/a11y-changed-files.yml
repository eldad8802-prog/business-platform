name: a11y-changed-files

# WP1 A-16 enforcement (CI Enforcement Phase 1).
#
# jsx-a11y rules stay `warn` in eslint.config.mjs, so a FULL lint never fails —
# legacy/grandfathered code is untouched (WP9 §10). This job enforces jsx-a11y as
# BLOCKING on the files CHANGED in a pull request ONLY: the goal is "no new a11y
# debt", not "fix all existing debt". Scoped to jsx-a11y rules (other lint
# warnings are ignored here). A justified `eslint-disable` is the documented
# exception for intentional patterns.

on:
  pull_request:

permissions:
  contents: read

jobs:
  jsx-a11y-changed:
    name: jsx-a11y (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Enforce jsx-a11y on changed .tsx/.jsx (legacy grandfathered)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # NUL-delimited so paths with spaces are safe.
          mapfile -d '' CHANGED < <(git diff -z --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.tsx' '*.jsx')
          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo "No changed .tsx/.jsx files — nothing to enforce."
            exit 0
          fi
          printf 'Changed UI file: %s\n' "${CHANGED[@]}"
          set +e
          npx eslint -f json "${CHANGED[@]}" > eslint-a11y.json
          ESLINT_EXIT=$?
          set -e
          # ESLint exit codes: 0 = no problems, 1 = problems reported (we parse them
          # for jsx-a11y), >=2 = ESLint itself failed (bad config / crash) → fail hard
          # so a crash can never leave empty JSON that silently passes the gate.
          if [ "$ESLINT_EXIT" -gt 1 ]; then
            echo "::error::ESLint failed to run (exit $ESLINT_EXIT) — failing the a11y gate."
            exit 1
          fi
          node scripts/ci/check-jsx-a11y.mjs eslint-a11y.json
