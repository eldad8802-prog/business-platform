# Notification engine activation record / migration 20261212090000_notification_engine_activation — proof on PostgreSQL
# BEFORE it reaches Production (ephemeral PG17). DEPENDS ON 20261211090000_notification_engine_followup (PR 2b), itself
# on 20261210090000_notification_engine_foundation (PR #1143): the lab chains the follow-up lab, so the activation
# migration meets exactly what it builds on (the policy row of notifications_engine, the role topology).
#
# .nte2c/lab.sh chains .nte2/lab.sh --with-nte2 (→ .nte/lab.sh --with-nte: Production's role topology, the owner's
# DEFAULT PRIVILEGES, FORCE RLS, the foundation and the follow-up applied by `prisma migrate deploy`), re-applies the
# control-plane privileges verbatim and creates a LOGIN member of app_ctlplane (the platform admin's real writer role).
#
#   0. Evidence files are SELECT-only and selectable in Production; the proof pins migration.sql's sha256; the
#      migration names only its own table and what it builds on; expand-only (ALTER TABLE / UPDATE only on its own
#      new table, nothing dropped, deleted or truncated).
#   1. Baseline (follow-up applied, activation pending): the PREFLIGHT passes (8 is INFO); the proof refuses.
#   2. `prisma migrate deploy` applies it (with overrides written before the release, NTE2C_SEED): proof 14/14
#      (12 + the two visibility checks); the preflight then fails exactly its "not there yet" checks.
#   3. Faults: each injected defect is caught by the proof check meant for it.
#   4. Battery (.nte2c/battery.ts) as the real roles: backfill, catalog, RLS + privileges in action, the override
#      trigger (written by the control plane), the policy trigger (re-saves move nothing; the kill switch), the
#      worker's observation (own tenant only, global-only first activation once, contradicted claims refused),
#      CHECKs, erasure cascade, backward compatibility.
#   5. Atomicity: the migration failing on its last statement leaves nothing of it behind.
#
# Synthetic credentials; ZERO secrets; ZERO Neon; ZERO network.

name: notification engine — activation migration lab (ephemeral PG17)

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261212090000_notification_engine_activation/**"
      - "ops/evidence/notification-engine-activation-*.sql"
      - ".nte2c/**"
      - ".github/workflows/notification-engine-activation-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: notification engine activation (PG17, real migration via migrate deploy, Production role topology)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: nte2c_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: nte2c_ci_synthetic_super_pw
      LAB_PASSWORD: nte2c_ci_synthetic_role_pw
      CHECKPOINT_DISABLE: "1"
      PREFLIGHT: ops/evidence/notification-engine-activation-preflight.sql
      EVIDENCE: ops/evidence/notification-engine-activation-production-evidence.sql
      NTE2C: prisma/migrations/20261212090000_notification_engine_activation/migration.sql

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: 0. Evidence files are SELECT-only and selectable in Production; checksum pinned; the migration names only its own table and what it builds on; expand-only
        run: |
          set -euo pipefail
          FORBIDDEN='\b(insert|update|delete|merge|drop|alter|create|truncate|grant|revoke|copy|call|do|vacuum|comment|commit|upsert|replace|lock|nextval|setval|reindex|cluster|refresh)\b'
          for f in "$PREFLIGHT" "$EVIDENCE"; do
            if grep -inE "$FORBIDDEN" "$f"; then echo "write keyword in $f"; exit 1; fi
            grep -q "'$f'" .github/workflows/prod-readonly-evidence.yml || { echo "$f not selectable"; exit 1; }
          done
          node scripts/ci/evidence-output-guard.mjs   # assert-shaped output only (public logs)
          sum=$(sha256sum "$NTE2C" | cut -d' ' -f1)
          grep -q "'$sum'" "$EVIDENCE" || { echo "the proof pins a different checksum ($sum)"; exit 1; }
          echo "$NTE2C sha256 $sum (pinned)"
          others=$(grep -oE '"[A-Z][A-Za-z]*"' "$NTE2C" | sort -u | grep -vxE '"Business"|"BusinessFeatureAccess"|"PlatformFeaturePolicy"|"NotificationEngineActivation"' || true)
          test -z "$others" || { echo "the migration names other relations: $others"; exit 1; }
          echo "the migration names only Business, BusinessFeatureAccess, PlatformFeaturePolicy and its own NotificationEngineActivation"
          if grep -qiE '^\s*(DROP|ALTER FUNCTION|DELETE|TRUNCATE)\b' "$NTE2C"; then echo "not expand-only"; exit 1; fi
          if grep -iE '^\s*ALTER TABLE\b' "$NTE2C" | grep -qv '"NotificationEngineActivation"'; then echo "ALTER TABLE on an existing table"; exit 1; fi
          if grep -iE '^\s*UPDATE\b' "$NTE2C" | grep -qv '"NotificationEngineActivation"'; then echo "UPDATE of an existing table"; exit 1; fi
          echo "expand-only: no DROP / ALTER FUNCTION / DELETE / TRUNCATE; ALTER TABLE and UPDATE only on its own new table"

      - name: 1. Baseline (follow-up applied, activation pending) — PREFLIGHT passes; the proof refuses
        run: |
          set -euo pipefail
          bash .nte2c/lab.sh nte2c_pre
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte2c_pre -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$PREFLIGHT" | tee /tmp/pre.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/pre.out; then echo "preflight FAILS on the baseline"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/pre.out)" = "7" || { echo "expected 7 PASS"; exit 1; }
          test "$(grep -cE '^ +[0-9]+ \| INFO' /tmp/pre.out)" = "1" || { echo "expected 1 INFO"; exit 1; }
          if lab -f "$EVIDENCE" 2>/dev/null | grep -qE '^ +1 \| PASS'; then echo "the proof passed before the migration"; exit 1; fi
          echo "the proof refuses on the baseline"

      - name: 2. prisma migrate deploy applies it — proof 14/14; preflight fails exactly its "not there yet" checks
        run: |
          set -euo pipefail
          NTE_SEED=.nte/seed.sql NTE2C_SEED=.nte2c/seed.sql bash .nte2c/lab.sh nte2c_post --with-nte2c | tee /tmp/post.log
          grep -q 'Applying migration `20261212090000_notification_engine_activation`' /tmp/post.log
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte2c_post -v ON_ERROR_STOP=1 "$@"; }
          lab -f "$EVIDENCE" | tee /tmp/ev.out
          if grep -qE '^ +[0-9]+ \| FAIL' /tmp/ev.out; then echo "proof FAILS after the release"; exit 1; fi
          test "$(grep -cE '^ +[0-9]+ \| PASS' /tmp/ev.out)" = "14" || { echo "expected 14 PASS"; exit 1; }
          fails=$(lab -f "$PREFLIGHT" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' ')
          test "$fails" = "1 5 " || { echo "after the release: expected '1 5 ', got: $fails"; exit 1; }

      - name: 3. Faults — each is caught by the proof, by the check meant for it
        run: |
          set -euo pipefail
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -U lab_owner -d nte2c_post -v ON_ERROR_STOP=1 "$@"; }
          su() { psql -X -q -v ON_ERROR_STOP=1 -U "$SUPER" -d nte2c_post -c "$1"; }
          failing() { lab -f "$EVIDENCE" | { grep -E '^ +[0-9]+ \| FAIL' || true; } | awk -F'|' '{print $1}' | tr -d ' ' | tr '\n' ' '; }
          test "$(failing)" = "" || { echo "unexpected baseline: $(failing)"; exit 1; }
          fault() {  # fault <label> <expected> <inject> <undo>
            su "$3"; got=$(failing); su "$4"
            test "$got" = "$2" || { echo "$1: expected '$2', got '$got'"; exit 1; }
            echo "fault detected [$1] → FAIL $got"
          }
          T='"NotificationEngineActivation"'
          OBS='public.notification_engine_observe(integer, boolean, timestamp(3))'
          OVR='public.notification_engine_override_changed()'
          REC='public.notification_engine_record(integer, boolean, timestamp(3), text)'
          fault "RLS not forced" "4 " "ALTER TABLE $T NO FORCE ROW LEVEL SECURITY" "ALTER TABLE $T FORCE ROW LEVEL SECURITY"
          fault "a DELETE policy" "4 " "CREATE POLICY lab_delete ON $T FOR DELETE USING (true)" "DROP POLICY lab_delete ON $T"
          fault "the runtime may write" "5 " "GRANT INSERT ON $T TO app_runtime" "REVOKE INSERT ON $T FROM app_runtime"
          fault "PUBLIC may read" "5 " "GRANT SELECT ON $T TO PUBLIC" "REVOKE SELECT ON $T FROM PUBLIC"
          fault "the cascade dropped" "6 " \
            "ALTER TABLE $T DROP CONSTRAINT \"NotificationEngineActivation_businessId_fkey\"; ALTER TABLE $T ADD CONSTRAINT \"NotificationEngineActivation_businessId_fkey\" FOREIGN KEY (\"businessId\") REFERENCES \"Business\"(\"id\") ON DELETE RESTRICT" \
            "ALTER TABLE $T DROP CONSTRAINT \"NotificationEngineActivation_businessId_fkey\"; ALTER TABLE $T ADD CONSTRAINT \"NotificationEngineActivation_businessId_fkey\" FOREIGN KEY (\"businessId\") REFERENCES \"Business\"(\"id\") ON DELETE CASCADE ON UPDATE CASCADE"
          fault "observe SECURITY INVOKER" "7 " "ALTER FUNCTION $OBS SECURITY INVOKER" "ALTER FUNCTION $OBS SECURITY DEFINER"
          fault "trigger function search_path not pinned" "7 " "ALTER FUNCTION $OVR RESET search_path" "ALTER FUNCTION $OVR SET search_path = pg_catalog, public, pg_temp"
          fault "EXECUTE observe for PUBLIC" "8 " "GRANT EXECUTE ON FUNCTION $OBS TO PUBLIC" "REVOKE EXECUTE ON FUNCTION $OBS FROM PUBLIC"
          fault "EXECUTE the helper for the runtime" "8 " "GRANT EXECUTE ON FUNCTION $REC TO app_runtime" "REVOKE EXECUTE ON FUNCTION $REC FROM app_runtime"
          fault "the override trigger disabled" "9 " \
            'ALTER TABLE "BusinessFeatureAccess" DISABLE TRIGGER "BusinessFeatureAccess_notification_engine_activation"' \
            'ALTER TABLE "BusinessFeatureAccess" ENABLE TRIGGER "BusinessFeatureAccess_notification_engine_activation"'
          fault "an ENABLED override without a record" "11 " \
            "ALTER TABLE \"BusinessFeatureAccess\" DISABLE TRIGGER \"BusinessFeatureAccess_notification_engine_activation\"; INSERT INTO \"Business\" (\"name\", \"updatedAt\") VALUES ('nte2c-fault', now()); INSERT INTO \"BusinessFeatureAccess\" (\"businessId\", \"featureKey\", \"state\", \"updatedAt\") SELECT max(\"id\"), 'notifications_engine', 'ENABLED', now() FROM \"Business\"; ALTER TABLE \"BusinessFeatureAccess\" ENABLE TRIGGER \"BusinessFeatureAccess_notification_engine_activation\"" \
            "DELETE FROM \"BusinessFeatureAccess\" WHERE \"businessId\" IN (SELECT \"id\" FROM \"Business\" WHERE \"name\" = 'nte2c-fault'); DELETE FROM \"Business\" WHERE \"name\" = 'nte2c-fault'"
          fault "a backfilled record dated before the release" "12 " \
            "UPDATE $T SET \"firstActivatedAt\" = '2026-01-01', \"priorActivatedAt\" = '2026-01-01', \"lastActivatedAt\" = '2026-01-01' WHERE \"lastSource\" = 'migration'" \
            "UPDATE $T SET \"firstActivatedAt\" = m.t, \"priorActivatedAt\" = m.t, \"lastActivatedAt\" = m.t FROM (SELECT (started_at AT TIME ZONE 'UTC')::timestamp(3) AS t FROM \"_prisma_migrations\" WHERE migration_name = '20261212090000_notification_engine_activation') m WHERE \"lastSource\" = 'migration'"
          test "$(failing)" = "" || { echo "proof not back to baseline: $(failing)"; exit 1; }

      - name: 4. Battery — backfill, RLS, privileges, both triggers, the worker's observation (real roles)
        run: |
          set -euo pipefail
          OWNER_URL="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/nte2c_post" \
          CTL_URL="postgresql://nte2c_ctl_login:$LAB_PASSWORD@localhost:5432/nte2c_post" \
          RUNTIME_URL="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/nte2c_post" \
          AUTH_URL="postgresql://te_auth_login:$LAB_PASSWORD@localhost:5432/nte2c_post" \
            npx tsx .nte2c/battery.ts

      - name: 5. Atomicity — the migration failing on its last statement leaves nothing of it behind
        run: |
          set -euo pipefail
          bash .nte2c/lab.sh nte2c_broken --broken-nte2c
          lab() { PGPASSWORD="$LAB_PASSWORD" psql -X -At -U lab_owner -d nte2c_broken -v ON_ERROR_STOP=1 "$@"; }
          left=$(lab -c "SELECT (SELECT count(*) FROM pg_class WHERE relname = 'NotificationEngineActivation')
            + (SELECT count(*) FROM pg_proc WHERE proname LIKE 'notification\_engine\_%')
            + (SELECT count(*) FROM pg_trigger WHERE tgname LIKE '%\_notification\_engine\_activation')")
          led=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261212090000_notification_engine_activation' AND finished_at IS NULL")
          found=$(lab -c "SELECT count(*) FROM \"_prisma_migrations\" WHERE migration_name = '20261211090000_notification_engine_followup' AND finished_at IS NOT NULL")
          echo "objects left=$left unfinished ledger rows=$led follow-up applied=$found"
          test "$left" = "0" && test "$led" = "1" && test "$found" = "1" || { echo "NOT atomic"; exit 1; }
