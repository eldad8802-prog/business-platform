# D2 / P4-A — Real Neon non-bypass role lab (PREVIEW ONLY)
#
# Connection bootstrap: the existing repo secret NEON_API_KEY is used INSIDE the
# runner ONLY to (a) verify the exact Preview target identity and (b) fetch an
# owner connection URI for that target (provisioning + teardown). No DATABASE_URL
# / DIRECT_URL GitHub secret is required or created. Nothing is printed but
# endpoint id / role / database / sanitized results.
#
# Gate A: identity — verify project/branch/endpoint/database via the Neon API and
#         enforce the allowlist. No connection URI is fetched here.
# Gate B: fetch owner URI (API) -> provision role p4_runtime_lab + p4_runtime_lab
#         schema -> run the tenant-isolation battery through a client that
#         authenticates DIRECTLY as the role (Option A) -> teardown.
#
# Safety contract (enforced by this file):
#   - Hard allowlist endpoint ep-wispy-dawn-amr74bwz / branch br-red-scene-amth33qx
#     / project orange-shape-16620903 / db neondb. Hard deny ep-flat-brook-am4bhq1y
#     + ep-winter-bread-ami5o8p5. Any mismatch -> FAIL CLOSED.
#   - NEON_API_KEY and every connection URI are masked; never echoed; never written
#     to a tracked file or artifact.
#   - Neon API is used ONLY for identity lookup + connection-uri retrieval. No
#     project/branch/endpoint/role/config mutation via the API.
#   - Only schema p4_runtime_lab + role p4_runtime_lab are created (via SQL, as
#     owner); every object is p4_runtime_lab.p4_*. No writes to public. No PII.
#   - app_runtime never referenced. No Legacy Web Access change. No new branch.
#   - Teardown (DROP SCHEMA CASCADE + DROP ROLE) in battery finally + always() net;
#     residue verified 0. Standard Prisma only; @prisma/adapter-neon NOT adopted.

name: d2/p4a — runtime role lab (preview only)

on:
  workflow_dispatch:
  push:
    branches:
      - d2/p4a-runtime-role-lab

permissions:
  contents: read

concurrency:
  group: d2-p4a-runtime-role-lab
  cancel-in-progress: false

env:
  NEON_BASE: https://console.neon.tech/api/v2
  P4_PROJECT_ID: orange-shape-16620903
  P4_BRANCH_ID: br-red-scene-amth33qx
  P4_EXPECT_ENDPOINT: ep-wispy-dawn-amr74bwz
  P4_EXPECT_DB: neondb
  P4_EXPECT_HOST_SUFFIX: us-east-1.aws.neon.tech
  P4_DENY_ENDPOINTS: ep-flat-brook-am4bhq1y ep-winter-bread-ami5o8p5

jobs:
  gate_a_identity:
    name: Gate A — Preview target identity (Neon API lookup, no connection URI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate_a: ${{ steps.verify.outputs.gate_a }}
    steps:
      - name: Verify project/branch/endpoint/database via Neon API
        id: verify
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_API_KEY:-}" ]; then echo "::error::repo secret NEON_API_KEY is missing"; exit 1; fi
          api() { curl --fail-with-body -sS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" "$1"; }

          # Hard-coded expected identity. Anything else -> fail closed.
          EID="${P4_EXPECT_ENDPOINT}"; BID="${P4_BRANCH_ID}"; PID="${P4_PROJECT_ID}"; DB="${P4_EXPECT_DB}"
          for d in ${P4_DENY_ENDPOINTS}; do
            if [ "$EID" = "$d" ]; then echo "::error::expected endpoint is a DENY endpoint"; exit 1; fi
          done

          proj=$(api "${NEON_BASE}/projects/${PID}")
          region=$(printf '%s' "$proj" | jq -r '.project.region_id')
          br=$(api "${NEON_BASE}/projects/${PID}/branches/${BID}")
          br_id=$(printf '%s' "$br" | jq -r '.branch.id')
          ep=$(api "${NEON_BASE}/projects/${PID}/endpoints/${EID}")
          ep_id=$(printf '%s' "$ep" | jq -r '.endpoint.id')
          ep_branch=$(printf '%s' "$ep" | jq -r '.endpoint.branch_id')
          ep_host=$(printf '%s' "$ep" | jq -r '.endpoint.host')

          echo "project=${PID} region=${region}"
          echo "branch=${br_id} endpoint=${ep_id} endpoint_branch=${ep_branch}"
          echo "endpoint_host=${ep_host}"

          fail=0
          [ "$br_id" = "$BID" ] || { echo "::error::branch id mismatch"; fail=1; }
          [ "$ep_id" = "$EID" ] || { echo "::error::endpoint id mismatch"; fail=1; }
          [ "$ep_branch" = "$BID" ] || { echo "::error::endpoint not on expected branch"; fail=1; }
          case "$ep_host" in *"${P4_EXPECT_HOST_SUFFIX}") : ;; *) echo "::error::endpoint host region suffix mismatch"; fail=1 ;; esac
          case "$ep_host" in ${EID}.*) : ;; *) echo "::error::endpoint host does not start with expected endpoint id"; fail=1 ;; esac
          case "$region" in *us-east-1*) : ;; *) echo "::error::project region is not us-east-1"; fail=1 ;; esac
          for d in ${P4_DENY_ENDPOINTS}; do case "$ep_host" in *"$d"*) echo "::error::DENY endpoint present"; fail=1 ;; esac; done

          if [ "$fail" -ne 0 ]; then echo "gate_a=FAIL" >> "$GITHUB_OUTPUT"; echo "::error::GATE A = FAIL"; exit 1; fi
          echo "gate_a=PASS" >> "$GITHUB_OUTPUT"; echo "GATE A = PASS"

  gate_b_p4a:
    name: Gate B — P4-A role lab (p4_runtime_lab)
    needs: gate_a_identity
    if: needs.gate_a_identity.outputs.gate_a == 'PASS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies (prisma generate via postinstall)
        run: npm ci --no-audit --no-fund
      - name: Sanity-check battery syntax
        run: node --check .p4a/battery.mjs

      - name: Fetch owner URI (Neon API) + run P4-A battery
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          api() { curl --fail-with-body -sS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" "$1"; }
          get_uri() {  # $1 = pooled(true|false)
            api "${NEON_BASE}/projects/${P4_PROJECT_ID}/connection_uri?branch_id=${P4_BRANCH_ID}&endpoint_id=${P4_EXPECT_ENDPOINT}&database_name=${P4_EXPECT_DB}&role_name=neondb_owner&pooled=$1" | jq -r '.uri'
          }
          DBP="$(get_uri true)"; DBD="$(get_uri false)"
          # Mask immediately — belt and braces (they are never echoed regardless).
          echo "::add-mask::${DBP}"; echo "::add-mask::${DBD}"
          [ -n "${DBP}" ] && [ "${DBP}" != "null" ] || { echo "::error::empty pooled owner URI"; exit 1; }
          [ -n "${DBD}" ] && [ "${DBD}" != "null" ] || { echo "::error::empty direct owner URI"; exit 1; }
          # Identity re-assert on the URIs (host must be the expected endpoint; deny prod).
          for u in "${DBP}" "${DBD}"; do
            case "$u" in *"${P4_EXPECT_ENDPOINT}"*"${P4_EXPECT_HOST_SUFFIX}"*) : ;; *) echo "::error::owner URI is not the expected Preview endpoint"; exit 1 ;; esac
            for d in ${P4_DENY_ENDPOINTS}; do case "$u" in *"$d"*) echo "::error::owner URI hits a DENY endpoint"; exit 1 ;; esac; done
          done
          DATABASE_URL="${DBP}" DIRECT_URL="${DBD}" \
          P4_EXPECT_ENDPOINT="${P4_EXPECT_ENDPOINT}" P4_EXPECT_DB="${P4_EXPECT_DB}" \
          P4_EXPECT_HOST_SUFFIX="${P4_EXPECT_HOST_SUFFIX}" P4_DENY_ENDPOINTS="${P4_DENY_ENDPOINTS}" \
          node .p4a/battery.mjs

      - name: Teardown safety net (always)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          DBD="$(curl --fail-with-body -sS -H "Authorization: Bearer ${NEON_API_KEY}" -H "Accept: application/json" "${NEON_BASE}/projects/${P4_PROJECT_ID}/connection_uri?branch_id=${P4_BRANCH_ID}&endpoint_id=${P4_EXPECT_ENDPOINT}&database_name=${P4_EXPECT_DB}&role_name=neondb_owner&pooled=false" | jq -r '.uri')"
          echo "::add-mask::${DBD}"
          [ -n "${DBD}" ] && [ "${DBD}" != "null" ] || { echo "no owner URI for teardown"; exit 0; }
          case "${DBD}" in *"${P4_EXPECT_ENDPOINT}"*) : ;; *) echo "::error::teardown URI endpoint mismatch"; exit 1 ;; esac
          mkdir -p .p4a
          cat > .p4a/teardown.mjs <<'TD_EOF'
          import { PrismaClient } from '@prisma/client';
          const c = new PrismaClient({ datasourceUrl: process.env.DIRECT_URL });
          await c.$executeRawUnsafe('DROP SCHEMA IF EXISTS p4_runtime_lab CASCADE');
          try { await c.$executeRawUnsafe('DROP OWNED BY p4_runtime_lab'); } catch {}
          await c.$executeRawUnsafe('DROP ROLE IF EXISTS p4_runtime_lab');
          const r = await c.$queryRaw`SELECT (SELECT count(*)::int FROM information_schema.schemata WHERE schema_name='p4_runtime_lab') AS lab, (SELECT count(*)::int FROM pg_roles WHERE rolname='p4_runtime_lab') AS role, (SELECT count(*)::int FROM pg_class cc JOIN pg_namespace n ON n.oid=cc.relnamespace WHERE cc.relname LIKE 'p4\\_%') AS rel`;
          console.log('[teardown-net] lab=' + r[0].lab + ' role=' + r[0].role + ' rel_p4=' + r[0].rel);
          await c.$disconnect();
          if (r[0].lab !== 0 || r[0].role !== 0 || r[0].rel !== 0) process.exit(1);
          TD_EOF
          DIRECT_URL="${DBD}" node .p4a/teardown.mjs
