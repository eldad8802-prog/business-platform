# D2 / P4-A — Real Neon non-bypass role lab (PREVIEW ONLY)
#
# Gate A: prove — firsthand, without printing a secret — that Preview
#         DATABASE_URL / DIRECT_URL resolve to the Preview Neon endpoint only.
# Gate B: provision a dedicated non-bypass LOGIN role + isolated p4_runtime_lab
#         schema on that endpoint, then run the tenant-isolation battery through a
#         connection that authenticates DIRECTLY as the role (Option A), and tear
#         it all down.
#
# Safety contract (enforced by this file):
#   - environment: preview-db  -> secrets scoped to this environment only.
#   - Gate A is pure string parsing. No checkout, no npm, no psql, no network.
#   - Hard allowlist: ep-wispy-dawn-amr74bwz. Hard deny: ep-flat-brook-am4bhq1y
#     (Production) + ep-winter-bread-ami5o8p5. Anything else -> FAIL CLOSED.
#   - Gate B re-asserts identity in-process before constructing any client.
#   - Only schema p4_runtime_lab + role p4_runtime_lab are created; every object
#     is p4_runtime_lab.p4_*. No writes to public. No app data. No PII.
#   - app_runtime is never referenced. No Legacy Web Access change.
#   - Teardown (DROP SCHEMA CASCADE + DROP ROLE) runs in the battery's finally and
#     again in an always() safety-net step; residue is verified to be 0.
#   - Standard Prisma path only. @prisma/adapter-neon is NOT adopted.
#
# Nothing echoes DATABASE_URL / DIRECT_URL / a password / a connection string.
# Only endpoint id / pooled-direct / database name / sanitized results are printed.

name: d2/p4a — runtime role lab (preview only)

on:
  workflow_dispatch:
  push:
    branches:
      - d2/p4a-runtime-role-lab

permissions:
  contents: read

concurrency:
  group: d2-p4a-runtime-role-lab
  cancel-in-progress: false

env:
  P4_EXPECT_ENDPOINT: ep-wispy-dawn-amr74bwz
  P4_EXPECT_DB: neondb
  P4_EXPECT_HOST_SUFFIX: us-east-1.aws.neon.tech
  P4_DENY_ENDPOINTS: ep-flat-brook-am4bhq1y ep-winter-bread-ami5o8p5

jobs:
  gate_a_identity:
    name: Gate A — Preview endpoint identity (no DB access)
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 5
    outputs:
      gate_a: ${{ steps.parse.outputs.gate_a }}
    steps:
      - name: Parse hostnames in memory and enforce allowlist (no network)
        id: parse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::preview-db environment is missing DATABASE_URL and/or DIRECT_URL."
            exit 1
          fi
          parse_host() { local u="$1"; u="${u#*://}"; u="${u##*@}"; local hp="${u%%/*}"; printf '%s' "${hp%%:*}"; }
          parse_db()   { local u="$1"; u="${u#*://}"; u="${u##*@}"; case "$u" in */*) u="${u#*/}";; *) u="";; esac; u="${u%%\?*}"; printf '%s' "$u"; }
          classify()   { local h="$1" first ep pooled; first="${h%%.*}"; case "$first" in *-pooler) ep="${first%-pooler}"; pooled="pooled";; *) ep="$first"; pooled="direct";; esac; printf '%s %s' "$ep" "$pooled"; }

          DB_HOST="$(parse_host "$DATABASE_URL")"; DB_NAME="$(parse_db "$DATABASE_URL")"
          DR_HOST="$(parse_host "$DIRECT_URL")";   DR_NAME="$(parse_db "$DIRECT_URL")"
          read -r DB_EP DB_MODE <<< "$(classify "$DB_HOST")"
          read -r DR_EP DR_MODE <<< "$(classify "$DR_HOST")"
          echo "DATABASE_URL -> endpoint=${DB_EP} mode=${DB_MODE} database=${DB_NAME}"
          echo "DIRECT_URL   -> endpoint=${DR_EP} mode=${DR_MODE} database=${DR_NAME}"

          fail=0
          for denied in ${P4_DENY_ENDPOINTS}; do
            if [ "$DB_EP" = "$denied" ] || [ "$DR_EP" = "$denied" ]; then
              echo "::error::HARD DENY hit: ${denied}."; fail=1
            fi
          done
          [ "$DB_EP" = "${P4_EXPECT_ENDPOINT}" ] || { echo "::error::DATABASE_URL endpoint ${DB_EP} != ${P4_EXPECT_ENDPOINT}"; fail=1; }
          [ "$DR_EP" = "${P4_EXPECT_ENDPOINT}" ] || { echo "::error::DIRECT_URL endpoint ${DR_EP} != ${P4_EXPECT_ENDPOINT}"; fail=1; }
          case "$DB_HOST" in *"${P4_EXPECT_HOST_SUFFIX}") : ;; *) echo "::error::DATABASE_URL region suffix mismatch"; fail=1 ;; esac
          case "$DR_HOST" in *"${P4_EXPECT_HOST_SUFFIX}") : ;; *) echo "::error::DIRECT_URL region suffix mismatch"; fail=1 ;; esac
          [ "$DB_NAME" = "${P4_EXPECT_DB}" ] || { echo "::error::DATABASE_URL database ${DB_NAME} != ${P4_EXPECT_DB}"; fail=1; }
          [ "$DR_NAME" = "${P4_EXPECT_DB}" ] || { echo "::error::DIRECT_URL database ${DR_NAME} != ${P4_EXPECT_DB}"; fail=1; }

          if [ "$fail" -ne 0 ]; then echo "gate_a=FAIL" >> "$GITHUB_OUTPUT"; echo "::error::GATE A = FAIL — FAIL CLOSED before any DB connection."; exit 1; fi
          echo "gate_a=PASS" >> "$GITHUB_OUTPUT"
          echo "GATE A = PASS"

  gate_b_p4a:
    name: Gate B — P4-A role lab (p4_runtime_lab)
    needs: gate_a_identity
    if: needs.gate_a_identity.outputs.gate_a == 'PASS'
    runs-on: ubuntu-latest
    environment: preview-db
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies (prisma generate via postinstall)
        run: npm ci --no-audit --no-fund
      - name: Sanity-check battery syntax
        run: node --check .p4a/battery.mjs
      - name: Run P4-A battery (authenticates DIRECTLY as the non-bypass role)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          P4_EXPECT_ENDPOINT: ${{ env.P4_EXPECT_ENDPOINT }}
          P4_EXPECT_DB: ${{ env.P4_EXPECT_DB }}
          P4_EXPECT_HOST_SUFFIX: ${{ env.P4_EXPECT_HOST_SUFFIX }}
          P4_DENY_ENDPOINTS: ${{ env.P4_DENY_ENDPOINTS }}
        run: node .p4a/battery.mjs
      - name: Teardown safety net (always)
        if: always()
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          mkdir -p .p4a
          cat > .p4a/teardown.mjs <<'TD_EOF'
          import { PrismaClient } from '@prisma/client';
          const c = new PrismaClient({ datasourceUrl: process.env.DIRECT_URL });
          await c.$executeRawUnsafe('DROP SCHEMA IF EXISTS p4_runtime_lab CASCADE');
          try { await c.$executeRawUnsafe('DROP OWNED BY p4_runtime_lab'); } catch {}
          await c.$executeRawUnsafe('DROP ROLE IF EXISTS p4_runtime_lab');
          const r = await c.$queryRaw`SELECT (SELECT count(*)::int FROM information_schema.schemata WHERE schema_name='p4_runtime_lab') AS lab, (SELECT count(*)::int FROM pg_roles WHERE rolname='p4_runtime_lab') AS role, (SELECT count(*)::int FROM pg_class cc JOIN pg_namespace n ON n.oid=cc.relnamespace WHERE cc.relname LIKE 'p4\\_%') AS rel`;
          console.log('[teardown-net] lab=' + r[0].lab + ' role=' + r[0].role + ' rel_p4=' + r[0].rel);
          await c.$disconnect();
          if (r[0].lab !== 0 || r[0].role !== 0 || r[0].rel !== 0) process.exit(1);
          TD_EOF
          node .p4a/teardown.mjs
