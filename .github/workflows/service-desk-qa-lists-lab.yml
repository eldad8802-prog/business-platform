name: service desk QA lists — per-business QA lists lab (ephemeral PG17)

# Migration 20261129090000_service_desk_qa_lists (DRAFT — never applied without a separate owner approval): a business's
# own QA lists (immutable versions, REQUIRED per check), the case's choice of a list version, per-check results stored in
# the case, the lists journal, the erase function. On the M1 lab (P4 lab → #1096 → #1104 → M1, via .sdm1/chain.sh): the
# application of this migration (prisma migrate deploy, fault + recovery, rollback script) and its guards AS the runtime
# role. Synthetic only; no secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - "prisma/migrations/20261127090000_service_desk_tracks/**"
      - "prisma/migrations/20261129090000_service_desk_qa_lists/**"
      - ".sdqa/**"
      - "ops/evidence/service-desk-qa-lists-*.sql"
      - ".sdm1/chain.sh"
      - ".sd3p4/lab.sh"
      - ".sd3/lab.sh"
      - "prisma/schema.prisma"
      - ".github/workflows/service-desk-qa-lists-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: service desk QA lists (PG17, runtime role, M1 + QA lists applied)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_super
          POSTGRES_PASSWORD: sdqa_ci_synthetic_super_pw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_super -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      SUPER: lab_super
      PGPASSWORD: sdqa_ci_synthetic_super_pw
      LAB_PASSWORD: sdqa_ci_synthetic_role_pw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: The QA lists migration on the M1 lab, and its guards as the runtime role
        run: |
          set -euo pipefail
          bash .sd3p4/lab.sh sdqa >/dev/null
          bash .sd3p4/lab.sh sdqa --deploy-only >/dev/null
          # #1096, #1104, M1 (its own chain proves them); then this migration: a failure inside it leaves nothing + the
          # recovery procedure; the application; a second application refused; the rollback script on copies.
          bash .sdm1/chain.sh sdqa > /tmp/m1-chain.out
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/m1-chain.out || { cat /tmp/m1-chain.out; echo "the M1 chain is not green"; exit 1; }
          # the read-only preflight on the M1 lab: every check PASS (or INFO)
          psql -X -v ON_ERROR_STOP=1 -At -F "|" "postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdqa" -f ops/evidence/service-desk-qa-lists-preflight.sql | tee /tmp/pre.out
          ! grep -q "|FAIL|" /tmp/pre.out || { echo "the preflight is not green"; exit 1; }
          bash .sdqa/chain.sh sdqa | tee /tmp/chain.out
          # the read-only production evidence after the application: every check PASS (or INFO)
          psql -X -v ON_ERROR_STOP=1 -At -F "|" "postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdqa" -f ops/evidence/service-desk-qa-lists-production-evidence.sql | tee /tmp/ev.out
          ! grep -q "|FAIL|" /tmp/ev.out || { echo "the evidence is not green"; exit 1; }
          test "$(grep -c "|PASS|" /tmp/ev.out)" = "15" || { echo "the evidence did not report its 15 checks"; exit 1; }
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/chain.out || { echo "the QA lists chain is not green"; exit 1; }
          R="postgresql://app_runtime_prod:$LAB_PASSWORD@localhost:5432/sdqa"
          A="postgresql://lab_owner:$LAB_PASSWORD@localhost:5432/sdqa"
          OWNER_URL="$A" DATABASE_URL="$R?connection_limit=10" DIRECT_URL="$R" AUTH_DATABASE_URL="$A" AUTH_PLANE_ENABLED=true \
          TASK_REQUEST_HMAC_KEY=sdqa-ci-synthetic-hmac-key-0123456789abcdef TASK_REQUEST_HMAC_KEY_ID=sdqa-ci \
          AUTH_TOKEN_SECRET=sdqa-ci-synthetic-auth-secret-0123456789abcdef \
            npx tsx .sdqa/battery.ts | tee /tmp/sdqa.out
          grep -qE '^[0-9]+ passed, 0 failed$' /tmp/sdqa.out || { echo "the QA lists battery is not green"; exit 1; }
