name: release-migrate
run-name: "release-migrate — ${{ inputs.expected_migrations }}"

# Gated Production migration — "Human approves, the Runner executes."
#
# This is the dedicated, gated Release step that applies pending Prisma
# migrations to Production. It is the ONLY automated place that runs
# `prisma migrate deploy` against Production.
#
# Safety model:
#   - Manual trigger only (workflow_dispatch). NEVER runs on push/merge.
#   - The job targets the protected `production-db` GitHub Environment, which has
#     a REQUIRED REVIEWER. GitHub pauses the run until a human approves — and the
#     Production DB connection secrets are only exposed to the job AFTER approval.
#   - Uses the Neon DIRECT (non-pooled) connection for DDL, per Neon/Prisma.
#   - Applies PENDING migrations only (migrate deploy never resets, never
#     generates, and — on the baselined Production DB — never re-runs history,
#     so the known timestamp anomaly does not affect a pending-only apply).
#   - Vercel auto-deploy is untouched; this workflow never deploys app code.
on:
  workflow_dispatch:
    inputs:
      # GATE (docs/security/RELEASE_MIGRATE_AUTHORITY_GATE.md): the run applies EXACTLY these, or nothing.
      expected_migrations:
        description: 'Exact migration names this run may apply (comma-separated). Anything else pending stops the run.'
        required: true
        type: string
      reason:
        description: 'Audit note: why this migration run is happening (optional)'
        required: false
        type: string

# Least privilege: read repo contents only. No write scopes are needed.
permissions:
  contents: read

# Never overlap two migration runs against Production.
concurrency:
  group: release-migrate-production
  cancel-in-progress: false

jobs:
  # No secrets here: classify every expected migration and check the approval record of each
  # authority-changing one (checksum, owner decision, a successful post-merge preflight run) —
  # BEFORE anyone is asked to approve the protected environment. The plan is in the run summary.
  plan:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Plan — classify, check approval records and preflight runs
        env:
          EXPECTED: ${{ inputs.expected_migrations }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-migrate-gate.mjs plan --expected "$EXPECTED"

  migrate:
    needs: plan
    runs-on: ubuntu-latest
    # Binding this job to the protected environment is what enforces the
    # human-approval gate AND scopes the DATABASE_URL / DIRECT_URL secrets to
    # this job only (they do not exist anywhere else in CI).
    environment: production-db
    # L-21: migrations are applied ONLY from main. The job-level condition keeps a
    # dispatch from any other ref from even requesting the environment; the first
    # step re-asserts it so the guarantee is visible in the log and cannot be lost
    # by editing the condition alone.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Assert the dispatched ref is main (L-21)
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::release-migrate may only run from refs/heads/main (got ${REF})"; exit 1
          fi
          echo "ref OK: ${REF}"
      - name: Checkout (read-only, no persisted git credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci — includes prisma CLI from devDependencies)
        run: npm ci

      # Pre-state (read-only). `migrate status` exits non-zero when migrations
      # are pending — that is expected here, so this step is informational only.
      - name: prisma migrate status (pre — read-only, expected to show pending)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node_modules/.bin/prisma migrate status

      # GATE: the real pending set must be EXACTLY the expected set — a migration merged while this
      # run waited for approval, or any other unapproved pending migration, stops the release here.
      - name: Gate — pending set == expected set (before any apply)
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          EXPECTED: ${{ inputs.expected_migrations }}
        run: node scripts/ci/release-migrate-gate.mjs verify --expected "$EXPECTED"

      # The actual, approved apply. Applies pending migrations only, in order.
      # Fails the job (and stops the release) on any migration error.
      - name: prisma migrate deploy (apply pending — Production)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node_modules/.bin/prisma migrate deploy

      # Post-state verification. Must be "up to date" (exit 0); if not, the job
      # fails so the release is not declared complete.
      - name: prisma migrate status (post — must be up to date)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node_modules/.bin/prisma migrate status

      - name: Job Summary
        if: always()
        env:
          REASON: ${{ inputs.reason }}
          EXPECTED: ${{ inputs.expected_migrations }}
        run: |
          {
            echo "## release-migrate (gated Production migration)"
            echo ""
            echo "- Trigger: manual (workflow_dispatch), approved via \`production-db\` environment."
            echo "- Action: \`prisma migrate deploy\` (pending migrations only) over the direct connection."
            echo "- Expected (and verified) migrations: ${EXPECTED}"
            echo "- Reason: ${REASON:-'(none provided)'}"
            echo ""
            echo "_Vercel auto-deploy is unaffected. This workflow applies migrations only._"
          } >> "$GITHUB_STEP_SUMMARY"
