<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Dubiz</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0; height: 100%;
        font-family: "Heebo", "Assistant", system-ui, -apple-system, sans-serif;
        background: #f8f6f1; color: #1f2937;
      }
      .wrap {
        min-height: 100%;
        box-sizing: border-box;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: 14px;
      }
      .brand { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; color: #0f172a; }
      .msg { font-size: 16px; line-height: 1.6; color: #475569; max-width: 320px; }
      button {
        margin-top: 8px; min-height: 48px; padding: 0 24px;
        border: none; border-radius: 14px; cursor: pointer;
        font-family: inherit; font-size: 16px; font-weight: 700;
        background: #0f766e; color: #fff;
      }
    </style>
  </head>
  <body>
    <!--
      Capacitor offline / load-error fallback (Milestone A). Shown by the native
      shell (config server.errorPath) when the remote server.url cannot be
      reached, instead of a blank white WebView. This is NOT offline product
      functionality — just a branded reconnect screen.
    -->
    <div class="wrap">
      <div class="brand">Dubiz</div>
      <div class="msg">אין כרגע חיבור למערכת. בדקו את החיבור לאינטרנט ונסו שוב.</div>
      <button id="retry" type="button">נסה שוב</button>
    </div>
    <script>
      // Recovery + history hygiene (W7 finding).
      //
      // Capacitor shows this page via BridgeWebViewClient.onReceivedError ->
      // webView.loadUrl(errorPath), and loadUrl PUSHES a history entry. Two
      // consequences were proven on the emulator:
      //   1. location.reload() only re-rendered THIS local file — the page
      //      lives on the Capacitor local server, not on the app origin, so
      //      the user could never get back to the app: a dead end.
      //   2. once the app did load, this page stayed BEHIND it in history, so
      //      an in-app back landed the user on "no connection".
      //
      // history.back() fixes both: it re-requests the failed app URL (the
      // entry Capacitor pushed this page on top of), and it leaves this page
      // FORWARD in history rather than behind the app. If the load fails
      // again Capacitor simply pushes this page over the same entry, so the
      // stack cannot grow. With no previous entry there is nothing to return
      // to, and reload is the only honest fallback.
      document.getElementById("retry").addEventListener("click", function () {
        if (history.length > 1) {
          history.back();
        } else {
          location.reload();
        }
      });
    </script>
  </body>
</html>
